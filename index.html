的是「專案經理應該參考什麼，才能清楚了解哪些利害關係人需要被通知？」這裡的關鍵：不是問有哪些利害關係人，而是問：誰需要被通知。所以問題聚焦在誰是資訊接收者，這是個關於「通知」的責任識別問題，而不是「找名單」。* RACI 矩陣在「通知誰」的執行層面上可以提供明確資訊，尤其在某些細項活動或控制流程中。* 「溝通管理計畫書」為什麼比「利害關係人登錄表」更適合呢？-「溝通管理計畫書」定義誰需要哪些資訊、何時需要、如何通知，這正是本題問的「誰需要被通知」的答案。-「利害關係人登錄表」包含所有利害關係人的名單、角色、影響力等，可以幫助你知道有專案中有哪些利害關係人，但無法判斷誰需要被通知，這需要進一步參照溝通管理計劃書（或是溝通策略）。- 此外，溝通管理計畫書會根據「利害關係人分析」來設定不同人需要收到的資訊類型與頻率，所以它已經把利害關係人的參與需求轉化成通知需求了。"}, {"source": "PMSuccess17.pdf", "number": 6, "stem": "你向高階主管報告資料平台專案狀態時，使用大量技術術語，例如資料湖、串流處理、Schema 演進與模型訓練管線。會後，主管表示無法判斷專案是否能支援預期的業務效益。專案經理應如何改善？", "options": ["僅提供成本與時程數字。", "請架構師代替你報告。", "改用商業影響說明。", "增加更多技術細節。", "要求主管參加技術訓練。"], "answers": [2], "explanation": "正解是「改用商業影響說明」。這題的關鍵是：高階主管不是要理解技術架構細節，而是要判斷專案是否能支援預期的業務效益。專案經理應根據溝通對象調整訊息內容。對高階主管報告時，應將技術狀態轉換成他們能用來決策的資訊，例如：是否能支援預期效益；對營收、效率、風險或合規的影響；是否需要高階決策或資源支持；目前主要風險與替代方案；以及對時程、成本、價值交付的影響。"}, {"source": "PMSuccess17.pdf", "number": 7, "stem": "某雲端服務遷移專案的技術工作大致如期完成，儀表板顯示「綠燈」。但客戶主管認為專案實際上有風險，因為使用者訓練、營運交接與上線支援尚未準備好。雙方對「專案健康狀態」的理解不同。專案經理應採取哪些行動？（選兩項）", "options": ["只保留技術進度指標。", "重新確認狀態報告指標。", "與客戶確認資訊需求。", "納入移轉與準備度資訊。", "要求客戶接受現有儀表板。", "停止使用顏色狀態標示。"], "answers": [2, 3], "explanation": "狀態報告應符合接收者的決策需求。若客戶關心的是營運準備度與移轉風險，報告就不能只呈現技術進度。應與客戶確認需求，並將移轉、訓練、支援與準備度納入報告。"}, {"source": "PMSuccess17.pdf", "number": 8, "stem": "專案進行的很順利，專案成員都知道何時需開始工作，並且會透過議題紀錄追蹤利害關係人的需求，專案發起人也舉辦了里程碑慶功宴表達他對專案團隊成員的感激。今天早上，你接到一位專案團隊成員的電話，他表示他負責的其中一項前置活動已經推遲了兩天。最有可能是因為下列何項原因而造成此情況？", "options": ["里程碑慶功會沒有邀請適當的人", "專案經理只關注發起人的需求", "功能經理沒有被列入溝通管理計畫書中", "前置活動不需要被關注"], "answers": [2], "explanation": "* 功能經理通常對於資源管理與資源可用性有決定性的影響。如果功能經理沒有被列入溝通管理計畫書中，相關資訊（如資源調配或變更計劃）無法順利傳達，可能會導致前置活動因資源短缺、支援不足等原因而延遲。* 其他選項是錯誤的，因為：-前置活動如果被忽略，整個專案時程都有風險。因此，說「不需要被關注」是不符合專案管理實務的說法。-慶功會只是對成果表達感激和激勵，與前置活動延遲無直接關係。-雖然專案經理應該關注發起人的需求，但只專注發起人而忽略其他利害關係人的需求將產生風險。另外，發起人的需求通常影響的是高層級的專案方向，而非特定的前置活動。"}, {"source": "PMSuccess17.pdf", "number": 9, "stem": "某敏捷軟體專案需要外部的專業知識與可交付成果來增加基於機器學習的模組。某個已獲准的供應商要求專案經理參加該供應商的敏捷團隊之每日會議，但專案經理的行程已經排滿了內部會議。兩個團隊可以如何以較低頻率的方式進行同步交流？", "options": ["在每個站點設置魚缸窗口。", "共享一個通用的電子看板。", "為常見的回顧調整迭代。", "增加並執行Scrum of Scrums。", "導入規模化敏捷架構 (SAFe)。"], "answers": [3], "explanation": "Scrum of Scrums允許兩個團隊舉行自己的日常會議，同時以較低的頻率在他們之間增加更有目標的會議。其他選項適不適合的，因為魚缸有安全疑慮、回顧會議的頻率與相關性是低的，而看板則缺乏即時的交流。"}, {"source": "PMSuccess17.pdf", "number": 10, "stem": "專案經理正在管理一項金融監理申報系統專案。監管機關要求所有關鍵設計決策、資安例外、測試結果與核准紀錄都必須保留，以便日後稽核。團隊目前多以口頭討論或即時訊息確認決策。專案經理應採取哪些行動？（選兩項）", "options": ["確保稽核資料在結案時能全數補齊。", "要求團隊備份訊息。", "保存核准與回覆證據。", "改用口頭確認以加快決策。", "取消即時通訊工具。", "建立"], "answers": [2, 5], "explanation": "* 受監管專案需要可追溯、可稽核的溝通紀錄。即時溝通可作為輔助，但正式決策、核准與例外處理必須留下紀錄與證據。故最佳選項是以下這兩項：- 建立正式決策紀錄。監理與稽核要求的是可追溯、可驗證、可保存的紀錄。關鍵設計決策、資安例外與測試結論，不能只停留在口頭或即時訊息裡。- 保存核准與回覆證據。除了決策內容本身，還必須保留誰核准、何時核准、回覆內容是什麼，這些都是日後稽核的重要證據鏈。* 其他選項不是最佳做法，因為：取消即時通訊工具過於極端；要求備份訊息仍不等於正式治理；改用口頭確認並不符合稽核要求；等到結案才補齊資料，風險太高，也常無法完整還原。"}, {"source": "PMSuccess18.pdf", "number": 1, "stem": "專案團隊已完成了幾次成功的交付，然而為了因應近期市場的變化，專案團隊需要新的技能。專案經理應該怎麼做？", "options": ["尋求外部供應商或專家的支援。", "增加具有新技能的資源。", "提升現有團隊的技能。", "請贊助者協調提供所需資源。"], "answers": [2], "explanation": "隨著專案的進行，專案經理與專案團隊應該更深入的了解客戶需要與團隊能力，以辨識出團隊技能的落差。發現技能出現落差時，專案經理有責任提升團隊知識與技能，以降低成本與時間，並改善品質。另外，專案經理也需持續評量，並更新團隊技能。"}, {"source": "PMSuccess18.pdf", "number": 2, "stem": "專案經理正在管理一項偏遠地區設備安裝專案。現場工程師常在網路不穩定的地點作業，需要每天回報安裝照片、座標、檢查結果與異常說明。過去工程師透過即時通訊回報，但常發生照片漏傳、時間戳不一致與資料難以追蹤的問題。專案經理應該怎麼做？", "options": ["指派專案助理集中整理照片、座標與異常紀錄，確保資料完整。", "建立具備離線紀錄、欄位檢核與同步功能的現場回報機制。", "安排每日固定時段，由現場工程師口頭回報當日安裝狀況。", "授權各區域選擇最適合現場條件的回報工具，再由專案經理彙整。", "調整回報頻率，讓各區域在完成階段性安裝後彙整提交。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [1], "explanation": "* 正解是「建立具備離線紀錄、欄位檢核與同步功能的現場回報機制」。這個情境的核心問題是現場網路不穩定，加上回報方式缺乏結構化與可追蹤性，所以才會出現照片漏傳、時間戳不一致、資料難追蹤。最有效的做法不是增加人工整理或改變回報頻率，而是直接改善回報機制本身，讓它能：在離線環境先完整記錄資料、用必填欄位與格式檢核降低漏報，並在網路恢復後再同步，保留一致的時間與紀錄軌跡。* 其他選項都只是部分補救。口頭回報不利留痕；專案助理整理屬於事後補救；延後彙整會降低即時性；各區自選工具則會讓資料格式更分散。"}, {"source": "PMSuccess18.pdf", "number": 3, "stem": "專案經理召開利害關係人會議，以確保可以和重要利害關係人在交付標的、里程碑、總預算及角色與責任達成共識。但有一位重要利害關係人沒有參與會議。專案經理應該怎麼做？", "options": ["參考組織過程資產，以取得缺席之利害關係人的通訊方式。", "參考利害關係人登錄表，以確認誰可以將會議資訊傳送給缺席的利害關係人。", "參考溝通管理計畫書，以確保可以將會議資訊發布給缺席的利害關係人。", "參考利害關係人參與計畫書，以確認為何有利害關係人無故缺席。\nA. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [2], "explanation": "溝通管理計畫書記載著利害關係人的溝通需求、所需的溝通資訊、發布與接收資訊的頻率、誰負責發布資訊、誰可以接收資訊、傳送資訊的方法或技術為何...等。所以，專案經理應該依據溝通管理計畫書上的規劃將會議資訊提供給缺席的利害關係人。"}, {"source": "PMSuccess18.pdf", "number": 4, "stem": "為了讓敏捷成員彼此享受快速及高頻率的溝通環境。請問，你需要搭配哪種手法才能創造出這樣的溝通環境？", "options": ["組建自我組織團隊。", "制定溝通管理計畫書，並有效管理溝通。", "讓團隊成員待在同一個房間，並坐在一起。", "跟團隊成員溝通敏捷宣言。"], "answers": [2], "explanation": "為了達成快速及高頻率的溝通，你的團隊需要待在同一個房間，並坐在一起。"}, {"source": "PMSuccess18.pdf", "number": 5, "stem": "某關鍵團隊成員獲得了一項新機會，且將離開專案團隊。此團隊正在尋找替代者，但尚無法找到具有相同技能層級的人。此團隊成員自專案一開始，也就是一年多前，即參與此專案，並且擁有其他團隊成員所缺乏的許多知識與技能。團隊應該採取哪兩項行動來確保專案的連續性？（選兩項）", "options": ["請即將離職的團隊成員提名幾位在某些任務上可能是最俱技能的現有團隊成員。", "與即將離職的團隊成員一起安排幾場知識移轉會議。", "在下一個團隊回顧會議中討論關鍵依賴資源辭職的風險。", "通知該團隊成員的經理，除非他們很快找到合適的人選，否則這可能對專案不利。", "在產品待辦清單中建立一個新的工作事項，以便採訪這位即將離職的團隊成員，並記錄這場會議的資訊。"], "answers": [1, 4], "explanation": "最適合的兩項行動是：1.「與即將離職的團隊成員一起安排幾場知識移轉會議」：知識移轉是專案收斂/人員交接時的核心活動；PMP教材在「結束專案或階段」中特別列出知識移轉為關鍵主題，強調在交接前確保知識被擷取、分享與可追溯。2.「在產品待辦清單中建立新的工作事項，以便採訪這位即將離職的團隊成員，並記錄這場會議的資訊」：將知識移轉任務明確化為待辦項目可以確保其被優先安排與追蹤，並產出可查詢的工件（如作業手冊、SOP、環境設定、關鍵聯絡人、風險與變通方案），此舉符合「可視化工作＋單一事實來源」的敏捷管理實務。"}, {"source": "PMSuccess18.pdf", "number": 6, "stem": "一項智慧製造專案的例行週會經常超時。工程、採購與品保人員都在會議中提出自己的問題，但沒有清楚的決議，也沒有行動負責人。團隊認為會議「資訊很多，但沒有用」。專案經理下一步應該怎麼做？", "options": ["將未決議題留到月會時與高階主管一同處理。", "取消例行週會，並引導利害關係人填寫議題紀錄單。", "邀請部門主管參加後續會議，並決議。", "會議前先發布議程與預期產出。", "要求每位人員都要提出解決方案。"], "answers": [3], "explanation": "* 正解是「會議前先發布議程與預期產出」。此題的核心問題不是資訊不夠，而是會議缺少目的、決議機制與責任歸屬。先在會前明確議程、每個議題要達成的產出，以及會後需形成的決議與行動項目，才能改善「資訊很多，但沒有用」的狀況。* 其他選項都不是最佳的下一步，因為：取消週會太激烈，無法解決跨部門協調需求；要求每人都提方案，不能保證形成決議；找主管來開會，會把本來應由團隊處理的問題往上推；留到月會再處理，會讓問題累積更久。"}, {"source": "PMSuccess18.pdf", "number": 7, "stem": "專案經理正在管理一項客戶資料平台專案。開發團隊完成新資料模型後，分析團隊表示報表邏輯無法銜接，客服團隊也不知道新欄位代表的業務意義。開發團隊回應：「技術規格已經放在共用資料夾。」專案經理應該怎麼做？", "options": ["安排跨部門知識分享。", "要求開發團隊停止變更模型。", "將問題記錄到經驗教訓。", "由客服主管訓練人員。", "要求各單位自行研讀規格。"], "answers": [0], "explanation": "* 此題的正解是「安排跨部門知識分享」。此情境中的問題是：不同團隊對新資料模型的理解沒有對齊。技術規格通常不足以讓分析團隊理解報表邏輯銜接方式，也不足以讓客服團隊掌握欄位的業務意義。專案經理應促成跨部門知識分享，讓開發、分析與客服一起釐清欄位定義、資料邏輯、業務用途與實際影響。* 其他選項較不適合，因為：要求各單位自行研讀規格是被動做法，無法保證共同理解。記錄到經驗教訓太晚，不能解決眼前協作問題。要求停止變更模型未必是根因對策。由客服主管訓練人員只能處理單一部門，無法解決跨部門理解落差。"}, {"source": "PMSuccess18.pdf", "number": 8, "stem": "專案為討論某項議題召開一場會議，專案經理在會議開始時卻發現手上的風險登錄表與其他團隊成員所使用的版本不一致。專案經理應該落實下列哪項工件的實施才能避免這個問題再次發生？", "options": ["利害關係人登錄表", "風險管理計畫書", "議題紀錄", "溝通管理計畫書"], "answers": [3], "explanation": "* 溝通管理計畫書詳細規範了專案中的資訊傳遞的頻率與方法、文件格式與標準、責任人與接收人、版本控制機制等。如果會議中使用的文件版本不一致，顯示溝通或文件管理過程中出現問題，應透過溝通管理計畫書來明確文件版本控制機制，確保相關資訊一致。* 其他選項是錯誤的，因為：-利害關係人登錄表用於記錄專案相關的利害關係人的資訊，與文件版本不一致的問題無直接關係。-議題紀錄是專案中用於記錄未解決的問題，並非用於解決文件版本一致性的問題。它可能協助追蹤此問題的處理過程，但不足以從源頭解決。-風險管理計畫書規劃如何識別、分析和應對風險，與文件版本一致性問題無直接關聯。"}, {"source": "PMSuccess18.pdf", "number": 9, "stem": "智能網專案結合了預測軌和敏捷軌。敏捷團隊發布之後檢測到一個主要的軟體缺陷，並開始修正。但是有缺陷的版本已經在預測軌上進行部署，並導致實際測試的失敗。哪種措施最能有效防止將來出現類似問題？", "options": ["透過即時通訊向團隊發送與整個專案面向有關的議題紀錄更新。", "將軟體軌重新規劃到預測式時間表中。", "確保與預測式團隊共享回顧會議。", "在敏捷實驗室和現場進行相同的單元測試。"], "answers": [0], "explanation": "* 這題的關鍵不是單純測試不足，而是：敏捷軌已發現重大缺陷並開始修正，但預測軌仍部署了有缺陷的版本。這代表混合式專案中，敏捷軌與預測軌之間的議題資訊沒有即時同步。因此，最能防止類似問題再次發生的做法，是建立跨軌道的即時議題更新與溝通機制，讓所有受影響團隊都能知道：哪個版本有重大缺陷；目前是否可部署；修正狀態為何；哪些測試或部署活動需要暫停，以及哪些團隊會受到影響。故正解是「透過即時通訊向團隊發送與整個專案面向有關的議題紀錄更新」。* 其他選項都是錯誤的，因為：- 進行相同的測試雖然有幫助，但題目中的失敗主因是「已知缺陷沒有及時傳達給預測軌」，不是單元測試環境不一致。- 將軟體軌重新規劃到預測式時間表中並不是好方法。混合式專案不代表敏捷軌要被改成預測式。問題是跨軌整合與溝通不足，不是交付方法選錯。- 共享回顧會議雖然有助於經驗學習，但回顧會議通常是事後改善，無法即時阻止預測軌部署有缺陷的版本。此題需要的是即時議題通報與跨軌同步。"}, {"source": "PMSuccess18.pdf", "number": 10, "stem": "專案團隊每周開例會，但成員遍佈世界各地。專案經理應該如何進行有效管理？", "options": ["留意時區與語言的問題", "每週發布會議記錄", "鼓勵非正式溝通", "確保成員都採用互動式溝通"], "answers": [0], "explanation": "* 跨文化溝通或遠距溝通時，常會出現為了確保能正確理解訊息的意義而面臨的挑戰。例如：語言不同、文化差異、工作習慣不同、時區各異...等問題。* 另外，雖然與成員進行「互動式溝通」是不錯的做法，但是此專案的問題是「成員遍佈世界各地」，成員之間存在時差問題，所以不可能全部「都」採用互動式溝通。* 專案經理最好的做法是「留意時區與語言的問題」，然後才能規劃出適合此專案型態的溝通管理計畫書，這樣成員就可以依據計畫書在適當的時間、採用合適的工具進行溝通，當然也可以將互動式溝通規劃進去。"}, {"source": "PMSuccess19.pdf", "number": 1, "stem": "公司正在進行一項智能網專案，同時包含預測軌和敏捷軌。敏捷團隊在發布之後檢測到一項重大的軟體缺陷，並開始更正，但是有缺陷的版本同時在預測軌上進行部署，並導致實際運作的失敗。哪種措施最能有效地防止將來出現類似問題？", "options": ["即時發布議題紀錄的更新。", "讓預測軌的團隊參加回顧檢討會議。", "安排預測軌與敏捷軌都進行相同的測試。", "將軟體開發與缺陷修正的工作加入預測軌的時程表。"], "answers": [0], "explanation": "此題的情境是「敏捷團隊負責軟體開發與除錯，預測團隊負責軟體的部署，但是預測式團隊在沒有收到軟體缺陷的通知下就進行部署，所以導致失敗」。因此讓兩個團隊共用議題紀錄，並即時更新與發布軟體有缺陷的資訊是最有效且低成本的預防方法；此外混和式專案可以讓不同團隊共用計畫書與文件。「回顧會議」是每個迭代的最後才會召開的會議，缺乏即時性，故不適合用來傳達軟體有缺陷的訊息。另外，預測式團隊沒有必要只是為了得知軟體缺陷的訊息，就在時程表中加入敏捷團隊的工作。"}, {"source": "PMSuccess19.pdf", "number": 2, "stem": "你帶領一個為期2年的專案。專案贊助者希望每週可以有一次專案現況報告、客戶希望每個月可以開一次面對面會議，但是專案團隊成員則希望儘量減少開會的次數。下列何項是管理專案現況會議的最佳做法？", "options": ["在專案的規劃階段，就將會議的次數、種類、形式和類型等都定義在溝通管理計畫書中。 (\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "根據組織過程資產上的歷史資訊來制定會議規則", "依照贊助者和客戶的需求進行會議。", "在專案的規劃階段，應該依照客戶的需求舉行面對面的會議，等到專案的執行階段，即可以書面報告來替代實體會議。"], "answers": [0], "explanation": "在專案的規劃階段，就需將會議的次數、種類、形式和類型等都定義在溝通管理計畫書中，以利專案執行。"}, {"source": "PMSuccess19.pdf", "number": 3, "stem": "組織從傳統專案管理方法轉型為敏捷方法，部分團隊成員對敏捷已有一定的認識與實務經驗，但仍有幾位新加入的成員缺乏敏捷知識與技術實作能力。專案經理希望在初期推動敏捷時，提升整體團隊對敏捷的理解與實作能力。專案經理應該採取下列哪一種做法？", "options": ["僅針對新加入的團隊成員進行個別敏捷訓練。", "只要求團隊中的安排開發人員參與訓練，其餘角色可視情況參加。", "為團隊安排集體敏捷輔導與工作坊，強化整體理解與實作一致性。", "指派一位資深成員擔任個人導師，逐一協助新成員學習敏捷。A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [2], "explanation": "敏捷導入的初期階段，團隊層級的學習與共同成長尤為重要，因為敏捷強調的是跨職能團隊、協作與透明度，而非單一成員的技能補強。透過團隊輔導可以：建立共通語言與價值觀、一起練習敏捷儀式與實作、提升團隊合作與決策成熟度，以及減少因認知差異造成的阻力與落差。相較之下，針對個人進行訓練或安排導師雖然有幫助，但若缺乏團隊共同參與與實踐，學習效果容易分散，不利於打造一致性的敏捷文化與團隊節奏。"}, {"source": "PMSuccess19.pdf", "number": 4, "stem": "一位在預測式手法方面經驗豐富的專案經理第一次承接敏捷專案。為了幫助自己調適，該專案經理製作了一份觀察清單，列出那些由於僕人式領導者行動不當而引起的情況。缺乏僕人式領導會導致哪些情況？（選三項）", "options": ["團隊成員逃避承擔具有挑戰性的任務。", "團隊成員不想與其他部門直接溝通。", "團隊中的高績效者會晉升到更高級的職位。", "專案利害關係人對敏捷方法表示懷疑。", "團隊成員提出了他們無法消除的障礙。"], "answers": [0, 1, 3], "explanation": "僕人式領導者必須透過挑戰來促進專業上的發展。僕人式領導者可幫助團隊與外部團體建立橋樑。僕人式領導者會就敏捷業務價值對利害關係人進行教育。僕人式領導者也會消除障礙，並支持專案外的個人成長。"}, {"source": "PMSuccess19.pdf", "number": 5, "stem": "某電子公司正開發一款新型半導體晶片，專案正進入設計優化階段。一名關鍵利害關係人表示「他並不知道設計圖已經發生變更」，並對此感到不滿。專案經理應該如何處理此情況？", "options": ["審查專案的溝通管理計畫書。", "下次記得寄送變更通知給此利害關係人。", "要求這位利害關係人定期參與專案會議。", "修訂專案的溝通技術和溝通模式。", "成立專門的利害關係人變更通知小組。"], "answers": [0], "explanation": "* 溝通管理計畫書定義了專案資訊將如何、何時及由誰進行管理與傳遞。審查溝通管理計畫書可以確認利害關係人是否被適當納入溝通流程。另外。專案經理應透過審查溝通管理計畫書來檢查和改善溝通流程。*「要求利害關係人定期參與會議」是被動的解決方式，並不能從根本上解決資訊傳遞失效的問題。* 修訂溝通模式可能是後續的活動，但是在尚未確定根本原因之前立即修訂並不合適。*「下次記得寄送變更通知給此利害關係人」是補救措施。此舉可以解決當前問題，但無法保證未來不會出現類似情況。* 成立小組可能是一種冗長且低效的方式，並非實際解決問題的最佳選擇。"}, {"source": "PMSuccess19.pdf", "number": 6, "stem": "資深團隊成員，Will由於個人原因突然離開公司。他是團隊中唯一擁有UX經驗的人。現在，該團隊無法實現當初向利害關係人所承諾的Sprint目標。敏捷實踐者應該怎麼做？", "options": ["團隊需推遲所有與UX有關的任務。必要時\b可尋求外部SMEs的協助。", "團隊成員應繼續合作，以完成任務。", "產品負責人應與利害關係人溝通，並依據開發情況適當地管理他們的期望。", "Scrum master 可以藉此機會教導每一位成員關於Sprint目標的重要性。"], "answers": [2], "explanation": "產品負責人有責任根據團隊的實際狀況及其可持續的步調來管理利害關係人的期望。"}, {"source": "PMSuccess19.pdf", "number": 7, "stem": "你正在管理一項多階段製造流程改善專案。第一階段剛結束，團隊發現供應商資料格式問題造成大量重工。第二階段將使用相同供應商資料。專案經理應怎麼做？", "options": ["在第二階段立即套用經驗學習。", "使用管理儲備應應對此重工成本。", "記錄此問題。", "要求供應商立即改善流程。", "等此階段完成後再檢討。"], "answers": [0], "explanation": "* 正解是「在第二階段立即套用經驗學習」。這題的關鍵是：第一階段已經發現供應商資料格式造成大量重工，而第二階段還會使用相同供應商資料。這代表這個問題不是單純「已發生的過去事件」，而是會直接影響下一階段的可重複風險與工作效率。專案經理應把第一階段的經驗學習立即轉化為第二階段的改善措施，例如：先定義供應商資料格式標準；在第二階段開始前檢查資料品質；更新資料接收與驗證流程；將資料格式問題加入風險或議題追蹤；以及與供應商確認提交規則與責任。* 其他選項是錯誤的，因為：- 記錄此問題：必要，但不完整。只記錄不應用，無法避免第二階段重複發生同樣問題。- 等此階段完成後再檢討：太晚。第二階段即將使用相同資料，應立即套用學習，而不是等問題再發生。- 要求供應商立即改善流程：方向可能正確，但太窄。專案經理不只要要求供應商改善，也要把經驗教訓納入下一階段的工作方式、檢查流程與風險管理。- 使用管理儲備應對此重工成本：不佳。管理儲備通常用於未知未知風險，不應優先拿來處理已知且可預防的重工問題。"}, {"source": "PMSuccess19.pdf", "number": 8, "stem": "專案團隊有3位成員在美國洛杉磯，另有2位成員在印度海德拉巴，由於兩個地區時差的關係，兩地的團隊成員之間已經產生許多溝通不良的議題。專案經理應該如何處理？", "options": ["請兩地的成員各推派1位代表，再與專案經理協調時間進行線上會議。", "經贊助人同意後，協調所有團隊成員在一個地點工作。", "使用共用的電子看板讓兩地的成員溝通資訊。", "協調兩地成員的工作時間使其部分重疊，在重疊的工作時間召開團隊的線上會議。 ( (您的選項)"], "answers": [3], "explanation": "選項「協調兩地成員的工作時間使其部分重疊，在重疊的工作時間召開團隊的線上會議」是最佳解，因為當團隊成員是不到10位的虛擬團隊時，如有溝通問題的狀況，還是需先協調工作時間，並以全體成員互動式溝通為首選。選項「使用共用的電子看板讓兩地的成員溝通資訊」較不適合，因為電子看板是拉式溝通，效果不如互動式溝通。選項「經贊助人同意後，協調所有團隊成員在同一個地點工作」不適合，因為專案不會因為虛擬團隊溝通不良就改組為同地團隊。選項「請兩地的成員各推派1位代表，再與專案經理協調時間進行線上會議」也不適合，因為團隊成員不到10位，不需要推派代表來溝通，專案還是以全體成員互動式溝通為首選。"}, {"source": "PMSuccess19.pdf", "number": 9, "stem": "專案經理發現大約有30%的專案利害關係人都不看每週發布的專案資訊。專案經理該如何改善此狀況？", "options": ["召開會議，找出利害關係人不看專案報告的原因。", "重新審視溝通管理計畫書，以確定此計畫書包含所有專案利害關係人的資訊需求。 ( (您的選項)", "每週發布專案資訊後，就提醒所有的利害關係人去觀看。", "再次溝通，讓所有的利害關係人知道專案資訊的重要性。"], "answers": [1], "explanation": "溝通管理計畫書中記載著利害關係人的溝通需求，例如：溝通格式、溝通方法、溝通頻率、發布資訊的理由、誰負責發佈資訊、接收者是誰、傳送資訊的方法......等。所以，此題的狀況，最有可能就是溝通管理計畫書出了問題，所以，才會出現30％的人員不看資訊的這種狀況發生，故，重新審查溝通管理計畫書，並做必要的修改是當務之急。"}, {"source": "PMSuccess19.pdf", "number": 10, "stem": "專案團隊進行一跨國專案，團隊中的承包商大都精通多種語言，而其中一家海外承包商的官方語言有四種。當專案舉辦整個團隊的會議時，該承包商與團隊以英語交談，但當進行承包商會議時，此承包商則會以不同的語言相互交談。專案經理在團隊會議上提出此問題，但承包商解釋「當他們可以以家鄉語言自由溝通時，他們的工作效率會更好」。專案經理首先應該如何應對？", "options": ["將此問題陳報給資源部門。", "讓整個團隊一起討論與制定團隊溝通的基本規則。", "要求整個團隊使用同一種語言。", "為專案提供翻譯服務。", "安排語言訓練課程。"], "answers": [1], "explanation": "共同商定的基本規則可以讓成員更願意遵循。故「讓整個團隊一起討論與制定團隊溝通的基本規則」是最佳解。另外，除非團隊無法找到解決方案，否則不需要向上陳報。"}, {"source": "PMSuccess20.pdf", "number": 1, "stem": "專案團隊正進行某Sprint。此團隊在時間壓力下通常表現良好。但這次似乎有些不同。工作場合很安靜，人們進行著看似秘密的談話。Scrum板上顯示工作按計劃進行著，並且也滿足了品質檢查，但團隊領導者卻感到焦慮。團隊領導者應該怎麼做？", "options": ["告訴團隊你對他們的工作感到焦慮。", "假設一切都正常，讓團隊繼續工作。", "在下一個站立會議時，要求每個人快速報告他們認為Sprint的進展。", "想想看所有其他可能導致這些焦慮情緒的近期變化或原因。"], "answers": [3], "explanation": "如果資料顯示工作是進展順利的，但你感到焦慮或不確定，那麼相信你的直覺會是個好主意。專案外可能會發生某些事情，而你對於這些事情的覺察可能就是導致你焦慮的原因。嘗試自己找出焦慮的原因，而不是散布焦慮或提醒團隊。假設一切都很好可能也是可以的，但是若沒有透過一些內省（introspection）來分析專案情況的話，你的焦慮將可能影響團隊。"}, {"source": "PMSuccess20.pdf", "number": 2, "stem": "有位團隊成員因專案工作表現優異，績效良好，專案經理想推薦他升遷。專案經理應該提供什麼資料給功能經理及高階主管？", "options": ["說明該團隊成員績效表現的相關會議紀錄。", "說明與匯總該團隊成員在專案中所交付的重要成果。", "說明該團隊成員績效表現的相關專案工件。", "說明該團隊成員達到績效目標的實獲值報告。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [1], "explanation": "* 當專案經理欲推薦團隊成員升遷時，最具說服力的資訊是該成員「在專案中所實際交付的重要成果」，因為這些成果可以展現成員的能力、責任感與貢獻價值。* 其他選項是錯誤的，因為：-實獲值報告是用來衡量整體專案績效與進度的工具，反映的是整體績效。-專案工件，例如：WBS、風險登錄表、計畫書等工件，著重的是專案資訊管理的績效，並非針對個人的工作績效。-會議紀錄雖然可能包含對該成員的正面評價，但這種紀錄通常缺乏系統性與成果量化的依據，難以作為升遷推薦的核心訊息。"}, {"source": "PMSuccess20.pdf", "number": 3, "stem": "迭代期間，在B國工作的專案團隊遇到了可能導致任務B延遲完成的問題。A國的團隊需要任務B的準時完成才能滿足他們的進度。這些團隊是以虛擬方式一起工作。為了解決此問題，專案經理可以做什麼？", "options": ["要求團隊進行虛擬協作，以找出避免潛在延遲的解決方案。", "要求團隊成員在迭代期間盡其所能，並在迭代完成後進行回顧。", "要求B國團隊更加努力按時完成，以免耽誤其他團隊的工作。", "增加迭代長度，並為專案團隊增加額外的資源，以便他們能夠滿足適當的截止日期。\nA. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [0], "explanation": "「可能會導致延遲」並不意味著任務的完成將會被延遲。為了提高成功的可能性，團隊應該協作並找出解決方案。他們是最了解自己工作的人，儘管是以虛擬方式進行工作，但他們應該還是能夠找出解決方案。"}, {"source": "PMSuccess20.pdf", "number": 4, "stem": "蒐集需求過程時，你得到超過2,000個需求，經過分析之後，由一位資深專家為全體成員制定出最終版的需求。請問，你使用的技術是？", "options": ["投票", "獨裁式決策制定", "一致同意", "多準則決策分析"], "answers": [1], "explanation": "獨裁式決策制定 (Autocratic decision making)是決策制定技術的其中一種，此技術是由一個人負責為群體制定決策。"}, {"source": "PMSuccess20.pdf", "number": 5, "stem": "某同地工作的團隊正在依據上一個迭代及回顧會議更新其基本規則。下列哪一個選項應該被排除在新的基本規則之外？", "options": ["團隊會議期間不得發送電子郵件或上網，並應在上午9:00至下午4:00期間出現在工作現場。", "團隊會議期間不得說髒話，而且週一晚上必須參加西洋棋俱樂部。", "說實話，並為對的一方（在對的時間）解決任何問題。", "如果你感到困惑，請要求澄清，此外，不要打斷其他人發言。"], "answers": [1], "explanation": "參加休閒活動通常不是基本規則的一部分。"}, {"source": "PMSuccess20.pdf", "number": 6, "stem": "專案經理帶領一個重要的大型專案，目前進行到第二個階段，團隊中有兩位成員時常發生衝突與爭吵，且此狀況一直無法改善與解決。專案經理應該怎麼做？", "options": ["移除這兩位成員", "評估這兩位成員的貢獻度之後，只留下其中一位", "與團隊所有成員討論該如何解決", "讓其他團隊成員決定將移除或是留下他們"], "answers": [2], "explanation": "這是關於團隊成員的衝突事件，既然是常態性的事件，就由所有團隊成員一起討論後，再決定將是最好的做法。"}, {"source": "PMSuccess20.pdf", "number": 7, "stem": "在分析了兩個團隊之間持續衝突的背景後，專案經理促成了一場討論，雙方同意採用一種特定的方法來解決問題。幾天後，其中一個團隊開始偏離商定的行動，認為交付壓力證明了採用不同方法的正當性。專案經理應該做什麼？", "options": ["將偏差上報給高階管理層，以強制履行協議。", "加強已商定的解決策略，並與相關團隊直接處理偏差問題。", "根據目前的交付壓力和執行限制，重新評估解決方案。", "允許有限度地偏離協議，以因應短期交付壓力。"], "answers": [1], "explanation": "* 這題的關鍵是：專案經理已經先分析衝突背景，並促成雙方討論，最後雙方也已經 同意採用特定方法來解決問題。所以現在的問題不是「還沒找到解決方案」，而是其中一方偏離已承諾的行動。因此，專案經理下一步應該先直接處理偏差，提醒團隊回到已商定的解決策略，並了解偏離原因，避免衝突再次升高。故「加強已商定的解決策略，並與相關團隊直接處理偏差問題」是正解。* 其他選項是錯誤的，因為：- 選項「根據目前交付壓力重新評估解決方案」有可能是後續動作，但不能因為一方自行偏離，就立刻推翻原本雙方已同意的解決方式。- 選項「允許有限度偏離協議」不適合。這會削弱團隊承諾，也可能讓另一方覺得不公平，導致衝突惡化。- 選項「上報高階管理層」太早。專案經理應先在團隊層級處理衝突與偏差，除非問題無法解決或已嚴重影響專案。"}, {"source": "PMSuccess20.pdf", "number": 8, "stem": "某虛擬團隊成員最近加入了一個同地工作的團隊。儘管他的素質很高，但此團隊成員的表現卻不斷受到同地團隊成員的質疑與嘲笑。團隊領導者應該採取哪種方法？", "options": ["取消該虛擬團隊成員的合同；顯然，此團隊並無凝聚力。", "使用團隊章程來處理協作和團隊目標的問題。", "監控此情況，並僅在虛擬團隊成員向人力資源部報告時進行干預。", "每週組織一次由協調員主持的虛擬協作會議。"], "answers": [1], "explanation": "團隊領導者需授權該團隊進行自組織，並解決新的虛擬團隊成員正在經歷的孤立和欺凌風險。使用團隊章程來解決協作和團隊目標的問題可提醒每個人他們似乎已經忘記的共同目標、專業精神和適當的行為。"}, {"source": "PMSuccess20.pdf", "number": 9, "stem": "有一位專案成員Paul告訴專案經理，他覺得工作缺乏挑戰，想領導一個團隊或是承擔更大的責任，因此專案經理安排與他面談，請問專案經理該如何處理？", "options": ["以問卷調查的方式，由專案團隊成員，以及Paul的直屬主管評定是否要讓他領導團隊、承擔更大的責任或是維持現況。", "以KPI評量Paul的績效表現，再與他面談以了解他的技能、經驗與目前的工作狀況，然後判斷要讓他領導團隊、承擔更大的責任或是維持現況。", "與Paul進行一對一面談，並將他的考量與需求彙整成書面報告，然後再向上陳報給專案贊助者，由他做出最終決策。", "瞭解Paul對於目前工作的想法，再詢問他有關於專案管理與領導的一些問題，評估他是否已適任帶領團隊。"], "answers": [1], "explanation": "關鍵績效指標（KPI）有助於專案經理衡量團隊成員是否朝著專案目標邁進。另外，評量個人績效時，請別忘了與成員面談，仔細聆聽團隊成員的意見，並保持客觀的判斷，與靈活的態度。"}, {"source": "PMSuccess20.pdf", "number": 10, "stem": "你的專案已進入結案階段。你觀察到某位功能經理對於協助專案交付似乎興趣不大，反而熱衷於參與研討會、撰寫技術論文，並持續提升他在領域內的專業知識。你推測他現在的動機主要來自於哪一種需求？", "options": ["安全", "外部認同", "社會", "尊重", "自我實現"], "answers": [4], "explanation": "* 正解是「自我實現」。本題的情境特徵為：主動學習、專業探索、非以專案為導向的行為，故屬於最高層次的自我實現需求。* 其他選項是錯誤的，因為：- 社會需求是與他人建立連結，但此人的行為偏向於個人深度成長導向。- 尊重需求偏向外部肯定，而非主動自我挑戰與探索。- 安全需求通常出現在早期職涯，且行為會偏向維持穩定與避免風險。- 外部認同看似正確，但題目強調的是內在成長，而非尋求他人肯定。* 馬斯洛需要階層理論從最低到最高層級的需要如下所述：* 生理：如對食物、水的需求。* 安全：需要被保護與穩定的生活。* 社會：對親情、愛情和友情的需求，並且需要歸屬感。* 尊重：需要被尊重、被認可，需要有名望或專業聲望。* 自我實現：自我成長，並以所學成就自己或他人。"}, {"source": "PMSuccess21.pdf", "number": 1, "stem": "專案進行到第5個階段，有兩位重要利害關係人在相同的時程要求你完成不同的事情，但因為資源有限，你無法同時達到雙方的要求。請問，你應該選擇何種衝突解決方式才能喚起雙方的共識與信任？", "options": ["命令", "撤出", "合作", "緩和"], "answers": [3], "explanation": "由於題目提到無法達到雙贏，故不可選擇「合作」。另外，由於要獲得雙方的信任感，所以可以先淘汰「命令」和「撤出」。只有「緩和」尚可以讓雙方有共識，願意往共同目標來一起努力完成專案。"}, {"source": "PMSuccess21.pdf", "number": 2, "stem": "你是一個敏捷專案的Scrum Master，在迭代回顧會議中，兩位資深成員因對測試流程的改善提案產生爭議。一開始，他們針對流程改善提出不同觀點，後來開始互相指責對方不配合，並威脅若再合作下去就要退出團隊。根據Speed B. Leas的衝突等級模型，他們目前的衝突狀況最可能處於哪一層級？", "options": ["第5級：棘手的情況（World War）。", "第1級：要解決的議題（Problem to Solve）。", "第2級：分歧（Disagreement）。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "第3級：競賽（Contest）。", "第4級：戰鬥／逃跑（Fight or Flight）。"], "answers": [4], "explanation": "正解是「第4級：戰鬥／逃跑」。題目中的敘述包含明顯的指責與退出威脅，顯示衝突已超越議題，開始針對人與其合作關係。第4級的特徵是情緒主導、關係緊張、可能升高為行動威脅（如：退群、拒絕合作）。"}, {"source": "PMSuccess21.pdf", "number": 3, "stem": "專案經理想採用僕人式領導方式帶領混合式專案。專案經理應該怎麼做？", "options": ["為團隊估算使用者故事。", "為團隊處理行政事務，並鼓勵他們自我探索。", "為團隊建立團隊章程。", "為團隊分解工作任務。"], "answers": [1], "explanation": "A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n選項中只有「為團隊成處理行政事務，並鼓勵他們自我探索」是僕人式領導模式的範例。專案領導者協助團隊成員處理各項行政瑣碎事務時，可讓他們有更多的時間專注在專案工作上。而其它選項都是團隊成員在敏捷式專案中應該執行的事項，故不適合專案經理來執行。"}, {"source": "PMSuccess21.pdf", "number": 4, "stem": "你的專案最近發生多起衝突，已經嚴重影響團隊士氣。你了解狀況後，發現此問題很複雜，牽涉到的人員比你想像的還多，所以，你決定先勸勉所有的成員都應該朝同一個目標邁進，並再次允諾達成專案績效將可得到績效獎金。請問，你採用了下列何種方法？", "options": ["強迫", "議題解決", "緩和", "妥協"], "answers": [2], "explanation": "解決衝突的方法如下：* 議題解決/合作：從不同的角度融入多元的觀點，需要以合作的態度，並開放心胸的討論，以獲得共識與承諾。* 妥協/調解：雙方都讓步，找出各方均有相當滿意度的解決方案，以利暫時或是局部解決衝突。* 緩和/接納：只強調同意的地方，完全不提差異處。例如：給予升遷機會來維持和諧關係。* 強迫/獨裁：強迫他人接受某人的觀點，也就是：一方得逞、另一方則失敗，就是贏輸的做法。例如：可透過有權威的職位下令以解決緊急狀況。* 撤出/規避：讓雙方從衝突中退出，並未解決問題。撤出議題有時是為了作更好的準備或是由他人來解決。"}, {"source": "PMSuccess21.pdf", "number": 5, "stem": "在一項大型專案中，專案經理相信團隊成員本質上缺乏責任感、不會自動自發，並且必須透過持續監督來驅使他們完成任務。專案經理視遵守指令為基本工作態度，同時也盡量避免讓成員參與決策。請問專案經理的行為最符合下列哪一種理論？", "options": ["強化理論：以外部獎懲機制塑造行為改變。", "赫茲伯格的動機－保健理論：需要透過激勵因子提升內在滿足感。", "馬斯洛的需求層次理論：滿足較低層次需求才能追求成長。", "麥克里葛的X理論：員工需被控制、監督，否則將逃避責任。", "麥克里葛的Y理論：員工雖然能自我驅動，並輔以監督與指令更能提升團隊績效。"], "answers": [3], "explanation": "* 麥克里葛的X理論 認為員工天性懶惰、不願承擔責任、抗拒變革，需強化控制與懲罰才能有效管理。本題情境符合此思維模式：不信任、監督控制、不鼓勵參與。* 其他選項是錯誤的，因為：- Y理論強調自律與成就動機，非題目所示的負面人性觀。- 赫茲伯格理論強調激勵與工作設計，與控制／監督風格無直接關聯。- 馬斯洛理論關注動機層次，不針對管理者對人性的信念。- 強化理論是一種動機理論，強調的是人類行為是由後果所塑造的。當某個行為帶來正面結果，該行為就更可能再次發生，反之，則該行為會減少。"}, {"source": "PMSuccess21.pdf", "number": 6, "stem": "專案經理與專案團隊成員之間因意見不合導致嚴重衝突。專案經理該如何處理？", "options": ["先暫時擱置不要處理。", "由專案經理負責解決。", "告訴團隊成員應服從專案經理的指示。", "專案經理與專案團隊成員一起協同解決。"], "answers": [3], "explanation": "管理衝突時，讓所有人都能發表自己的意見、認真傾聽他人所傳遞的訊息、重述或提出問題，以確保每個人都了解所要傳達的訊息、鼓勵雙方找出問題的雙贏解決方案與共識，並展現尊重及認同他人的不同立場，皆是有效處理衝突的必要措施。所以，只有選項「專案經理與專案團隊成員一起協同解決」符合有效管理衝突的精神。另外，除非題目有說嚴重衝突後經過多次溝通或處理仍無法解決，而且衝突的情緒升高，才要選擇「撤離/迴避/擱置」。"}, {"source": "PMSuccess21.pdf", "number": 7, "stem": "你正在帶領一個跨部門數位服務專案。團隊成員大多具備專業能力，也能自主完成被分派的工作。為了讓團隊在專案之外持續成長，你鼓勵成員利用工作之餘參加專業社群、技術讀書會或產業交流活動，並在團隊會議中分享新知。 你並未強制參加，也沒有把參與社群作為績效考核條件，而是相信成員會主動追求成長，並將所學回饋到專案工作中。 這種管理觀點最符合下列哪一項？", "options": ["麥克理葛的 X 理論。", "赫茲伯格的雙因素理論。", "麥克理葛的 Y 理論。", "獎賞與懲罰制度。", "指示型領導方式。"], "answers": [2], "explanation": "正解是「麥克理葛的 Y 理論」。McGregor 的 Y 理論認為，人們願意主動投入工作，會追求工作滿足，也不一定需要被嚴格指揮。題目中，專案經理鼓勵成員自我精進、參與專業社群、主動學習並回饋團隊，正是相信團隊成員具備內在動機與自我管理能力。選項「赫茲伯格的雙因素理論」有迷惑性，因為專業成長確實可被視為激勵因素。但題目問的是「管理觀點」，且強調相信成員會主動追求成長與自我管理，因此最符合 Y 理論。"}, {"source": "PMSuccess21.pdf", "number": 8, "stem": "敏捷團隊加入一位不熟悉敏捷方法的新成員。在每週一次的展示會議上，當一名經常批評他們先前工作的營運工程師意外出現，並對原型提出非常直白的回饋時，此新進成員明顯變得緊張。會議結束後，該成員迅速離開會議室。團隊應該如何應對？（選兩項）", "options": ["促進這位新團隊成員與營運工程師之間的面對面會議。", "產品負責人應在當天晚些時候聯繫此團隊成員，以了解問題的歷程。", "讓團隊成員們弄清楚他們自己的關係，因為這是一個自組織團隊。", "召開團隊會議，從其他團隊成員那裡了解他們對此情況的了解。", "團隊領導者應該在下一個回顧會議上重申基本規則，尤其是參與協定及溝通規範。 ( (您的選項)"], "answers": [0, 4], "explanation": "正解是「促進這位新團隊成員與營運工程師之間的面對面會議」和「團隊領導者應該在下一個回顧會議上重申基本規則，尤其是參與協定及溝通規範」。這是因為：- 在回顧會議重申/修正「基本規則」可以協助建立心理安全感與互動邊界。營運工程師「很直白的回饋」不一定錯，但若呈現方式造成新成員緊張逃離，代表團隊需要立即校準溝通方式與參與協定。- 促成面對面溝通可以協助釐清意圖、修復關係、建立共享理解。此舉可以協助新成員理解回饋的目的、也讓營運工程師理解其表達方式的影響，避免下次再度傷害團隊氛圍。"}, {"source": "PMSuccess21.pdf", "number": 9, "stem": "一項跨部門系統整合專案進入測試階段。資安團隊要求增加額外驗證程序，以降低上線後的合規風險；開發團隊則認為新增程序會壓縮修復缺陷的時間，可能影響里程碑。雙方都能提出合理依據，但會議已多次陷入僵局。專案經理希望採用一種能兼顧雙方核心關切、降低後續重工，並讓團隊共同承諾解決方案的衝突處理方式。專案經理應採用哪一種方法？", "options": ["強調共同目標並淡化差異。", "依職權指定較可行的方案。", "暫停討論，待情緒降低後再議。", "各退一步取得中間方案。", "共同探討需求與解法。"], "answers": [4], "explanation": "正解是「共同探討需求與解法」，這也是「協作 / 解決問題」的衝突處理方式。當雙方都有合理立場，且專案需要取得長期可接受的解決方案時，專案經理應促進雙方釐清真正需求、限制條件與可行替代方案，尋找雙贏結果。此外，教材中也強調討論時應聚焦議題本身，而非個人；有效的衝突管理能帶來更好的理解、績效與生產力。"}, {"source": "PMSuccess21.pdf", "number": 10, "stem": "在混合式專案的產品展示會議上，工程專家展示了最新的測試驅動開發雛形，並請團隊提供回饋。團隊成員Y打斷了此展示，並抗議雛形的成本太高。此舉立刻激起工程團隊成員的防禦心，並開始急著反駁。在這種情況下，專案領導者應該採取什麼行動？", "options": ["停止會議。堅定地告訴大家冷靜下來，並控制會議的其餘部分。", "藉此機會在會議期間解決團隊成員Y的擔憂。", "介入並聲明將對成本的問題進行考量，但提醒大家此展示會議是用來針對產品開發進行回饋。", "讓團隊自己解決這項打斷與問題。"], "answers": [2], "explanation": "作為一名有效的團隊領導者，你需要知道人們何時是以會對團隊產生負面影響的方式行事。在此情況下，Y表現得像個欺凌者，這種行為威脅到會議的既定目的。另外，你也不應該表現得像一位獨裁者。而讓團隊自行解決問題可能需要花很長的時間，並且會發現更多的情緒反應。所以，如果您可以通過快速提醒，讓會議重回正軌，這會是最佳選擇。"}, {"source": "PMSuccess22.pdf", "number": 1, "stem": "專案中有一位資深系統工程師，他在組織工作15年了，他擁有旁人無法取代的技術，所以他贏得團隊成員的認可與推崇。請問，此系統工程師是達到馬斯洛需要階層理論的哪一個階層？", "options": ["安全", "歸屬", "尊重", "自我實現"], "answers": [2], "explanation": "Maslow的需要層級理論從最低到最高階層的需求如下所述：* 生理：如對食物、水的需求。* 安全：需要被保護與穩定的生活。* 歸屬：對親情、愛情和友情的需求，並且需要歸屬感。* 尊重：需要被尊重、被認可，需要有名望或專業聲望。* 自我實現：自我成長，並以所學成就自己。"}, {"source": "PMSuccess22.pdf", "number": 2, "stem": "專案有一位團隊成員很常在會議上大力推廣自己的想法，並鼓吹大家追隨他的作法，導致有些成員感到困擾。專案經理應該如何管理人格特質？（連連看）。", "options": ["1-c, 2-d, 3-a, 4-b", "1-a, 2-d, 3-b, 4-c\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "1-a, 2-d, 3-c, 4-b", "1-b, 2-d, 3-a, 4-c"], "answers": [0], "explanation": "正解是：1-c、2-d、3-a和4-b。心理類型理論專家Carl Jung認為人類可以歸類為兩個基本態度：內向（introversion）和外向（extraversion），並主張人們會以下述四個獨立的心理功能來體驗世界：直覺（Intuition）、思維（Thinking）、 感覺（Sensation）與感受（Feeling）。「感覺」：不依賴邏輯思考或感受，而是個人認定的絕對事實。例如：我覺得思想被壓抑了。「感受」是指將觀念或事件價值化。例如：看他這麼累，我覺得對他很抱歉。外向型人的特徵是喜愛運動及社交，有自信，較開朗。而內向型人則是：愛思考、善於內省、不夠自信、不善交友，有些害羞。A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"}, {"source": "PMSuccess22.pdf", "number": 3, "stem": "團隊章程是針對團隊成員的預期行為制定一套共有的基本規則。下列哪些事項通常會包含在團隊章程中？（選三項）", "options": ["各個敏捷式儀式的時間盒。", "與重要利害關係人的溝通頻率與方法。", "促進知識分享的方法。", "團隊的共同價值觀。", "團隊進行決策的方法。", "規劃時程的工具與技術。"], "answers": [2, 3, 4], "explanation": "團隊章程是一份由團隊成員一起制定，可以讓團隊在進行工作時，建立其價值與協議。良好的團隊章程應包括：團隊的共同價值觀、團隊溝通與工具使用的指導方針、團隊進行決策的方法、團隊該如何解決意見分歧時的衝突、團隊會面的方式與時間、以及其他團隊協議，如：促進知識分享的方法。"}, {"source": "PMSuccess22.pdf", "number": 4, "stem": "專案經理應該如何配置專案團隊的技能使專案成功？", "options": ["要求功能經理列出專案成員的技能，並提供訓練計畫，以加強成員的技能與知識。", "由擁有跨職能的團隊成員依照自身的興趣與偏好認領專案任務。", "要求專案團隊列出重要的專案產出並對應到團隊相關的技能，決定最佳的專案交付方式。 (您的選項)", "審視整個專案然後建立 KPIs，然後，評量團隊的技能並連結到 KPIs，展現團隊將如何使專案成功的強處。"], "answers": [3], "explanation": "為了促使專案成功，專案經理需確保專案團隊擁有那些能達成專案目標、願景及績效的所需技能。故，確保團隊的技能與需達成的KPIs有所連結是配置專案團隊技能的好方法。"}, {"source": "PMSuccess22.pdf", "number": 5, "stem": "某混合式專案進行3個月後出現以下幾個狀況： -新進資源沒有準時完成專案工作。 -經驗豐富的資深資源回報「新進同事正在執行不必要的任務」。 -有些專案資源的專業水準不夠，故而延誤專案進度。 專案經理該如何做才能提升團隊績效？（選兩項）", "options": ["安排全團隊輔導活動，以解決無法如期完成任務的問題。", "建立輔導機制，讓經驗豐富的資源可以指導資淺的資源。", "與Scrum Master討論，以決定是否需要向專案發起人報告此事。", "與團隊一起討論與制定適合的培訓計畫與目標一致的任務清單。", "請專家協助制定一份團隊都認可的任務清單。"], "answers": [1, 3], "explanation": "專案進行時，專案經理需要為需要的人提供培訓，以提高團隊績效，另外，可以善用檢查表，以確保每個團隊成員皆可以自行確認需要完成的任務。此外，專案經理遇到問題時應該先與團隊一同解決問題，而不是向上陳報，所以選項「與Scrum Master討論，以決定是否需要向專案發起人報告此事。」與「請專家協助制定一份團隊都認可的任務清單。」可以先淘汰。另外，專案進行中，較不建議進行全員培訓，所以選項「安排全團隊輔導活動，以解決無法如期完成任務的問題。」也可以先忽略。"}, {"source": "PMSuccess22.pdf", "number": 6, "stem": "某敏捷專案團隊在一個正在經歷重大和破壞性劇變的環境中工作。由於壓力，團隊成員表現不佳，但工作必須繼續。團隊應該做什麼？", "options": ["要求product owner在時程中增加時間。", "一如繼往般地工作。", "依靠敏捷教練讓團隊專注於所期望的結果。", "查看專案的結束事宜或能取消的專案事項。"], "answers": [2], "explanation": "如果工作必須繼續，那麼答案就是找到一種方法來專注於工作。延長最後期限或假裝什麼都沒有發生是有風險的。在這個階段查看專案結束的選項可能有點激烈。"}, {"source": "PMSuccess22.pdf", "number": 7, "stem": "你被指派為一項跨部門產品開發專案的專案經理。該專案過去因為團隊成員分散在不同地點、溝通效率低落而屢次延誤交付。為改善合作成效，組織決定採取集中辦公（co-location）的方式，將主要成員與客戶代表安排在同一工作空間內，以提升專案績效。根據此作法，集中辦公最可能直接帶來哪些正向影響？（選兩項）", "options": ["增強專案成員與客戶之間的溝通效率與即時回饋。", "增加跨職能成員之間的知識共享與學習機會。", "提高組織對專案的監控強度。", "降低整體專案運作成本。", "有助於建立團隊凝聚力與信任感。"], "answers": [0, 4], "explanation": "*「增強專案成員與客戶之間的溝通效率與即時回饋」為集中辦公最主要的目的之一，能減少溝通延遲與誤解，提升需求澄清與決策速度。另外，長時間共處與面對面互動有助於增進成員間的互信與合作意願，是團隊發展的重要因素。* 其他選項是錯誤的，因為：- 集中辦公可能反而產生成本，如場地租借、差旅費用等，成本未必下降。- 專案監控強度取決於治理機制與報告流程，與是否集中辦公關係不直接。- 雖可能對於「增加知識共享與學習機會」有正面影響，但這是間接效益，不像溝通與團隊發展那麼直接可預期。"}, {"source": "PMSuccess22.pdf", "number": 8, "stem": "在一個軟體開發專案中，某位資深開發工程師的績效表現非常出色，每個開發任務都能提前完成，甚至常常在Sprint中超前其他成員。然而，他經常在每週五下午3點提前離開公司，且未向專案經理報告，理由是他已完成所有任務。專案經理應該如何處理此情況？", "options": ["與團隊一起制定或修訂團隊運作規則，強化透明度與一致性。", "懲罰該成員，強調制度的重要性。", "與該成員進行一對一對話，提升雙向溝通與透明度。", "不需處理，因為該成員的開發速度領先團隊。"], "answers": [0], "explanation": "* 專案的成敗取決於團隊協作與透明度，而非單一成員的績效，因此專案經理應該與團隊成員一起建立團隊章程或基本規則，並取得共識，以避免團隊成員因為不一致的行為規範而產生不滿或疑慮。另外，基本規則或團隊章程可以且應該在專案過程中根據需要而重新制訂或更新。這樣可以幫助團隊適應變化，提升協作效率，並保持專案執行的一致性和透明度。* 其他選項是錯誤的，因為：-懲罰會帶來反效果，特別是對高績效成員進行懲罰容易引起士氣低落，甚至影響其他開發人員對管理方式的不信任。-雖然進行一對一對話是一個不錯的選擇，但如果沒有後續規則的更新或改善，這個方法可能無法長期解決問題。-「不處理」這種忽視規範的做法會影響團隊的協作模式，並可能導致團隊的協調困難。"}, {"source": "PMSuccess22.pdf", "number": 9, "stem": "某個虛擬的專案團隊已經一起工作了一個月。在這段時間裡，他們已建立起些許的聯繫，然後在面對面的團隊建設日時，他們終於見面了。在這次會議上，團隊決定他們想要更改每週狀態會議的基本規則，並加入一些社交時間。他們認為這將有助於緩解他們中許多人所表達的孤立感。目前的團隊章程規定狀態團隊會議僅用於工作目的。專案經理首先應該做什麼？", "options": ["允許團隊在工作時間中安排單獨的會議，以進行社交。", "盡快安排另一場同地舉行的團隊建設活動。", "更改基本規則，並允許僅在每週狀態會議的前10分鐘進行社交。", "對團隊成員進行民意調查，以衡量對於改變基本規則的支持度。"], "answers": [3], "explanation": "對於基本規則的更改，團隊的共識是關鍵。所有其他選擇肯定都是可行的，但會對專案產生負面影響。單獨開會可能會分散團隊在工作時間上的注意力；改變基本規則，並限制它，似乎是專制的作法；另一個團隊建設活動將耗費大量的時間和金錢。"}, {"source": "PMSuccess22.pdf", "number": 10, "stem": "在某個組織中，有些人每週工作4天，但每日的工作時間較長，而其他人則每週工作5天。在一個專案中，這些日程表的混合導致了一些日程安排上的問題，特別是對於站立會議和迭代展示會議。團隊應該採取哪種方法？", "options": ["向PMO尋求建議。", "建議團隊中的每個人在此專案期間使用相同的工作週時。", "要求每週工作4天的團隊成員參加第五天的站立會議。", "自組織，並解決其排程問題。"], "answers": [3], "explanation": "團隊需要在這裡做出一些艱難的選擇，但他們必須讓每個人都同意。他們可以商定如何與那些無法參加會議，或是會在4天工作週的最後一個工作日結束時舉行站立會議的成員共享資訊。無論他們做出什麼選擇，團隊章程中的一致意見和對工作的共同看法是關鍵。"}, {"source": "PMSuccess23.pdf", "number": 1, "stem": "某專案團隊正被派往海外帶領一家子公司的一個整合性專案。為了做好準備，他們檢視了先前進行過的回顧紀錄，以找出主要的問題。在下一個迭代中，團隊可以使用僕人式領導和積極傾聽來解決下面列出的哪些問題？", "options": ["團隊非常不願意在訓練活動中配合。", "由於培訓效率低下，設備面臨到品質維護不佳的風險。", "調度問題。由於輪班工作的關係，團隊在每天的不同時間中有專門的非工作時間。", "實地考察期間遇上熱浪氣候，因此戶外的實踐培訓被模擬所取代。"], "answers": [0], "explanation": "* 此題的關鍵在於從選項中找出哪些問題能透過「僕人式領導」和「積極傾聽」解決。僕人式領導強調的是服務團隊、建立信任、促進成員成長，而積極傾聽則是理解成員的困難、需求與動機。因此，這兩個方法最適合處理與人員意願、參與度與學習效果相關的問題。* 選項「團隊非常不願意在訓練活動中配合」涉及團隊動機、參與度與信任感問題，這正是僕人式領導與積極傾聽可派上用場的地方。* 其他選項是錯誤的，因為：- 選項「調度問題」：這是制度性或時程上的問題，可由流程調整或工作協調來處理。- 選項「實地考察期間遇上熱浪，改用模擬培訓」：這是環境因素造成的調整，屬於不可抗力，不是溝通或領導可以解決的範疇。- 選項「培訓效率低落導致設備品質維護不佳」：雖然可能與團隊學習成效有關，但題目未表明是態度或溝通問題，因此無法明確歸因於可由僕人式領導處理的問題。"}, {"source": "PMSuccess23.pdf", "number": 2, "stem": "有一項大型專案採用混合式方法進行。專案前期需要完成較嚴謹的整體規劃與治理報告，產品功能則由團隊以迭代方式開發。近期，團隊在開發過程中遇到許多技術不確定性，經常需要嘗試不同的開發方法、工具與架構設計。同時，團隊成員也被要求準備大量狀態更新、行政紀錄與跨部門報告，導致他們能專注於技術探索與產品交付的時間減少。在此情境下，下列何者最能表現專案經理的僕人式領導風格？", "options": ["專案經理注意到團隊長時間工作，因此主動安排茶點與咖啡，並在會議中感謝團隊的努力，以維持士氣。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。\nA. 會，我有興趣了解PM", "專案經理在團隊遇到技術困難時，透過提問引導成員思考不同解法，而不是直接指定解決方案。", "專案經理承擔必要的治理報告、狀態彙整與行政協調工作，讓團隊能將更多時間投入技術問題解決與產品交付。", "專案經理蒐集幾種可能的新開發工具與方法，提供給團隊比較，並讓團隊自行決定是否採用。"], "answers": [2], "explanation": "題目的主要問題不只是團隊需要技術探索，而是團隊同時被大量行政與報告工作分散注意力。僕人式領導的核心之一，是移除障礙、保護團隊專注力、讓團隊能完成高價值工作。因此，專案經理主動承擔必要的治理與行政協調，讓團隊專注於技術問題與交付，是最符合情境的做法。"}, {"source": "PMSuccess23.pdf", "number": 3, "stem": "以下哪一項最能代表僕人式領導的實踐行為？", "options": ["領導者根據團隊成員的成熟度，調整領導方式與介入程度，以提升目標達成效率。", "領導者主動移除障礙、關心成員的需求與成長，並致力於培養團隊的自我管理能力。 ( (您的選項)", "領導者以自身的遠見鼓舞團隊，促使團隊成員超越自我、追求改變與創新。", "領導者在關鍵決策中做出明確判斷，並強調團隊需服從專案目標與紀律。", "領導者設計績效獎勵機制，將個人成果與專案成功掛鉤，以激勵團隊高效率產出。"], "answers": [1], "explanation": "MAI D. 不會，我對PMI的AI認證沒有興趣其他，歡迎留言\n觀看結果\n* 正解是「領導者主動移除障礙、關心成員的需求與成長，並致力於培養團隊的自我管理能力」。此選項展現出僕人式領導的核心精神：服務導向（主動幫助團隊移除障礙）、成員優先（關心個人成長與需求），及賦能（培養自我管理而非控制團隊）。* 其他選項是錯誤的，因為：-「強調根據成熟度調整風格」是情境式領導。-「著重願景與激勵」雖能推動成長，但並非以服務為起點。這是轉型式領導。-「強調團隊需服從專案目標與紀律」是屬於控制與命令的直示型/權威領導。-「著重績效回報與激勵交換」是交易型領導的做法。"}, {"source": "PMSuccess23.pdf", "number": 4, "stem": "在一個長期執行的專案中，專案經理觀察到反覆的打斷、私下交談和個人批評經常使團隊會議脫離正軌。雖然目前尚未有任何重大衝突升級，但這些行為正在團隊內部製造緊張氣氛並降低信任感。專案經理應該做什麼？", "options": ["隨著時間的推移，協作日趨成熟，允許團隊自我修正行為。", "先觀察，僅在破壞性行為升級為明顯衝突時才加以處理。", "建立並強化明確的基本規則，以實現互相尊重的溝通和會議行為。", "要求職能經理及早介入會議，並強制執行適當的行為。"], "answers": [2], "explanation": "此題情境中的團隊目前雖然還沒有發生重大衝突，但已經出現反覆的打斷、私下交談、個人批評，而且這些行為正在造成緊張氣氛並降低信任感。這表示問題已經影響團隊合作氛圍，專案經理不應等到衝突升級才處理，而應該主動建立並強化團隊的基本規則。此外，管理衝突也意味著在衝突升級前加以預防。故建立並強化共同的基本原則，有助於在衝突加劇前，促進互相尊重的互動、心理安全感和一致的期望。"}, {"source": "PMSuccess23.pdf", "number": 5, "stem": "專案正處於執行階段。此專案的團隊成員都是舊識，大多數成員都合作過兩個專案以上。最近有個團隊成員向新任的專案經理反應：「有位成員最近時常抱怨專案的管理方式」。專案經理應該如何應對？", "options": ["舉辦團隊建設活動，以提升團隊士氣。", "將此事記錄下來，並找出抱怨的成員，以便可以與他好好解釋專案的管理方針。", "安排團隊會議，並討論目前的基本規則和團隊期望的合作方式。", "參考利害關係人參與計畫書，以解決目前的問題。", "與各個團隊成員單獨會面，並了解他們各自所期望的管理方式。"], "answers": [2], "explanation": "舉行團隊會議是最好的應對方式，因為在會議上可以鼓勵與引導每位團隊成員的參與，並可以讓所有團隊成員公開討論，並共同商討與制定一套基於共識的管理方式或指導方針。"}, {"source": "PMSuccess23.pdf", "number": 6, "stem": "專案這週遇到了無預警的短暫停電，軟體開發主管宣佈專案的軟體開發將會延後一週完成，但是為了準時完成專案，此舉將壓縮到軟體測試的時間，所以，開發主管與測試主管產生激烈的討論。請問，你應該採用何種衝突處理方式，才能讓這類事件可以得到長遠的解決方式？", "options": ["從不同的看法融入多元的觀點。", "尋求一個兩方均感到部分滿意的解決方案。", "告訴他們只要能達成專案目標，兩個部門都可得到獎金。", "先推遲此議題，以期做出更好的準備與應對方式。"], "answers": [0], "explanation": "此題的情境是專案成員各持不同的觀點，為了化解之間的衝突，且能達成「長期效果」的方法是：合作，而「從不同的看法融入多元的觀點」就是合作的做法。"}, {"source": "PMSuccess23.pdf", "number": 7, "stem": "某虛擬實境創新產品的專案採用混合式方法，此專案包含三個團隊。開發團隊最近正加速功能特性的交付，行銷團隊必須為產品的上市預作準備，但行銷團隊向專案經理表達對於產品交付時程的擔憂，並抱怨無法得知開發團隊的進度與狀況。專案經理該如何處理？", "options": ["安排兩個團隊共同參加每日站立會議。", "讓產品負責人帶領開發團隊加速交付。", "請功能經理向開發團隊表達時程的擔憂及溝通的問題。", "讓Scrum master負責解決兩個團隊溝通的障礙。"], "answers": [0], "explanation": "當專案中的各個團隊之間存在猜疑或擔憂時，最好的做法就是盡快安排他們進行面對面溝通。而每日站立會議是敏捷式專案中發生頻率最為頻繁的會議。選項「讓Scrum master負責解決兩個團隊溝通的障礙」並不合適，因為團隊之間的溝通障礙應該由團隊成員自行負責解決，Scrum master只需要協助或促進成員去解決衝突，而不是負責解決。選項「請功能經理向開發團隊表達時程的擔憂及溝通的問題」也不適合，因為這是專案內的開發團隊與行銷團隊溝通的問題，與功能部門/功能經理無關。"}, {"source": "PMSuccess23.pdf", "number": 8, "stem": "下圖中的情境分別屬於哪一個團隊發展的階段？", "options": ["1-->(A)、2-->(B)、3-->(D)、4-->(C)", "1-->(A)、2-->(C)、3-->(D)、4-->(B)", "1-->(B)、2-->(A)、3-->(D)、4-->(C)", "1-->(B)、2-->(C)、3-->(D)、4-->(A)"], "answers": [2], "explanation": "正解是：1-->(B)、2-->(A)、3-->(D)、4-->(C)。編號1中提到成員主張自身立場，並出現意見分歧與衝突，所以是「風暴」階段。編號2提到成員有禮貌，並考量是否要顯露自身觀點，這表示還在觀望熟悉環境中，故為「形成」階段。編號3中提到成員可以輕鬆協作、溝通，並解決問題，所以是屬於「表現」階段。編號4中提到成員開始發揮生產力，且開始信任對方，故屬於「規範」階段。"}, {"source": "PMSuccess23.pdf", "number": 9, "stem": "一個 Scrum 團隊正在執行第六個 Sprint。近期 Product owner 開始參加每日 Scrum，並要求每位開發人員逐一報告進度、調整當日工作順序，也提出將一項緊急需求直接加入目前 Sprint。團隊反映會議時間逐漸延長，且每日 Scrum 已變成向 Product owner 報告狀態。目前 Sprint Goal 仍然有效。Scrum Master 應如何處理？", "options": ["允許產品負責人調整工作次序。", "陪同產品負責人檢視燃盡偏差。", "擴大會議規模以同步利害關係人的需求。", "保留團隊主導，另行釐清需求。"], "answers": [3], "explanation": "每日 Scrum 是開發團隊用來檢視近期進度、協調當日工作並提出障礙的短時間協作會議，不應成為向 Product owner 報告狀態的會議。Product owner 負責產品價值、需求釐清及產品待辦清單的優先順序、開發團隊則負責規劃如何完成工作。Scrum Master 應協助各角色理解 Scrum 流程、保護團隊自主性，並將需要深入討論的新需求安排在每日 Scrum 之外處理。若 Product owner 同時承擔Sprint 待辦清單中的開發工作，可作為執行工作的人員參與；但不應因此指派其他成員的技術作法或將會議轉變為管理報告。"}, {"source": "PMSuccess23.pdf", "number": 10, "stem": "團隊與一位法規顧問因審查回覆順序產生爭執。團隊認為是資源與排程限制，顧問則認為團隊不重視合規承諾。雙方語氣轉為防衛，緊張升高。專案經理應該做什麼？", "options": ["召集雙方調整審查節奏與回覆優先順序，並建立後續升級準則。", "請贊助者與法規顧問確認合規回覆期望，避免團隊承諾不可行的時程。", "與相關方檢視事件背景、限制條件與各自關切，以判斷造成分歧的主要原因。", "重新確認溝通管道與責任分工，要求雙方依既定流程提出需求與限制。"], "answers": [2], "explanation": "* 正解是「與相關方檢視事件背景、限制條件與各自關切，以判斷造成分歧的主要原因」。本題的重點是：雙方對同一個問題的認知不同，而且情緒與防衛性溝通正在升高。團隊將問題視為資源與排程限制；法規顧問則將問題視為團隊承諾不足。這表示專案經理不能只把它當成單純的排程問題，也不能只靠流程或贊助者來壓制分歧。衝突管理的第一步通常不是立即解決表面問題，而是先了解：各方如何定義問題；各自受到哪些限制；背後真正的關切是什麼；衝突是否來自誤解、期望落差、資源限制或承諾認知不同。* 其他選項不適合的原因是：- 召集雙方調整審查節奏與回覆優先順序，並建立後續升級準則：雖然看起來務實，也可能是後續可行行動。但它已經跳到「調整優先順序」與「建立升級準則」，尚未先釐清雙方對問題的不同定義與背後原因，因此不是最佳第一步。- 重新確認溝通管道與責任分工，要求雙方依既定流程提出需求與限制：看似能改善溝通，但題目中的核心不是單純流程不清，而是雙方對問題本質的解讀不同。若只強化流程，可能無法降低防衛性，也無法處理信任與期望落差。- 請贊助者與法規顧問確認合規回覆期望，避免團隊承諾不可行的時程：此選項考量到團隊限制與外部利害關係人期望，但過早升級給贊助者，且偏向保護團隊立場，可能使顧問感到被排除或被壓制。專案經理應先理解衝突脈絡。"}, {"source": "PMSuccess24.pdf", "number": 1, "stem": "你帶領的專案採用虛擬團隊進行，預計將於半年後結案。某日成員之間發生衝突，此衝突在短時間內是無法解決的。請問，你應該採用哪種處理方式?", "options": ["合作/問題解決", "妥協/和解", "緩和/接納", "擱置/迴避"], "answers": [3], "explanation": "由於題目提到此衝突在短時間內無法解決，也就是需要更多時間，做好充分準備後才能處理，所以，擱置/迴避會是最佳解。"}, {"source": "PMSuccess24.pdf", "number": 2, "stem": "一項混合式數位服務專案已進行到第三個 Sprint 審查會。團隊正在展示符合完成定義的產品增量，並邀請關鍵利害關係人提供回饋。會議期間，Kevin 持續詢問團隊如何估算故事點、為何採用目前的任務分配方式，以及每日 Scrum 是否應延長。他的問題逐漸占用原本用來檢視產品成果與討論後續價值的時間。Scrum Master該如何處理？", "options": ["讓團隊回應，以維持透明度。", "請 Product owner 彙整待辦清單。", "重申審查會議的目的，另排流程或會議討論。", "邀請 Kevin 參加回顧會議。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [2], "explanation": "Sprint 審查會議的重點是讓團隊與利害關係人共同檢視產品增量、討論成果所帶來的價值與環境變化，並據此考量後續 Product待辦清單的調整。Kevin 提出的流程問題並非完全不重要，但若持續在 Sprint 審查會議中深入討論，會使會議偏離原本目的。因此，Scrum Master 應：先肯定 Kevin的關切、說明 Sprint 審查會議的目的、將會議重新聚焦於產品成果、價值與回饋，而後另行安排適當場合處理流程建議。 教材將 Scrum Master／敏捷教練定位為協助團隊與相關人員理解敏捷思維和 Scrum 流程的角色，並促進協作式決策環境。"}, {"source": "PMSuccess24.pdf", "number": 3, "stem": "在一次治理審查會議中，資深利害關係人要求在不調整範疇或資源的情況下，加速交付數項功能。團隊成員後來表示擔心，認為此要求不切實際，且可能影響品質和士氣。專案經理應該做什麼？", "options": ["將請求上報給贊助者，並等待他們決定是否繼續進行。", "接受請求並鼓勵團隊加倍努力以符合期望。", "向利害關係人清楚傳達團隊的疑慮和限制，以支援明智的決策。", "要求團隊協作重新評估其預估，並找出吸收額外工作的機會。"], "answers": [2], "explanation": "這題的關鍵是：資深利害關係人要求加速交付數項功能，但同時又要求：不調整範疇、不增加資源。這代表時程被壓縮，但其他限制條件不變。團隊已經指出這樣可能影響品質與士氣，因此專案經理不應直接接受，也不應只是要求團隊硬吸收工作，而是要把限制、風險與可能後果清楚地向利害關係人說明，幫助他們做出有資訊基礎的決策。此舉不但有助於利害關係人做出明智的決策，同A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n時保護交付的可持續性和團隊士氣。故正解是「向利害關係人清楚傳達團隊的疑慮和限制，以支援明智的決策」。"}, {"source": "PMSuccess24.pdf", "number": 4, "stem": "研發部門的主管經常指示敏捷團隊增加或調整產品的功能特性，並讓產品負責人在迭代審查會議時才發現。專案經理應如何處理此問題？", "options": ["請產品負責人直接與研發部門主管溝通。", "請研發部門主管對於功能特性的增加或調整提出變更申請。", "召集產品負責人與研發部門主管會面，並由專案經理進行協調。", "向贊助人反應此問題，避免研發部門主管對於團隊的干擾。"], "answers": [0], "explanation": "* 此題的最佳解是「請產品負責人直接與研發部門主管溝通」。這是因為：在敏捷環境下，產品負責人負責管理產品待辦清單與功能優先順序。研發部門主管直接對團隊下指示、增加或調整功能，會繞過產品負責人的角色，造成優先順序混亂與範疇失控。正確作法是讓需求與變更回到產品負責人這個正式窗口。* 選項「召集產品負責人與研發部門主管會面，並由專案經理進行協調」較不適合，是因為：專案經理可促進合作，但核心問題在於要恢復正確的角色分工，不是由專案經理居中協調需求決策，而且這樣做容易讓專案經理取代 PO 的產品決策角色。* 這題的解題邏輯是：功能需求應透過產品負責人進入待辦清單並排序，不能由外部主管直接指揮團隊。"}, {"source": "PMSuccess24.pdf", "number": 5, "stem": "專案經理James相信他應該多信任專案團隊成員，並且多賦予他們責任，讓他們有成就感，進而提升工作效率。請問，James崇信的是哪一種理論？", "options": ["期望理論", "馬斯洛需求理論", "赫茲伯格激勵理論", "邁克裏葛的X理論"], "answers": [2], "explanation": "赫茲伯格激勵理論說明：人們將因為激勵因子 ，例如：自我實現、工作成就、責任的賦予、認可、前途、或專業肯定而提升工作的動力或績效。但是，人們因為保健因子 而提升工作動力的機率幾乎是零。保健因子 包含：薪資、工作環境和個人生活現況。"}, {"source": "PMSuccess24.pdf", "number": 6, "stem": "在一項跨部門系統導入專案持續執行數月後，專案經理發現例行協調會經常被插話、諷刺性回應與小圈圈討論打斷。雖然尚未出現正式投訴或需要升級的重大衝突，但新加入的成員開始迴避發言，會後抱怨增加，合作信任逐漸下降，會議決策品質也受到影響。專案經理應該做什麼？", "options": ["與團隊共同確認會議互動準則，並持續提醒與介入以維持尊重的討論方式。", "分別與較常打斷討論的成員談話，請他們注意語氣並避免影響其他人的參與。", "請職能主管列席關鍵會議，以提供權威支持並確保討論維持在議程範圍內。", "在下次回顧會中蒐集成員對會議效率的意見，再判斷是否需要建立行為規範。"], "answers": [0], "explanation": "* 正解是「與團隊共同確認會議互動準則，並持續提醒與介入以維持尊重的討論方式」。本題的關鍵是：破壞性行為尚未升級為重大衝突，但已經影響團隊信任、參與度與會議品質。題目中的插話、諷刺回應、小圈圈討論，都是會削弱心理安全感與團隊合作的行為。雖然目前還沒有正式投訴或重大衝突，但如果專案經理放任不處理，後續可能演變成更明顯的人際衝突或協作問題。因此，專案經理應及早建立並強化團隊互動與會議行為的共同準則，例如：尊重發言順序、避免人身批評或諷刺、會議中公開討論，不私下形成小團體、對議題提出建設性意見、以及在偏離準則時即時提醒。衝突管理不只是處理已爆發的衝突，也包含預防不當互動持續惡化。* 其他選項不佳是因為：- 在下次回顧會中蒐集成員對會議效率的意見，再判斷是否需要建立行為規範：蒐集意見有價值，但題目已明確指出行為正在傷害信任與參與度。若只是等待回顧會再判斷，會過於被動。- 分別與較常打斷討論的成員談話，請他們注意語氣並避免影響其他人的參與：個別談話可能是輔助措施，但本題描述的是整體會議文化與團隊互動問題。只處理個別成員，無法建立所有人共同遵循的行為標準。- 請職能主管列席關鍵會議，以提供權威支持並確保討論維持在議程範圍內：這是過度依賴外部權威，也可能讓團隊更緊張。專案經理應先在團隊層級建立清楚的互動準則，而不是立即請職能主管介入。"}, {"source": "PMSuccess24.pdf", "number": 7, "stem": "客戶決定變更專案的一項預期產出，而且此變更已獲得核准，但對於時程與預算的影響尚不明朗。專案中的軟體開發團隊得知此消息後，拒絕承諾軟體的完成日期，並且告訴專案經理「敏捷式的開發方法無法準確預測最終的交付日期」，但專案的另一個團隊需要依靠此軟體才能完成其他的產品開發工作。專案經理應該怎麼做？", "options": ["請產品負責人帶領開發團隊進行估算後決定軟體的完成日期。", "召集相關的團隊成員溝通意見並釐清問題。", "因變更已核准必須執行，要求軟體開發團隊討論並決定完成日期。", "協助軟體開發團隊運用時程估算技術製作甘特圖。"], "answers": [1], "explanation": "發生衝突時，最好的做法就是讓發生衝突的成員們能夠以開放的心胸，開誠布公地溝通、釐清問題，並試圖一起找出解決方案。選項「協助軟體開發團隊運用時程估算技術製作甘特圖」，並不適合，因為甘特圖並非敏捷式開發團隊會使用的工具。"}, {"source": "PMSuccess24.pdf", "number": 8, "stem": "專案經理同時負責數個專案，其中一個新成立的混合式專案團隊由不同部門與地區的成員組成。成員具備所需的專業能力，但在前兩週已出現重複作業、等待決策及溝通方式不一致等情況。由於專案經理無法參與團隊所有日常活動，希望在保留團隊自主性的同時，協助團隊建立有效的合作方式。專案經理首先應該怎麼做？", "options": ["鼓勵成員以非正式互動建立合作關係。", "促成團隊共同訂定工作協議與決策規則。", "安排成員定期交換進度與依賴資訊。", "召集相關專案代表統一各團隊的協作節奏與回報方式。"], "answers": [1], "explanation": "新團隊正處於形成階段，問題不只是資訊不足，而是尚未建立角色期待、溝通規範、決策權限及衝突處理方式。專案經理應以促進者與服務型領導者的角色，協助成員共同建立團隊章程或工作協議，讓團隊自行形成可遵循的工作方式，同時提升自主性與共同責任。此外，團隊章程應由團隊共同建立，可納入共享價值、行為準則、溝通方式、決策規則、績效期待、衝突處理及會議安排。 專案經理負責建立支持協作的協議、結構與流程，而團隊則依團隊章程自行組織與運作。"}, {"source": "PMSuccess24.pdf", "number": 9, "stem": "專案經理正在領導一個跨職能產品開發團隊。團隊近期雖然能準時完成工作，但成員多半只願意執行熟悉的任務，不太主動提出新方法。幾位資深成員擔心嘗試新技術會造成錯誤，初階成員則表示缺乏機會學習更具挑戰性的工作。專案經理希望能激勵團隊成員，提升團隊能力，並建立一個能讓成員願意學習與成長的環境。專案經理應該怎麼做？（選兩項）", "options": ["定期公開表揚績效表現最佳的成員，並優先給予獎金與實質獎勵，以鼓勵其他成員提升績效。", "根據團隊成員的能力與發展目標，安排具挑戰性但可達成的任務，並提供必要的支援與回饋。", "建立心理安全的團隊環境，鼓勵成員提出想法、嘗試新方法、從錯誤中學習，並將經驗轉化為改善行動。", "在重要技術與流程決策中，由專案經理親自判斷並指導團隊執行，以避免團隊因意見分歧而降低效率。", "要求團隊遵守既有標準流程，避免使用未經驗證的新方法，以降低錯誤與返工風險。"], "answers": [1, 2], "explanation": "* 正解是「根據團隊成員的能力與發展目標，安排具挑戰性但可達成的任務，並提供必要的支援與回饋」和「建立心理安全的團隊環境，鼓勵成員提出想法、嘗試新方法、從錯誤中學習，並將經驗轉化為改善行動」。這是因為：有效領導不是只要求團隊完成任務，而是幫助成員成長。提供具挑戰性的任務，可以讓成員發展新技能；但挑戰必須搭配支援、回饋與合理期望，否則可能變成壓力或風險。高績效團隊需要心理安全感。成員若能在安全環境中提出不同意見、嘗試新方法並從錯誤中學習，團隊才會持續改善與創新。這也符合僕人式領導與促進團隊自我成長的精神。* 其他選項並不適合，因為：- 獎金與表揚可以激勵個人，但若過度強調最佳個人績效，可能造成競爭、降低合作，甚至削弱團隊互助氛圍。題目重點是團隊成長，不是只獎勵明星成員。- 專案經理親自做所有重要決策，可能短期看似有效，但會降低團隊自主性與學習機會。有效領導應引導、賦能與支持團隊，而不是控制所有決策。- 標準流程有助於穩定，但完全避免新方法會壓抑創新與學習。有效領導應允許團隊在可控風險下嘗試與改進，而不是用流程限制所有探索。"}, {"source": "PMSuccess24.pdf", "number": 10, "stem": "某成員3個月前加入專案團隊，但是幾乎每天都無法準時參加站立會議。專案經理應該怎麼做？", "options": ["在每日會議中與整個團隊面對面討論此問題。", "與整個團隊重新檢視團隊章程，並視情況修訂它。", "在回顧會議中提出該問題，以決定可行的改善計劃。", "向此成員的功能經理報告，並尋求可能的紀律處分。"], "answers": [1], "explanation": "與不合作的團隊成員打交道總是很困難的。在這種情況下，最好的方法是提出基本規則或團隊章程，以協助提高團隊的一致性行為，並增強彼此對專案目標和團隊的共同承諾。"}, {"source": "PMSuccess25.pdf", "number": 1, "stem": "你正帶領一個剛組成的分散式Scrum團隊，團隊成員分佈於三個不同時區。雖然成員來自不同文化背景，但他們都展現高度的參與意願與合作精神。現在，你的目標是在短期內建立基本信任與團隊\n連結，但由於預算限制，無法安排面對面會議。在此限制下，下列哪一項做法最有助於促進團隊彼此認識並提升士氣？", "options": ["舉行非正式的虛擬午餐聚會。", "提供團隊共處的場所。", "鼓勵團隊成員自組織。", "舉行跨時區的每日站立會議。", "規定每次溝通時都需開啟視訊鏡頭。"], "answers": [3], "explanation": "* 在無法安排面對面會議的情況下，每日站立會議（Daily Scrum）是分散式團隊中最關鍵的同步互動機制。若能在三地間協調出一個合理的交集時間進行每日會議，將有助於：建立穩定的團隊節奏、培養習慣性溝通與同步感、促進彼此了解，並提升心理安全與參與感。即使是短時間的每日交流，也能逐步累積關係與共識，對於建立分散式Scrum團隊的信任基礎與士氣提升具有實際成效。* 其他選項是錯誤的，因為：- 鼓勵團隊成員自組織雖然重要，但並非短期內最能促進了解與提升士氣的措施。- 提供團隊共處的場所可以先淘汰，因為題目提到由於預算限制，無法安排面對面會議，所以若無法有機會實體共處，該措施將無效。- 舉行非正式的虛擬午餐聚會雖然輕鬆可行，但需自發參與，頻率與持續性難以管理。- 規定每次通訊皆開視訊可能過於僵硬，造成壓力或文化抵觸。"}, {"source": "PMSuccess25.pdf", "number": 2, "stem": "單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。\n專案經理先與兩個高度相依的產品團隊釐清持續摩擦的來源，發現爭議主要來自交付順序與資訊同步方式不同。經引導後，雙方同意採用共同排程、每日同步及變更前先通知的做法來降低誤解。一週後，平台團隊因客戶展示期限迫近，未依約定同步變更，逕自改採原本被排除的流程，導致應用團隊再次收到不一致資訊，合作氣氛開始惡化。專案經理應該做什麼？", "options": ["將未遵守協議的情況提交給治理小組，要求其確認團隊應遵循的工作方式。", "重申雙方已同意的協作方式，並與平台團隊釐清偏離協議的影響與修", "與兩個團隊重新檢視展示期限、依賴關係與目前限制，判斷原協議是否仍適用。", "接受平台團隊的短期調整，但要求其在展示完成後補充說明偏離原因。"], "answers": [1], "explanation": "* 正解是「重申雙方已同意的協作方式，並與平台團隊釐清偏離協議的影響與修正行動」。本題的關鍵是：衝突已經被分析過，雙方也已同意具體解決方式，但其中一方後續偏離協議。這不是第一次發現衝突，也不是尚未了解衝突原因的情境。題目已明確指出，專案經理已經：釐清衝突來源、促成雙方討論、讓雙方同意採用特定協作方式，但其中一方後續未依約定行動。因此，專案經理此時應該強化已達成共識的解決策略，並直接處理偏離行為。* 其他選項不佳的原因是：- 與兩個團隊重新檢視展示期限、依賴關係與目前限制，判斷原協議是否仍適用：重新檢視限制條件看似合理，但題目並沒有指出原協議已不適用，而是其中一方單方面偏離已同意的做法。若立即重新評估協議，可能弱化原本已取得的承諾。- 接受平台團隊的短期調整，但要求其在展示完成後補充說明偏離原因：這等於默許偏離協議，可能讓另一團隊認為共識沒有約束力，也會讓衝突再次升高。交付壓力不能自動合理化單方面改變已同意的行動。- 將未遵守協議的情況提交給治理小組，要求其確認團隊應遵循的工作方式：治理小組可在必要時協助，但此時尚未顯示專案經理無法處理。立即升級可能讓衝突變得更正式、更對立，不是最佳第一步。"}, {"source": "PMSuccess25.pdf", "number": 3, "stem": "許多新成員剛加入專案團隊，雖然原來的團隊成員已經受過專案經理所安排的專案管理與團隊協作的相關訓練，但新的成員抱怨因缺乏團隊的共同理解導致彼此合作不順暢。專案經理應該怎麼做？", "options": ["說明這是團隊運作的正常現象，並提出變更申請延長專案時程。", "確保所有的新成員都能自在地請求原團隊成員與專案經理協助。", "提出變更團隊成員的申請，以較有經驗的資源取代新的團隊成員。", "要求原來的團隊成員提供支援與訓練，並安排召開啟動會議。"], "answers": [3], "explanation": "* 專案經理若想協助專案的團隊組建，他或她可以要求團隊中的資深成員與經驗較少的團隊成員一起合作，並視需要為其提供指導，以及分享知識、資訊和專業技能。* 再次召開啟動會議的核心目的是重新建立團隊共識、確保所有人對專案的目標、範疇和角色有一致理解。無論是內部問題還是外部變更，當專案的任何基本條件發生重大變動時，召開啟動會議都是必要且有效的策略。"}, {"source": "PMSuccess25.pdf", "number": 4, "stem": "在開發一款新客服App的過程中，一名專案團隊成員不熟悉最近組織採用的一款後端服務整合系統，讓他在交付分配的任務時遇到了困難，並導致開發進度面臨延遲的風險。專案經理應該怎麼做？", "options": ["要求團隊成員立即安排新系統的培訓課程。", "指派一位經驗豐富的資源來協助該團隊成員。", "向專案贊助者報告情況，並尋求資源協助。", "提出延長專案時程表的變更申請。"], "answers": [1], "explanation": "* 指派一位經驗豐富的資源來支持該團隊成員是一個務實的解決方案，這樣既可以確保當前的任務順利完成，又可以幫助團隊成員學習新系統。這種方法能夠立即減輕專案的進度壓力，並可以提升團隊成員的技能。* 雖然培訓是解決技能差距的好方法，但此選項忽略了當前任務的緊迫性。如果讓團隊成員自行學習，可能需要較長時間，此舉將導致專案延誤。* 專案經理應應該先嘗試解決問題，而不是立即提出變更請求。延長專案時程應該是當所有其他解決方案都不可行時，才使用的最後手段。* 將問題升級給專案贊助人是一種不恰當的做法。專案經理應在自己的管理範圍內處理議題，而不應直接求助於高層管理人員。"}, {"source": "PMSuccess25.pdf", "number": 5, "stem": "研發部的某高階主管偶爾會造訪敏捷團隊的工作場域，並對於緊急的功能特性工作給出指示。在Sprint審查期間，產品負責人對於團隊被要求進行這些功能特性感到不太舒服。專案經理應該如何解決這個問題？", "options": ["授予這位高階主管可以將新項目添加到待辦事項的權限。", "要求這位高階主管針對新項目的變更提出申請。", "向上呈報，以確保這位高階主管不再干擾團隊。", "與這位高階主管及產品負責人會面，以商討工作流程。"], "answers": [3], "explanation": "此情況是，高階利害關係人繞過產品負責人，並造成了破壞。這需要在高階主管與產品負責人之間達成工作協議才能恢復秩序。其他選項都違反了敏捷，例如：升級和提出變更請求，要么就是破壞了產品負責人的角色，例如：直接要求待辦清單。"}, {"source": "PMSuccess25.pdf", "number": 6, "stem": "某敏捷團隊正在開發一項訂閱制數位服務。專案範疇與預算已由治理委員會核准，且目前沒有額外預算可用。團隊在前幾個 Sprint 中已穩定交付高優先順序功能，客戶回饋也大致正面。 然而，近期市場競爭者推出以資料分析與個人化推薦為核心的新服務，產品負責人因此調整產品待辦清單，將部分高價值項目改為需要基礎資料分析與模型調校能力。團隊目前具備良好的前端、後端與測試能力，但缺乏足夠的資料分析經驗。部分成員表示願意學習，但擔心短期內速度會下降。 在不改變已核准範疇與預算的前提下，專案經理應該怎麼做？", "options": ["增加具資料分析技能的新成員加入團隊，並要求其立即負責所有新興高價值項目，以避免影響既有團隊速度。", "要求產品負責人延後所有需要資料分析能力的待辦項目，讓團隊繼續交付原本熟悉的功能，以維持穩定速度。", "請贊助人向治理委員會要求額外預算，因為市場變化代表原本資源規劃已不再適用。", "尋求外部資料分析供應商支援，以確保團隊不因學習新技能而降低速度。", "與團隊及產品負責人合作，辨識新技能缺口，透過訓練、配對工作、教練或知識分享提升現有團隊能力。"], "answers": [4], "explanation": "這題的關鍵限制是：範疇與預算固定，團隊已有穩定交付能力，但因市場變化需要新技能。在這種情境下，專案經理不應第一時間增加資源、找外部廠商或要求額外預算。因為題目已明確說明預算固定，而且團隊已有良好基礎與學習意願。最佳做法是協助團隊提升能力，也就是：辨識技能缺口； 安排訓練、教練、指導或結對；讓具相關經驗的人協助其他成員；與產品負責人調整短期工作順序；以及讓團隊在可持續節奏下逐步建立新能力。 故正解是「與團隊及產品負責人合作，辨識新技能缺口，透過訓練、配對工作、教練或知識分享提升現有團隊能力」。"}, {"source": "PMSuccess25.pdf", "number": 7, "stem": "專案進入整合測試後，專案經理發現內部團隊、供應商與營運代表處理分歧的方式差異很大。有人一遇到延遲就直接找高層，有人擔心破壞關係而不提出疑慮，也有人私下協商卻未同步相關方。結果，相似爭議在不同工作串流中被以不同方式處理，團隊對何時討論、何時升級缺乏共識。專案經理應該做什麼？", "options": ["與團隊和利害關係人明確建立分歧處理、溝通與升級的共同準則。", "鼓勵團隊與供應商先自行協調，只有在無法解決時才提交專案經理。", "請專案贊助者確認衝突升級門檻，並要求各方依照贊助者指示處理。", "依照每次爭議的影響程度個別介入，以避免建立過度僵化的處理流程。"], "answers": [0], "explanation": "* 正解是「與團隊和利害關係人明確建立分歧處理、溝通與升級的共同準則」。本題的關鍵是：整個專案中處理分歧的方式不一致。題目中出現三種不同反應：有人太快升級；有人避免提出問題；以及有人私下處理但沒有同步相關方。這代表問題的根本不是某一次衝突本身，而是團隊與利害關係人缺乏一致的衝突處理原則。專案經理應該讓相關方清楚知道：什麼情況應先協商；什麼情況應正式記錄；什麼情況需要升級；誰應參與討論；以及如何保持透明與一致。* 其他選項不佳是因為：- 請專案贊助者確認衝突升級門檻，並要求各方依照贊助者指示處理：升級門檻確實重要，但直接交給贊助者定義，會讓專案經理過早上交責任。此時應由專案經理先建立並溝通清楚的衝突管理期望。- 鼓勵團隊與供應商先自行協調，只有在無法解決時才提交專案經理：自行協調有時是有效的，但題目已指出有人私下協商卻未同步，導致處理方式不一致。若只鼓勵自行解決，可能讓不透明與不一致更嚴重。- 依照每次爭議的影響程度個別介入，以避免建立過度僵化的處理流程：個別判斷看似彈性，但本題問題正是「類似衝突被不同方式處理」。若持續個案處理，無法建立一致期望，也無法降低重複性混亂。"}, {"source": "PMSuccess25.pdf", "number": 8, "stem": "在第11個Sprint期間，開發團隊提前完成了該Sprint的所有使用者故事。身為敏捷實踐者的你清楚知道有幾種方式可以應對此狀況。請問，下列何項是較不適當的處理方式？", "options": ["慶祝提前完成工作。", "ScrumMaster 鼓勵開發團隊與產品負責人一起選取額外的故事來進行開發。", "在回顧會議時，和團隊檢討選取太少故事的心態。", "放成員半天假，以鼓勵成員高績效的表現。"], "answers": [2], "explanation": "放半天假鼓勵成員、選取額外的故事來進行開發、慶祝提前完成工作都是適合採用的做法，唯有「在回顧會議時檢討成員選取太少故事的心態」並不合適，因為這是不尊重團隊的作為。"}, {"source": "PMSuccess25.pdf", "number": 9, "stem": "由於新的團隊成員即將加入，因此要求敏捷團隊更新專案工件。以下哪些文件應該更新？（選兩項）", "options": ["願景聲明。", "里程碑滑動圖。", "資訊散熱器", "燃盡圖。", "路線圖。"], "answers": [2, 3], "explanation": "燃盡圖和資訊散熱器是向新團隊成員傳達進度與狀態的最佳選擇，而且燃盡圖中的預計剩餘故事點數之趨勢線需定期更新。願景聲明書和路線圖一般不會更新，除非發生重大變化。任何里程碑的滑動都將包含在資訊散熱器中。"}, {"source": "PMSuccess25.pdf", "number": 10, "stem": "專案經理是以專案團隊中的替代者身份加入了此專案。在最初的會議上，專案經理意識到，關於如何解決技術決策存在許多不同的意見。團隊成員不尊重彼此的想法，團隊環境變得適得其反。然而，現在團隊已經開始更有效地溝通，並製定了一些共同工作的流程和程序。請問，團隊現在處於哪個發展階段？", "options": ["風暴", "風采", "組建"], "answers": [3], "explanation": "風暴通常始於團隊成員自然工作方式之間所存在的衝突。人們可能會因為各種原因而以不同的方式工作，但是，如果不同的工作方式導致無法預料的問題，他們可能會感到沮喪和適得其反。一旦團隊成員開始一起工作，並調整他們的工作習慣和行為，並提供更多支持時，團隊就轉換到了正軌階段。"}, {"source": "PMSuccess26.pdf", "number": 1, "stem": "一位即將退休的專案經理一個月前將所有的材料移交給新的專案經理，專案到目前為止都很順利。今天這位新專案經理被告知，測試時有一個關鍵零件發生了故障。為了回應此問題，這位新專案經理第一步應該做什麼？", "options": ["與利害關係人溝通與討論此問題，以辨識出此問題將造成的成本與時程變異。", "諮詢前任專案經理，以確認該如何應對此問題。", "修訂時程基準，以解決為了修復關鍵零件而造成的時程延誤。", "查看風險管理計畫書，以確認是否有關於此風險的回應計畫。"], "answers": [3], "explanation": "專案發生問題時，可以先查看是否此問題是已辨識風險，若是的話，並請確認風險管理計畫書中是否有其風險回應計畫。"}, {"source": "PMSuccess26.pdf", "number": 2, "stem": "專案經理正在測試承包商所交付的應用程式，並發現此交付並不符合組織現在所採用的新標準。經查證，這些新標準並沒有包含在當初簽訂的專案工作說明書中。承包商表示為了完成這些額外的工作，此專案需展延兩週，且需增加6%的專案費用。專案經理應該怎麼做？", "options": ["為了及早完成專案，創造價值，應要求組織盡快付款。", "依據承包商提供的估算進行協商，並追加專案費用。", "提出變更申請，並依據契約條款來評估此新增費用。", "拒絕接受這項不符合專案需求的產出，並結束專案。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [2], "explanation": "此題情境是組織的新標準並未告知承包商，所以，組織需要透過變更申請的方式來修訂契約，將此新標準的需求加入契約中，才能順利完成專案。另外，承包商並沒有違約，所以不可以拒收產出。"}, {"source": "PMSuccess26.pdf", "number": 3, "stem": "你是某企業核心系統升級專案的專案經理，專案採用預測式生命週期，範疇、時程與成本基準已獲核准，並剛進入執行階段。 此時技術團隊提出一項替代實作方案：若在主要開發工作前先增加一輪架構驗證與缺陷預防活動，預期可降低後續系統整合失敗、品質缺陷與重工的可能性。然而，初步判斷此方案可能造成額外成本，並使部分里程碑延後。團隊認為越早執行越能降低後續風險， 專案贊助者則提醒專案必須維持商業價值與治理要求。 專案經理下一步最適合怎麼做？", "options": ["與團隊及相關利害關係人評估此方案對專案的整體影響，若需調整基準，則依變更管理計畫提出變更申請。", "將此建議記錄為變更請求，連同團隊提出的風險降低效益送交 CCB，並等待 CCB 決定是否核准該替代方案。", "請團隊先完成此方案的成本效益分析，若分析結果顯示可明顯降低重工與失敗率，則更新專案管理計畫書，並安排執行。", "將此建議納入風險登錄表，更新風險回應策略與風險報告，並要求團隊在不變更基準的前提下，先執行可行的預防活動。"], "answers": [0], "explanation": "正解是「與團隊及相關利害關係人評估此方案對專案的整體影響，若需調整基準，則依變更管理計畫提出變更申請」，因為它沒有直接假設一定要變更，也沒有直接跳到 CCB，而是先做整體影響分析，再依變更管理計畫處理。這最符合整合變更控制的精神。"}, {"source": "PMSuccess26.pdf", "number": 4, "stem": "Anne是某自行車公司的專案經理，她的專案團隊成員Tim辨識出一個與設計有關的風險。Tim發現支持自行車頸部的支架若在高鹽份的環境下將逐漸腐蝕，且會破壞自行車的頸部結構，並對騎士造成傷害。為了有效地處理此情況，Anne最後決定將自行車的材料由一般材料改為抗腐蝕材料。Anne是採用下列哪一種風險策略？", "options": ["規避", "拒絕", "移轉", "承擔"], "answers": [0], "explanation": "規避風險是指改變專案管理計畫書以排除風險，並保護專案目標使其不受影響。"}, {"source": "PMSuccess26.pdf", "number": 5, "stem": "專案發起人和專案團隊都向專案經理保證，新專案絕對有確實可行的時間表和足夠的預算。但是專案經理還是擔心會發生突發事件而威脅到專案的成功。專案經理應如何應對這一項擔憂？", "options": ["為專案要求額外資金，以應對突發事件。", "列出與評估所有的專案風險。", "依照原計畫書執行專案，以符合發起人的期望。", "要求團隊成員再次評估時程表與預算的準確性。", "與功能經理會議，以討論如何處理未知的未知風險。"], "answers": [1], "explanation": "專案經理有責任主動辨識風險，並讓自己熟悉如何分析已識別風險，以及為其規劃應對策略。"}, {"source": "PMSuccess26.pdf", "number": 6, "stem": "你執行的一個大型專案，其專案成員分散於組織中所有的部門。專案目前的時程與預算都管制在計劃內。突然一個重要的成員Tim被其部門的主管外派執行為期2週的教育訓練，但是Tim所負責的任務T1尚未完成，而T2及T3需等待T1完成後，才能開始，且T2是關鍵路徑上的任務。為了不耽誤時程，你要求其他團隊成員加班趕工，終於趕上Tim不在組織時所該完成的時程，但是專案成本因此超出了預算，且專案的品質也連帶受影響。你該如何處置此情況？", "options": ["感謝加班的專案團隊成員，並提醒他們下次須更加注意品質", "重新評估專案管理計畫書", "發信給你的部門主管，請他要求Tim的部門主管保證以後不會再發生此情形", "因為超出預算，所以需請發起人裁奪"], "answers": [1], "explanation": "雖然Tim負責的T1不是關鍵路徑上的任務，但關鍵路徑T2與T1有相依存的關係，故還是需要縮程法去完成專案。這題最好的選擇應該是了解問題發生的原因，並思考如何避免此情況再發生，所以只有「重新評估專案管理計畫書」是比較合適的。"}, {"source": "PMSuccess26.pdf", "number": 7, "stem": "組織與Enterprise Z公司合作，每個月交付一定數量的手機SIM卡片。專案今天臨時被暫停，因為專案經理一直以為風險容許度是25%，但是贊助者認為是20%。請問，專案經理當初應該著重哪些任務，才能避免此事件的發生？", "options": ["1.在專案執行期間，定期地反覆辨識關係人、2.在每個專案階段初期，重新審視關鍵利害關係人的風險容許度。", "1.分析專案風險時，專案經理與關鍵利害關係人需針對風險容許度達成共識、2.確實實施利害關係人參與計畫。", "1.依據專案對於變更與品質的容許度來制定風險容許度、2.由專案管理辦公室追蹤與稽核專案是否超出風險容許度的範圍。", "1.依據組織文化定義風險容許度、2.通知所有利害關係人皆需依據組織文化來回應風險。"], "answers": [1], "explanation": "風險容許度是指專案經理或關鍵利害關係人願意接受的最大風險，以及該風險所造成的潛在衝擊上限。在分析專案風險時，專案風險團隊必須知道並了解風險容許度，以根據專案的可接受風險容許度來評估風險。所以一旦專案經理與關鍵利害關係人對風險容許度達成共識之後，一整個專案就會依據此規範來管制專案，並且為了確保利害關係人都能保持一制性的認知，專案經理需依據利害關係人參與計畫與利害關係人溝通專案狀態。"}, {"source": "PMSuccess26.pdf", "number": 8, "stem": "專案經理無意中聽到了公司餐廳中的談話。有人說，工會可能會在接下來的兩週內採取行動。專案經理知道任何工會行動都會影響專案團隊，在專案的這個階段，任何專案的延誤都會對預算和進度造成重大損害。初期時，此工會行動的可能性被認為是最小的。因此，這是始料未及的。專案經理應該怎麼做？", "options": ["通知相關的利害關係人，並將新風險更新進風險登錄表中。", "與工會成員及工會領袖會面，以解決此衝突。", "為專案團隊設置一個資訊會議，讓他們了解參與工會行動的人員可能受到的紀律處分。", "向利害關係人詢問有關工會行動可能性的更多信息，然後根據聽到的內容採取行動。"], "answers": [0], "explanation": "專案經理需要主動解決此問題。透過更新風險登錄表，並將此風險的發展情況傳達給適合的利害關係人，以實現「解決問題」這一目標。"}, {"source": "PMSuccess26.pdf", "number": 9, "stem": "專案中有一項關於時程的矯正措施已經通過變更管制委員會的審查與核准了。專案經理接下來應該如何處理這項獲准的矯正措施？", "options": ["安排進專案工作，並實施它。", "更新時程基準。", "修訂工作績效報告。", "監視與管制這項矯正措施。"], "answers": [0], "explanation": "* 既然此矯正措施已經通過審核，就表示它已獲授權可實施。專案經理此時的主要任務，是確保這項措施被納入實際工作中，並加以執行。* 其他選項是錯誤的，因為：- 選項「更新時程基準」是錯誤的，因為雖然在多數情況下變更獲准後要更新基準，但不一定每個矯正措施都會影響基準。如果這次變更只影響預測值或控制帳戶，而未變動基準層級文件，就不需要更新基準。因此不能當成立即的正確步驟。- 選項「修訂工作績效報告」這也是錯誤的，因為這任務應在實施變更之後再進行，並非可優先處理的事項。- 選項「監視與管制這項矯正措施」雖然合理，但這是執行之後的監控階段工作，不應跳過「安排與實施」階段。"}, {"source": "PMSuccess26.pdf", "number": 10, "stem": "專案經理帶領的國際運動會場館工程專案正進行結構整合階段。鋼構施工原本已依核准時程展開，但當地政府已正式公告「地區水文報告」異動，要求承包商重新提交地基支撐能力資料。政府尚未發布停工令，也尚未正式限制大型器械進場，但公告內容可能影響後續施工方法。 該場址原本即位於地下水位偏高區域，且團隊在早期風險規劃中已將「地質條件變化」與「主管機關新增施工限制」列為已識別風險。此時媒體已開始報導，利害關係人也要求專案團隊說明後續影響。 專案經理現在應優先採取哪些行動？（選兩項）", "options": ["重新召開風險規劃會議，重建風險管理方法。", "發布停工預警通知，請利害關係人等待政府決議。", "更新議題紀錄，指派負責人追蹤政府公告與影響。", "要求施工團隊立即改用不需大型器械的替代工法。", "查閱風險登錄表，確認既有風險與應變計畫。", "啟動變更控制程序，提出時程與成本基準調整。"], "answers": [2, 4], "explanation": "正解是「查閱風險登錄表，確認既有風險與應變計畫」和「更新議題紀錄，指派負責人追蹤政府公告與影響」。題目已明確指出，地質條件與主管機關施工限制在早期風險規劃中已被識別。因此專案經理應先查閱風險登錄表，確認既有風險、觸發條件、責任人、應變計畫與可能的應變儲備。此外，政府水文報告異動已正式公告，媒體與利害關係人也已開始關注。這不是單純假設，而是已經發生、需要負責人追蹤與管理的外部事件。因此應更新議題紀錄，追蹤政府公告、正式公文、限制條件、決策時點與潛在影響。"}, {"source": "PMSuccess27.pdf", "number": 1, "stem": "你已針對專案提出一項重大變更申請，內容為「增加預算以委外取得關鍵技術資源，以確保專案能如期完成」。這項變更將影響專案的進度、成本與風險。經過變更控制委員會（CCB）審核後，變更正式獲得核准。你下一步應採取哪一項行動？", "options": ["根據核准內容更新專案管理計畫書與相關子計畫，並通知團隊與執行人員依此進行調整。", "立即通知所有主要利害關係人此變更已通過，以便他們重新評估需求與期望。", "儘快與外部供應商簽約，並啟動採購流程以減少進度落後的風險。", "更新專案章程以反映此次變更內容，並取得高層主管再次核准。", "請產品負責人更新產品待辦清單與優先順序，以確保交付價值最大化。"], "answers": [0], "explanation": "* 正解是「根據核准內容更新專案管理計畫書與相關子計畫，並通知團隊與執行人員依此進行調整」。根據整合變更控制流程的規範，獲核准後，應立即更新專案管理計畫書與相關文件，而後再根據更新過的計畫書進行溝通、採購或其他行動。* 其他選項是錯誤的，因為：- 通知利害關係人很重要，但不應在計畫書或文件未更新前貿然宣布，否則會造成資訊錯誤或混亂。- 變更專案章程是重大項目變更時才會執行，且不是常規的變更處理流程。大多數變更只需更新計畫書即可。- 與供應商簽約屬於執行層面行為，必須在計畫書已更新的基礎上進行，否則可能造成未授權採購。- 本題情境屬預測式專案，與敏捷的「產品待辦清單管理」無直接關聯。"}, {"source": "PMSuccess27.pdf", "number": 2, "stem": "單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。\n一項採預測型方法執行的醫療軟體專案已進入系統驗證階段。業務單位提出一項新的功能變更，技術團隊初步判斷，若採用該功能，必須增加完整的資安與迴歸測試，否則將無法符合驗收與合規要求。 專案經理檢視財務資料後發現，成本基準未包含這些測試費用；應變儲備已配置給已辨識的供應商風險，而管理儲備則由治理委員會控管。目前該變更申請尚未獲得核准。 專案經理接下來應將重點放在哪一項行動？", "options": ["先執行必要測試，再補辦變更核准程序。", "重新排序既有測試並刪除低風險案例，以維持預算。", "依逐級呈報程序要求贊助人核准動用管理儲備。", "完成影響評估並依變更流程送審。", "重估完工成本，直接更新專案成本基準。"], "answers": [3], "explanation": "這項功能尚屬於未核准的變更申請，而新增測試會影響專案成本，也可能影響時程、範疇、品質、風險與合規性。因此，專案經理應先完成整體衝擊分析，將所需測試費用、資源、時程及風險納入變更資料，再依變更管理計畫提交有權限的治理單位審查。此外，在變更獲准前，不能直接執行工作、修改成本基準或任意使用儲備。故正解是「完成影響評估並依變更流程送審」。"}, {"source": "PMSuccess27.pdf", "number": 3, "stem": "你的組織是當地的知名藥廠，現今專案所生產的新型口服降血糖藥物於三天前已經開始進行量產前的製作。今天專案成員告訴你，檢驗後發現，完成的藥物並不符合品質指標，需要予以改進。你應A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n該提出?", "options": ["矯正措施", "預防措施", "缺失修", "權變措施"], "answers": [2], "explanation": "當你發現可交付成果不符合品質標準，就需要找出未達到標準的原因，並提出缺陷修復的變更申請。缺失修正指的是用於修正不符合產品的刻意活動。"}, {"source": "PMSuccess27.pdf", "number": 4, "stem": "專案歷經多次矯正後仍出現成本與進度嚴重偏差的情況。EVM 指標（SPI、CPI）持續低於 0.8，趨勢分析顯示績效惡化。專案經理認為目前的成本基準已不再適用，績效報告失去參考價值。專案經理希望恢復有效的監管機制，下一步應該怎麼做？", "options": ["增加儲備金以吸收未來的偏差。", "與團隊討論削減範疇以降低成本。", "向CCB提交基準變更申請，並附上風險與趨勢分析。", "更新成本基準，以便後續報告更符合現況。", "採用趨勢分析替代EVM，以避免績效數據失真。"], "answers": [2], "explanation": "*「向CCB提交基準變更申請，並附上風險與趨勢分析」符合變更控制程序。* 其他選項是錯誤的，因為：- 專案經理不得自行更新基準，必須經正式流程。- 趨勢分析是輔助工具，EVM仍是主要績效指標，兩者應互補而非取代。- 儲備金是用來應對風險，不開用來掩蓋績效偏差或修正基準。- 範疇變更屬重大決策，也需透過變更控制流程提出，不能立即削減範疇。"}, {"source": "PMSuccess27.pdf", "number": 5, "stem": "專案經理帶領一個利害關係人眾多的大型專案，專案執行到一半時，有一位對此專案不熟悉的利害關係人加入了董事會，並改變了專案的既定決策，而且此改變將影響專案的進度與成本。專案經理首先應該怎麼做？", "options": ["告知客戶此變更將影響既定的進度。", "將此新風險更新進風險登錄表中，並規劃應變策略。", "將此事記錄下來，並評估後續該如何繼續進行專案。", "向此利害關係人簡報專案狀態，並請他收回變更要求。", "修訂專案時程表。"], "answers": [2], "explanation": "此題的情境涉及：新利害關係人加入、既定決策被改變、且可能影響進度與成本。這不是單純的新風險，但也不能立刻修訂時程。專案經理首先應該記錄此情況，釐清變更內容，評估對範疇、時程、成本、風險與利害關係人的影響，再依變更管理流程決定是否提出正式變更申請。故正解是「將此事記錄下來，並評估後續該如何繼續進行專案」。選項「將此新風險更新進風險登錄表中，並規劃應變策略」不是最佳解，因為這不是尚未發生的不確定事件，而是已經發生的決策變動，較接近議題或變更。"}, {"source": "PMSuccess27.pdf", "number": 6, "stem": "客戶提出了一些必要的修訂建議，這些建議影響到一些要徑上的活動，因而導致專案時程的變更。當你執行這些變更時，又發生了一些爭議。你應該怎麼做？", "options": ["製作議題紀錄", "請客戶收回建議", "要求功能經理的協助", "提出變更申請"], "answers": [0], "explanation": "* 不要被題目中的變更混淆了。此題的情境重點是「執行變更時，發生了一些爭議。專案經理應該怎麼做」。* 專案經理只要知道發生爭議時應該如何處理即可回答此題。而製作議題紀錄可以讓發生爭議的成員們知道他們所在意的事情已被受理與記錄，並會被解決，所以，「製作議題紀錄」是最佳解。* 另外，情境中並無提到發生了什麼爭議，所以只能先記錄下來，由議題負責人決定該如何處理。所以選項「要求功能經理的協助」是錯誤的，因為尚未知道這議題該如何處理，所以不能直接交給功能經理。"}, {"source": "PMSuccess27.pdf", "number": 7, "stem": "Jeff是一個$2,000,000的產品開發專案的專案經理，此專案已經進入執行階段，目前專案的時程、成本和範疇都掌控在計畫內。今天上午，一名專案團隊成員告訴Jeff：「他看到一則關於此專案將用到的材料的報導，該報導指出此種材料存在非常高的缺陷率」。在此報導前，並沒有任何原因或跡象可以讓Jeff對該材料的品質產生懷疑。請問，對於專案團隊成員的提醒，Jeff首先應該怎麼做？", "options": ["制定風險緩解計畫", "對風險進行分析", "採用備援計劃", "立即停止生產"], "answers": [1], "explanation": "隨著新風險的辨識，專案經理需對風險進行分析和制定風險應對專案集。目前，你所掌握的資訊量還不足以停止原來已執行工作，所以，只有在對風險進行分析後，才能確定如何制定風險回應策略。"}, {"source": "PMSuccess27.pdf", "number": 8, "stem": "在一個軟體開發專案中，專案經理為了壓縮整體時程，決定在某些模組尚未完全完成的情況下，提前進行下一個開發階段。這種做法可能加速專案進度，但也伴隨一定風險。這麼做最可能引發哪些問題？（選兩項）", "options": ["可能導致部分工作需要重新進行，增加重工成本並影響整體時程。", "可能因階段之間的快速切換，導致顧客的需求和期望無法充分被滿足。", "可能增加專案風險，包括技術問題或未解決的依賴事項所導致的進度延誤。", "可能因過程中缺乏明確控制，產生範疇的非預期變更和資源分配問題。", "可能可以降低整體專案成本，因為提早完成下一個階段可以壓縮資源的投入時間。"], "answers": [0, 2], "explanation": "* 在尚未完成前一階段就進入下一階段，可能會讓一些未解決的依賴性問題耽誤進度，而增加專案風險。* 提前進行下一階段可能會讓後續工作是在不完整或不正確的輸出下進行，導致大量的重工。* 顧客滿意度通常與需求確認和交付結果的品質相關，而非直接受到階段切換影響。* 提前進入下一階段引起，並不會造成範疇的非預期變更。* 提前進入下一階段往往會增加成本，特別是由於重工和風險引起的額外支出。所以不可能減少整體專案成本。"}, {"source": "PMSuccess27.pdf", "number": 9, "stem": "專案經理被指派接手一個國外專案，在某次會議上得知該國常發生水災，可能會對這個專案造成損失。專案經理應該先做什麼？", "options": ["擬定回應策略。", "進行衝擊評估。", "提出變更申請", "登錄至議題紀錄。", "查看風險登錄表。"], "answers": [4], "explanation": "最佳解是：查看風險登錄表。請注意，題目情境提到「專案經理接手一個專案」，這表示之前已經有其他專案經理經手過此專案，所以，新任的專案經理應該先去查詢看看前任專案經理留下的風險登錄表中是否已經記錄了此風險。"}, {"source": "PMSuccess27.pdf", "number": 10, "stem": "在規劃風險回應過程中，專案團隊正在討論應對威脅的風險策略。他們提出了幾個對策：(1)外包，(2)等到風險發生時再處理，(3)製作產品雛型、(4)安排有經驗的人員執行活動，(5)買保險。下列何項風險策略是專案團隊沒有想到的呢？", "options": ["移轉", "承擔", "規避", "減輕"], "answers": [2], "explanation": "* 移轉：外包和買保險。* 減輕：製作產品雛型和安排有經驗的人員執行活動。* 承擔：等到風險發生時再處理。故只有規避是目前尚未想到的方法。"}, {"source": "PMSuccess28.pdf", "number": 1, "stem": "某公司為了一個大型的綠能辦公室興建專案特地聘用一位擁有超過5年相關經驗的專案經理。此專案的管理計畫書中清楚記載客戶必須聘用3位有相關經驗的外部專家來進行各個階段的確認與驗收。今\n天專案經理得知客戶不想聘用外部專家，因為他們認為外聘專家的成本太高。專案經理應該怎麼做？", "options": ["依照專案管理計畫書上的約定，協助客戶聘用外部專家。", "評估不聘用外部專家的相關影響，並與客戶清楚說明可能將發生的問題及後果。 ( (您的選項)", "請求組織提供額外的專案資源，以期達成專案目標。", "與客戶會議，向他們說明可以不外聘專家，但是他們需要提出變更申請，並負擔衍生的相關成本及風險。"], "answers": [1], "explanation": "此題目情境顯示專案發生了議題。發生議題時，需要先將議題記錄下來，而後指派議題負責人來評估與處理該議題。所以，專案經理於評估過後，需要向客戶說明，讓他們知道若是不依據計畫書外聘專家的話將引起哪些風險、問題或是不良的後果。"}, {"source": "PMSuccess28.pdf", "number": 2, "stem": "專案團隊中有兩位技術人員橫跨兩個不同的專案，你擔心這兩位成員有可能會因為支援其他專案而延遲到你的專案進度。身為專案經理你可以如何處理？（連連看）", "options": ["3---e 和 2---d", "3---a 和 4---e\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "2---e 和 4---d", "2---b 和 4---c"], "answers": [2], "explanation": "此題主要是測試你是否了解負面風險的應對策略。a是關於「陳報」的描述、b是指「承擔」、c是「移轉」、d是「減輕」、而e是「規避」。所以正解是：2---e 和 4---d。"}, {"source": "PMSuccess28.pdf", "number": 3, "stem": "團隊處於產品的開發階段時，他們注意到有三個必要的變更。團隊成員對於如何實施這些變更抱持著不同的看法。專案經理應該怎麼做？", "options": ["與所有團隊成員會議，並以投票方式選出最多成員認可的變更實施方式。", "確認所有的團隊成員與利害關係人都清楚了解變更管理計畫書，且遵循它。", "與專案贊助者及組織高層會議，並討論出解決方案。", "確保所有的變更申請都與專案進展有關，並直接與所有團隊成員溝通變更的重點。"], "answers": [1], "explanation": "團隊和專案經理必須遵循記錄在變更管理計畫書中的變更管理流程與程序。"}, {"source": "PMSuccess28.pdf", "number": 4, "stem": "一項預測型系統汰換專案正在執行關鍵整合測試。測試環境建置任務原定本週完成，但專案團隊發現供應商交付延誤，導致該任務將無法如期結束。 專案經理已與功能經理重新協商內部支援人力，也檢查可用的加班與平行作業方案。經確認後，雙方一致認為即使增加支援，此任務仍會超過時程管理計畫中設定的控制門檻，並影響後續核准里程碑。 專案經理接下來應該怎麼做？", "options": ["請贊助人先核准延長時程。", "修訂時程基準與里程碑。", "更新議題紀錄。", "提出變更申請。", "與功能經理協商替代人力的調派。"], "answers": [3], "explanation": "正解是「提出變更申請」。題目已明確說明，專案經理與功能經理已再次協商，仍確認任務無法如期完成，而且會超過控制門檻並影響核准里程碑。此時已不是單純追蹤議題，而是可能影響時程基準或正式承諾，因此應提出變更申請，附上對時程、成本、風險與後續交付的影響分析，交由適當權責單位審核。"}, {"source": "PMSuccess28.pdf", "number": 5, "stem": "客戶提出了很多小的、次要的變更請求，但表明它們是緊急且關鍵的。專案經理應該採取什麼行動？", "options": ["將這些請求放入待辦清單中。", "確保每一個變更請求都記錄進變更紀錄中。", "拒絕這些微小的變更。", "將客戶的行為上報給贊助者，因為這會惹惱團隊。"], "answers": [1], "explanation": "即使客戶提出的是非常小的變更請求，每一個請求皆需要被處理。頻繁且次要的請求並非升級的原因。專案經理不能拒絕利害關係人與客戶的變更請求。最後，將請求放入待辦清單中並不是對於變更的正確作法。"}, {"source": "PMSuccess28.pdf", "number": 6, "stem": "某專案主要是製作一種精密的平衡儀器，此儀器需要在特定的溫度、濕度與壓力下製作才能成功，專案團隊尚無法成熟掌控此技術。專案經理決定先製作此設備的雛形，他運用的是哪一種風險策略？", "options": ["承擔", "減輕", "規避", "移轉"], "answers": [1], "explanation": "製作設備的雛形是「減輕」風險的一種方法，這種方法是利用提前採取行動以便將不利的風險後果降低到一個可以接受的值。"}, {"source": "PMSuccess28.pdf", "number": 7, "stem": "某專案具有以下特點： -正處於規劃完成的階段。 -在專案期間，關鍵利害關係人將有2.5週無法參與專案。 專案經理在了解關鍵利害關係無法參與之後，必須決定第一步該做什麼。 請問，正確的步驟是什麼？", "options": ["確保更新議題紀錄，並通知其他的利害關係人。", "繼續進行規劃，並找出此變更可能會對專案進度產生何種影響。", "舉辦一場與贊助人的會議，以評估該情況，並確定替代方案。", "要求財務部門在利害關係人缺席期間提供替代人選。"], "answers": [0], "explanation": "專案經理需要做的第一件事是將此當作一個議題，並將其傳達給其他的利害關係人。在此之前，不能或不應該採取任何行動。"}, {"source": "PMSuccess28.pdf", "number": 8, "stem": "專案經理與朋友閒聊時聽到接下來的兩週內可能會發生工會遊行。專案經理知道，專案現階段若發生任何問題都可能對預算和時程造成重大影響，所以任何的工會活動都可能影響專案團隊。專案初期時，工會遊行的可能性被認為是極小的。因此，這情況是出乎意料之外的。專案經理應如何應對它？", "options": ["規劃如何獎勵那些不參加工會遊行的人，並為那些參加的人制定相對應的紀律處分。", "通知相關的利害關係人，並將該新風險記錄到風險登錄表中。", "藉由非正式的討論獲取更多資訊，並使用這些資訊來決定下一步。", "安排會議，與工會的領導者協商，以解決任何懸而未決的衝突。"], "answers": [1], "explanation": "* 此題情境說明了一個新的風險已經出現，也就是屬於「新辨識出的風險」。根據風險管理流程，當專案中出現新的風險時，應該採取以下步驟：記錄於風險登錄表、評估其發生機率與影響，並通知利害關係人（尤其是可能受到影響者或具備應對權責者）。* 其他選項較不合適，因為：- 雖然蒐集與了解更多資訊是有幫助的，但僅靠「非正式管道」，而不記錄或正式處理風險，並不足以符合專案風險管理的基本要求。-「規劃獎勵與懲罰」是針對行為而非風險的對策，且未釐清事實就規劃獎懲辦法，可能引發倫理爭議與勞資衝突。- 工會目前尚未採取行動，所以「立即與工會協商」可能會引發不必要的敏感或誤解。在沒有更多資訊與授權前，不應草率談判。"}, {"source": "PMSuccess28.pdf", "number": 9, "stem": "你是某大型轉型專案的專案經理，專案產品已進入驗收階段。一位關鍵客戶在驗收會議上指出，產品中「缺少一項他們認為極為關鍵的功能」，並表示這將嚴重影響產品對其部門的實際價值。經查證，該功能確實不包含在已核准的專案範疇說明書中，也從未記錄在任何需求文檔內。該客戶強烈要求加入此功能，並暗示若未納入，可能不予簽署驗收文件。身為專案經理，你應該採取下列哪些行動？（選兩項）", "options": ["與該客戶深入討論其需求背後的商業價值，並引導他", "將此爭議列為風險項目，並在風險登錄表中記錄與追蹤應對方案。", "向客戶解釋此功能並未納入範疇，並婉拒其請求以維護基準完整性。", "暫緩交付驗收程序，等待變更控制委員會（CCB）審核該功能納入與否。", "建議團隊先評估開發該功能的成本與時間，再回覆客戶是否可以將此功能添加到當前專案範疇中。", "立即召開團隊技術評估會議，開始規劃該功能的開發時程與資源需求。"], "answers": [0, 3], "explanation": "*「與客戶討論其需求背後的商業價值」顯示出你願意理解並重視客戶的商業痛點，建立合作關係。而且引導客戶正式提出變更請求（Change Request） 是正確的變更流程。*「暫緩交付驗收程序，等待變更申請的審核」也是正確的流程。另外，暫緩交付也可穩定局勢、爭取溝通與決策時間。* 其他選項是錯誤的，因為：-「立即評估與規劃開發時程與資源需求」是跳過變更控制的作為，這屬於未經授權即進行工作，資源可能會白白投入。-「向客戶解釋並婉拒其請求」雖有理有據，但立場過於僵硬，不利於關係維繫與價值導向管理。-「將此爭議記錄在風險登錄表」是錯誤的，因為這是「已發生的需求落差」，不是尚未發生的不確定事件。-「建議團隊先評估再回覆」跳過了變更控制程序，且容易讓客戶誤解為「預期可接受變更」，未經授權即開始投入評估工作，可能會白白浪費時間。"}, {"source": "PMSuccess28.pdf", "number": 10, "stem": "一個敏捷團隊正在開發客戶資料分析平台。上一個迭代回顧會議中，團隊發現資料蒐集作業比預期耗時，可能影響後續模型驗證工作。在討論改善方式時，一名團隊成員提到：下一個迭代期間，組織可能有機會聘請一位外部調查承包商，協助執行關鍵資料訪談；若能成功取得該承包商，調查速度可能提升一倍，並讓團隊更早完成驗證。此安排尚未確定，也尚未納入目前迭代計畫。團隊應如何分類並處理此情況？（選兩項）", "options": ["標示為緊急阻礙事項。", "提出變更請求。", "記錄並評估回應策略。", "視其為議題。", "將其歸類為機會。", "歸類為外部變更。"], "answers": [2, 4], "explanation": "正解是「將其歸類為機會」和「記錄並評估回應策略」。題目情境並不是負面風險，而是「若發生，會對專案目標產生正面影響」的情況。若成功聘請承包商，調查速度可提高一倍，可能改善時程與價值交付，因此應歸類為機會，也就是正面風險。此外，雖然這是機會，但仍然是不確定事件，不能只在回顧會議中口頭討論。團隊應將其記錄於風險登錄表或敏捷團隊使用的風險追蹤工件中，評估機率、影響、責任人與可能的回應策略。"}, {"source": "PMSuccess29.pdf", "number": 1, "stem": "一項預測型客戶服務系統升級專案的範疇基準以獲得核准，團隊正在執行第二階段開發。某位團隊成員在檢視客戶抱怨紀錄後，建議新增一個「即時通知」功能，認為可提升客戶滿意度並減少客服來電。部分團隊成員認為這個功能很有價值，建議直接加入目前工作中。專案經理應該怎麼做？", "options": ["拒絕此建議，以避免產生範疇潛變。", "納入開發，以提升客戶滿意度。", "請團隊評估與調整 WBS 與時程。", "要求客戶提出正式變更需求。", "記錄此需求，並依變更流程評估。"], "answers": [4], "explanation": "正解是「記錄此需求，並依變更流程評估」。新增功能可能提升客戶滿意度，但它不在已核准範疇內，因此不能直接加入工作，也不能因為它「看起來有價值」就繞過變更流程。專案經理應將此建議形成變更請求，依變更管理計畫評估其對範疇、時程、成本、品質與風險的影響，再交由適當權責單位審查。"}, {"source": "PMSuccess29.pdf", "number": 2, "stem": "專案經理負責一項購物網站改版專案，由於程式錯誤導致系統重複發送折價券，這可能導致會員增加消費，公司可能因此需提高產品供應商的補貼金額，如果公司回收或作廢折價券會違反當地法令。專案經理首先該如何處理？", "options": ["識別與評估風險，並決定應對方式。", "提出變更申請，以增加專案預算。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "向專案贊助人報告此問題，並要求增加儲備金。", "強化系統測試，以確保未來不會再發生類似的程式錯誤。"], "answers": [0], "explanation": "最佳解是選項「識別與評估風險，並決定應對方式」。此題情境出現「議題」(程式錯誤)與「風險」(可能需提高補貼金額)。故以這四個選項來看，第一步需要先處理的是風險。而其他選項都是評估風險後才能進行的活動。"}, {"source": "PMSuccess29.pdf", "number": 3, "stem": "專案經理負責在客戶端執行一項員工教育訓練專案，訓練教室將由客戶提供，專案團隊負責開發訓練素材。依據規劃，此專案將於下週的星期三進行第一次訓練，並且預計將連續進行三週，期望在一個月內完成此套教育訓練課程。今早客戶來電表示，由於發生了一些無預警的問題，訓練教室在接下來的兩週都無法使用。專案經理接下來應該怎麼做？", "options": ["請組織提供閒置的空間，以協助專案如期進行。", "協助客戶找到替代教室，並如期進行教育訓練專案。", "根據契約條款要求客戶賠償團隊的損失。", "將最新的訓練日期更新進專案時程表中。", "提出變更申請，以反映最新的訓練日期。 (\nA. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [4], "explanation": "此題情境是專案遇到了問題，而此問題將影響專案時程，所以專案經理接下來需要做的事情是提出變更申請。"}, {"source": "PMSuccess29.pdf", "number": 4, "stem": "你被指派接手一個歷經兩位專案經理的軟體專案。你進行評估後發現：除非引進來自高價賣方的專業技術，否則團隊將無法如期完成客戶所要求的關鍵交付標的。這項需求將影響專案的時程與成本。身為專案經理，你下一步應該怎麼做？", "options": ["向組織高層報告此情況，並等待進一步指示。", "提出變更申請，以反映新的執行方式與其對時程的影響。", "將此情況視為高風險事件，並發展風險應對策略以轉移風險。", "修改專案管理計畫書，納入引進外部技術與調整後的時程。"], "answers": [1], "explanation": "本題屬於「整合變更控制流程」的試題。專案若想如期完成，其解決方案（高價採購技術）將改變原有時程與成本，因此必須先提出變更申請，由相關人員進行審核與決策。"}, {"source": "PMSuccess29.pdf", "number": 5, "stem": "某公司的產品將被一項可能會在未來四個月內通過的新法律所影響。新產品發布正在啟動中，應該在三個月內完成。如果這項擬議的法律得以通過，新產品將不符合新要求。專案經理應該如何解決這個潛在問題？", "options": ["1. 推進專案和專案的規劃。 2. 滿足所有截止日期，以確保產品得以在法律可能發生變化之前完成。", "1. 就可能的法律影響向贊助人與關鍵利害關係人發出警告。 2. 建議他們在立法通過之前先擱置該項目。", "1. 更新風險管理計畫書。 2. 推進專案的規劃。", "1. 與贊助人和關鍵利害關係人討論其風險。 2. 使用討論的結果，更新假設紀錄與專案章程。"], "answers": [3], "explanation": "這項新法律可對該專案產生深遠的影響。它絕對會導致新的潛在風險、新的假設及可能的章程變更。"}, {"source": "PMSuccess29.pdf", "number": 6, "stem": "專案執行期間，專案經理察覺大部分的議題與變更申請都來自於研發部門。專案經理應該怎麼做才能解決此問題？", "options": ["重新審視範疇說明書。", "依據研發部門的建議修訂變更管理計畫書。", "指派一個專案團隊成員專門處理研發部門提出的變更。", "與研發部門的主管會議，讓他清楚了解專案的變更規則。", "與研發部門討論，並了解他們提出變更的原因。"], "answers": [4], "explanation": "若是有某位利害關係人或是某個利害關係人群組總是提出議題，或是對專案的既定規劃有疑問及變更要求時，專案經理最好是多花點心力去了解他們提出議題或變更的背後原因為何，才是最好的解決之道。所以，選擇「與研發部門討論，並了解他們提出議題與變更的原因」才是解決此問題的根本辦法。"}, {"source": "PMSuccess29.pdf", "number": 7, "stem": "混合式團隊已經確定了很多風險與議題，但寫得似乎有點不清楚。以下哪些描述是風險？（選兩項）", "options": ["燃盡圖不夠清楚，它尚未更新。", "願景聲明被誤解將可能導致錯誤的需求。", "該專案的技術負責人已經從公司離職。", "一位資深副總裁表示他還有其他的需求。", "新的DevOps工具鏈可能會在此迭代期間準備就緒。"], "answers": [1, 4], "explanation": "風險包括不確定性，可以是正面的或負面的，而問題是已經發生的並且是負面的。不明確的燃盡圖、辭職和需要額外需求都是已經發生的事件。"}, {"source": "PMSuccess29.pdf", "number": 8, "stem": "製作專案報告時，你發現有一個風險未被列入風險應對策略中。請問，你首先應該怎麼做？", "options": ["執行風險稽核", "執行緊急應變措施", "接受此風險", "再次辨識風險", "提出變更申請"], "answers": [3], "explanation": "若有一個在風險應對策略中並未預測到的風險發生時，此風險的影響可能會超過預期，而且風險應對策略可能也不適用。所以，為了避免此情形發生，你應該先執行額外的風險管理過程，例如：識別風險，以期能進一步規劃與管制風險。"}, {"source": "PMSuccess29.pdf", "number": 9, "stem": "專案經理正在管理一項智慧大樓安控系統專案。專案團隊在風險回應規劃會議中，討論多項可能影響交付、成本與營運安全的威脅。贊助人要求專案團隊採取移轉風險策略。專案團隊最有可能採用的作法是？（選兩項）", "options": ["建立備援施工班組，以降低人力不足影響。", "增加整合測試輪次，以降低缺陷發生機率。", "接受低機率風險，並保留管理儲備因應。", "要求供應商提供三年零故障保固。", "為施工期間的公共安全責任購買保險。", "延後系統上線日期，以避開法規查核期間。"], "answers": [3, 4], "explanation": "* 選項「為施工期間的公共安全責任購買保險」是典型的風險移轉。若風險事件發生，部分財務損失由保險公司承擔。選項「要求供應商提供保固」是透過契約將缺陷修復責任部分轉由供應商承擔，也屬於移轉風險。* 選項「延後上線」是透過調整時程避開風險暴露，較接近規避或減輕風險。選項「增加測試」是降低缺陷發生機率，屬於減輕風險。選項「建立備援人力」是降低人力不足造成的影響，屬於減輕風險。選項「接受低機率風險並保留儲備」是接受風險。"}, {"source": "PMSuccess29.pdf", "number": 10, "stem": "你負責管理一項跨國體育場館建設專案。某項關鍵交付標的因供應商問題確定無法如期完成，且經內部確認後，無法透過任何方式加速或補救。此延誤可能影響後續的驗收與啟用時程。此時，你應採取哪些行動以符合專案管理原則？（選兩項）", "options": ["要求供應商增派資源以強化施工效率。", "啟動變更流程，提交調整建議與風險分析報告。", "與贊助人溝通，評估此風險對專案的整體衝擊。", "立即調整時程基準，以利後續施工作業。", "等實際延誤發生後再視情況調整。"], "answers": [1, 2], "explanation": "* 此題測試的是風險辨識後的應對程序、專案基準管理流程，以及與贊助人溝通的必要性。故「與贊助人溝通，評估此風險對專案的整體衝擊」和「啟動變更流程，提交調整建議與風險分析報告」是最佳解。* 其他選項是錯誤的，因為：- 基準只能在變更流程完成且核准後調整，不可擅自更改。- 等實際延誤發生後再視情況調整是被動消極的作為，違反風險應對原則。- 題目已說「無法補救」，所以要求供應商增派資源是無效且可能產生額外浪費的行為。"}, {"source": "PMSuccess30.pdf", "number": 1, "stem": "你是供應商端的新任專案經理，正在執行一個固定總價的外包專案。專案已完成啟動並進入第 2 個月，且已通過第一次里程碑審查。上週，客戶公司完成組織重整，導致： • 原本在 SOW中列為「需求核准人」的業務主管離職。 • 新上任的主管要求加入兩項新功能，並指出原本需求描述有\n重大缺漏。 • 客戶的採購部門來信提醒：任何範疇調整都必須遵循合約中的變更條款，否則不會付款。 • 你的團隊同時發現：若新增功能，將影響既定測試計畫與交付時程。 目前尚未收到正式的變更單，但客戶新主管要求你「先把需求文件改好，下週就要看新版規格」。 在此情境下，專案經理最應該做的事情是？", "options": ["更新採購管理計畫書，因為需求改變會影響供應鏈與採購策略。", "與新主管重新簽署協議，以確保新的需求具有法律效力並可被執行。", "更新需求文件，確保新主管的需求被完整記錄，避免溝通落差。", "更新專案管理計畫書（含時程與品質管理計畫），以反映新需求可能造成的調整。", "提交變更申請，要求依合約變更條款啟動"], "answers": [4], "explanation": "正解是「提交變更申請，要求依合約變更條款啟動正式變更程序」。此題的關鍵不是「需求寫不寫得完」，而是固定總價＋採購明確聲明「未依合約變更條款就不付款」。在這種情境，你若先改需求文件，會讓供應商端承擔「做了但不能請款」的風險。PMI 對此的標準動作是：走整合變更控制——審查變更、決策核准與否、並管理對交付物/文件/計畫的更新。"}, {"source": "PMSuccess30.pdf", "number": 2, "stem": "你帶領的敏捷團隊即將在Sprint審查會議中展示一項核心功能，但技術負責人發現該功能在少數情況下會失效，可能導致高額損失。雖然贊助人希望如期展示，但你擔心此風險未被處理妥當。以下哪些做法最合適？（選兩項）\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "options": ["告知贊助人你們有能力控制風險，不須擔心。", "如期展示此功能，並將問題記錄為技術債。", "將這項風險轉為測試案例，列入下次迭代處理。", "由Scrum Master負責處理此事，避免影響團隊節奏。", "在Sprint審查會議中如實說明功能狀況與風險，並邀請利害關係人參與討論。", "推遲展示此功能，等修正完成再安排展示。"], "answers": [2, 4], "explanation": "* 選項「在Sprint審查會議中如實說明功能狀況與風險，並邀請利害關係人參與討論」體現敏捷的透明性與協作原則。Sprint審查會議是利害關係人了解產品狀態、提供回饋、共同調整產品方向的最佳時機，應誠實呈現現況，讓團隊與利害關係人共同決定是否接受該功能的風險或延後釋出。*「將這項風險轉為測試案例，列入下次迭代處理」屬於「持續改進」與「品質內建」的實踐。將風險條件具體化為測試案例，能提升功能的穩定性與可驗證性，是處理高衝擊但可重現問題的實用手法。* 其他選項是錯誤的，因為：- 「如期展示此功能，並將問題記錄為技術債」是錯誤的處理順序。技術債是用於可容忍的延遲修正，但本情境中風險為「高衝擊」，不能輕易延後。-「推遲展示此功能，等修正完成再安排展示」會繞過透明溝通與共創決策的原則。是否展示應由團隊與利害關係人共同討論，而非單方面決定延遲。-「告知贊助人你們有能力控制風險，不須擔心」屬於過度承諾，且缺乏事實依據。高風險問題應進行評估與揭露，不應單方面保證。-「由Scrum Master負責處理此事，避免影響團隊節奏」並不合適，因爲Scrum Master的職責是移除障礙、促進流程，但不是決策者或風險承擔者。這是開發團隊與產品負責人應共同處理的問題。"}, {"source": "PMSuccess30.pdf", "number": 3, "stem": "一個採用預測式方法的企業設施升級專案已完成規劃，範疇、時程與成本基準也已獲核准。專案進入執行階段後，贊助人通知專案經理，董事會因公司現金流壓力，已決議將本專案可用預算刪減20%。董事會仍希望專案盡可能維持原定商業目標，但尚未決定是否調整範疇、時程和品質要求。專案團隊中部分成員建議立即刪除低優先級功能以符合新預算；財務部則要求專案經理儘快更新成本基準。專案經理應該先採取下列哪一項行動？", "options": ["修改專案管理計畫書，移除低優先級範疇項目，以確保專案能在新的預算限制內完成。", "立即提出變更申請，將成本基準降低 20%，以反映董事會已核准的預算刪減。", "與組織高層討論，要求恢復原預算，因為已核准的成本基準不應在執行階段被任意調整。", "與專案團隊分析預算刪減對範疇、時程、品質、風險與商業價值的影響。"], "answers": [3], "explanation": "本題關鍵是：預算已被削減，但如何影響專案尚未分析。專案經理不能直接更新成本基準，也不能自行刪減範疇。預算減少 20% 會影響多個面向，包括：範疇是否縮減、時程是否延長、品質是否降低、風險是否增加、商業價值是否仍可達成、是否需要分階段交付。因此第一步應該是與團隊進行影響分析並提出可行方案，再透過正式變更控制流程取得核准。"}, {"source": "PMSuccess30.pdf", "number": 4, "stem": "消防設備規劃與建置專案最近有一項關於範疇的變更已經經由變更管制委員會審查與核准了。專案經理接下來應該怎麼做？", "options": ["更新專案管理計畫書與文件", "評估其風險及回應策略", "追蹤該變更的執行狀況", "執行獲准的變更申請"], "answers": [0], "explanation": "當變更被核准後，專案經理接著需要進行的事情是：更新專案管理計畫書和專案文件、向相關利害關係人報告此變更，而後再執行獲准的變更申請，並追蹤該變更的執行狀況。"}, {"source": "PMSuccess30.pdf", "number": 5, "stem": "專案團隊正致力於改進線上報紙的使用者體驗（UX）。團隊認為這是一個相當低風險的專案，因此他們放棄風險評估並開始工作。產品所有者不同意此舉，並委託進行風險評估。關於此場景，哪種說法是正確的？", "options": ["風險評估即將被完成，所以一切都很好。", "專案風險是每個人的責任，團隊不應該跳過風險評估。", "風險評估是產品所有者的責任。", "如果團隊是正確的，那麼產品負責人就是在浪費時間與資源。"], "answers": [1], "explanation": "此題的正解是「專案風險是每個人的責任，團隊不應該跳過風險評估」。風險無處不在，並且在每個專案或活動中都可能存在。專案風險是每個人的責任。團隊、產品所有者及利害關係人都應該意識到專案與其環境相關的各種風險。風險評估的方式是正式還是非正式的，可取決於專案背景，但所有專案皆需進行某種形式的風險評估。此外，即使團隊認為專案屬於低風險，也不能因此直接省略風險評估。"}, {"source": "PMSuccess30.pdf", "number": 6, "stem": "專案經理與團隊在一個軟體開發專案中進行風險管理的規劃。專案團隊辨識出一個需要將第三方的軟體整合到組織系統中的高風險事項。團隊已經初步製定了一個回應計畫，但若實施此計畫將可能花費高額費用，並需增加專案預算。專案經理應該做什麼？（選兩項）", "options": ["忽略這項高風險事項，因為有管理儲備，而且不可以變更專案預算。", "立即實施此回應計畫，以避免發生潛在風險。", "不做任何事，先觀望此風險是否會出現。", "在確認這項回應計畫前先評估其成本效益分析。", "同時也考慮其他風險管理選項。"], "answers": [3, 4], "explanation": "當專案團隊為已辨識風險制訂回應計劃時，應同時為此計劃進行成本效益分析，以了解此風險需要投入多少成本，如：應變儲備或管理儲備。另外，專案經理也需考慮其他風險管理選項，如：風險規避、風險接受或風險轉移。也就是說，透過評估成本效益分析，並考慮其他風險管理選項，專案經理就可以針對如何進行風險回應做出明智的決定。"}, {"source": "PMSuccess30.pdf", "number": 7, "stem": "專案經理加入具有以下特徵的專案： -團隊分佈於全球 -固定預算 -非常緊迫的交期 專案經理該如何避免範疇潛變，並讓團隊專注於交付能滿足需求的產品？", "options": ["與所有開發團隊舉行每日站立會議", "防止利害關係人與團隊領導者直接互動", "要求所有的開發團隊負責人準備詳細的需求", "確保所有的變更皆需透過變更管制過程"], "answers": [3], "explanation": "* 範疇潛變是指：在沒有獲得批准的情況下，自行改變專案範疇。所以，遵守商定好的變更管制過程將有助於避免範疇潛變。透過這一過程，所有的範疇變更皆須經過正式的審查與批准，確保不會影響專案的核心目標和資源。* 每日站立會議雖能促進團隊內部的溝通與協作，但它的主要目的是幫助團隊了解彼此的工作狀態，而非直接控制範疇潛變。若沒有強化變更管制，站立會議本身無法完全避免範疇潛變。* 需求準備應由專案經理、需求分析師（若有的話）或產品負責人與利害關係人共同完成，而非完全由開發團隊負責。而且若只由開發團隊負責人準備需求，可能因缺乏與客戶的直接溝通，導致需求內容與客戶期望不一致。* 完全防止利害關係人與團隊領導者互動可能導致溝通斷層，使得團隊對需求背景缺乏理解。應當建立透明的溝通渠道，確保需求和背景信息能有效傳達給團隊，但要避免利害關係人直接繞過專案經理進行需求變更。"}, {"source": "PMSuccess30.pdf", "number": 8, "stem": "組織預計年底前推出新產品，產品上市前必須完成一座儲存與轉運設施。專案目前仍符合時程基準，但緩衝時間有限。在例行利害關係人會議中，團隊得知原規劃的設施地點可能屬於政府單位，且尚未確認是否需要額外許可。若審查時間過長，可能影響年底上市。專案經理下一步最適合怎麼做？", "options": ["更新利害關係人登錄表，將政府單位列為高影響力外部利害關係人。", "將此情況記錄為議題，指派法務代表追蹤土地使用權確認。", "將此情況記錄為風險，更新風險登錄表，並安排後續分析與回應規劃。", "立即尋找替代地點，並向贊助人報告原地點可能不適用。"], "answers": [2], "explanation": "題目說「可能屬於政府單位」、「尚未確認是否需要額外許可」、「若審查時間過長，可能影響年底上市」。這些都是典型風險訊號，因為它們代表未來可能發生的事件或條件，且一旦發生，會影響時程、合規、設施完成與產品上市目標。風險管理邏輯是：不要等到問題真正發生才處理。教材題庫中也強調，主動風險管理始於早期識別與記錄，這有助於在風險形成並影響交付之前進行分析、監控與及時應對。因此，專案經理的下一步不是直接解決，也不是立刻上報，而是先把這項不確定性納入風險登錄表，後續再評估其發生機率、影響程度、風險負責人與回應策略。"}, {"source": "PMSuccess30.pdf", "number": 9, "stem": "一項跨國醫療科技專案正在辨識新法規可能造成的風險。專案經理邀請法規、資安、臨床及供應鏈專家提供意見，但專家分布於不同地區，且部分成員不願在會議中直接反駁資深顧問。 為降低權威偏誤，專案經理希望專家先各自提交判斷，再由促進者彙整且不揭露個別身分，將結果回傳給專家重新評估，直到主要觀點逐漸收斂。 專案經理應採用哪一項技術？", "options": ["以結構化腦力激盪蒐集並分類意見。", "先建立機率分布，並執行蒙地卡羅分析。", "先個別訪談，再由專案經理整合結論。", "對各項意見進行加權投票與排序。", "進行多輪匿名專家回饋。"], "answers": [4], "explanation": "正解是「進行多輪匿名專家回饋」，此選項描述的就是德爾菲技術（Delphi Technique）。此方法由促進者管理，透過多輪蒐集、彙整及回饋專家意見，使專家在不受職位、聲量或群體壓力影響的情況下逐步形成共識。ATP4 將德爾菲技術列為風險辨識方法，並定義為透過多輪回饋蒐集專家意見，直到達成共識。"}, {"source": "PMSuccess30.pdf", "number": 10, "stem": "某建築公司正執行一個大型商業綜合辦公室建設專案，專案團隊包括建築設計師、工程師、施工管理人員等。專案經理發現團隊在進行風險管理時，無法有效分類已辨識的風險，導致風險評估與應對計畫的制定進度受阻。例如，有人建議按部門分類風險，但另一部分成員認為應按建設階段來劃分。專案經理應該如何建議團隊有效地對風險進行分類？", "options": ["使用檢核表，逐項對風險進行分類，確保每項風險都被涵蓋。", "按風險發生的機率與衝擊程度進行分類，這將提供最準確的結果。", "使用風險分解結構（RBS）來協助分類已辨識的風險。", "參考歷史專案的風險登錄表與議題紀錄，辨識出所有的專案個別風險。"], "answers": [2], "explanation": "* 風險分解結構（RBS）是一種分層結構工具，可根據風險來源（如技術、管理、外部因素等）有效地對風險進行分類，有助於團隊有條理地組織和管理風險。* 雖然歷史資料是風險辨識的有用參考，但僅依賴過去的風險紀錄可能忽略本專案的特定風險，無法直接解決分類問題。* 檢核表的設計通常基於過往專案經驗，可能忽略當前專案的特殊情境或獨特風險，故無法涵蓋所有潛在的風險，特別是當專案具有高度不確定性或涉及新領域時。* 機率與衝擊是用於風險評估的指標，而非風險分類的基準，這可能導致混淆。"}, {"source": "PMSuccess31.pdf", "number": 1, "stem": "一個敏捷產品開發專案正在第 5 個 Sprint。專案經理觀察風險燃燼圖後發現，雖然團隊已完成多個高優先級使用者故事，但整體剩餘風險暴露值幾乎沒有下降，且其中兩項技術整合風險持續維持在高等級。產品負責人希望團隊繼續拉入更多功能，以維持交付速度。專案經理應該怎麼做？", "options": ["向贊助人回報風險狀態，並請他決定下一個 Sprint 的工作內容。", "在下一個 Sprint 回顧會議時，積極探討風險沒有下降的原因，並提出解決方案。", "與團隊檢視高風險項目的應對措施，調整待辦清單優先順序並處理關鍵技術風險。 ( (您的選項)", "鼓勵團隊增加 Sprint 承諾量，以透過更多交付成果降低整體專案風"], "answers": [2], "explanation": "* 風險燃燼圖用來追蹤剩餘風險暴露值是否隨時間下降。題目中雖然工作持續完成，但風險沒有下降，代表團隊可能只是在交付功能，卻沒有處理真正影響專案成功的關鍵風險。專案經理應促進團隊檢視高風險項目，確認風險應對措施是否有效，並與產品負責人討論是否需要調整產品待辦清單優先順序，優先處理能降低重大風險的工作。* 選項「在下一個 Sprint 回顧會議時，積極探討風險沒有下降的原因，並提出解決方案」較不佳，是因為回顧會議主要用來檢視團隊流程與改善方式；但本題的高風險仍持續存在，且可能影響產品交付，應即時處理。可透過與團隊、產品負責人協作，檢視風險應對措施、調整產品待辦清單優先順序，或安排必要的技術風險降低工作，而不應等到下一次回顧才處理。"}, {"source": "PMSuccess31.pdf", "number": 2, "stem": "某專案的最終產出需要由三個高度依賴的部分共同組成，而每一個部分分別由不同的團隊執行。這三個有經驗的團隊目前進行得很順利，但是專案經理擔心各團隊的產出合併後可能會出現衝突或不相容的地方。專案經理應該怎麼做才能避免出現他/她擔憂的情況？\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "options": ["讓三個團隊保持目前的速度繼續工作，但是要求團隊需要更頻繁地回報專案狀態。", "再次辨識風險，並降低風險門檻，以制定更多的風險回應策略。", "檢視三個團隊的專案任務，並決定哪個團隊的工作具有最高優先等級，然後讓其他兩個團隊推遲他們的工作，以確保不會發生衝突。", "先不做任何事，等衝突發生後，再採取應對措施。", "事先辨識潛在的衝突，並與三個團隊每週定期地舉行聯合會議，讓三個團隊可以在會議中檢視彼此的工作狀況。"], "answers": [4], "explanation": "讓三個團隊有機會藉由定期會議來檢視彼此的專案狀態的作法，可以讓整個專案團隊及時發現問題，並降低專案到最後才發現問題的機率。"}, {"source": "PMSuccess31.pdf", "number": 3, "stem": "某資料中心遷移專案正在進行中，團隊回報其中一項設備安裝活動比原計畫晚了四天。職能主管要求專案經理立即向贊助人申請延長時程，但排程中仍有多條平行路徑尚未重新分析。專案經理第一步應該做什麼？", "options": ["將專案狀態暫時調整為紅燈，並通知高階管理層可能需要調整完工日期。", "依據目前已知延遲天數，先提出時程變更請求，避免後續被認為延誤回報。", "先通知客戶可能的交付日期變動，再要求團隊重新檢視所有剩餘活動。", "要求相關團隊安排快速跟進，以補回四天延遲，避免影響專案狀態。A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果", "檢查該活動是否位於關鍵路徑，並分析延遲對後續里程碑與整體完工日期的影響。 ( (您的選項)"], "answers": [4], "explanation": "正解是「檢查該活動是否位於關鍵路徑，並分析延遲對後續里程碑與整體完工日期的影響」。活動晚四天不一定代表整個專案晚四天，故專案經理應先分析該活動是否在關鍵路徑上、是否仍有浮時，以及對後續里程碑與整體完工日期的影響。其他選項較不合適，因為有的是太快對外升級或改變狀態；有的則可能是後續的矯正措施。題目情境出現延遲時，建議先分析關鍵路徑與整體影響，再決定是否變更或採取矯正措施。"}, {"source": "PMSuccess31.pdf", "number": 4, "stem": "現在正處於第9個Sprint的第3天，你剛剛注意到，有一位主要的競爭對手正藉由發布一項類似於你的團隊正在嘗試開發的新功能來擊敗你。身為Scrum master的會怎麼做？", "options": ["立即終止該Sprint，並在下一個Sprint中撰寫探針(Spike)使用者故事，以解決此問題。", "詢問Product owner 該Sprint目標是否仍然適用。", "取消該Sprint，並重新排序待辦清單中的功能特性。啟動新的Sprint，以解決商業環境中的突發事件。", "進行內部檢查以找出原因，並防止這種情況再次發生。"], "answers": [1], "explanation": "只有Product owner有權取消Sprint，儘管他或她也許會因為利害關係人、開發團隊或Scrum master的影響這樣做。 如果該Sprint的目標已經過時，則該Sprint將會被取消。"}, {"source": "PMSuccess31.pdf", "number": 5, "stem": "專案團隊正在為參加明年世界大學運動會的參賽成員與教練協調住宿事宜。參賽成員已決定將住進年初完工的新住宿，而教練團預計將住在會場附近的旅館和大學宿舍。為了順利完成教練團的住宿租賃協議，專案團隊首先應該做什麼？", "options": ["進行實地考察，並檢視附近旅館和大學宿舍的品質。", "與教練團代表開會，以了解他們的住宿需求。", "製作租賃協議範本，並取得預算利害關係人的支持。", "針對會場附近的可用住房存量進行整體評估。"], "answers": [1], "explanation": "題目提到：專案團隊正在為「教練團」協調住宿事宜，而參賽成員已決定要住進年初完工的新住宿。若題目詢問的是「統籌整體住宿安排」，那麼參賽者當然會是核心利害關係人之一。但題目詢問的是：教練團住宿協議的第一步行動，重點是處理「教練團」的住宿問題，因此需先了解教練團的需求。在此背景下，不需再次向參賽者蒐集需求，以避免資訊混淆、資源誤用。"}, {"source": "PMSuccess31.pdf", "number": 6, "stem": "某金融科技公司正在開發一項行動理財平台，原本的商業企劃案預期上線後六個月內可提升 20%的新客戶開戶率。專案目前仍依獲准的範疇、時程與預算執行，前兩個版本也已按計畫發布。 然而，市場上突然出現一個競爭者推出類似平台，並提供免手續費與即時投資建議功能。業務單位的最新預測顯示，即使專案依原計畫完成，預期新客戶開戶率可能只會提升 8%。產品負責人認為團隊仍應完成原待辦清單，因為所有功能都已獲核准；贊助人則擔心原效益已不再成立。 專案經理應該怎麼做？", "options": ["與產品負責人確認原待辦清單中哪些功能仍未完成，並要求團隊優先交付最接近競爭者功能的項目，以維持原發布時程與市場回應速度。", "將競爭者推出新平台列入風險登錄表，指派業務單位持續追蹤市場反應，並要求團隊先完成目前已核准的高優先待辦項目。", "與產品負責人、贊助人及關鍵商業利害關係人重新檢視商業企劃案、效益假設與外部競爭影響，並評估是否需要調整產品優先順序、成功指標或版本目標。", "請產品負責人將競爭者的免手續費與即時投資建議功能納入產品待辦清單，並在下一次迭代規劃中讓團隊評估是否能加入目前版本。", "建議贊助人召開治理會議，重新確認是否仍接受 8% 的開戶率提升預測，若仍可接受，則維持原計畫並於收尾時更新效益資料。"], "answers": [2], "explanation": "外部競爭已使原本 20% 的新客戶開戶率效益預測下降到 8%，這代表原商業企劃案與價值假設可能不再成立。專案經理應促進產品負責人、贊助人與商業利害關係人重新檢視效益、成功指標與產品優先順序。"}, {"source": "PMSuccess31.pdf", "number": 7, "stem": "某產品團隊已經完成了一個工作精簡專案的10個預計迭代中的8個。在為第9個迭代細化待辦清單時，product owner了解到有一個影響全公司的大規模預算變更，並發送以下電子郵件： 親愛的工作精簡專案團隊， 昨天宣布的預算變動將影響我們的專案。我可能需要重新確定我們的部分預計工作之優先等級。 團隊領導者應該如何應對？", "options": ["回饋一些建議，以便縮小範疇，且仍然繼續進行這兩個迭代。", "解散團隊，讓他們有時間尋找新的任務。", "聯繫財務部門，以便了解有關預算削減的更多資訊。", "等待product owner重新確定待辦清單的優先等級。"], "answers": [3], "explanation": "這不是解散團隊的理由。在團隊開始工作之前，product owner需要重新確定待辦清單的優先等級。團隊不可繞過product owner而獨自採取行動。縮小範圍的建議應該可被product owner輕易地接受，但是待辦清單仍然需由product owner重新確定其優先等級。"}, {"source": "PMSuccess31.pdf", "number": 8, "stem": "某公司委託外部團隊開發一項客戶自助服務平台，專案採敏捷方式執行。最後一次迭代結束時，團隊在核准的範疇、時程與預算內完成所有承諾功能，產品也已完成部署。然而，在專案慶功會上，一位商業利害關係人表示，雖然平台已上線，但客服案件量沒有下降，客戶使用率也低於預期，因此他認為這項專案並未創造實際商業價值。為了避免在專案結束時才出現這種認知落差，專案經理原本應該採取哪些行動？（選兩項）", "options": ["將產品上線後的客服量、使用率與商業效益追蹤完全移交給營運單位，避免專案團隊對營運成果承擔不合理責任。", "遵循溝通管理計畫書中的流程定期向商業利害關係人報告範疇、時程、成本與完成百分比，以提高他們對專案成功的理解。", "與產品負責人、專案贊助人及關鍵商業利害關係人共同確認效益假設、成功指標與產品待辦清單的價值排序。", "在每次迭代審查中邀請商業利害關係人檢視產品增量、使用者回饋與價值指標，並依回饋調整後續待辦清單。", "在專案結束前安排正式結案滿意度調查，讓商業利害關係人有機會說明他們對專案成果的看法。", "在專案啟動時取得商業利害關係人對需求清單的正式簽核，並在後續迭代中盡量避免變更，以確保承諾範疇完整交付。"], "answers": [2, 3], "explanation": "正解是「在每次迭代審查中邀請商業利害關係人檢視產品增量、使用者回饋與價值指標，並依回饋調整後續待辦清單。」和「與產品負責人、專案贊助人及關鍵商業利害關係人共同確認效益假設、成功指標與產品待辦清單的價值排序」。這是因為：敏捷專案不能只在最後確認「功能有沒有做完」，而應在每次迭代審查中讓商業利害關係人檢視產品增量、回饋與價值訊號。若客服案件量、使用率或商業效益未如預期，團隊可以提早調整產品方向與待辦清單。此外，題目核心不是範疇、時程、預算失控，而是「交付成果沒有被認為產生商業價值」。因此專案經理應協助產品負責人、贊助人與關鍵商業利害關係人定義效益假設、成功指標，並用這些價值標準來排序產品待辦清單。"}, {"source": "PMSuccess31.pdf", "number": 9, "stem": "在一個混合式專案中，產品負責人最近一直反覆抱怨開發團隊每次迭代所交付的功能似乎都不符合原先的設計。專案經理應如何應對？", "options": ["請產品負責人於規劃會議時與團隊成員一起討論待辦清單項目。", "請產品負責人於審查會議時建議解決方法。", "請產品負責人參加回顧會議，與團隊成員一起討論解決方法。", "請開發團隊自組織解決此問題。"], "answers": [2], "explanation": "回顧會議是敏捷式專案中的一個重要會議（事件），在此會議中，敏捷團隊可以討論專案的績效與實務、辨識問題，還可以一起找出團隊合作方式的具體改善提案。"}, {"source": "PMSuccess31.pdf", "number": 10, "stem": "某系統開發專案的 EV 低於 PV，且 AC 高於 EV。專案經理注意到團隊仍持續報告「工作正在進行」，但沒有說明偏差原因。專案經理應採取哪些行動？（選兩項）", "options": ["立即刪除低優先順序功能，以便快速改善 SPI 與 CPI，並向治理委員會報告改善結果。", "暫停尚未開始的工作，直到團隊提出完整的成本回復計畫與時程壓縮方案。", "分析時程與成本偏差的根本原因，確認是估算錯誤、效率下降、範疇變動或外部依賴造成。", "根據目前績效趨勢與剩餘工作重新預測完工成本、完工日期與可能需要的管理行動。 ( (您的選項)", "將目前偏差視為專案執行中的正常波動，待下一次績效報告再決定是否需要處理。", "要求團隊改以完成百分比回報進度，避免 EV 數據造成高階主管過度解讀。"], "answers": [2, 3], "explanation": "EV 低於 PV，表示完成價值低於原計畫，有時程落後跡象。AC 高於 EV，表示實際成本高於已完成工作的價值，成本效率不佳。專案經理應先分析偏差原因，並重新預測完工成本與日期。故正解是「分析時程與成本偏差的根本原因，確認是估算錯誤、效率下降、範疇變動或外部依賴造成」和「根據目前績效趨勢與剩餘工作重新預測完工成本、完工日期與可能需要的管理行動」。"}, {"source": "PMSuccess32.pdf", "number": 1, "stem": "由於組織的商業策略發生變化，專案資金被縮減。專案贊助者提出：「可以減少品質管制的成本」。在這種情況下，專案經理應該如何處理？", "options": ["根據贊助者的需求直接修改專案管理計畫書，而不需進行其他變更影響評估與審查，因為贊助者需要為專案負全責。", "透過品質稽核來檢查現有品質計畫執行情況，以確認是否有不必要的流程可進行優化調整。", "評估減少品質管制對專案目標與交付成果的影響，並依照結果提出適當的因應方案和建議。", "縮小專案範疇，以減少工作內容並降低成本，但需確保達成專案最小可行性成果與目標。"], "answers": [2], "explanation": "* 專案經理的首要任務是評估變更對專案的影響。當資金減少時，直接削減品質管制成本可能導致交付成果不符合要求。因此，專案經理應評估這項變更對時間、成本、風險及專案績效的影響，並向專案贊助者提出建議，而不是盲目執行變更。* 其他選項是錯誤的，因為：-品質稽核旨在檢查品質計畫書的執行情況，並非直接用來應對資金縮減的狀況。這項活動雖然有助於優化品質流程，但並不能取代對變更影響的全面評估。-縮小專案範疇是一種成本控制策略，但需透過變更控制流程來獲得審核和批准，不能在沒有完整分析與確認的情況下直接採取行動。此選項忽略了變更流程的重要性。-專案管理計畫書的變更應遵循變更管理流程，進行影響分析並提交變更請求，經審核批准後才能更新文件。若未經評估和審批就修改計畫，會導致專案缺乏一致性與透明度，增加專案失敗的風險。"}, {"source": "PMSuccess32.pdf", "number": 2, "stem": "單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。\n專案經理管理一個包含12個階段的專案，現在\b專案已經進行到第8個階段的末期。專案經理\b與專案團隊已經將\b專案的實際績效整理好了。為了讓專案可以順利地進行，他下一步最好做什麼？", "options": ["審查專案產品", "將專案的實際績效提供給利害關係人", "製作第9個階段的專案章程", "進入下一個階段", "將專案績效與商業企劃案進行比較 \b"], "answers": [4], "explanation": "在每個\b專案階段的末期都需要設置階段閘門，好將專案績效與專案及商業文件，例如：商業企劃案、專案章程、專案管理計畫書或效益管理計畫書進行比較。專案經理可藉由這些比較結果來進行：進入下一個階段、修正後，再進入下一個階段、結束專案、或繼續停留於該階段...等決策。"}, {"source": "PMSuccess32.pdf", "number": 3, "stem": "某銀行平台專案採混合式方法。核心資料移轉採預測式，客戶介面採敏捷式。近期敏捷團隊延後了一項介面功能，但該功能會影響資料移轉測試腳本。兩個團隊仍各自回報進度正常。專案經理最應該做什麼？", "options": ["請產品負責人重新評估該介面功能的商業價值，若短期價值不足，則將其移出目前版本，以降低對資料移轉測試的干擾。", "將介面功能延後記錄為敏捷團隊內部風險，等整合測試出現實際影響後，再登錄為跨工作流議題並啟動修正行動。A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果", "檢視兩個工作流之間的相依關係，並分析介面延後對資料移轉測試與整合里程碑的影響。", "要求兩個團隊在下一次狀態會議中使用同一份進度報告範本，讓專案經理能比較敏捷與預測式工作流的完成百分比。", "依資料移轉工作流的進度基準維持專案整體狀態，同時請敏捷團隊在下一個 Sprint 中優先補回延後的介面功能。"], "answers": [2], "explanation": "正解是「檢視兩個工作流之間的相依關係，並分析介面延後對資料移轉測試與整合里程碑的影響」。混合式專案的重點不是各工作流各自「看起來正常」，而是要管理跨工作流相依性、整合點與整體里程碑影響。介面功能延後已影響資料移轉測試腳本，PM 應主動分析整合影響並協調更新計畫。"}, {"source": "PMSuccess32.pdf", "number": 4, "stem": "在混合式專案中，團隊R遇到了一個無預警的挑戰，此挑戰可能會推遲當前迭代，並可能造成下一個迭代中的任務B無法如期完成。此專案中的另一個團隊Ｗ需要依賴任務B才能順利完成他們手中的任務。專案經理應該如何解決這個問題？", "options": ["與產品負責人會議，並重新檢視與定義下一個迭代待辦清單的優先順序。", "協助團隊R進行回顧會議，並讓他們知道在下一個迭代的初期需要先辨識風險。", "增加專案資源與迭代的長度，以確保團隊Ｗ的任務可以完成。", "分別與兩個團隊會議，要求他們討論出一個可以滿足如期交付產出的方法與期限。"], "answers": [0], "explanation": "* 在混合式專案中，當出現影響範疇和依賴項目的問題時，產品負責人是設定優先順序和調整目標的關鍵角色。與產品負責人會議可以確保下一個迭代的待辦清單可以按照最重要的商業需求重新排列。在此題中，產品負責人和開發團隊可以藉由重新檢視優先等級，調整團隊R和W的工作計畫，讓資源更有效地分配，並降低對依賴項目的影響。* 雖然溝通是解決問題的必要步驟，但單獨要求團隊解決問題並達成協議，可能導致過多的責任被推給團隊，忽略了產品負責人在優先等級設定和資源調整中的責任。* 敏捷方法是在固定的時間框架（Timebox）和節奏中運作。增加資源或延長迭代的做法會影響專案的穩定性和可預測性。* 回顧會議的目的是反思和改進團隊的流程，但這種做法偏離了當前問題的緊迫性，無法立即解決團隊W依賴任務B的挑戰。"}, {"source": "PMSuccess32.pdf", "number": 5, "stem": "某科技公司正在開發一套自動駕駛輔助系統，專案由團隊A與團隊B共同開發功能模組。下圖是過去Sprint的資料彙整。Scrum Master正在評估哪個團隊在持續交付能力與品質一致性方面表現較佳。請問，哪一個團隊在綜合績效上較為優秀？", "options": ["團隊A，因為他們估算較少，容易完成交付任務。", "團隊B，因為其Velocity略高，表示長期平均工作輸出量較大。", "無法判斷，因為缺乏使用者回饋或缺陷數據來衡量品質。", "團隊B，因為他們嘗試挑戰更高的工作量，是更進取的團隊。", "團隊A，因為其DoD達成率高、實際完成量接近預估，展現穩定的交付品質。"], "answers": [4], "explanation": "團隊A的DoD符合率高達95%，表示品質一致性佳。團隊A預估200點，且其實際完成點數（190）接近平均Velocity（185），顯示估算準確且執行穩定。另外，雖然團隊B的平均Velocity略高，但其DoD達成率僅78%，這代表工作可能未真正完成或品質不穩。「Velocity高」不能代表績效高，若交付物無法符合完成定義，則可能導致返工或技術債累積。所以正解是「團隊A，因為其DoD達成率高、實際完成量接近預估，展現穩定的交付品質」。"}, {"source": "PMSuccess32.pdf", "number": 6, "stem": "為了建立新的保單管理系統，某團隊被分配到一個專案中。專案進行6個月之後，專案贊助者表示了他的擔憂：「有位不同部門的公司同事聲稱，保單管理系統存在錯誤，且團隊無法解決這些關鍵問題」。專案經理應該使用哪兩項來準備對於專案贊助者的回應？（選兩項。）", "options": ["風險度量指標。", "各種變更。", "缺陷紀錄。", "議題紀錄。", "技術債。"], "answers": [2, 3], "explanation": "你需要獲取關於品質，以及任何影響專案的障礙之資料與報告，以便向專案贊助者解釋這些問題。缺陷紀錄將顯示正在打造的產品之品質及產品的哪些地方需要多加關注。問題紀錄可提供有關障礙的資訊。問題紀錄是一種報告工具，可用來追蹤專案中的錯誤，並依照類型和嚴重性整理當前的問題，以確定問題的優先等級。雖然風險度量工具可辨識專案的威脅，並將它們按優先等級排序，而且你也需要考量變更與技術債，但前提是，你需要先解決這些關鍵問題才行。"}, {"source": "PMSuccess32.pdf", "number": 7, "stem": "客戶不滿意團隊所交付的產品，並表示這不是他們期望的。專案經理感到非常驚訝，因為敏捷開發團隊已經在先前的幾個迭代中展示與交付過此產品了。專案經理該怎麼做才能避免發生這種結果？", "options": ["每次迭代發生變更後，都有資源可以測試產品。", "確保客戶都能充分了解展示的價值。", "確保團隊充分參與專案範疇的制定。", "要求團隊對於需求的各項變更都簽字確認。"], "answers": [1], "explanation": "迭代審查是團隊向客戶展示工作產出，並得到客戶回饋，且可用來確保產出是否有滿足他們期望的最佳機制。所以，若是客戶對專案的參與程度不足，以致於不了解迭代審查的目的時，將非常有可能造成此結果。"}, {"source": "PMSuccess32.pdf", "number": 8, "stem": "一個為期三年的軟體開發專案已經進行一半，目前的CPI大於1、SPI大於1。然而，在今日的專案會議中，專案贊助者帶來一個不好的消息：公司財務出了問題，即日起將縮減40%的專案整體預算。專案經理應該如何應對這種情況？", "options": ["向贊助者展示良好的專案績效報告，並建議刪減低優先價值的功能範圍，以求完成專案。 (您的選項)", "進行跨部門腦力激盪會議，尋找額外資源，以填補資金缺口。", "將此事記錄到議題紀錄中，並等待組織高層的決定。", "檢查專案章程與優先事項，並提出繼續進行、縮減範疇或結束專案的建議。"], "answers": [3], "explanation": "* 當專案預算大幅縮減時，應根據專案章程檢討專案的價值與優先等級，提出繼續進行方案或結束專案的建議，以確保專案符合組織的策略需求與可行性。* 其他選項是錯誤的，因為：-尋找新資金雖然是積極做法，但此舉並非專案經理的責任範疇，而是公司財務和管理層的職責。-刪減範疇後若是仍然無法往下進行專案，贊助者可能仍會決定終止專案。而且直接刪減範疇將可能忽略了其他面向的評估。-僅記錄問題並等待決策是被動的做法，缺乏專案經理應有的主動性與決策支持能力，不符合專案管理的責任與價值。"}, {"source": "PMSuccess32.pdf", "number": 9, "stem": "你是某軟體開發敏捷專案的產品負責人（PO）。在迭代中期，你收到兩位重要利害關係人的不同反饋： • A利害關係人希望你將他們新提出的一項高優先需求納入當前迭代。 • B利害關係人則擔心當前團隊的交付品質下降，建議放緩進度以確保穩定性。 你與團隊討論後發現： • A的新需求具有實質價值，但尚未經過完整分析與估算。 • 團隊工作量已滿，當前迭代剩餘時間有限。 作為產品負責人，以下哪一項是最佳行動？", "options": ["向 Scrum Master 建議召開特別會議，說明利害關係人衝突，並請團隊自行決定是否接
