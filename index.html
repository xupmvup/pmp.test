受新需求或調整品質門檻。", "拒絕 A 的需求與 B 的擔憂，維持原定工作內容，避免中斷。", "將 A 的新需求立即納入當前迭代待辦清單中，並安排團隊優先處理。", "將 A 的新需求納入產品待辦清單中，邀請兩位利害關係人參加下一次精煉與迭代審查會議，共同討論需求優先順序與品質顧慮。"], "answers": [3], "explanation": "正解是「將 A 的新需求納入產品待辦清單中，邀請兩位利害關係人參加下一次精煉與迭代審查會議，共同討論需求優先順序與品質顧慮」，因為此做法：- 符合敏捷原則：透明、協作、與利害關係人共同創造價值。- 延後需求處理但不忽略：納入產品待辦清單是正確動作。- 安排參與會議：使用 Scrum 儀式作為互動場域，提升參與與決策品質。- 平衡價值與風險：不急於納入但正視雙方意見，維持團隊穩定與信任。"}, {"source": "PMSuccess32.pdf", "number": 10, "stem": "專案經理正帶領一項新型風力發電機的跨國混合式專案。此專案涵蓋設計、原料採購和製造。目前進行到第六個階段。截至上週的監控點為止，專案進展順利。然而，本週績效報告顯示時程出現偏差。來自亞洲的團隊抱怨：「由於歐洲團隊由於當地長假而延誤了原料挑選任務，導致我們的生產前置作業無法如期進行，並影響了團隊士氣。」專案經理首先應該如何處理？", "options": ["運用快速跟進法來化解亞洲團隊的時程壓力。", "壓縮時程，要求團隊加班，以改善時程績效。", "依據風險管理計畫書評估時程延誤將造成的衝擊。", "與利害關係人溝通，以了解延誤的根本原因。"], "answers": [3], "explanation": "* 此題的關鍵在於：「專案發生時程偏差而導致團隊出現抱怨情緒，並影響士氣」。由於抱怨只是症狀，但真正的根本原因可能是：溝通時差或機制不良或資源安排失當等。所以，專案經理的首要任務不是直接採取補救行動，而是釐清問題的真正來源與影響面。因此，專案經理應先與利害關係人（如歐洲團隊、排程負責人、資源調度人員）進行溝通，以確認真正的延誤原因，再依據事實制定應對策略。* 其他選項是錯誤的，因為：1. 雖然依據計畫書來評估風險是重要的一環，但這是處理延誤後續衝擊的活動，不應該是第一步行動。2. 快速跟進是同時進行原本應該依序的工作，但目前問題根源尚未釐清，貿然套用可能造成更大風險。3. 壓縮時程是成本高、風險高的做法，不應在根因未明時就下達加班命令，可能會打擊士氣，並惡化狀況。"}, {"source": "PMSuccess33.pdf", "number": 1, "stem": "你擔任新軟體開發專案的專案經理，組織希望藉此作為公司導入敏捷式管理的示範案例。你深知績效的追蹤與展示是利害關係人是否對敏捷式管理產生信心的關鍵，所以，你希望有一種工具可以展現團隊在各個迭代的完成率，並可用來預測未來迭代的團隊產能。你可以使用哪一種工具？", "options": ["實獲値管理報告", "趨勢分析", "速度圖", "變異分析報告"], "answers": [2], "explanation": "在敏捷式專案中，速度圖可以顯示隨著時間變化的團隊完成率，並可用於協助預測未來迭代的團隊產能。"}, {"source": "PMSuccess33.pdf", "number": 2, "stem": "專案在第三個階段時，顧客認為有兩個功能沒完成，不願意簽驗收單。專案經理應該如何處理？", "options": ["將已驗證的可交付成果和專案管理計畫書相比對。", "檢視專案章程。", "拿可交付成果和範疇基準相比對。", "檢視品質管理計畫書，如果屬實，將做到顧客滿意為止。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [0], "explanation": "* 從此題情境描述可以知道專案正處於確認範疇過程，所以，你只需要找出確認範疇的投入即可。故，「將已驗證的可交付成果和專案管理計畫書相比對」是最佳解。* 選項「拿可交付成果和範疇基準相比對」並不正確，因為「可交付成果」是指尚未通過組織內部品質檢驗的產品，所以並不適合拿給客戶確認。"}, {"source": "PMSuccess33.pdf", "number": 3, "stem": "在一個重要的客戶服務改善流程專案中，團隊推出了新的服務流程，並為所有最終使用者提供了相關培訓。然而，最終使用者依然拒絕採用新的流程，並選擇繼續使用既有的工作方式。作為敏捷團隊的一員，你認為團隊應該採取以下哪些行動來應對這個挑戰？", "options": ["將不合作的情況上報給最終使用者的功能經理。", "留意實施新流程的相關風險。", "重新組裝，並執行原定計劃。", "參與最終使用者社群，並嘗試了解他們的擔憂。"], "answers": [3], "explanation": "* 敏捷原則強調與利害關係人和使用者的緊密合作，他們的支持是確保專案成功的關鍵因素。所以，此團隊需要更深入地了解最終使用者的需求和期望。* 使用者拒絕新流程的風險應該在早期就被辨識並納入考量，而不是等到問題發生後再處理。現在的重點應該是與使用者建立更深層的互動，了解他們的擔憂與障礙，並透過漸進式改進來解決問A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n題。* 過度向上呈報或試圖回到原計劃，不僅無法解決根本問題，反而可能重蹈覆轍。因此，團隊應專注於合作與持續改善。"}, {"source": "PMSuccess33.pdf", "number": 4, "stem": "一項混合式產品升級專案正在執行中。硬體建置採預測式管理，產品功能則以兩週迭代交付。過去幾次迭代結束時，團隊多半只回報設備故障、測試環境不穩等一般作業問題。 在最近一次迭代審查後，測試團隊提醒專案經理：若依目前設計繼續開發，產品可能無法通過即將到來的法規符合性審查。此狀況尚未造成正式拒收，但若未及早處理，可能影響後續發布、合約承諾與客戶驗收。 專案經理應優先審查並更新哪兩項工件？（選兩項）", "options": ["合規紀錄與補救追蹤。", "風險管理計畫書中的方法。", "迭代回顧的改善項目。", "機率／影響矩陣的格式。", "風險登錄表與風險負責人。", "產品技術文件的版本編號。"], "answers": [0, 4], "explanation": "此題情境是一個新浮現的法規風險，且可能影響發布、驗收與合約承諾。專案經理應將其納入風險登錄表，記錄風險原因、影響、觸發條件、責任人、狀態與應對策略。此外，題目特別指出產品可能不符合法規，因此不只是一般技術風險，也涉及合規管理。專案經理應更新合規相關紀錄，例如合規需求、差距、責任人、補救行動、審查狀態與追蹤結果。故正解是「風險登錄表與風險負責人」和「合規紀錄與補救追蹤」。"}, {"source": "PMSuccess33.pdf", "number": 5, "stem": "專案經理在專案執行中期接手。數個交付項目已完成，但最近的回饋顯示，一個先前未參與專案討論的群體，其抗拒情緒日益高漲。專案章程和初始的利害關係人登錄表皆可供查閱。專案經理應該怎麼做？", "options": ["繼續執行已批准的計畫，同時監控利害關係人的回饋以進行進一步的變更。", "與抗拒的群體溝通以了解他們的疑慮，然後再更新利害關係人文件。", "請贊助者確認是否應將新識別的群體視為利害關係人。", "檢閱利害關係人登錄表，並識別受近期結果影響的其他利害關係人。"], "answers": [3], "explanation": "專案經理是在專案執行中期才接手。這表示他需要先了解既有專案背景、原本識別了哪些利害關係人、哪些人被遺漏、目前交付成果又可能影響到哪些新群體。因此，第一步應該先檢閱既有文件，特別是：專案章程和利害關係人登錄表。此外，有效的利害關係人參與始於準確的識別。檢視並更新利害關係人登錄表，可確保所有受影響或具影響力的各方都得到確認，尤其是在專案影響或利害關係人動態發生變化時。故選項「檢閱利害關係人登錄表，並識別受近期結果影響的其他利害關係人」是正解。"}, {"source": "PMSuccess33.pdf", "number": 6, "stem": "專案經理接手一個執行到一半的混合式專案，專案結合了預測式方法的明確階段目標與敏捷式方法的快速適應需求。此專案面臨多重挑戰，包括團隊士氣低落、範疇不清、資源分配不足，以及進度過快導致部分交付成果無法滿足需求。專案績效指標顯示成本績效指標（CPI）為0.8，時程績效指標（SPI）為1.3。在這種情況下，專案經理第一步該如何處理？", "options": ["與專案贊助者會面，確保資源分配符合需求，並討論調整預算的可能性。", "與專案利害關係人會面，重新確認專案範疇與優先等級，確保目標一致。", "與專案團隊成員個別會面，了解各成員的情緒狀態與挑戰。", "重新審查專案的交付標的，以確認範疇與預期成果的一致性。"], "answers": [1], "explanation": "* 這題的關鍵是：專案看起來進度超前，但成本超支，而且交付成果不符合需求。在混合式專案中，專案經理第一步應先讓關鍵利害關係人重新對齊：專案範疇是否清楚； 哪些需求與交付成果最重要； 預測式階段目標是否仍有效； 敏捷部分的產品優先順序是否正確； 是否需要調整交付節奏、資源或品質標準。所以選項「與專案利害關係人會面，重新確認專案範疇與優先等級，確保目標一致」是正解。* 選項「重新審查交付標的，以確認範疇與預期成果一致性」方向接近，但它有兩個限制：- 第一，它偏向專案經理或團隊內部檢查。但範疇是否清楚、交付成果是否符合期待、需求優先順序是否正確，不能只靠 PM 自己判斷，需要關鍵利害關係人共同確認。- 第二，它只處理「交付物與預期成果是否一致」，但沒有處理「優先順序」與「目標一致性」。這題是混合式專案，敏捷部分尤其需要持續確認價值與優先順序。若優先順序錯了，即使交付標的被重新審查，也可能繼續做錯方向。* 雖然贊助者能提供資源的支持和協助決策的制定，但在範疇和優先等級未確定的情況下，直接與贊助者討論預算或資源分配是缺乏基礎的，並可能導致決策不符合專案需求。* 在未解決範疇模糊的核心問題前，單獨與成員會談可能無法有效改善團隊士氣。"}, {"source": "PMSuccess33.pdf", "number": 7, "stem": "一項混合式設備升級專案正進行到第三階段。專案經理在例行績效審查中發現，一項已完成活動比核准時程晚了 3 天。該活動的後續工作與數個階段里程碑相連，但團隊尚未確認延誤是否已耗盡總浮時，或是否會改變預測完工日。 專案經理知道時程管理計畫書中訂有偏差門檻與呈報規則，但目前尚未核准任何矯正措施或基準變更。在決定後續處置前，專案經理應先採取哪些行動？（選兩項）", "options": ["分析時程網圖、浮時與完工預測。", "檢視時程管制門檻與呈報規則。", "快速跟進受影響的後續活動。", "登錄重大議題並立即呈報贊助人。", "通知利害關係人完工日期將延後。", "將三天延誤納入新的時程基準。"], "answers": [0, 1], "explanation": "正解是「檢視時程管制門檻與呈報規則」和「分析時程網圖、浮時與完工預測」。專案經理應先參考時程管理計畫書，以確認：可接受的時程偏差範圍、何時需要採取矯正措施、何時需要呈報或通知利害關係人，以及應採用哪些時程控制方法。 此外，「延誤 3 天」不一定等於「專案完工延誤3 天」。專案經理應分析：該活動是否位於要徑、尚有多少總浮時、延誤是否影響後續里程碑、目前趨勢是否會改變預測完工日，以及偏差的原因與程度。要徑法可用來辨識決定最短完工時間的路徑，浮時則可判斷活動能延遲多久而不影響專案完成日期。"}, {"source": "PMSuccess33.pdf", "number": 8, "stem": "專案進行到一半，組織的財政出現問題，組織高層評估過後決定縮減專案整體預算。專案經理應該怎麼辦做？", "options": ["更新專案管理計畫書", "比對商業企劃案與專案狀況，以評估是否還能繼續進行專案", "將此事記錄進風險登錄表", "修訂成本預算編列的方法"], "answers": [1], "explanation": "既然組織高層決定縮編預算，那你就需評估縮編後的預算是否可以完成專案，也就是說，你需要再進行一次預算評估，故所有決定預算的投入都是你的參考依據，以便確認是否還能繼續進行此專案。"}, {"source": "PMSuccess33.pdf", "number": 9, "stem": "專案經理正在管理一項跨部門系統整合專案。最近一次專案現況會議原本是要確認當週進度、風險與待決議題，但會議中多位團隊成員不斷提出各自部門關切的問題，有些議題與當週進度無直接關係，另有兩位技術負責人針對解決方案爭論不休。 會議最後超時 40 分鐘，未形成任何決議，也沒有明確的後續行動負責人。幾位成員事後反映，會議雖然讓問題被提出，但缺乏焦點與決策效率。為了讓下次專案現況會議更有效，專案經理應採取哪些行動？（選兩項）", "options": ["請成員僅報告進度，不再討論爭議。", "只邀請決策者與工作包負責人參加會議。", "改以電子郵件取代現況會議直到穩定。", "規定每人發言次數，避免特定成員主導。", "會前發布議程、目的、預期產出與時間盒。", "會中引導衝突，並記錄行動負責人。"], "answers": [4, 5], "explanation": "正解是「會前發布議程、目的、預期產出與時間盒」和「會中引導衝突，並記錄行動負責人」。現況會議失焦，代表會議目的、討論範圍、預期成果與時間控管不足。專案經理應在會前準備並發布清楚的議程，定義會議要產出的決策、待確認事項或行動項目，並使用時間盒避免討論發散。本題不只是會議安排問題，也包含衝突與議題失控。專案經理應在會議中促進協作、使用主動聆聽與回饋技巧，將爭議導向可處理的議題、決策或行動項目，並指定負責人與追蹤方式。若有問題、衝突或不一致，應將其推向解決，必要時記錄於議題紀錄並指派負責人。"}, {"source": "PMSuccess33.pdf", "number": 10, "stem": "專案進行中，因為法令因素的改變，專案經理認為可能將與組織策略有所衝突。專案經理第一步應該做甚麼？", "options": ["繼續進行專案，等贊助者告知明確的訊息後再來討論進一步的作法。", "記錄這些衝突，主動找組織高層與贊助者討論，並確認專案是否需要調整方向、終止或繼續進行。", "提出變更申請，好讓專案目標能符合相關法令。", "結束該專案，並由贊助者啟動另一個符合法令與組織策略的專案來取代目前專案。", "暫停專案，直到釐清法令所引發的衝突。"], "answers": [1], "explanation": "雖然專案可能會因為發令因素的改變而被迫終止專案，但是終止專案的決定應先得到有關當局或是組織高層的核准與授權。 所以，專案經理必須先和贊助者討論，並取得決議後，再進行後續作業。"}, {"source": "PMSuccess34.pdf", "number": 1, "stem": "專案的IRR是5%、成本績效指標是1.4、時程績效指標是0.75、NPV是-3,000，而回收期是6年。專案經理應該怎麼做？", "options": ["增加專案成本。", "改善NPV值。", "加速專案時程。", "結束專案。"], "answers": [2], "explanation": "成本績效指標大於1時，表示成本管制在預算內，所以目前先不需要考量成本。時程績效指標小於1時，則表示時程落後了。所以，加速專案時程會是最好的選擇。"}, {"source": "PMSuccess34.pdf", "number": 2, "stem": "被賦能的自主性團隊在前四個迭代中取得了令人矚目的進展，但現在產品負責人發現第五個迭代的產出低落，且沒有任何明顯的理由。請問，造成這種情況的原因是？", "options": ["很可能是某個表現不佳的團隊成員拖慢了團隊步伐。", "團隊先前處於團隊發展的風暴階段，現在已經轉向正軌階段。", "技術債務已經產生，團隊的產出會在此原因被消除前繼續下降。", "在前四個迭代中，團隊處理的是待辦清單中的低複雜性故事。 (\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [3], "explanation": "*「在前四個迭代中，團隊處理的是待辦清單中的低複雜性故事」是正解。這是因為在敏捷專案中，速度（velocity）本質上會受工作難度或複雜性所影響。若早期迭代挑選了「容易、低複雜度」的故事，團隊的產出會看起來特別亮眼；當待辦清單逐步走到較高複雜度的項目時，在相同的團隊能力下，其產出自然就會下降。這是最常見且「沒有表面跡象」的原因。* 此題也可以使用刪去法來解題：-「風暴轉向正軌階段」是錯誤的，因為：從風暴轉向正軌通常是提升產出，而非降低產出。-「某個人表現不佳」也不正確，因為敏捷強調跨職能、群體貢獻與系統性檢視，把責任歸咎個人是偏見的推論，且題目說「沒有明顯理由」。-「技術債造成下降」也不正確，雖然技術債確實會拖慢速度，但常伴隨可觀測的跡象（缺陷率上升、重工增加）。題目強調「沒有明顯的理由」，故更貼近工作組合複雜度改變而非已經浮現問題的技術債。"}, {"source": "PMSuccess34.pdf", "number": 3, "stem": "敏捷團隊在某天下午一同聚集在一個開放式的工作空間，並且邀請顧客一起參加。在此會議中，團隊首先邀請客戶觀看他們進行App的操作示範，而後邀請顧客親自操作。會議進行大約30分鐘後，團隊充滿了歡呼聲。這裡正在舉辦什麼活動？", "options": ["專案回顧會議", "每日站立會議", "產品審查會議", "產品規劃會議A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [2], "explanation": "這是敏捷專案中的產品展示會議，也稱為審查會議，在此會議中，專案團隊向客戶展示產品功能，有可以讓客戶自行操作。"}, {"source": "PMSuccess34.pdf", "number": 4, "stem": "一項混合式軟體專案已進行到第四個迭代。最近兩週，團隊完成的使用者故事數量略低於預期，且部分已完成項目在測試後被退回修改。例行同步會議中，一位資深成員表示：「大家同時處理太多工作，可能因此出現重工。」另一位測試人員則認為，重工也可能與驗收條件不清或品質檢查不足有關。專案經理接下來應該怎麼做？", "options": ["更換造成重工的成員，並補強交付審查。", "蒐集資料以釐清重工的主要來源。", "使用看板檢視工作流，並立即限制進行中的工作（WIP）。", "要求團隊對不確定工作設定時間盒與探針。"], "answers": [1], "explanation": "題目中的「工作太多導致重工」只是團隊成員的初步觀察，尚未被證實。測試人員又提出另一個可能原因：驗收條件或品質檢查不足。因此專案經理不應直接假設問題來自工作量、個人績效或特定工具不足，而應先蒐集資料、分析重工來源，判斷這是時程壓力、品質流程、需求不清、工作流瓶頸，還是多個因素共同造成。"}, {"source": "PMSuccess34.pdf", "number": 5, "stem": "專案經理負責一項高度管制的專案，在專案進行中贊助人與高階主管們提出了一項可能違反法令的變更申請。專案經理該如何回應？", "options": ["將變更申請交付變更管制委員會審查。", "諮詢組織內法律專家或部門的意見與指引。", "向贊助人與高階主管們表達反對的意見。", "搜尋組織的知識庫，察看是否有前例。"], "answers": [1], "explanation": "題目提到這項變更申請「可能」違法，既然並不確定，專案經理就應該先向專家請教過後，才能進行後續回應，而且是否違反法令的判斷通常並非是專案團隊的專業。故「諮詢組織內法律專家或部門的意見與指引」為最佳解。選項「向贊助人與高階主管們表達反對的意見。」可以淘汰，因為尚未確認是否違反法令前，不適合直接表達反對意見。選項「搜尋組織的知識庫，並察看是否有前例」也不適合，因為最好是由法律專家而非團隊成員進行搜尋。"}, {"source": "PMSuccess34.pdf", "number": 6, "stem": "專案有三位關鍵的內部利害關係人，經過個別訪談後瞭解他們對專案的看法與需求並不相同。專案經理該如何協調？", "options": ["將他們的看法與需求納入簡報，然後個別面會這三位利害關係人，取得他們的回饋後再自行整理並建立共識。", "請這三位利害關係人各自準備簡報，然後安排會議邀請他們參加，讓他們有機會陳述已見說服對方。", "將他們的看法與需求納入簡報，然後安排會議邀請這三位利害關係人參加，讓所有人當面討論。", "將他們的看法與需求納入需求文件中，然後由專案贊助人進行決議。"], "answers": [2], "explanation": "利害關係人之間如對於專案有不同的看法和需求，最佳的方式就是讓他們可以一起進行面對面的溝通，以求得到共同的理解。選項「將他們的看法與需求納入需求文件中，然後由專案贊助人進行決議」可以先刪除，因為題目詢問的是你要如何「協調」，所以不適合由贊助人做出獨裁式的決議。"}, {"source": "PMSuccess34.pdf", "number": 7, "stem": "一項內部知識管理系統專案已成功部署平台，並完成使用者訓練。三個月後，管理層發現員工仍很少使用該平台，跨部門知識重複開發的問題也沒有改善。專案經理在檢討時最應強調哪一項？", "options": ["只要平台符合規格，就不需追蹤後續效益。", "專案已交付平台，因此已完成價值交付。", "專案產出已完成，但成果與價值尚未實現。", "系統已完成訓練，因此應交由營運部門負責。", "使用者未使用平台，代表專案範疇可能定義錯誤。"], "answers": [2], "explanation": "此專案的產出是平台與訓練；成果是員工真的使用平台並改善知識分享；價值則是降低重複開發、提升效率。完成交付物不代表價值一定實現。"}, {"source": "PMSuccess34.pdf", "number": 8, "stem": "專案進行到最終兩個月時，在其中一次的確認範疇會議上，有位關鍵利害關係人提出多項疑問，認為專案並沒有完全符合專案範疇。專案經理打算採用一連串的詢問，以期可以一次解決問題。專案經理打算採用的是什麼工具?", "options": ["魚骨圖", "柏拉圖", "親和圖", "腦力激盪", "決策樹"], "answers": [0], "explanation": "因果圖又稱為魚骨圖、Why - Why圖或石川圖。此工具可以將已辨識出來的問題原因拆解為不同的分支，有助於辨識造成該問題的主要原因。"}, {"source": "PMSuccess34.pdf", "number": 9, "stem": "專案經理帶領一個使用敏捷式開發手法的專案。他想要每天都能了解專案進展，並預估時程。專案經理最好使用那項工具？", "options": ["燃盡圖", "甘特圖", "實獲值分析", "假設情境分析", "故事點分析"], "answers": [0], "explanation": "* 此題的正解是「燃盡圖」。此題有兩個關鍵詞「敏捷式開發」和「每天了解專案進展，並預估時程」。在敏捷裡，燃盡圖恰好就是用來：每天更新剩餘工作量（剩餘故事點 / 剩餘任務數），並顯示理想下降線 vs 實際進度線，讓你快速看出：是否落後 / 超前，以及依目前速度，預估能否在Sprint 或 Release 期限內完成。完全符合題目要的：「每天掌握進度＋預估時程」。* 其他選項是錯誤的，因為：- 實獲值分析多用在預測性 / 傳統專案進度與成本控制。雖然也可以估算完工時程與成本，但題目明講「敏捷式開發」。PMP 考試會希望你用敏捷專屬、輕量化的可視化工具（如燃盡圖），而不是重型的 EVA。- 假設情境分析用來模擬不同情境會怎麼影響時程或成本，不是每天拿來看「實際進度」的工具，而是做「假設模擬」用。- 甘特圖偏向傳統排程視覺化工具。在敏捷環境中較少用來追蹤每天進度，而且甘特圖也不是特別強調「剩餘工作量隨時間變化」的圖示。- 故事點分析是用來「估算工作量」、看容量，不是用來追蹤每天實際進度的圖表。故事點本身是「工作量單位」，不是「進度可視化工具」。"}, {"source": "PMSuccess34.pdf", "number": 10, "stem": "某敏捷團隊的燃盡圖連續五天幾乎沒有下降。每日協調會議上，成員表示多個故事受到同一個外部API 權限問題影響。產品負責人擔心 Sprint 目標可能無法達成。Scrum Master 或專案經理最適合怎麼做？", "options": ["改為每月向管理層彙報一次燃盡圖狀況，以避免短期波動造成不必要的干擾。", "協助團隊處理外部 API 權限障礙，並讓團隊重新檢視 Sprint 目標與當日工作安排。 ( (您的選項)", "與產品負責人討論延長目前Sprint 時間盒的可能性，讓團隊有足夠時間完成原先承諾的所有使用者故事。", "引導所有成員每天提交工時紀錄，以便判斷燃盡圖停滯是否來自個人效率問題。"], "answers": [1], "explanation": "這題的關鍵是：燃盡圖連續停滯，而且團隊已指出多個故事受到同一個外部 API 權限問題影響。所以這不是單純的個人效率問題，也不是等到月底再回報的狀態資訊，而是正在阻礙 Sprint 目標達成的障礙。Scrum Master 應協助團隊移除障礙，促進團隊檢視對 Sprint 目標的影響，並調整當日或接下來的工作安排。"}, {"source": "PMSuccess35.pdf", "number": 1, "stem": "組織的企業資源規劃(ERP)系統專案共區分為5個階段來進行，現在已經進行到第5個階段的尾聲。明天上午10點，專案經理將協同專案贊助者以及重要的利害關係人一起進行最終版本的可交付成果\n之確認活動。此時，其中一位資深專案成員建議：「明天的確認活動若是順利完成，我們就可立即關閉專案帳戶，以確保不再發生多餘的成本」。專案經理應該如何回覆？", "options": ["關閉專案帳戶這活動並非專案內的任務，故此事交由組織進行即可。", "好建議，請準備專案帳戶關閉確認單。", "這並不可行，專案帳戶需要等\b完成專案或階段之行政結案程序後才能關閉。", "好建議，但是請先完成專案的最終報告。"], "answers": [2], "explanation": "由題目所述你可得知團隊明天將進行的是確認範疇過程，而「關閉專案帳戶」是結束專案或階段過程中的行政結案程序之一，而且結案程序所包含的活動甚多，故，專案帳戶需要等\b完成專案或階段之行政結案程序後才能關閉。"}, {"source": "PMSuccess35.pdf", "number": 2, "stem": "在某迭代中，一項技術議題出現後三天才被處理，差點導致一項重要任務延遲完成。雖然此議題已被解決，但專案經理希望防止類似情況再度發生。以下哪些作法最有助於團隊未來更有效處理此類議題？（選兩項）", "options": ["在迭代規劃會議中加入更多緩衝時間。", "在回顧會議中檢視此事件，找出流程改善機會。", "要求每日提交書面議題處理報告，提升責任感。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "與團隊建立更清晰的議題通報與追蹤機制。", "在展示會議中討論此議題，讓利害關係人參與解決建議。"], "answers": [1, 3], "explanation": "* 回顧會議是檢視團隊流程的正式場域，適合針對此事件做根本原因分析並提出改進建議。* 清楚的議題通報與追蹤流程可以幫助團隊更快辨識與回應議題，此舉也是預防遲延的關鍵。* 其他選項是錯誤的，因為：- 展示會議聚焦在產品展示與收集利害關係人回饋，不可用來討論團隊內部流程問題。- 增加緩衝時間只是治標不治本，會降低敏捷效率。- 強制書面報告違反敏捷的「簡化溝通」原則，也會造成不必要負擔。"}, {"source": "PMSuccess35.pdf", "number": 3, "stem": "你剛結束一個專案，此專案的品質和成本都管制在計劃內，但是發起人認為此專案是失敗的，因為原定的完工時程為40週，但實際執行了42週才完成。下列哪一項最有可能是此專案被判定為失敗的原因？", "options": ["專案的完成時間超過時程基准", "不好的範疇管理", "忘了更新時程基準", "發起人忘記時程基準已經更改過了A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [0], "explanation": "可先忽略「忘了更新時程基準」和「發起人忘記時程基準已經更改過了」，因為題目並無提到此情境。而合乎基準是專案成功的指標之一，故「專案的完成時間超過時程基准」為最佳解。"}, {"source": "PMSuccess35.pdf", "number": 4, "stem": "某銀行平台專案採混合式方法。敏捷團隊已完成所有高優先使用者故事，預測式資料移轉也已完成部署。贊助人要求專案經理確認是否可以正式關閉。專案團隊發現，資安稽核報告尚未歸檔，營運團隊也尚未確認夜間批次失敗時的升級流程。下列哪些事項最能支持正式關閉？（選兩項）", "options": ["預測式工作流已完成部署完成，因此敏捷未結事項可交由營運處理。", "所有需關閉的交付成果已依驗收準則", "低優先營運流程已經完成，雖然尚未演練，但不影響目前平台展示。", "贊助人已經口頭同意關閉專案，並要求剩餘文件由 PMO 後續補齊。", "敏捷團隊已在最後一個 Sprint 審查會上向重要利害關係人展示所有完成的故事。", "資安稽核證據、營運移交、採購與行政收尾均已完成。"], "answers": [1, 5], "explanation": "混合式專案正式關閉不能只看敏捷增量完成或預測式部署完成。必須有正式接受、文件歸檔、營運移交、採購與行政收尾完成。故正解是「所有需關閉的交付成果已依驗收準則正式接受」和「資安稽核證據、營運移交、採購與行政收尾均已完成」。"}, {"source": "PMSuccess35.pdf", "number": 5, "stem": "由於專案時程緊湊，專案經理外包了一些團隊較不熟悉的技術工作給T供應商。T供應商完全依照契約條款與技術規範完成專案工作，且於今天交付了成品。但是，專案經理對此交付標的不太滿意，希望供應商可以依照他的要求調整交付標的。專案經理首先應該怎麼做？", "options": ["接受交付標的，再與T供應商協商一份新的契約或是修訂原有契約。", "對此採購案提出的變更申請，並在T供應商調整成品之前暫停付款。", "終止契約，並請第三方進行仲裁。", "召集包含T供應商在內的相關利害關係人，一起討論出一個雙方都可以接受的替代方案。"], "answers": [0], "explanation": "題目情境提到「T供應商完全依照契約條款與技術規範完成專案工作」，因此，賣方已滿足契約規範，所以專案經理需要接受此產出。另外，專案經理若是想對成品進行修訂，可以與供應商協商新的契約或是修改原有契約，以便供應商可以有所依據地將交付標的修訂成符合專案經理要求的產品。"}, {"source": "PMSuccess35.pdf", "number": 6, "stem": "一項預測型研發專案已完成約 60%。由於新的法規限制使原定產品無法在目標市場上市，治理委員會正式核准提前終止專案。部分技術成果仍可供未來專案使用，採購部門也已開始處理供應商的契約收尾活動。贊助人要求專案經理依組織程序執行結案，並提供資訊供未來投資決策參考。專案經理應優先著重哪一項工作？", "options": ["促成經驗移轉，並更新知識庫。", "結清未決求償，並歸檔契約文件。", "驗證終止依據，並保存決策紀錄。", "彙整績效趨勢，並完成結案報告。"], "answers": [2], "explanation": "此專案並非正常完成，而是被提前終止。此時除了執行一般結案活動外，專案經理還應特別調查、確認並記錄：為何專案無法繼續、終止決策所依據的法規、商業與治理資訊、決策由誰核准、專案截至終止時已交付多少成果與價值，以及哪些未完成成果、風險或責任需要移轉。 這些資訊不只支援本次正式結案，也能避免未來專案重複投入於不可行的方案。故正解是「驗證終止依據，並保存決策紀錄」。"}, {"source": "PMSuccess35.pdf", "number": 7, "stem": "一個預測型專案已完成所有交付標的，內部品質檢查也顯示符合驗收準則。客戶在驗收會議中口頭表示滿意，但尚未簽署正式驗收文件。贊助人希望專案經理立即釋放團隊並關閉專案，因為下一個高優先等級專案急需人力。專案經理下一步應該怎麼做？", "options": ["將專案狀態標示為已完成，並請贊助人代替客戶核准專案結束。", "釋放專案團隊，因為客戶已口頭表示滿意，且組織有更高優先級需求。", "取得客戶的", "先關閉專案採購與財務帳目，再等待客戶日後補簽驗收文件。"], "answers": [2], "explanation": "專案已完成交付標的，不代表可以立即關閉專案。在正式結束專案前，專案經理應確認：交付標的已正式驗收；產品、服務或成果已移交給營運或客戶；結案文件完成；採購、財務與行政收尾完成；經驗學習與專案文件已歸檔；資源再正式釋放。題目中客戶只是「口頭表示滿意」，尚未簽署正式驗收文件，因此專案經理應先取得正式驗收，再進行完整結案程序。"}, {"source": "PMSuccess35.pdf", "number": 8, "stem": "你的一個新系統開發專案進入結案時，有一位利害關係人對於專案所耗費的時間、成本和資源產生質疑。你與相關的利害關係人會議，但是並不順利，你們發生了數次的爭論。若想避免這類溝通的失敗，會議前，你應該事先使用什麼專案工件？", "options": ["專案時程", "專案管理計畫書", "效益分析", "成本基準"], "answers": [2], "explanation": "專案結束時，專案經理可以參考商業文件，例如：商業企劃案與效益管理計畫書，並搭配效益分析，以評估專案是否達到當初所制定的經濟效益、可行性效益或專案效益之預期結果。"}, {"source": "PMSuccess35.pdf", "number": 9, "stem": "專案經理管理一項分階段進行的製造產線改善專案。第一階段已交付新的檢測流程，但第二階段會依據第一階段成果進行自動化。營運主管要求直接進入第二階段，以免延誤整體時程。專案經理應該如何做？", "options": ["將第一階段未完成事項列入第二階段待辦，避免整體時程被收尾活動拖慢。", "先完成第一階段驗收、文件更新與經驗學習，再", "只要營運主管同意，即可將第一階段視為完成並轉入第二階段。", "直接開始第二階段，並在後續自動化設計中同步修正第一階段文件。"], "answers": [1], "explanation": "本題考的是「階段收尾」。收尾不只發生在整個專案最後，也可能發生在每個階段結束時。第一階段交付的新檢測流程會成為第二階段自動化的基礎，因此若第一階段未正式驗收、文件未更新、經驗學習未整理，就直接進入第二階段，可能會把錯誤或缺口帶入後續工作。故「先完成第一階段驗收、文件更新與經驗學習，再正式進入下一階段」是正解，因為先完成階段驗收、文件更新與經驗學習，可以確保第二階段建立在可靠基礎上。"}, {"source": "PMSuccess35.pdf", "number": 10, "stem": "專案經理正在關閉一項供應鏈管理系統專案。交付成果已獲客戶接受，但營運部門表示尚未完全理解例外訂單處理、供應商資料異常與升級路徑。贊助人希望本週結案。專案經理應先完成哪些事項後再結案？（選兩項）", "options": ["釋放專案核心成員。", "確保客戶能自行承擔營運風險。", "只提交最終績效報告。", "完成知識移轉與演練。", "確認營運團隊接手準備。", "將所有問題移至未來專案。"], "answers": [3, 4], "explanation": "* 專案結束不只是交付標的被接受，還需確認接收組織具備接手能力。若營運團隊無法處理例外與升級流程，知識移轉尚未完成，就不宜急著正式關閉。所以專案經理應先完成以下兩項：- 確認營運團隊接手準備。營運部門既然還不理解例外訂單處理、供應商資料異常與升級路徑，就表示移交尚未真正完成。結案前要先確認接手能力、支援安排與營運準備度。- 完成知識移轉與演練。這類例外處理與升級路徑通常不能只靠文件，還需要實際講解與情境演練，確保營運團隊能獨立處理。* 其餘選項不適合優先作為結案前提，尤其是先釋放核心成員或只交最終報告，都會增加移交失敗風險。"}, {"source": "PMSuccess36.pdf", "number": 1, "stem": "專案經理已經完成一個組織變革專案的驗收事宜，現在開始結束專案。此時專案贊助者通知專案經理，專案資訊是屬於機密度高，且需要保密的文件，所以，請將所有的專案文件直接交給他們，不需要上傳到經驗學習知識庫中。專案經理下一步該做什麼？", "options": ["將贊助者的需求提供給專案稽核人員審核。", "將資訊都交給贊助者，並刪除經驗學習登錄表上的資訊。", "依據原始計畫書中的規劃來發布資訊。", "建立機密資訊上傳系統，並加密處理。"], "answers": [2], "explanation": "題目情境顯示專案已經進入結案，所以，專案資訊中，哪些是屬於機密文件，哪些不是，都應該在規劃溝通管理時就已經設定與規劃完成，所以，結案時只需要依據當初所規劃的過程來處理機密性資訊即可。"}, {"source": "PMSuccess36.pdf", "number": 2, "stem": "專案的可交付成果面臨到無法如期完成的問題，預計需要延後10天才能交件，而且專案團隊已經評估過，所有的措施皆無法挽回這窘境，但是客戶仍要求必須如期完成可交付成果。專案經理該如何處理?", "options": ["重新分配資源", "提出變更申請", "結束專案，並移轉已經完成的可交付成果", "參考風險登錄表\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [2], "explanation": "可先刪除「提出變更申請」和「重新分配資源」，因為題目題到：「所有的措施皆無法挽回這窘境」，所以，若是因為專案遇到問題而無法如期完成專案時，是可以往結束與中止專案方向去做考量。"}, {"source": "PMSuccess36.pdf", "number": 3, "stem": "你的專案中有三位成員同時參與多個專案的開發，所以，最近一個月時常加班。今天你的團隊被告知專案將被中途結束，這三位成員聽到後其實有點高興，因為不用再加班了。身為專案經理的你首先應該做什麼？", "options": ["結束尚待解決的求償。", "找團隊開會，並辨識與更新經驗學習。", "確認獲准的變更申請都已經被完成。", "釋放資源，讓成員可以去進行其他專案。"], "answers": [1], "explanation": "若是專案在完成前被中途結束，專案經理還是需要進行結束專案或階段過程，除了調查與記錄專案中止的原因外，還需與專案團隊會議，以辨識與更新經驗學習，以供組織未來使用。另外，你可以A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n忽略選項「結束尚待解決的求償」，因為題目中並無提到任何採購事項。"}, {"source": "PMSuccess36.pdf", "number": 4, "stem": "某醫院病患入口網站已完成部署，主要使用單位在展示會中表示「功能大致符合需求」。贊助人希望本週宣布專案完成，並將團隊轉派至另一項高優先專案。然而，法規遵循主管尚未簽署正式驗收文件，營運單位也尚未完成異常處理演練。專案經理接下來應該怎麼做？", "options": ["依收尾準則確認法規遵循簽署與營運演練完成狀態，取得必要接受與移轉確認後，再建議關閉專案。", "請產品負責人彙整展示會回饋，代表使用單位與法規遵循主管確認成果可接受。", "在主要使用單位已口頭接受的基礎上，先釋放大部分團隊資源，保留少數成員支援後續簽核。", "召開收尾檢視會議，將法規遵循簽署與營運演練列為結案後交辦事項，並請贊助人核准先行宣布完成。"], "answers": [0], "explanation": "口頭滿意不等於正式驗收。題目中仍有法規遵循簽署與營運演練未完成，代表正式關閉條件尚未滿足。PM 應先確認接受、合規與營運移轉，而不是因贊助人壓力提前宣布完成。故選項「依收尾準則確認法規遵循簽署與營運演練完成狀態，取得必要接受與移轉確認後，再建議關閉專案」是正解。"}, {"source": "PMSuccess36.pdf", "number": 5, "stem": "一項採預測型方法執行的客戶專案，原定於 7 個月內完成，目前已進入第 6 個月。客戶正式通知，因預算被臨時凍結，無法支付最後一期款項。專案經理檢視現金流、完工尚需成本與合約條款後，確認繼續工作將產生無法回收的費用；專案贊助人也表示組織不會提供替代資金。專案經理接下來應採取哪一項行動？", "options": ["申請提前結束專案。", "重新商議最後一期付款。", "提交成本與時程變更。", "暫停工作並保留資源。"], "answers": [0], "explanation": "題目有幾個關鍵條件：客戶正式確認無法支付款項。、繼續執行將產生不可回收的財務損失、組織不提供替代資金，以及專案已失去完成所需的財務支持。因此，專案經理應依治理與合約程序，向有權限的贊助人或治理單位申請提前終止專案，並在獲準後結束專案。PMP情境中，專案經理通常不應自行宣布終止，而是提出評估結果並依治理程序處理。"}, {"source": "PMSuccess36.pdf", "number": 6, "stem": "你正在管理一項醫療院所的病患入口網站升級專案。專案採混合式方法，核心資安與法遵功能採預測式階段交付，使用者介面改善則採迭代方式完成。 目前最後一個階段已完成系統部署演練，多數使用單位在展示會中表示滿意。贊助人希望本週宣布階段完成，讓團隊轉入下一個高優先專案。然而，專案經理檢查收尾清單後發現： • 法務主管尚未簽署正式驗收紀錄； • 營運團隊尚未完成異常處理演練； • 外部資安廠商仍有一筆尾款與交付紀錄待核對； • 產品負責人希望將兩項低優先改善任務放入後續待辦清單。 專案經理接下來最適合怎麼做？", "options": ["等所有營運效益實現後再啟動階段收尾。", "確認", "先完成經驗教訓會議，再請法遵補簽。", "將未完成事項列入待辦清單後關閉階段。", "依贊助人要求宣布階段完成並釋放團隊。", "請產品負責人接受增量並結束此階段。"], "answers": [1], "explanation": "正解是「確認正式驗收、移轉與合約收尾條件」。此題的陷阱是「展示會滿意」與「贊助人希望結束」不等於可以正式關閉階段。專案經理在結束專案或階段前，應確認交付成果已由授權方正式驗收，接收單位已具備移轉準備，並完成相關採購、財務與行政收尾。教材中對收尾活動包含交付成果被客戶接受、移轉交付成果、更新組織過程資產、準備最終報告、結束法律／合約／財務義務、歸檔專案資訊與釋放資源等。"}, {"source": "PMSuccess36.pdf", "number": 7, "stem": "某企業 CRM 導入專案即將結束。系統已通過使用者驗收，但尚有供應商尾款待核對，部分文件仍未歸檔。贊助人要求儘快關閉專案。專案經理應該怎麼做？（選兩項）", "options": ["先釋放大部分團隊，將剩餘文件整理工作交由 PMO 在專案關閉後完成。", "取消經驗學習活動，避免團隊在收尾階段投入過多行政工作。", "完成必要文件歸檔與知識移交，確保組織能查閱", "在驗收已完成的基礎上，確認供應商合約義務、尾款與交付文件是否已結清。", "以使用者驗收結果取代所有採購與行政收尾活動。", "將尾款核對事項轉給營運單位，因為系統已通過使用者驗收。"], "answers": [2, 3], "explanation": "使用者驗收完成，只代表交付成果已被接受，但不代表專案所有收尾活動都完成。正式收尾還包含採購收尾、合約結清、付款核對、文件歸檔、經驗學習、知識移交與最終報告。 故正解是「在驗收已完成的基礎上，確認供應商合約義務、尾款與交付文件是否已結清」和「完成必要文件歸檔與知識移交，確保組織能查閱正式專案紀錄」。"}, {"source": "PMSuccess36.pdf", "number": 8, "stem": "你是DataPulse專案的專案經理，該專案已依合約要求完成交付並進入結案流程。在專案結束後，客戶以電子郵件通知團隊，表示他們希望協助排除幾項技術問題，並要求進行一些細部調整與新增兩個小功能。你應該如何處理這項請求？", "options": ["請客戶依照變更控制程序，提交正式的變更申請，以啟動評估流程。", "將客戶的請求轉交給維運或服務管理部門，確認是否符合服務範圍並由其處理。", "立即召開團隊會議，安排人力重新支援客戶所需的修正與新增功能。", "評估客戶請求的可行性與影響後，提出變更申請以重啟專案範疇。"], "answers": [1], "explanation": "*「將客戶的請求轉交給維運或服務管理部門，確認是否符合服務範圍並由其處理」最符合PMI 強調的階段移轉、合約責任界線與運營交接原則。* 專案結案時，不應重新安排團隊資源。也不適合進行變更控制程序。"}, {"source": "PMSuccess36.pdf", "number": 9, "stem": "客戶已經驗收專案產品。當專案進行結案作業時，客戶突然表示要增加一項產品功能，此功能不會增加太多成本或花太多時間。你應該怎麼做？", "options": ["提出增加產品功能的變更申請，經評估且批准後再執行。", "繼續進行專案結案，請客戶另行啟動新契約來增加產品功能。", "由於對專案時程與成本的影響很小，直接依照客戶的要求增加產品功能。", "發生了未辨識的風險，故動用管理儲備來處理。"], "answers": [1], "explanation": "客戶已經驗收產品，且進行專案結案了，這表示專案的範疇已完成，若要增加新的產品功能，則應該另行啟動新契約，成立另一個專案來進行，而非提出變更申請，注意結束過程組中的過程是不會產出變更申請的。"}, {"source": "PMSuccess36.pdf", "number": 10, "stem": "一項混合式企業系統專案的交付標的已獲正式驗收，專案即將進入行政結束。專案期間曾發生多次成本與時程偏差，團隊也採取趕工、重新排序工作及供應商改善措施，使專案最終達成主要目標。贊助人要求專案經理在結案前說明：偏差為何發生、採取了哪些矯正措施、措施是否有效，以及未來類似專案應如何改善。專案經理應採取哪些行動？（選兩項）", "options": ["追溯變更與績效紀錄。", "核對缺陷修復與驗收結果。", "再次檢視與分析已核准變更。", "向全體利害關係人發布績效報告。", "以滿意度調查確認矯正成效。", "更新經驗學習登錄表。"], "answers": [0, 5], "explanation": "專案經理應檢視變更紀錄、績效報告及相關專案文件，以確認：發生了哪些偏差、哪些矯正措施曾被提出與核准、實際執行結果如何，以及對成本、時程、品質及效益造成何種影響。 變更紀錄可顯示專案期間提出的變更及其狀態，而結束專案時也應分析變異與趨勢，作為最終報告及經驗學習的依據。此外，分析結果應記錄在經驗學習登錄表中，包括情境、影響、建議與未來行動，並在專案結束時移轉至組織的經驗學習知識庫，以支援後續專案。故正解是「追溯變更與績效紀錄」和「更新經驗學習登錄表」。"}, {"source": "PMSuccess37.pdf", "number": 1, "stem": "請參照以下的專案特徵： - 專案正在啟動階段 - 由於缺乏資金，該專案被終止了 - 專案經理必須結束專案 專案經理應該採取的第一個行動是？", "options": ["結束所有的專案採購過程。", "檢查組織的專案結束之指導方針。", "藉由執行風險分析，以確認終止專案的潛在影響。", "依照溝通管理計畫書以正確地通知所有利害關係人。"], "answers": [1], "explanation": "專案結束的指導方針或各項需求將包含須遵循的組織程序。"}, {"source": "PMSuccess37.pdf", "number": 2, "stem": "專案經理帶領的系統開發專案獲得利害關係人極高的讚賞與滿意度，明天將進入結束階段,，組織高層希望專案經理可以繼續為組織帶領下一個重要的專案。專案經理應先完成哪件事?", "options": ["進行需要評量與可行性評估", "最終處置未決的求償", "製作新專案的章程", "將專案的所有計畫書與文件歸檔，以供組織未來使用"], "answers": [3], "explanation": "單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。\n此試題提到「希望專案經理可以繼續為組織帶領下一個重要的專案」，且並無提到採購事宜，故可以知道此專案是內部專案，故可以先忽略「最終處置未決的求償」。另外，其餘選項中，只有「將專案的所有計畫書與文件歸檔，以供組織未來使用」是結束專案時需要進行的行政活動。"}, {"source": "PMSuccess37.pdf", "number": 3, "stem": "專案已經進入結束階段，專案團隊大多給予負面評價，且有多位利害關係人表示以後不想再合作。組織高層要求此專案進行經驗學習，專案經理最好先怎麼做？", "options": ["使用議題紀錄，並向上級呈報正面及負面的經驗學習紀錄。", "依據溝通管理計畫書向上級呈報正面的經驗學習紀錄。", "彙整專案各個階段的議題紀錄與變更紀錄。", "發出信件請所有利害關係人回饋專案各個階段的經驗學習紀錄。"], "answers": [3], "explanation": "* 題目最後詢問的是：組織高層要求此專案「進行經驗學習」，PM要如何做？而且此題提到「多位利害關係人表示未來不想再合作」。* 這代表專案經理不能只從內部文件或議題紀錄分析，而應主動向所有相關利害關係人蒐集回饋，了解他們在各階段的實際感受、問題、期望落差與改善建議。才能完整進行經驗學習。* 選項「使用議題紀錄，並向上級呈報正面及負面的經驗學習紀錄」方向部分正確，但太快進入呈報。應先蒐集內外部完整的回饋後，再彙整分析後呈報。* 原則上，無論是正面的，還是負面的經驗學習紀錄，都需要記錄下來，以供組織或專案未來的使A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n用。但是在文件化經驗學習紀錄之前，專案經理需要先蒐集相關資料，故選項「發出信件請所有利害關係人回饋專案各個階段的經驗學習紀錄」為最佳解。"}, {"source": "PMSuccess37.pdf", "number": 4, "stem": "專案團隊已經完成與移轉交付標的，正在撰寫結案報告。此時，主要利害關係人提出一項新功能需求，聲稱這對業務非常關鍵，並希望你設法納入本次專案。你該如何處理這項突如其來的請求？", "options": ["拒絕變更請求，並提醒所有利害關係人已簽署驗收與範疇確認文件。", "邀請利害關係人重新召開Kick-off會議，以展開第二階段專案。", "說明專案已進入結束階段，並建議將此需求轉交給產品或營運團隊另行處理。", "評估變更對時程與資源的影響，必要時延後結案以納入此變更。", "直接納入交付內容，避免破壞與利害關係人的信任關係。"], "answers": [2], "explanation": "*「說明專案已進入結束階段，並建議將此需求轉交給產品或營運團隊另行處理」是最妥當的做法，既尊重流程，也為客戶提供解決方向。若專案已完成交付並進入結案階段，通常不應再納入新需求，應交由業務、產品或運維團隊處理。* 其他選項是錯誤的，因為：- 「直接納入交付內容，避免破壞信任關係」雖出於善意，但未經審核與控制就納入變更，違反專案邊界與控制原則。-「拒絕變更請求」雖然合理，但過於強硬，可能造成關係惡化。應給予客戶下一步建議或轉交路徑，而不是僅止於拒絕。-「邀請利害關係人重新召開 Kick-off 會議」並不合適，因為未經正式立案與批准，不能貿然「重啟」專案。-「評估影響，必要時延後結案」也不合適，因為專案已進入結束階段，延後結案屬於重大決策，應先有高層核准或變更控制流程，不可由專案團隊自行決定。"}, {"source": "PMSuccess37.pdf", "number": 5, "stem": "客戶已經驗收產品，而且專案也在預算和時程內完成了，但是專案經理發現有部分的利害關係人對專案不甚滿意。專案經理下一步應該做什麼？", "options": ["執行專案稽核，以確保利害關係人對於專案是滿意的。", "製作專案的結案報告，好向利害關係人明確表達專案的成本和時程績效。", "取得所有利害關係人對於專案的回饋意見，好評估他們對於專案的滿意程度。", "進行完整的專案文件審查，以彙整經驗學習。"], "answers": [2], "explanation": "專案經理有一項重要的責任是：依據利害關係人參與計畫書，挑選適合的工具或技術來取得相關利害關係人對於專案的回饋，好評估他們對於專案的滿意度。"}, {"source": "PMSuccess37.pdf", "number": 6, "stem": "我們何時可以說Sprint已經完成了？", "options": ["當時間盒結束時", "當工作被完成後", "當產品達到\b完成的定義(DoD)時", "當增量被驗收後", "當團隊完成產品增量時"], "answers": [0], "explanation": "所有Scrum事件都是時間盒事件，因此每個事件都有其最長的持續時間。Sprint一旦開始，其持續時間是固定的，不能縮短或延長。"}, {"source": "PMSuccess37.pdf", "number": 7, "stem": "某醫院病患入口網站專案已完成部署，主要使用單位在展示會中表示「功能大致符合需求」。贊助人希望本週宣布專案完成，並將團隊轉派至另一項高優先專案。然而，法規遵循主管尚未簽署正式驗收文件，營運單位也尚未完成異常處理演練。專案經理接下來應該怎麼做？", "options": ["在主要使用單位已口頭接受的基礎上，先釋放大部分團隊資源，保留少數成員支援法規簽署與營運演練。", "召開收尾檢視會議，將法規遵循簽署與營運演練列為結案後交辦事項，並請贊助人核准先行宣布專案完成。", "請產品負責人彙整展示會回饋與剩餘未結事項，代表使用單位確認成果可接受，再安排法規遵循主管後續補簽。", "將法規簽署與營運演練納入營運移轉清單，移交給營運單位持續追蹤，專案團隊則依贊助人要求進入關閉程序。", "依收尾準則確認法規遵循簽署與營運演練完成狀態，取得必要接受與移轉確認後，再建議關閉專案。"], "answers": [4], "explanation": "正解是「依收尾準則確認法規遵循簽署與營運演練完成狀態，取得必要接受與移轉確認後，再建議關閉專案」。正式結束前，不能用口頭滿意、贊助人壓力或移交清單取代必要的正式驗收與營運接手能力確認。"}, {"source": "PMSuccess37.pdf", "number": 8, "stem": "某系統專案依照已獲准的範疇交付產出。最終驗收時，客戶拒絕簽署，理由是希望新增一項高階報表。該報表未出現在需求文件、範疇基準或獲准的變更中。業務主管擔心若不接受，會影響後續合作。專案經理應該怎麼做？", "options": ["請贊助人與客戶協商，並獲得簽署，因團隊已完成所有獲准的範疇。", "先結束專案，再將高階報表列為維護期間的客戶增強需求。", "依驗收準則與範疇基準釐清差異，判斷該報表是否屬於新增需求，並依變更流程處理。", "建議加入高階報表，以維持客戶關係並取得正式驗收。"], "answers": [2], "explanation": "正解是「依驗收準則與範疇基準釐清差異，判斷該報表是否屬於新增需求，並依變更流程處理」。驗收爭議要回到正式依據：核准範疇、需求文件與驗收準則。若是原需求未達成，要修正；若是新增期待，要走變更或後續版本。不能直接加入，也不能忽略拒簽。"}, {"source": "PMSuccess37.pdf", "number": 9, "stem": "某軟體專案已通過主要驗收測試，但仍有四項低優先缺陷。客戶表示可接受上線，但要求將缺陷轉入保固期處理。供應商認為既然客戶同意上線，專案可以直接關閉。專案經理應如何處理？", "options": ["將缺陷移出正式缺陷清單，改由供應商與客戶私下追蹤。", "關閉專案，因為客戶已明確同意上線且缺陷優先度低。", "取得", "拒絕上線與關閉專案，直到所有低優先缺陷都被完全修正。"], "answers": [2], "explanation": "有條件接受可以成立，但必須正式記錄未結事項與後續責任。不能因缺陷低優先就不追蹤，也不能無限期阻止關閉。關鍵是「正式接受＋未結事項管理」。故正解是「取得正式有條件接受，記錄未結缺陷與處理期限」。"}, {"source": "PMSuccess37.pdf", "number": 10, "stem": "專案進行到第6個月，上週使用了快速跟進法讓專案趕上了進度，專案團隊都很高興。今天組織高層決定終止專案，專案經理應該怎麼做？", "options": ["記錄終止的原因。", "和利害關係人討論出可以繼續進行專案的策略。", "將此事記錄進議題紀錄。", "向專案贊助人報告此事。"], "answers": [0], "explanation": "若是專案在完成前被中止的話，專案經理還是需要記錄和調查中止的原因，並記錄進專案或階段結束文件中，並彙整進組織過程資產內，以供未來專案參考與使用。"}, {"source": "PMSuccess38.pdf", "number": 1, "stem": "季度結算結果顯示競爭對手們正在壓低價格。公司正失去市場佔有率，而且產品開發專案正進行到一半，目前顯示贊助單位似乎不太可能取回投資回報。專案經理應該如何使專案適應這些新條件？（選兩項）", "options": ["重新調整專案範疇，以提供與競爭對手相同的功能，並匹配他們的定價。", "快速跟進專案的其餘部分，以更少的間接成本交付預期的範圍。", "拆分敏捷路徑，以便在固定預算內逐步地將價值最大化。", "逐漸以可以接受一半或更少的工時報酬的外部專家工作人員取代當地的工作人員。", "對可交付成果進行成本/收益分析，以優化交付成本和速度。"], "answers": [2, 4], "explanation": "正確答案是「對可交付成果進行成本/收益分析，以優化交付成本和速度」和「拆分敏捷路徑，以便在固定預算內逐步地將價值最大化」。成本/收益分析與固定預算式的增量開發是正確的，因為它們可以在不中斷業務的情況下解決盈利能力的損失。"}, {"source": "PMSuccess38.pdf", "number": 2, "stem": "下列哪一項是以員工本身的想法為基礎，並藉由許多小幅度的變更而達到的持續改善方法？", "options": ["經驗學習登錄表", "全面品質管理", "規劃、執行、研究、行動 (PDCA)", "改善法 (\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [3], "explanation": "改善(Kaizen)法是由日本所提倡的一種持續改善方法，其主要特徵包含：以許多的微小變更為基礎、比起重大的變更，小幅變更較不需要支出大量的資金、改善想法皆來自員工或成員...等。"}, {"source": "PMSuccess38.pdf", "number": 3, "stem": "隨著一項組織變革開始推行，幾個團隊雖然收到相同的變更公告，但對這項變更如何影響其角色、決策權限與日常工作責任有不同解讀。部分團隊已依自己的理解調整工作方式，造成行為不一致、交接延誤與績效下降。贊助人要求專案經理提高變革執行的清晰度與一致性。專案經理應該做哪兩項？（選兩項）", "options": ["僅重申高層次的變革願景與商業理由，避免過早干預各團隊的執行方式。", "暫緩進一步說明，直到各團隊在實際執行中自然形成穩定的新工作模式。", "以一致且具體的方式溝通變更後的行為期望、交接方式與成功準則。", "與受影響團隊共同釐清變更對角色、責任、決策權限與日常工作流程的具體影響。 ( (您的選項)", "將角色混淆與績效下降問題提交治理單位，由治理單位統一發布後續指示。", "要求各團隊依據當地作業情境自行解讀變更，以提高採納彈性並降低阻力。"], "answers": [2, 3], "explanation": "A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n正解是「與受影響團隊共同釐清變更對角色、責任、決策權限與日常工作流程的具體影響」和「以一致且具體的方式溝通變更後的行為期望、交接方式與成功準則」。這是因為：題目指出問題來自團隊對角色、決策權限與日常責任的不同解讀，因此專案經理應先釐清變更對實際工作方式的影響，而不是只停留在變革口號或公告層次。此外，想改善清晰度，不能只說明變更目標，還要清楚傳達行為期望、交接方式與成功準則，讓不同團隊能以一致方式執行。"}, {"source": "PMSuccess38.pdf", "number": 4, "stem": "專案團隊在遠端工作，由於供應鏈嚴重中斷，營運能力受到了威脅。此風險已經列在風險登錄表中，但並未說明中斷的嚴重性，因此對於回應策略的指導方針是很少的。團隊首先應該做什麼？", "options": ["專注於保持團隊的一致性。", "就此事尋求專家判斷，並修改風險回應策略。", "將此事升級到可提供協助的組織資源上。", "取消專案。"], "answers": [1], "explanation": "外部的企業環境因素（EEF）常常會讓我們措手不及，並構成嚴重威脅，即使經過周密的計劃也是如此。在這種情況下，團隊應該依靠專家判斷，在困難的情況下找出如何盡可能繼續工作的方法。"}, {"source": "PMSuccess38.pdf", "number": 5, "stem": "針對一個需積極上市的專案，專案經理轉換成混合式方法。專案經理需要修改利害關係人參與計畫書，讓它遵循敏捷原則。專案經理應該採取什麼行動？", "options": ["增加利害關係人溝通管道的數量。", "增加正式的培訓研討會的數量，以涵蓋包括專案贊助者與客戶等所有利害關係人的所有相關問題。", "更新利害關係人參與策略。", "為所有的關鍵利害關係人強制地召開站立會議。"], "answers": [2], "explanation": "在這種情況下，利害關係人該如何參與這一塊需要修訂。所有其他答案都會讓專案變得復雜。敏捷包括利害關係人與團隊成員直接聯繫彼此以改善溝通、重視透明度並去除不必要的層級或形式的能力。"}, {"source": "PMSuccess38.pdf", "number": 6, "stem": "專案執行一半，幾項週期性問題在多次回顧會議中都被提出，團隊也已將相關經驗教訓記錄在知識庫中。然而，類似問題仍在後續工作中反覆發生，顯示團隊並未一致地將改善建議轉化為日常做法。贊助人詢問專案經理將如何使持續改進真正改善成果。專案經理應該怎麼做？", "options": ["將重複出現問題所對應的經驗教訓轉化為目前工作流程、團隊工作協議或完成定義中的具體做法，並追蹤其採用情況。", "將重複問題與經驗教訓採納不足的情況提交治理單位，以便由組織層級要求團隊遵循一致的改善措施。", "持續更新經驗教訓登錄表，指定負責人維護知識庫，並確保這些資訊可供後續階段與未來專案參考。", "讓各工作團隊依其工作情境，從已記錄的經驗教訓中選擇最適用的改善項目，並在下一次回顧會議中分享採用結果。"], "answers": [0], "explanation": "* 選項「將重複出現問題所對應的經驗教訓轉化為目前工作流程、團隊工作協議、檢查清單或完成定義中的具體做法，並追蹤其採用情況」是最佳解。題目指出問題不是「沒有回顧」或「沒有記錄」，而是經驗教訓沒有被一致地應用到當前工作。因此專案經理應把經驗教訓轉化為具體、可執行、可追蹤的工作實務，例如更新工作流程、檢查清單、團隊協議或完成定義。* 其他選項是錯誤的，因為：- 選項「讓各團隊自行選擇」可能導致改善不一致，無法解決週期性問題反覆發生的根本原因。- 選項「持續更新經驗教訓登錄表，指定負責人維護知識庫」看似符合知識管理，但仍偏向記錄與保存，沒有讓目前專案立即受益。- 選項「將重複問題與經驗教訓採納不足的情況提交治理單位」看似能提高重視程度，但太早升級。專案經理應先把經驗教訓嵌入目前工作方式；若仍無法落實，再考慮升級。"}, {"source": "PMSuccess38.pdf", "number": 7, "stem": "某專案團隊發現每日缺陷分類會議能顯著減少重複缺陷。此做法已在三個相似專案中證明有效。PMO 正在考慮是否將其改成建議的做法。PMO 應採取哪兩些行動？（選兩項）", "options": ["說明適用情境與使用門檻。", "先將此做法限制在原專案團隊。", "要求所有專案採用。", "先暫停其他缺陷管理方式。", "更新流程指引與範本。", "建立成效衡量與回饋機制。"], "answers": [0, 4], "explanation": "正解是「更新流程指引與範本」和「說明適用情境與使用門檻」。 這題的關鍵是：這個做法已在三個相似專案中證明有效，因此 PMO 可以將它轉化為組織層級的建議做法，但不能僵化成所有專案都必須採用。因此，PMO 應該把這項經驗制度化，例如：更新流程指引、範本、缺陷分類會議建議做法，同時說明它適用於哪些專案情境，例如缺陷重複率高、跨團隊品質問題多、缺陷來源不明等。"}, {"source": "PMSuccess38.pdf", "number": 8, "stem": "你帶領一個敏捷專案，此專案的成員都希望可以藉由快速交付價值來取得客戶的信任。你發現專案中有個資源，他曾經與專案贊助人一起完成過一些專案，而他現在好像想動用他自己的個人影響力來與專案贊助人合作，以期專案的效益實現可以提升。身為專案經理的你應該在哪個階段處理此議題，以優化專案的效益？", "options": ["在下一個規劃會議上", "在第一個效益被實現之後", "在接下來的回顧會議上", "在下一個資源績效評估會議上"], "answers": [2], "explanation": "敏捷團隊可藉由回顧會議辨識潛在議題，以及找出潛在的解決方案，以改進團隊整體績效。即然專案現在出現了議題，那就可藉由此儀式來討論出解決方案。"}, {"source": "PMSuccess38.pdf", "number": 9, "stem": "六個月前，Tim協助專案團隊找出一個棘手問題的根本原因，而且Tim也清楚說明了應該如何解決，與何時應該怎麼做。但是，現在問題又重新浮現出來了。Tim可能疏忽了下列何事？", "options": ["確認該決策是否已解決了問題", "找出解決問題的方法", "執行決策", "向利害關係人回報此事", "記錄此問題"], "answers": [0], "explanation": "解決問題的步驟是：找出發生問題的根本原因、分析此問題與原因、找出解決問題的方法、執行決策、確認該決策是否已解決了問題。所以，此專案經理應該是忘記確認該決策是否已解決了問題。"}, {"source": "PMSuccess38.pdf", "number": 10, "stem": "專案經理帶領的一項提昇市佔率的專案啟動會議之後，就一直不斷地發生需求變更，此專案的範圍影響到業務、運務、行銷、資訊等部門。此專案每週會進行一次專案會議，但會議中經常只有兩個部門出席；而每次會議結論也常常於會後又發生更改或推翻；專案的時程也不斷地延後。專案經理將如何改善這個情況？", "options": ["請總經理出面，領導各部門人員確定真正的方向。", "先與這兩個部門的經理好好的訪談需求，因為他們是重要的利害關係人。", "因為需求本來就會不斷地變更，可透過敏捷手法調適性地修正即可。", "透過創新遊戲與團隊一起找出專案真"], "answers": [3], "explanation": "情境中，專案的需求仍未獲得各部門的共識，而主要的發言者不一定能代表其它部門的意見，因為常會發生有結論後又推翻結果的問題，所以，可以使用創新遊戲幫助團隊一起找出共識。創新遊戲促進研習會的一種， 也稱為協作遊戲(Collaborative game), 它可用來協助利害關係人釐清複雜或是模糊的問題，以利達成共識。"}, {"source": "PMSuccess39.pdf", "number": 1, "stem": "你正協同專案發起人一起檢驗交付標的，專案發起人發現其中一項交付標的有瑕疵，並感到不滿意。請問，你的專案團隊應該如何應對？", "options": ["查看風險登錄表", "提出預防措施", "提出矯正措施", "提出缺失修"], "answers": [3], "explanation": "缺失修正指的是：針對專案組件所識別出來的瑕疵，提出修復或全部更換建議的正式書面紀錄。故，此時專案團隊應該提出：缺失修正。"}, {"source": "PMSuccess39.pdf", "number": 2, "stem": "某個不是專案關鍵利害關係人的公司高層直接向專案團隊持續提出意見。此舉讓重要利害關係人變得惱火，認為高層進行了干涉，且造成不必要的噪音，但專案團隊發現高層的意見很有幫助。團隊首先應該做什麼？", "options": ["採用Speed B Leas所提出的衝突管理技術。", "請product owner介入此衝突。", "將這位高層作為關鍵利害關係人，並添加到團隊中。", "討論在下一個回顧會議中應該進行什麼事。 (\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [3], "explanation": "這裡發生了很多可能對專案有利，但也可能有害的事情——現有的利害關係人可能會感到受到威脅，或者範疇也可能會因為利害關係人對於高層的投入所而發生變化。團隊需要決定做什麼，但在採取行動之前要有明確的共識及專家判斷。回顧會議上可以獲得團隊改進的見解。雖然其他選項也可能會發生，但首先要做的是與團隊討論。如果團隊同意進一步參與是可取的，那麼團隊可以繼續對利害關係人進行重新分類，以及進行任何由此產生的衝突管理。"}, {"source": "PMSuccess39.pdf", "number": 3, "stem": "一個軟體工程專案採用敏捷手法進行開發。最近幾個迭代中，團隊雖然都能完成大部分承諾的工作，但仍反覆出現需求澄清延遲、測試環境準備不足，以及缺陷修復回流時間過長等問題。專案經理希望團隊能定期檢視目前的工作方式、找出流程中的根本原因，並提出可在後續迭代中執行的改善行動。專案經理最應該採取哪一項做法？", "options": ["要求團隊成員記錄每次缺陷修復與需求澄清的經驗教訓，並安排跨團隊知識分享會。", "彙整目前專案中發現的流程問題，更新組織過程資產，並制定標準化範本供後續專案使用。", "依據組織的知識管理規範，要求團隊定期更新經驗教訓登錄表，並將改善建議提交給 PMO。", "邀請產品負責人與主要利害關係人參與迭代審查會議，以確認交付成果是否符合驗收條件。", "在每個迭代結束後，促進團隊舉行回顧會議，檢視工作流程、協作方式與障礙，並決定可執行的改善項目。"], "answers": [4], "explanation": "正解是「在每個迭代結束後，促進團隊舉行回顧會議，檢視工作流程、協作方式與障礙，並決定可執行的改善項目」，因為題目情境提到：此專案採用敏捷手法、需定期檢視工作方式與流程，並需找出可執行的改善行動。這些需要都指向敏捷中的回顧會議。"}, {"source": "PMSuccess39.pdf", "number": 4, "stem": "組織有一項採用預測式專案管理方法的專案，已進行六個月，但成本超支且進度落後，利害關係人時常抱怨，團隊士氣也很低落。贊助人指示專案經理將此專案轉換為敏捷式方法。專案經理該如何開始？", "options": ["與贊助人討論修訂專案章程。", "告訴利害關係人敏捷方法的好處。", "引導團隊制訂團隊章程並充分授權團隊進行工作。", "向利害關係人介紹敏捷的價值觀與原則。"], "answers": [3], "explanation": "當專案想從預測式方法轉換成敏捷式方式時，專案經理需要向利害關係人灌輸四項敏捷宣言、12項原則與五個價值觀，如此這般，團隊才能先了解敏捷的精神為何，而後也可以向利害關係人灌輸敏捷實務，並引導他們實際運用敏捷方法。另外，如果先「告訴利害關係人敏捷方法的好處」，而後才「向利害關係人介紹敏捷的價值觀與原則」，那利害關係人會難以理解敏捷的好處。選項「與贊助人討論修訂專案章程」可以忽略，因為專案開發方法是規範在專案管理計畫書中，而不是在專案章程中。"}, {"source": "PMSuccess39.pdf", "number": 5, "stem": "某公司導入新的績效儀表板。系統功能正常，但部門主管不願使用，因為他們擔心透明資訊會影響部門評比。員工也認為新系統只是高層用來監控績效。專案經理接下來應該怎麼做？", "options": ["要求所有主管引導員工使用系統。", "為抗拒者提供教育訓練。", "宣布系統已完成，並移交營運。", "分析抗拒原因，並調整變革溝通。", "請 IT 團隊增加更多報表功能。"], "answers": [3], "explanation": "正解是「分析抗拒原因，並調整變革溝通」。這題的關鍵是：系統功能正常，但主管與員工都因「透明資訊」產生疑慮。所以問題不是技術功能不足，而是抗拒變革、信任感不足與利害關係人認知落差。專案經理應先了解抗拒背後的原因，再調整變革溝通，例如：說明系統目的、資料使用方式、對各角色的影響，以及如何避免被誤解為單純監控工具。"}, {"source": "PMSuccess39.pdf", "number": 6, "stem": "團隊正在開發企業資源規劃 (ERP) 系統的人力資源 (HR) 模組。進行現場探訪時，客戶注意到團隊在資訊散熱器上的燃盡圖顯示了最近3週的進度。雖然團隊已完成三分之一的迭代，但實際進度明顯落後於預期進度。客戶表達了他們的擔憂。作為Scrum Master，你應該怎麼做？", "options": ["將進度落後的問題視為短期波動，建議客戶等到Sprint回顧會議時再做整體評估。", "個別與團隊成員面談，了解哪些人未達期望產出，並設定改善目標，以確保Sprint目標能如期達成。", "建議產品負責人在下一次每日站立會議中公開此議題，並要求團隊加快速度以追回進度。", "與產品負責人合作檢視產品待辦清單與目前進度，並召開一次以檢視進度落後原因為目標的討論會，鼓勵團隊共同提出改善策略並對客戶保持透明。", "請產品負責人從未完成的故事中挑出簡單項目，以便快速完成並拉高燃盡圖，降低客戶焦慮。"], "answers": [3], "explanation": "* Scrum Master與產品負責人（PO）是合作關係，應一起面對客戶的期待與需求。另外，Scrum Master應協助團隊找出進度落後的現況，並鼓勵團隊提出改進方法。* 其他選項是錯誤的，因為：- 每日站立會議是開發人員的會議，由他們主導，不應由PO主導。- 「請PO從未完成的故事中挑出簡單項目，以拉高燃盡圖」是操弄指標而非解決根本問題。- 「等到Sprint回顧會議時再做整體評估」這類延後處理、逃避對話，不僅無助於解決問題，也與Scrum提倡的「及早發現與回應問題」的原則相違。-「個別與團隊成員面談，了解哪些人未達期望產出」並不合適，因為Scrum強調「團隊共同承擔Sprint目標」，應透過集體討論改善方式，而非聚焦個人績效。"}, {"source": "PMSuccess39.pdf", "number": 7, "stem": "某零售公司準備導入 AI 排班系統。試點店長擔心排班權限被削弱，員工擔心工時安排不穩定，營運部門則要求三個月內全面上線。專案經理應先確認哪些事項？（選兩項）", "options": ["員工對新流程的支持程度。", "變革影響與採用阻力。", "取消人工排班的時間點。", "系統廠商的品牌知名度。", "受影響群體的準備度。", "立即擴展到所有門市的可行性。"], "answers": [1, 4], "explanation": "正解是「受影響群體的準備度」和「變革影響與採用阻力」。這題的關鍵是：店長擔心權限被削弱，員工擔心工時不穩定，營運部門又要求快速全面上線。這代表問題不只是系統導入，而是組織變革準備度與採用阻力。專案經理應先確認哪些群體會被影響、他們是否準備好接受變革，以及可能阻礙採用的因素。"}, {"source": "PMSuccess39.pdf", "number": 8, "stem": "專案已經完成了一半以上。專案經理注意到，團隊並沒有在每個sprint結束時進行回顧會議。相反的，他們在發布後才進行，每6個月進行一次。當專案經理在全體會議期間提出此問題時，團隊回應回顧會議是浪費時間，因為並無任何改變。在這種情況下，專案經理應該怎麼做？", "options": ["鼓勵團隊比一年兩次更頻繁地進行回顧會議，因為這是一個能討論哪些工作是有效的，以及哪些是無效的機會。", "向團隊解釋敏捷團隊需要回顧。", "同意團隊對於在每個sprint之後進行回顧會議幾乎沒有什麼好處的觀點。", "尊重自組織團隊的決定。"], "answers": [0], "explanation": "回顧會議的目的是在「反複試驗」的基礎上討論出他們體驗到的績效，並讓團隊納入持續改進。並非每個行動事項都會導致最佳的實踐或改進。但是，團隊必須繼續嘗試。作為領導人，專案經理的職責是鼓勵與強化好的實務。"}, {"source": "PMSuccess39.pdf", "number": 9, "stem": "某跨境支付平台專案正在開發中。近期市場出現新競爭者，監管機關也在此時宣布可能調整跨境交易審查規則。贊助人要求專案經理確保專案仍具商業可行性。專案經理應採取哪些行動？（選兩項）", "options": ["將可能之外部變化加入風險登錄表。", "暫時終止專案以避免風險。", "重新評估商業案例之假設。", "忽略競爭者，維持原範疇。", "等正式罰則公布後再處理。", "分析法規變化的專案影響。"], "answers": [2, 5], "explanation": "正解是「重新評估商業案例之假設」和「分析法規變化的專案影響」。 這題的關鍵是：新競爭者與可能的監管規則變化，會影響專案的商業可行性與原本的效益假設。因此，專案經理應先確認原本商業案例是否仍成立，例如市場需求、競爭優勢、收益假設、合規成本、上市時機與風險暴露是否改變。同時，也要分析法規變化對範疇、時程、成本、風險、合規要求與產品設計的影響。此外，選項「將可能之外部變化加入風險登錄表」雖然是有道理的後續行動，但不是最能回應「確保商業可行性」的兩個最佳答案。商業可行性需要先檢視商業案例假設與法規影響，再更新風險登錄表與應對策略。"}, {"source": "PMSuccess39.pdf", "number": 10, "stem": "某預測型金融系統專案已完成70%，範疇、時程與成本基準皆已核准。政府突然發布新法規，要求所有上線系統必須新增交易留存與稽核追蹤功能，且法規將在專案預定上線日前生效。該功能未包含在原需求文件中。贊助人要求團隊不可延後上線日期。專案經理下一步應該怎麼做？", "options": ["評估新法規對範疇、時程、成本、風險與合規的影響，並依流程處理。", "要求團隊加入新法規功能，以確保產品能符合政府要求。", "將新法規列入風險登錄表，待法規真正影響上線時再處理。", "告知贊助人此功能不在原範疇內，因此應維持原計畫上線。"], "answers": [0], "explanation": "* 正解是「評估新法規對範疇、時程、成本、風險與合規的影響，並依流程處理」。政府新法規已發布，且會在專案上線前生效，代表這不是單純的未來風險，而是會影響專案交付與產品合規的外部變更。由於新功能未在原需求文件與範疇基準中，且可能影響成本、時程與交付內容，專案經理不能直接執行，也不能忽略。正確作法是先進行整合影響分析，再依變更管理流程提出或處理變更請求。* 其他選項是錯誤的，因為：- 即使是法規要求，也不能未經變更流程就直接加入功能，否則會造成未受控變更。- 法規已經發布且會於上線日前生效，故新法規已是議題，應立即評估影響並處理。- 不能因為該法規要求不在原範疇內就拒絕，否則產品可能無法合法上線。"}, {"source": "PMSuccess40.pdf", "number": 1, "stem": "以下哪些是關於W. Edwards Deming持續改善過程的關鍵屬性?（選兩項）", "options": ["品質是透過預防而非檢驗來達成。", "改善工作場所和研究中心的產品測試。", "六標準差", "更好的產品設計以改善服務。", "超越客戶期望。"], "answers": [0, 3], "explanation": "* W. Edwards Deming是過程改善領域的初期領導者，他的品質理念中最知名的是：PDCA 循環（Plan-Do-Check-Act）、系統思維與流程優化、品質源自設計與預防、消除對檢驗的依賴，以及領導者應該創造穩定與學習的環境。故正解是:「更好的產品設計以改善服務」和「品質是透過預防而非檢驗來達成」。* 其他選項是錯誤的，因為：- Deming強調流程與系統的優化，而非加強產品測試。-「六標準差」是Motorola與GE提出的管理工具，不是Deming的原創觀念。-「超越客戶期望」屬於現今的品質觀念（如Kano模型），而非Deming的核心哲學。"}, {"source": "PMSuccess40.pdf", "number": 2, "stem": "你參與一個敏捷開發專案，團隊正專注於開發一款新型的電商應用程式。在最近一次的回顧會議籌備中，有位成員提到不知道是否需要安排產品負責人參與回顧會議。作為敏捷實踐者的你，應該怎麼回應？\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "options": ["產品負責人參與與否將由開發團隊投票決定。", "產品負責人是利害關係人之一，不需要出席回顧會議，此會議是開發團隊的內部會議。", "產品負責人必須出席回顧會議，負責引導會議進行，並確保每位團隊成員都有發言的機會。", "產品負責人是團隊的一份子，建議產品負責人出席回顧會議，共同參與檢討與改進過程。"], "answers": [3], "explanation": "* 回顧會議是用來反思過去Sprint的流程和改進空間，產品負責人的參與有助於從產品需求和優先等級的角度提供回饋，這對於團隊的整體改進至關重要。雖然敏捷框架中未強制規定產品負責人必須參與回顧會議，但建議參與，因為這有助於加強透明度、促進合作，並提升團隊對產品目標的對齊。* 產品負責人不是外部的利害關係人，而是專案團隊的一部分，需要與開發團隊和Scrum Master一起合作完成專案目標。將產品負責人排除在回顧會議之外，可能導致產品方向與團隊改進之間出現脫節。* 回顧會議的參與者是由整個敏捷團隊（含產品負責人）一起討論與規範的，不應該由開發團隊投票來決定是否讓產品負責人參與。* 產品負責人並非回顧會議的引導者。如有需要，這是Scrum Master的職責。Scrum Master 可以負責設計和引導會議流程，確保所有成員能有效參與討論並提出改進建議。"}, {"source": "PMSuccess40.pdf", "number": 3, "stem": "某建築公司剛完成一項歷時五年的大型公共工程專案。專案在回顧會議時發現，實際工期比原計畫延長 14 個月，主要原因包括設計審查反覆、供應商交付資料格式不一致，以及多次施工許可文件A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n退件。團隊也發現，這些問題在公司其他大型工程專案中曾反覆發生。為了協助組織改善未來專案的規劃與執行方式。專案經理應建議怎麼做？", "options": ["將所有偏差與問題記錄在本專案的經驗學習登錄表中，供未來專案團隊自行查閱，不需調整組織流程。", "分析原始規劃與實際結果的差異，辨識重複發生的流程問題，並將改善建議提交 PMO。", "使用專家判斷完成最終稽核，確認本專案是否符合所有法規要求，並將稽核結果歸檔。", "召開正式收尾會議，確認所有交付成果已被接受，且專案符合退場準則後即可關閉。", "進行肇因分析，找出造成本專案延誤的主要責任單位，並將結果提供給高階主管作為績效評估依據。"], "answers": [1], "explanation": "這題的核心不是單純「專案收尾」，而是：如何把一個專案的經驗轉化為組織層級的持續改善。因此，專案經理不應只完成最終報告或歸檔經驗學習，而應進一步：分析計畫與實際結果的差異；找出重複出現的流程性問題；整理可行改善建議；提交 PMO 或組織治理單位；更新範本、審查流程、檢查清單、許可文件準備指引、供應商資料交付標準等組織過程資產。"}, {"source": "PMSuccess40.pdf", "number": 4, "stem": "某公司導入新的知識分享平台，專案交付如期完成，但六個月後使用率仍低。訪談發現員工認為平台不是日常工作流程的一部分，主管也沒有使用或鼓勵團隊使用。專案經理在檢討時最應強調哪一項？", "options": ["增加平台功能即可解決採用問題。", "忘記為使用者提供教育訓練。", "平台已交付，因此專案完全成功。", "變革未嵌入日常工作與領導行為。", "營運主管沒有積極促使員工的後續使用。"], "answers": [3], "explanation": "正解是「變革未嵌入日常工作與領導行為」。這題的關鍵是：平台已交付，但員工沒有把它當成日常工作的一部分，主管也沒有示範或鼓勵使用。這代表問題不是單純「系統功能」或「訓練不足」，而是組織變革沒有真正落地。組織變革不只靠交付系統與訓練。若新行為沒有被納入流程、績效、主管示範與日常工作，採用率通常不會持續。此外，選項「忘記為使用者提供教育訓練」可能是原因之一，但題目明確指出主要問題是「不是日常流程的一部分」與「主管沒有使用或鼓勵」，所以變革嵌入不足更貼近正解。"}, {"source": "PMSuccess40.pdf", "number": 5, "stem": "某專案經理正在管理一項電動車充電站建置專案。部分站點已開始施工，部分充電設備也已完成採購。專案的商業案例假設可取得政府補助，得以抵銷一部分建置成本。 專案執行中，政府宣布新的補助規則將於三個月後生效，申請補助的充電設備必須支援新的通訊標準。若設備不符合新標準，專案仍可完成建置，但可能無法取得原先預期的補助。贊助人要求專案經理儘快提出建議。 專案經理第一步應該做什麼？", "options": ["要求供應商提出升級報價。", "提交變更請求，以更新設備標準。", "暫停現場施工直到規則生效。", "重新評估補助假設與專案影響。"], "answers": [3], "explanation": "這題的關鍵是：外部商業環境已經改變，而且可能影響專案的效益假設、成本、範疇、時程、風險與商業案例。此外，政府補助規則改變不代表專案一定要立刻換設備、停工或送變更。專案經理的第一步應該是評估影響，確認新規則會如何影響：原本的商業案例與效益假設；已採購設備是否符合新標準；未施工站點是否需要調整設計；成本、時程與補助資格；以及是否需要提出變更請求或替代方案。"}, {"source": "PMSuccess40.pdf", "number": 6, "stem": "專案經理正在負責一項敏捷專案，該專案被公司納入近期公告的稽核範圍內。稽核小組已排定下週首次會議，並指定這位專案經理出席。專案經理應該怎麼做才能為稽核做好準備？？", "options": ["審視專案相關資訊。", "在稽核期間提出豁免申請。", "要求開發團隊提供合規性資料。", "若有需要，為下一次迭代預留故事點。"], "answers": [0], "explanation": "* 當你收到稽核會議通知時，專案經理應全面審視目前專案的相關資訊與紀錄，以掌握專案範疇、時程、預算狀況、決策紀錄、變更歷程、利害關係人溝通等資訊。這些資訊將幫助你應對稽核小組的提問，並對自己目前專案狀況有完整了解，這是事前準備的關鍵行動。* 其他選項是錯誤的，因為：- 選項「若有需要，為下一次迭代預留故事點」是屬於迭代規劃層級的工作，與稽核準備無直接關聯。- 除非你已掌握稽核範圍，貿然要求開發團隊準備合規資料可能造成干擾。應先審查哪些資訊需要、哪些已有，再決定是否交辦。-「豁免」是指請求免除稽核要求，這只有在確定某些規範不適用時才可進行。在尚未了解稽核需求前就提出豁免是不當行為。"}, {"source": "PMSuccess40.pdf", "number": 7, "stem": "專案經理正帶領組織今年度最重視的專案。專案經理最近發現有位成員已經連續兩次延遲交付自身所負責的交付標的。專案經理首先應該怎麼做？", "options": ["與該成員進行一對一面談，了解他面臨的困難並共同尋找改善方案。", "評估該問題對專案目標的衝擊，並記錄成風險以作為後續管理依據。", "讓團隊在下次會議中檢討此狀況，並強調每個人都應負起責任。", "要求功能經理對該成員進行績效約談，並提出人力替補建議。", "將任務重新指派給其他團隊成員，以提升交付的成功率。"], "answers": [0], "explanation": "延遲發生兩次，代表情況值得關注。專案經理應展現同理心與問題解決能力，理解根因，同時展開支持行動。所以「與該成員進行一對一面談，了解他面臨的困難並共同尋找改善方案」是最符合實務與領導原則的做法。此舉也有助於維繫團隊士氣與信任基礎。"}, {"source": "PMSuccess40.pdf", "number": 8, "stem": "某公司聘請了一個新的Architectural Excellence委員會，其使命是推廣新的程式設計模式。敏捷團隊目前持續致力於新的和現有的軟體產品。專案經理應該如何應對這種新的發展？", "options": ["耐心等待，直到委員會給予團隊明確的指示，然後再決定。", "找個安靜的時間與委員會進行協商，以防止干擾團隊工作。", "與product owner交談，將此變更增加到待辦清單中。", "通知敏捷團隊，將由此而產生的變更盡可能地推遲。"], "answers": [2], "explanation": "在這種情況下需採取行動，而不是任何形式的延期。Product owner需參與進來，並且需要將此變更增加到待辦清單中。待辦清單修整是由Product owner控制，但需要團隊合作。Product owner也可以更改完成的定義或將變更加入驗收準則中。"}, {"source": "PMSuccess40.pdf", "number": 9, "stem": "某組織的團隊成員不願在回顧會中提出問題，因為過去提出缺陷原因的人常被主管責備。結果許多流程問題被私下處理，無法成為組織學習。若要建立持續改善文化，專案經理應採取哪些做法？（選兩項）", "options": ["鼓勵成員勇於公開承認錯誤。", "以匿名方式進行回顧會，以避免衝突。", "只討論成功案例，聚焦在獎勵與表彰，避免逞罰。", "建立不責備的學習環境。", "引導成員提出有建設性的缺失，並為各項缺陷找出當責人員。", "將問題聚焦於流程、工具與成員互動。"], "answers": [3, 5], "explanation": "正解是「建立不責備的學習環境」和「將問題聚焦於流程、工具與成員互動」。 這題的關鍵是：成員不願提出問題，是因為過去提出缺陷原因的人會被責備。因此，若要建立持續改善文化，專案經理應先建立心理安全與不責備的學習環境。若團隊擔心被責備，就不會揭露問題；改善討論應聚焦流程、系統與預防，而不是個人責任追究。此外，選項「鼓勵成員勇於公開承認錯誤」看似正向，但在缺乏心理安全的環境中，要求公開承認錯誤可能加劇恐懼。選項「以匿名方式進行回顧會，以避免衝突」可作為暫時輔助方法，但若目標是建立持續改善文化，核心仍是建立信任與不責備環境，而不是只靠匿名避免衝突。"}, {"source": "PMSuccess40.pdf", "number": 10, "stem": "某敏捷團隊在回顧會中建議取消所有設計審查，理由是審查會拖慢開發速度。產品負責人擔心缺陷可能增加，品保主管也提醒過去缺陷多半來自需求與設計理解差異。專案經理應如何處理？", "options": ["設計小型實驗並衡量結果。", "要求品保主管維持現行流程。", "直接取消設計審查以提升速度。", "將此建議交由高階主管決定。", "將回顧會結果存入知識庫。"], "answers": [0], "explanation": "持續改善不等於直接採納所有改善建議。若改善可能影響品質、風險或流程穩定性，較佳作法是用小規模實驗、明確指標與回饋來驗證效果。"}, {"source": "PMSuccess41.pdf", "number": 1, "stem": "以下哪些是關於W. Edwards Deming持續改善過程的關鍵屬性?（選兩項）", "options": ["品質是透過預防而非檢驗來達成。", "改善工作場所和研究中心的產品測試。", "六標準差", "更好的產品設計以改善服務。", "超越客戶期望。"], "answers": [0, 3], "explanation": "* W. Edwards Deming是過程改善領域的初期領導者，他的品質理念中最知名的是：PDCA 循環（Plan-Do-Check-Act）、系統思維與流程優化、品質源自設計與預防、消除對檢驗的依賴，以及領導者應該創造穩定與學習的環境。故正解是:「更好的產品設計以改善服務」和「品質是透過預防而非檢驗來達成」。* 其他選項是錯誤的，因為：- Deming強調流程與系統的優化，而非加強產品測試。-「六標準差」是Motorola與GE提出的管理工具，不是Deming的原創觀念。-「超越客戶期望」屬於現今的品質觀念（如Kano模型），而非Deming的核心哲學。"}, {"source": "PMSuccess41.pdf", "number": 2, "stem": "你參與一個敏捷開發專案，團隊正專注於開發一款新型的電商應用程式。在最近一次的回顧會議籌備中，有位成員提到不知道是否需要安排產品負責人參與回顧會議。作為敏捷實踐者的你，應該怎麼回應？\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "options": ["產品負責人參與與否將由開發團隊投票決定。", "產品負責人是利害關係人之一，不需要出席回顧會議，此會議是開發團隊的內部會議。", "產品負責人必須出席回顧會議，負責引導會議進行，並確保每位團隊成員都有發言的機會。", "產品負責人是團隊的一份子，建議產品負責人出席回顧會議，共同參與檢討與改進過程。"], "answers": [3], "explanation": "* 回顧會議是用來反思過去Sprint的流程和改進空間，產品負責人的參與有助於從產品需求和優先等級的角度提供回饋，這對於團隊的整體改進至關重要。雖然敏捷框架中未強制規定產品負責人必須參與回顧會議，但建議參與，因為這有助於加強透明度、促進合作，並提升團隊對產品目標的對齊。* 產品負責人不是外部的利害關係人，而是專案團隊的一部分，需要與開發團隊和Scrum Master一起合作完成專案目標。將產品負責人排除在回顧會議之外，可能導致產品方向與團隊改進之間出現脫節。* 回顧會議的參與者是由整個敏捷團隊（含產品負責人）一起討論與規範的，不應該由開發團隊投票來決定是否讓產品負責人參與。* 產品負責人並非回顧會議的引導者。如有需要，這是Scrum Master的職責。Scrum Master 可以負責設計和引導會議流程，確保所有成員能有效參與討論並提出改進建議。"}, {"source": "PMSuccess41.pdf", "number": 3, "stem": "某建築公司剛完成一項歷時五年的大型公共工程專案。專案在回顧會議時發現，實際工期比原計畫延長 14 個月，主要原因包括設計審查反覆、供應商交付資料格式不一致，以及多次施工許可文件A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n退件。團隊也發現，這些問題在公司其他大型工程專案中曾反覆發生。為了協助組織改善未來專案的規劃與執行方式。專案經理應建議怎麼做？", "options": ["將所有偏差與問題記錄在本專案的經驗學習登錄表中，供未來專案團隊自行查閱，不需調整組織流程。", "分析原始規劃與實際結果的差異，辨識重複發生的流程問題，並將改善建議提交 PMO。", "使用專家判斷完成最終稽核，確認本專案是否符合所有法規要求，並將稽核結果歸檔。", "召開正式收尾會議，確認所有交付成果已被接受，且專案符合退場準則後即可關閉。", "進行肇因分析，找出造成本專案延誤的主要責任單位，並將結果提供給高階主管作為績效評估依據。"], "answers": [1], "explanation": "這題的核心不是單純「專案收尾」，而是：如何把一個專案的經驗轉化為組織層級的持續改善。因此，專案經理不應只完成最終報告或歸檔經驗學習，而應進一步：分析計畫與實際結果的差異；找出重複出現的流程性問題；整理可行改善建議；提交 PMO 或組織治理單位；更新範本、審查流程、檢查清單、許可文件準備指引、供應商資料交付標準等組織過程資產。"}, {"source": "PMSuccess41.pdf", "number": 4, "stem": "某公司導入新的知識分享平台，專案交付如期完成，但六個月後使用率仍低。訪談發現員工認為平台不是日常工作流程的一部分，主管也沒有使用或鼓勵團隊使用。專案經理在檢討時最應強調哪一項？", "options": ["增加平台功能即可解決採用問題。", "忘記為使用者提供教育訓練。", "平台已交付，因此專案完全成功。", "變革未嵌入日常工作與領導行為。", "營運主管沒有積極促使員工的後續使用。"], "answers": [3], "explanation": "正解是「變革未嵌入日常工作與領導行為」。這題的關鍵是：平台已交付，但員工沒有把它當成日常工作的一部分，主管也沒有示範或鼓勵使用。這代表問題不是單純「系統功能」或「訓練不足」，而是組織變革沒有真正落地。組織變革不只靠交付系統與訓練。若新行為沒有被納入流程、績效、主管示範與日常工作，採用率通常不會持續。此外，選項「忘記為使用者提供教育訓練」可能是原因之一，但題目明確指出主要問題是「不是日常流程的一部分」與「主管沒有使用或鼓勵」，所以變革嵌入不足更貼近正解。"}, {"source": "PMSuccess41.pdf", "number": 5, "stem": "某專案經理正在管理一項電動車充電站建置專案。部分站點已開始施工，部分充電設備也已完成採購。專案的商業案例假設可取得政府補助，得以抵銷一部分建置成本。 專案執行中，政府宣布新的補助規則將於三個月後生效，申請補助的充電設備必須支援新的通訊標準。若設備不符合新標準，專案仍可完成建置，但可能無法取得原先預期的補助。贊助人要求專案經理儘快提出建議。 專案經理第一步應該做什麼？", "options": ["要求供應商提出升級報價。", "提交變更請求，以更新設備標準。", "暫停現場施工直到規則生效。", "重新評估補助假設與專案影響。"], "answers": [3], "explanation": "這題的關鍵是：外部商業環境已經改變，而且可能影響專案的效益假設、成本、範疇、時程、風險與商業案例。此外，政府補助規則改變不代表專案一定要立刻換設備、停工或送變更。專案經理的第一步應該是評估影響，確認新規則會如何影響：原本的商業案例與效益假設；已採購設備是否符合新標準；未施工站點是否需要調整設計；成本、時程與補助資格；以及是否需要提出變更請求或替代方案。"}, {"source": "PMSuccess41.pdf", "number": 6, "stem": "專案經理正在負責一項敏捷專案，該專案被公司納入近期公告的稽核範圍內。稽核小組已排定下週首次會議，並指定這位專案經理出席。專案經理應該怎麼做才能為稽核做好準備？？", "options": ["審視專案相關資訊。", "在稽核期間提出豁免申請。", "要求開發團隊提供合規性資料。", "若有需要，為下一次迭代預留故事點。"], "answers": [0], "explanation": "* 當你收到稽核會議通知時，專案經理應全面審視目前專案的相關資訊與紀錄，以掌握專案範疇、時程、預算狀況、決策紀錄、變更歷程、利害關係人溝通等資訊。這些資訊將幫助你應對稽核小組的提問，並對自己目前專案狀況有完整了解，這是事前準備的關鍵行動。* 其他選項是錯誤的，因為：- 選項「若有需要，為下一次迭代預留故事點」是屬於迭代規劃層級的工作，與稽核準備無直接關聯。- 除非你已掌握稽核範圍，貿然要求開發團隊準備合規資料可能造成干擾。應先審查哪些資訊需要、哪些已有，再決定是否交辦。-「豁免」是指請求免除稽核要求，這只有在確定某些規範不適用時才可進行。在尚未了解稽核需求前就提出豁免是不當行為。"}, {"source": "PMSuccess41.pdf", "number": 7, "stem": "專案經理正帶領組織今年度最重視的專案。專案經理最近發現有位成員已經連續兩次延遲交付自身所負責的交付標的。專案經理首先應該怎麼做？", "options": ["與該成員進行一對一面談，了解他面臨的困難並共同尋找改善方案。", "評估該問題對專案目標的衝擊，並記錄成風險以作為後續管理依據。", "讓團隊在下次會議中檢討此狀況，並強調每個人都應負起責任。", "要求功能經理對該成員進行績效約談，並提出人力替補建議。", "將任務重新指派給其他團隊成員，以提升交付的成功率。"], "answers": [0], "explanation": "延遲發生兩次，代表情況值得關注。專案經理應展現同理心與問題解決能力，理解根因，同時展開支持行動。所以「與該成員進行一對一面談，了解他面臨的困難並共同尋找改善方案」是最符合實務與領導原則的做法。此舉也有助於維繫團隊士氣與信任基礎。"}, {"source": "PMSuccess41.pdf", "number": 8, "stem": "某公司聘請了一個新的Architectural Excellence委員會，其使命是推廣新的程式設計模式。敏捷團隊目前持續致力於新的和現有的軟體產品。專案經理應該如何應對這種新的發展？", "options": ["耐心等待，直到委員會給予團隊明確的指示，然後再決定。", "找個安靜的時間與委員會進行協商，以防止干擾團隊工作。", "與product owner交談，將此變更增加到待辦清單中。", "通知敏捷團隊，將由此而產生的變更盡可能地推遲。"], "answers": [2], "explanation": "在這種情況下需採取行動，而不是任何形式的延期。Product owner需參與進來，並且需要將此變更增加到待辦清單中。待辦清單修整是由Product owner控制，但需要團隊合作。Product owner也可以更改完成的定義或將變更加入驗收準則中。"}, {"source": "PMSuccess41.pdf", "number": 9, "stem": "某組織的團隊成員不願在回顧會中提出問題，因為過去提出缺陷原因的人常被主管責備。結果許多流程問題被私下處理，無法成為組織學習。若要建立持續改善文化，專案經理應採取哪些做法？（選兩項）", "options": ["鼓勵成員勇於公開承認錯誤。", "以匿名方式進行回顧會，以避免衝突。", "只討論成功案例，聚焦在獎勵與表彰，避免逞罰。", "建立不責備的學習環境。", "引導成員提出有建設性的缺失，並為各項缺陷找出當責人員。", "將問題聚焦於流程、工具與成員互動。"], "answers": [3, 5], "explanation": "正解是「建立不責備的學習環境」和「將問題聚焦於流程、工具與成員互動」。 這題的關鍵是：成員不願提出問題，是因為過去提出缺陷原因的人會被責備。因此，若要建立持續改善文化，專案經理應先建立心理安全與不責備的學習環境。若團隊擔心被責備，就不會揭露問題；改善討論應聚焦流程、系統與預防，而不是個人責任追究。此外，選項「鼓勵成員勇於公開承認錯誤」看似正向，但在缺乏心理安全的環境中，要求公開承認錯誤可能加劇恐懼。選項「以匿名方式進行回顧會，以避免衝突」可作為暫時輔助方法，但若目標是建立持續改善文化，核心仍是建立信任與不責備環境，而不是只靠匿名避免衝突。"}, {"source": "PMSuccess41.pdf", "number": 10, "stem": "某敏捷團隊在回顧會中建議取消所有設計審查，理由是審查會拖慢開發速度。產品負責人擔心缺陷可能增加，品保主管也提醒過去缺陷多半來自需求與設計理解差異。專案經理應如何處理？", "options": ["設計小型實驗並衡量結果。", "要求品保主管維持現行流程。", "直接取消設計審查以提升速度。", "將此建議交由高階主管決定。", "將回顧會結果存入知識庫。"], "answers": [0], "explanation": "持續改善不等於直接採納所有改善建議。若改善可能影響品質、風險或流程穩定性，較佳作法是用小規模實驗、明確指標與回饋來驗證效果。"}, {"source": "PMSuccess42.pdf", "number": 1, "stem": "專案在定期的技術法規審查會議之後，範疇和時程發生了重大的變化。專案經理希望可以為下一個迭代找出一個新方法或流程，以避免可能的延遲。專案經理應該怎麼做？（選兩項）", "options": ["將範疇和時程的變更記錄下來，但不與團隊或利害關係人討論。", "與團隊及關鍵利害關係人進行回顧會議，檢討技術法規對範疇和時程變更的影響，並共同尋找可行的改進方案。", "重新審查與調整產品待辦清單，以確保下個迭代的工作能夠聚焦於最高優先等級的需求。", "由專案經理決定下一個迭代的優先項目與計劃，然後告知團隊執行。", "中止專案的技術法規審查，避免再度引發範疇和時程的變更。", "增加下一個迭代的工作量，以補償變更所帶來的延遲。"], "answers": [1, 2], "explanation": "* 在敏捷專案中，當範疇和時程發生重大變化時，產品待辦清單的調整至關重要。此舉能確保團隊專注於交付對顧客最具價值的項目。此外，專案經理需與利害關係人溝通，以確保他們了解此影響的全貌。並可透過回顧會議，了解問題的根本原因，並共同制定新的策略和方法來應對變更。* 其他選項是錯誤的，因為：-增加工作量可能會導致團隊過度負荷，進一步影響工作效率和品質，也違反敏捷中的可持續的步調（Sustainable Pace）原則。這種方法只會掩蓋問題，而非解決問題。-只記錄，但忽略與團隊和利害關係人的討論會導致缺乏透明度和合作，此舉將增加溝通障礙。專案成功的關鍵在於及時的溝通與協調。-敏捷強調團隊的集體決策。專案經理單方面決定計劃，可能會削弱團隊的參與感與責任感，進而影響團隊的士氣與工作績效。-中止技術法規審查會議將可能導致專案不符合顧客期望，甚至損害專案的最終交付價值。正確的方法應是改善審查帶來的影響，而非逃避。"}, {"source": "PMSuccess42.pdf", "number": 2, "stem": "腦力激盪技術可以用來協助下列何項的進行？（選三項）", "options": ["找出解決問題的方案", "找出改善過程的方法", "辨識風險", "排序產品待辦清單", "設定專案目標"], "answers": [0, 1, 2], "explanation": "腦力激盪技術能協助團隊辨識風險，找出解決問題和改善流程的方法。但無法用來協助專案目標的設定。排序產品待辦清單這任務是產品負責人的責任，故不需要使用腦力激盪技術。"}, {"source": "PMSuccess42.pdf", "number": 3, "stem": "在執行期間，一項新的法規要求被宣布，其僅影響專案交付成果的一個子集。忽略此變更可能會產生合規風險，而廣泛應用則會增加成本和延遲。發起人詢問應如何處理此影響。專案經理應該做什麼？\nA. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果", "options": ["將範疇或待辦事項的變更延後，直到法規正式實施為止。", "將法規變更上報以尋求指示，而不評估範疇或待辦事項的影響。", "將監管要求應用於整個專案的範疇或待辦項目。", "評估對範疇或待辦事項的影響，並僅調整受影響的工作。"], "answers": [3], "explanation": "* 題目關鍵是：新法規是外部環境變化，但它只影響部分交付成果。因此專案經理應先做影響評估，再針對受影響的範疇或待辦事項調整，避免不合規，也避免過度擴大造成不必要的成本與時程衝擊。故正解是「評估對範疇或待辦事項的影響，並僅調整受影響的工作」。* 其他選項是錯誤的，因為：- 選項「套用到整個專案」：過度反應，會增加不必要成本與延遲，且未必帶來相對應的合規效益。- 選項「等到法規正式實施再變更」：太被動，會增加合規風險並限制主動應對的選項。- 選項「直接上報但不評估」：不佳。未經影響評估的上報會延誤明智決策，也削弱專案層級的當責。"}, {"source": "PMSuccess42.pdf", "number": 4, "stem": "一個敏捷團隊正在進行每日站會。團隊的 Sprint 目標是在本週完成線上申請流程的核心驗證功能。會議中，開發成員依序同步昨天完成的工作、今天計畫進行的工作，以及可能影響 Sprint 目標的阻礙。會議進行中，一名成員提出近期測試環境的看板便利貼與標籤不足，可能影響團隊追蹤當天工作；另一名成員則希望在會議中討論整個團隊的開發流程是否應改成新的分支策略，因為過去幾個Sprint 都發生整合延誤。在每日站會中，哪一項最不適合被深入討論？", "options": ["看板便利貼與標籤不足，可能影響團隊當天追蹤工作狀態，需要有人立即補充或改用替代方式。", "團隊是否應重新設計整體開發流程與分支策略，並分析過去幾個 Sprint 發生整合延誤的原因。", "昨天完成了哪些與 Sprint 目標相關的開發與測試工作。", "今天每位成員計畫優先處理哪些工作，以協助團隊達成 Sprint 目標。"], "answers": [1], "explanation": "* Daily Scrum／每日站會/ 每日協調會議的重點是：檢視團隊朝 Sprint 目標的進展，調整當天計畫，並揭露立即影響工作的阻礙。所以以下內容適合在每日站會中提出：昨天完成什麼；今天要做什麼；有沒有阻礙；是否需要調整當天工作安排；是否有影響 Sprint 目標的風險或相依事項。此外，便利貼用完看似瑣碎，但如果影響團隊當天視覺化管理與工作追蹤，就可以作為阻礙提出。重點是快速指派處理，不需要長時間討論。* 深入分析流程問題、討論長期改善方案、根本原因分析、團隊工作方式調整，通常更適合放在Sprint Retrospective／迭代回顧會，或另開改善討論，不應佔用每日站會。"}, {"source": "PMSuccess42.pdf", "number": 5, "stem": "專案進行中，專案經理得知組織的商業環境已有所調整，此調整可能會讓目前專案的目標與新策略有所衝突。請問，專案經理第一步應該做甚麼？", "options": ["進行專案結案，並由發起人啟動另一個符合組織策略的專案來取代目前專案", "記錄此議題，主動找發起人確認，並討論專案是否需要調整或繼續進行", "提出變更申請，使專案目標符合組織策略", "繼續進行專案，等發起人告知明確的訊息後再來討論進一步的作法"], "answers": [1], "explanation": "如果專案的目標和已確立的組織策略相衝突，專案經理有責任儘早記錄及辨識出這些衝突，而且應主動反應給發起人，以便討論專案是否需要調整或是繼續進行。"}, {"source": "PMSuccess42.pdf", "number": 6, "stem": "組織最近要將進行中的專案由傳統的專案管理方法轉換為敏捷方法，專案經理得知目前的團隊成員認為他們缺乏一些需要的專業技能，而且彼此間的協作也不足。請問專案經理該如何回應？", "options": ["增加跨職能的資源至團隊。", "找尋外部專家以補足團隊所需的技能。", "向贊助人請求增加團隊資源。", "授權團隊成員自行討論解決問題。"], "answers": [0], "explanation": "敏捷式團隊推崇的是：自組織與跨職能，而跨職能的成員除了具備專精技術，也同時具備廣泛的其他領域的技能。所以，專案經理可以藉由加入跨職能的資源到團隊中，以便補足團隊的協作問題。"}, {"source": "PMSuccess42.pdf", "number": 7, "stem": "專案起始後的第二個月，商業分析師告知專案經理，專案中有一位內部的利害關係人對於沒有在專案啟動前參與起始前的初步規劃這件事，感到很不愉快。而且。這位利害關係人想將他的需求新增到需求追溯矩陣中。專案經理應該怎麼做才能改善與這位利害關係人的關係？", "options": ["提出變更申請，讓變更管制委員會決定是否接受這些新增的需求。", "參考範疇基準，以確認這位利害關係人的新增需求並無超出專案範疇。", "回應這位利害關係人的需求之前，先與他/她溝通，以取得更多關於這位利害關係人的相關資訊。", "更新利害關係人參與計畫書，以確保利害關係人參與評量矩陣中已經包含這位利害關係人。"], "answers": [2], "explanation": "這是關於「議題處理」的試題。而且題目詢問「專案經理應該怎麼做才能改善與這位利害關係人的關係」，所以，挑選回應策略時，應以「改善關係」為考量依據，故，「在回應這位利害關係人的需求之前，先與他/她溝通，以取得更多關於這位利害關係人的資訊」是最佳解。也就是以溝通取代管制將會是改善關係的最佳做法。另外，不需要考量選項「更新利害關係人參與計畫書，以確保利害關係人參與評量矩陣中已經包含這位利害關係人」，因為此利害關係人為專案的內部利害關係人，所以利害關係人參與評量矩陣中已經包含這位利害關係人了。"}, {"source": "PMSuccess42.pdf", "number": 8, "stem": "一家加拿大的新創公司向媒體宣布即將在歐盟和拉丁美洲上市。此後不久，合規性團隊建議將發布時間推遲6個月，以避免遭受到與歐盟新法規有關的重大懲罰。在準備合規性措施的同時，專案經理可以採取哪種方法來推進專案的上市？", "options": ["採用SWOT分析以權衡合規性和消費者需求之間的優先等級，如果結論有利於消費者，則恢復專案的推進。", "將此預測式專案重新規劃為大規模Scrum生命週期的專案，並使用故事點來估算獲准的里程碑。", "將受到法規影響的工作拆分成敏捷軌，並在預測式時程表中重新規劃那些未受到影響的工作。", "估算該懲罰對專案的影響，並相應增加應急儲備，並依按計劃恢復專案。"], "answers": [2], "explanation": "敏捷軌是正確的，因為若所要發布的專案包括對時間敏感的里程碑，那敏捷軌將更適合瀑布式。但是，合規性工作應該並行，同時搜集更多資訊以支持專案的推動。其他選項都是不正確的，因為超出專案範疇（消費者）、風險太大（應急）或不切實際（批准里程碑）。"}, {"source": "PMSuccess42.pdf", "number": 9, "stem": "作為組織變革專案其中的一部分，某經驗豐富的敏捷專案經理被聘用到一家具有強大的預測式文化的公司。此專案經理應該如何開始幫助該公司採用敏捷方法？（選兩項）", "options": ["確保使用了MoSCoW方法編寫所有的專案要求。", "向利害關係人展示敏捷是如何提高品質與降低風險。", "辨識出增量式商業價值交付的機會。", "培訓專案團隊，好讓他們能更加自力與跨職能。", "分析所有預定的專案，以挑選出合適的敏捷模型。"], "answers": [1, 2], "explanation": "* 在具有強烈預測式文化的組織中，逐步引入敏捷的最佳方式之一是辨識出能夠以增量方式交付價值的機會。這樣可以展示敏捷方法的實際效益，例如快速回應需求變化、提供早期回報以及持續改進，進而降低對敏捷方法的抗拒心理。* 在推動敏捷採用時，獲得利害關係人的支持非常重要。透過實例展示敏捷如何在短週期迭代提高產品品質、及早發現風險並減少浪費，能幫助利害關係人理解敏捷的價值，進而為轉型提供支持。* 其他選項是錯誤的，因為：-MoSCoW法是一種需求優先排序的工具，但敏捷的採用並不依賴某一具體工具。-儘管培訓團隊是推行敏捷的重要步驟，但在具有強預測式文化的公司中，轉型的初期應更著重於確保敏捷方法的採用能獲得高層認可和支持。團隊的培訓可以在轉型過程的後期進行。-雖然挑選適合敏捷的方法和模型是必要的，但這應該在建立對敏捷的基本認知和獲得支持後進行。另外，直接分析所有專案可能會因範圍過大而導致資源分散，並增加轉型的難度。"}, {"source": "PMSuccess42.pdf", "number": 10, "stem": "在執行中期，一場組織重組改變了數個專案利害關係人的報告路線和決策權。團隊不確定這將如何影響核准和日常協調。發起人詢問專案團隊將如何適應。專案經理應該做什麼？", "options": ["繼續在原有架構下運作以維持穩定。", "將所有協調問題上報給治理單位，無須分析。", "評估組織變革的影響，並相應地調整角色。", "暫停受影響的工作，直到組織完成重組。"], "answers": [2], "explanation": "題目關鍵是「組織重組」改變了利害關係人的報告路線與決策權，導致團隊不確定核准與日常協調方式。教材指出支援組織變革需要評估變革如何影響角色和權力，並調整角色以維持一致性、減少干擾。故正解是「評估組織變革的影響，並相應地調整角色」。"}, {"source": "PMSuccess.pdf", "number": 1, "stem": "在專案啟動初期，你發現客戶與專案團隊對專案的目標、活動與交付內容理解不一致，導致互動中常產生誤解與落差。作為專案經理，你應該如何處理此狀況以確保專案能順利展開？（選兩項）", "options": ["請客戶與團隊分別確認契約內容，以界定各自的責任與限制。", "根據客戶最新意見立即修改專案範疇，以維持合作氣氛。", "提出正式變更申請，並等待變更控制委員會核准後再執行。", "與客戶進行訪談與工作坊，明確收斂需求與雙方對專案成果的定義。", "召開啟動會議，讓所有利害關係人釐清目標、產出與角色期望。"], "answers": [3, 4], "explanation": "* 正解是「召開啟動會議」和「與客戶進行訪談與工作坊，明確收斂需求與雙方對專案成果的定義」，因為先澄清需求、與利害關係人對齊想法與共識建立的專案啟動階段的實務活動，有助於減少後續誤解與範疇衝突。* 其他選項是錯誤的，因為：- 若未建立共識，單靠契約容易讓雙方各自解讀。- 專案若未經正式流程就調整範疇將違反變更控制原則。- 專案在啟動階段時還未達成明確需求，也無基準，故無法進行變更流程。"}, {"source": "PMSuccess.pdf", "number": 2, "stem": "你擔任一個企業資源規劃（ERP）導入專案的專案經理。財務長（CFO）是關鍵利害關係人，具備： • 對預算與是否上線有高度決策權（高權力）。 • 因日常工作非常繁忙，對專案細節興趣不高（低興趣）。 • 過去曾因覺得被「資訊轟炸」而公開抱怨專案溝通太頻繁，甚至暫停過其他專案的核准流程。 你希望為這位CFO設計最合適的利害關係人管理策略，以下哪一種做法最恰當？\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "options": ["將CFO完全授權給其下屬財會主管參與專案，專案團隊不再直接與CFO溝通。", "每週寄送詳細的專案狀態報告，並邀請CFO參加所有專案會議，以提高其參與度。", "針對關鍵里程碑與重大決策，事先安排短時間一對一簡報，提供精簡重點資訊並徵詢CFO意見。", "只在專案出現重大風險或問題時，才通知CFO，以免打擾他的日常工作。"], "answers": [2], "explanation": "對於高權力／低興趣的利害關係人，可以採用「保持滿意（Keep Satisfied）」策略，也就是：在「關鍵決策點」提供「精簡但高品質」資訊，讓他覺得被尊重、資訊充足，但不被打擾過度。故「針對關鍵里程碑與重大決策，事先安排短時間一對一簡報，提供精簡重點資訊並徵詢CFO意見」是最佳解。"}, {"source": "PMSuccess.pdf", "number": 3, "stem": "專案的可交付成果已經通過品管人員的檢查了。今天專案經理與相關利害關係人一起驗收可交付成果時，幾乎所有的利害關係人都接受了可交付成果，惟獨有一位缺席兩次會議的利害關係人拒絕接受可交付成果。請問，專案經理當初應該如何做才可避免這樣的情況發生？", "options": ["規劃溝通時，清楚定義該利害關係人所需要的資訊及其發布方式。", "辨識利害關係人時，將該名利害關係人納入名單。A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果", "進行專案可行性分析時，就邀請該利害關係人參與專案活動，以獲得他的支持。", "制定有效的利害關係人管理策略。"], "answers": [3], "explanation": "利害關係人對於專案的參與，有助於他們了解專案狀態與促進共識。所以，規劃利害關係人參與時，對該利害關係人制定出有效的管理策略。"}, {"source": "PMSuccess.pdf", "number": 4, "stem": "在早期規劃期間，專案經理被要求定義必須追蹤和報告哪些資訊，以支援整個交付過程中的決策。該專案包括影響供應商選擇、交付順序和長期價值實現的永續性承諾。專案經理應該怎麼做？", "options": ["識別並記錄支援永續性相關決策的關鍵資訊需求。", "依賴標準的組織報告，因為永續性要求已經定義完成。", "在選定供應商且開始交貨後，才追蹤永續性指標。", "延後定義永續性資訊的需求，直到治理單位提出正式要求為止。"], "answers": [0], "explanation": "* 正解是「識別並記錄支援永續性相關決策的關鍵資訊需求」。及早確定關鍵資訊需求，有助於在整個專案中做出明智的決策。當永續性承諾影響交付和價值時，必須從一開始就識別和追蹤相關資訊。專案經理應識別並記錄：哪些永續性指標需要追蹤、誰需要這些資訊、資訊將如何影響決策、報告頻率與格式、資料來源與責任人，以及這些資訊如何連結到價值實現與供應商管理。* 其他選項不佳的原因是：- 選項「在選定供應商且開始交貨後，才追蹤永續性指標」太晚了。永續性承諾會影響供應商選擇與交付順序，必須在規劃階段納入決策資訊需求。- 選項「依賴標準的組織報告」不適合，因為標準報告可能不足以涵蓋本專案特定的永續性承諾，專案經理仍須依專案情境調整資訊需求。- 選項「延後定義直到治理單位正式要求」不符合主動規劃原則。若永續性會影響價值與決策，就應及早納入資訊與報告規劃。"}, {"source": "PMSuccess.pdf", "number": 5, "stem": "專案管理團隊審查議題紀錄上的資訊之後，一致認為多位利害關係人所希望的調整是可行的，並建議將目前的面對面會議改為虛擬會議，且希望開會頻率可以從現在的一週兩次改為一週一次。專案經理應該怎麼做？（選兩項）", "options": ["將會議形式與頻率的改變寫入議題紀錄中，並作為正式的決策，然後通知利害關係人。", "立即執行會議形式與頻率的改變，因為管理團隊已經認為這是可行的。", "評估改變會議形式和頻率對專案目標、進度及團隊協作的影響，並更新相關的計畫書與文件。", "只需通知內部專案團隊，因為改變的主要影響是在團隊內部的運作方式上。", "為此改變設定一個減輕策略，以防未來發生爭議。", "與相關利害關係人討論該需求的影響，徵詢他們的意見，並確認是否達成共識。 ( (您的選項)"], "answers": [2, 5], "explanation": "* 改變會議形式和頻率會直接影響利害關係人的參與和專案的進度，因此需要與所有相關利害關係人討論這些調整的可行性及潛在影響，並確認是否能獲得他們的支持。這符合專案管理中溝通和利害關係人管理的最佳實踐。* 在執行變更之前，應進行詳細的影響分析，確保改變不會對專案目標產生負面影響。更新文件有助於所有成員了解新的會議計劃，並避免溝通不清或誤解。* 其他選項是錯誤的，因為：-儘管管理團隊認為變更是可行的，但未徵詢其他重要利害關係人意見就立即執行可能導致不滿或阻力，尤其是當利害關係人對會議的形式和頻率有特定需求時。這種行為缺乏透明性與合作。-將決策僅記錄在議題紀錄上並通知利害關係人，忽略了與他們討論和徵求共識的必要性。這可能導致利害關係人對決策的不滿，甚至拒絕配合。-即使改變主要影響團隊內部的運作方式，也可能對利害關係人的參與與期望產生影響。因此，未通知所有相關利害關係人是一種不負責任的做法。-題目情境並非風險事件，不適合制定回應策略。"}, {"source": "PMSuccess.pdf", "number": 6, "stem": "你正在領導一項關鍵平台重構專案，需在兩週內收斂來自六個國家的專家意見，以決定未來的方向。這些專家背景多元、看法分歧，有些位於不同時區，且彼此之間不熟悉。你擔心專家們會受到他人影響或批評，所以希望以匿名方式收集意見，最終獲得共識。在這種情況下，以下哪一種方法最適合達成你的目的？", "options": ["腦力激盪法，以鼓勵專家提出創新想法並進行即時討論。", "SWOT 分析，以評估每項方案的優劣與可行性。", "德爾菲技術，以匿名收集多輪意見，並逐步收斂共識。", "蒙地卡羅分析，以評估架構決策的風險區間。"], "answers": [2], "explanation": "* 德爾菲技術可以跨時區、匿名收集意見、多輪回饋，非常適合取得分散專家的共識。* 其他選項是錯誤的，因為：- 蒙地卡羅分析用於風險模擬與機率預測，不適用於集體意見的收斂。- 腦力激盪法注重創意激發，並不適合結構化收斂與匿名操作。- SWOT分析用於方案分析，不適合收集或整合專家意見。"}, {"source": "PMSuccess.pdf", "number": 7, "stem": "在某專案中，專案經理召開了一個需要多位利害關係人參與的會議，會議中，有一個非常重要的利害關係人完全不與其他人合作。專案經理應該如何處理？", "options": ["進行衝突管理，以化解這些利害關係人之間的衝突", "再度了解其需求與期望，以確認是否需要修訂利害關係人管理策略", "重新審視溝通管理計畫書，以確認該利害關係人是否需要參加此會議", "再一次辨識利害關係人"], "answers": [1], "explanation": "此題的情境是該利害關係人在參與專案活動上出現問題，所以專案經理應該重新審視利害關係人參與計畫書的有效性。"}, {"source": "PMSuccess.pdf", "number": 8, "stem": "專案經理帶領一個預計將為期3年的軟體開發與整體行銷專案，此專案的利害關係人超過200位，所以，專案經理從一開始的規劃到後續的執行面上都非常著重於如何和利害關係人達成良好的互動與溝通。專案進入到第五個階段時，有二位利害關係人的參與狀態依據規劃地從抗拒轉移到支持。請問，專案經理應該做什麼？", "options": ["修訂利害關係人參與計畫書", "更新利害關係人登錄表", "更新議題紀錄", "通知專案贊助者"], "answers": [1], "explanation": "* 包含於利害關係人參與計畫書中的「利害關係人參與評量矩陣」會呈現各個利害關係人一開始被辨識出來的「目前參與程度(C)」，以及專案所期望的「所欲參與程度(D)」，而當這份包含參與評量矩陣的利害關係人參與計畫書被核准過後，就可以被視為管理與監視利害關係人參與的依據與評量基準。* 若專案經理於監視利害關係人參與時發現利害關係人並無依照這份計畫書從「目前參與程度(C)」移動至「所欲參與程度(Ｄ)」，那就需要提出變更申請，並評估看看是否需要修訂「利害關係人參與計畫書」與「利害關係人參與評量矩陣」。* 但是題目情境提到的是：『有二位利害關係人的參與狀態「依據規劃地」從抗拒轉移到支持』，所以這表示管理計畫書的規劃並無不妥之處，故不需要修訂。但由於利害關係人登錄表上需要記錄與更新各式各樣與利害關係人有關的資訊，故專案經理現在需要做的事情就是更新：利害關係人現階段的參與程度。"}, {"source": "PMSuccess.pdf", "number": 9, "stem": "專案經理帶領一個新型的雲端服務平臺開發專案。專案進行到設計階段時，專案經理發現有些關鍵利害關係人的參與程度未達到預期，他們對於會議的參與和決策制定的討論仍停留著些許的抗拒，未有實質性提升。這種情況將可能影響專案的整體進展。專案經理下一步應該採取什麼行動才能解決此問題？", "options": ["為利害關係人裁適管理策略，以促使他們參與專案。", "更新利害關係人參與評量矩陣，以記錄現狀並尋求進一步指導。", "重新分配溝通頻率與模式。", "提出變更申請，調整專案範疇，以減少對利害關係人參與的依賴。"], "answers": [0], "explanation": "* 若是利害關係人的參與程度沒有達到預計期望時，專案經理可以藉由變更申請的提出來修訂利害關係人參與計畫書中的管理策略，以促使他們參與專案。* 雖然溝通是促進參與的重要工具，但僅重新分配溝通頻率與模式可能無法直接解決利害關係人參與不足的根本問題。* 利害關係人參與評量矩陣的更新是對現狀的記錄，但並非解決參與不足的行動措施。這屬於後續分析的一部分，而非當前的最佳行動。*「提出變更申請，調整專案範疇」的作法過於激進。利害關係人參與不足時，專案團隊應透過管理策略來改善，而非直接改變專案範疇，這可能會削弱專案價值並引發更多問題。"}, {"source": "PMSuccess.pdf", "number": 10, "stem": "某金融機構啟動一項數位身分驗證專案。法遵部門重視風險控管，行銷部門希望降低註冊摩擦，資訊安全部門則要求更嚴格驗證。專案經理發現各方都支持專案，但對「成功」的理解差異很大。專案經理應採取哪些行動？（選兩項）", "options": ["採用贊助人提出的單一衡量標準。", "由專案經理定義最終成功準則。", "將各方期待轉化為可對齊的成果。", "收集各方需求，並進行差異分析。", "要求 IT 團隊先完成技術架構設計。", "促進關鍵利害關係人討論共同目標。"], "answers": [2, 5], "explanation": "正解是「促進關鍵利害關係人討論共同目標」和「將各方期待轉化為可對齊的成果」。 這題的關鍵是：各方都支持專案，但對「成功」的理解不同。法遵重視風險控管，行銷重視註冊便利，資安重視驗證強度。這些目標彼此可能衝突，所以專案經理應先促進關鍵利害關係人討論共同目標，並把不同期待轉化為可比較、可取捨、可對齊的成果，例如：降低詐欺風險；提升註冊完成率；符合法規與資安要求；和維持使用者體驗。 選項「收集各方需求，並進行差異分析」是有用的後續行動，但本題核心是「成功理解差異很大」。比起直接進入需求差異分析，應先對齊共同目標與成果方向。"}];
const letters='ABCDEFGHIJKLMNOPQRSTUVWXYZ';let pool=[],order=[],at=0,shuffle=false,results={};
const source=document.querySelector('#source'),card=document.querySelector('#card');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setup(){const old=source.value;const names=[...new Set(BANK.map(q=>q.source))];source.innerHTML='<option value="*">全部題庫（'+BANK.length+' 題）</option>'+names.map(n=>'<option value="'+esc(n)+'">'+esc(n.replace('.pdf',''))+'（'+BANK.filter(q=>q.source===n).length+' 題）</option>').join('');if(names.includes(old))source.value=old;pool=BANK.map((_,i)=>i).filter(i=>source.value==='*'||BANK[i].source===source.value);order=[...pool];if(shuffle)mix(order);at=0;results={};render()}
function mix(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function render(){if(!order.length){card.innerHTML='<div class="empty">這份題庫目前沒有題目。</div>';return}at=Math.max(0,Math.min(at,order.length-1));const q=BANK[order[at]],key=String(order[at]),done=results[key],multi=q.answers.length>1;document.querySelector('#position').textContent=(at+1)+' / '+order.length;document.querySelector('#progress').style.width=((at+1)/order.length*100)+'%';document.querySelector('#prev').disabled=at===0;document.querySelector('#next').disabled=at===order.length-1;document.querySelector('#score').textContent='已作答 '+Object.keys(results).length+' / '+order.length+'　答對 '+Object.values(results).filter(x=>x.correct).length;
let choices=q.options.map((o,i)=>{let cls='option';if(done&&q.answers.includes(i))cls+=' correct';else if(done&&done.selected.includes(i))cls+=' wrong';return '<button type="button" class="'+cls+'" data-choice="'+i+'" '+(done?'disabled':'')+'><span class="letter">'+letters[i]+'</span><span>'+esc(o)+'</span>'+(multi&&!done?'<input class="selectbox" type="checkbox" tabindex="-1" aria-hidden="true">':'')+'</button>'}).join('');
const feedback=done?'<div class="feedback '+(done.correct?'':'fail')+'"><h3>'+(done.correct?'答對了！':'再看一次正解')+'</h3><p class="correct-answer">正確答案：'+q.answers.map(i=>letters[i]+'. '+esc(q.options[i])).join('<br>')+'</p><p>'+esc(q.explanation||'（PDF 未附解析）')+'</p></div>':'';
card.innerHTML='<div class="meta"><span class="tag">第 '+q.number+' 題</span>'+(multi?'<span class="tag multi">複選 · '+q.answers.length+' 個答案</span>':'<span class="tag">單選</span>')+'<span>'+esc(q.source)+'</span></div><p class="stem">'+esc(q.stem)+'</p><div class="options">'+choices+'</div>'+(multi&&!done?'<p class="hint">請選取 '+q.answers.length+' 個選項，再送出答案。</p><button class="submit" id="submit" disabled>送出答案</button>':'')+feedback+'<div class="source">來源：'+esc(q.source)+' · PDF 第 '+q.number+' 題</div>';
let selected=[];card.querySelectorAll('.option').forEach(el=>el.addEventListener('click',()=>{const ix=Number(el.dataset.choice);if(multi){const box=el.querySelector('input');box.checked=!box.checked;el.classList.toggle('selected',box.checked);selected=[...card.querySelectorAll('.option')].filter(x=>x.querySelector('input')?.checked).map(x=>Number(x.dataset.choice));card.querySelector('#submit').disabled=selected.length!==q.answers.length}else{results[key]={selected:[ix],correct:q.answers.length===1&&q.answers[0]===ix};render()}}));if(multi&&!done)card.querySelector('#submit').addEventListener('click',()=>{results[key]={selected,correct:selected.length===q.answers.length&&selected.every(i=>q.answers.includes(i))};render()})}
source.addEventListener('change',setup);document.querySelector('#shuffle').addEventListener('click',e=>{shuffle=!shuffle;e.currentTarget.textContent='打亂題序：'+(shuffle?'開':'關');setup()});document.querySelector('#prev').addEventListener('click',()=>{at--;render()});document.querySelector('#next').addEventListener('click',()=>{at++;render()});setup();
</script></body></html>
