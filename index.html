<header><div class="eyebrow">PMP STUDY TOOL · OFFLINE</div><h1>章節測驗</h1><p>從題庫選一份測驗，作答後立即查看正解與解析。</p></header>
<main><section class="toolbar" aria-label="測驗設定"><label for="source">題庫</label><select id="source"></select><button id="shuffle" type="button">打亂題序：關</button><span class="spacer"></span><span class="status" id="score"></span></section><div class="progress"><span id="progress"></span></div><section class="card" id="card" aria-live="polite"></section><div class="nav"><button id="prev" type="button">← 上一題</button><span class="status" id="position"></span><button class="next" id="next" type="button">下一題 →</button></div><footer>題目及解析整理自目錄中的 PDF；每題標示來源檔名。</footer></main>
<script>
const BANK=[{"source": "PMSuccess1.pdf", "number": 1, "stem": "組織預計今年將陸續進行5個專案，他們希望可以採用最適合的專案管理方式進行這些專案。下列哪些專案適合採用預測式方法進行？（選兩項）", "options": ["Y專案的客戶要求每兩週就讓他們檢視一次專案，而且希望開發團隊每天都能進行站立會議。", "P專案預計將於一年內完成Ｔ城市的地下水道的所有老舊金屬管線的更換。", "M專案將為一款預計於下個月推出的新手機進行行銷，且會重複運用各種行銷手法，並從中找出最有成效的方法。", "A專案的目標是為H辦公大樓的30個廁所安裝最新的省水設備。", "S專案預計今年底先上線第一版產品，而後根據使用者的回饋，來做為該產品未來的新版本的功能更新考量。"], "answers": [1, 3], "explanation": "A專案和P專案最適合採用預測式方法進行，因為這兩個專案的需求明確，任務單純，所以只要事先進行規劃，就能順利推動專案進行。"}, {"source": "PMSuccess1.pdf", "number": 2, "stem": "某醫療集團正在推動一項「智慧醫院轉型」計畫，其中包含六個相互關聯的專案：電子病歷升級、病患 App、遠距看診平台、資料倉儲、醫療設備整合，以及資安強化。這些專案共用部分資訊架構、資安專家與臨床流程顧問，且其中一個專案的延誤可能影響其他專案的整合測試與上線時程。Justin Rose 被指派負責建立整體管理架構，協調各專案之間的相依性，處理跨專案資源衝突，並確保這六個專案能共同交付智慧醫院轉型的整體效益。 Justin Rose 最有可能擔任下列哪一種角色？", "options": ["專案經理，因為他負責制定管理計畫並解決資源衝突，以確保單一專案成功交付。", "專案集經理，因為他負責協調多個相互關聯專案的相依性、資源衝突與整體效益實現。", "專案贊助人，因為他負責確保智慧醫院轉型能取得高階支持與必要資金。", "專案組合經理，因為他負責根據醫療集團策略，決定哪些專案應被啟動、暫停或終止。"], "answers": [1], "explanation": "這題的關鍵是：六個相互關聯的專案、共用資源、存在相依性，且需要共同交付整體效益。故這是典型的專案集管理（Program Management）。專案集經理通常負責：協調多個相互關聯的專案；管理跨專案相依性；解決跨專案資源衝突；建立高階管理架構；以及確保專案集合起來能產生單一專案無法單獨達成的整體效益。故題目中的智慧醫院轉型正是由多個相關專案共同達成整體成果。"}, {"source": "PMSuccess1.pdf", "number": 3, "stem": "專案已進入第三個階段，目前時程與成本績效仍在核准基準內。狀態會議中，一位關鍵利害關係人提到，因市場政策可能調整，後續也許會要求修改部分產品規格。她的說法仍不完整，且尚未正式提出變更申請。 專案經理希望在不過早承諾變更、不打斷對方表達的情況下，展現主動傾聽並確認自己是否正確理解利害關係人的意圖。 專案經理最應該怎麼做？", "options": ["提醒利害關係人需先提出變更申請。", "重述重點並追問規格變動的背景。", "保持眼神接觸，讓對方完整表達想法。", "觀察語氣與表情，判斷其真正立場。", "記錄對方說法，會後再請團隊分析。A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [1], "explanation": "正解是「重述重點並追問規格變動的背景」。主動傾聽不只是點頭、眼神接觸或觀察表情，而是要讓說話者知道你聽到了，並確認你理解的內容是否符合對方原意。此時專案經理可重述或改述對方重點，例如：「我的理解是，您擔心市場政策變動可能影響某些規格，想先確認可能方向，對嗎？」接著再詢問後續問題，例如影響哪些規格、時點、決策依據與是否已有正式需求。"}, {"source": "PMSuccess1.pdf", "number": 4, "stem": "專案經理得知有兩位專案利害關係人不滿意專案對他們部門所造成的影響。利害關係人A注重專案的準時性，而利害關係人B則注重專案的成本，這2位利害關係人都擔心專案無法同時滿足他們的需求。專案經理最好應該怎麼做？", "options": ["請這兩位利害關係人將問題記錄在議題紀錄中。", "向所有的利害關係人執行簡報，以說明專案的現況。", "確保利害關係人了解專案經理的層級較高，並要求他們以正式文件提出問題。", "安排兩位利害關係人參加會議，讓他們可以說出自己有疑慮的地方。"], "answers": [3], "explanation": "在這個情況下，通過文件的溝通，可能會破壞與利害關係人之間的關係，因此，選項「確保利害關係人了解專案經理的層級較高，並要求他們以正式文件提出問題」不會是最佳的答案。另外，題目中並沒有提到你已經知道利害關係人所關注的真實問題為何，所以，選項「請這兩位利害關係人將問題記錄在議題紀錄中」也不是最佳的答案。而選項「向所有的利害關係人執行簡報，以說明專案的現況」更不會是最佳解，因為你並不需要因為兩位利害關係人的問題而去干擾其它人。所以，選項「安排兩位利害關係人參加會議，讓他們可以說出自己有疑慮的地方」是最佳解。"}, {"source": "PMSuccess1.pdf", "number": 5, "stem": "專案經理安排了一場迭代審核會議。會議中，她發現部分關鍵利害關係人對於此次所開發完成的功能特色感到不滿意。為了解決這個問題，專案經理首先應該做什麼？", "options": ["請專案發起人在專案團隊與那些感到不滿的利害關係人談判時擔任中立方。", "列出專案目前情況的優勢和劣勢，以評估該問題所造成的衝擊。", "評估與了解這些利害關係人為什麼不滿意之後，再處理此事。", "邀請專案團隊成員一起進行腦力激盪會議，以制定出適合的回應計畫。"], "answers": [2], "explanation": "題目情境顯示「有部分人員在迭代審查會議上表示不滿意專案產出」，這表示他們在審查時發生了衝突。專案經理有責任調查與了解衝突的來源和階段，並提出適當的衝突解決方案。所以，「先評估與了解這些利害關係人為什麼不滿意之後，再處理此事」是第一步該做的事。"}, {"source": "PMSuccess1.pdf", "number": 6, "stem": "某公司啟動一項策略性數位平台專案。專案經理被授權建立完整專案團隊，並可直接指派團隊成員的工作優先順序與每日任務。專案經理計畫將幾位曾參與類似專案的成員調入新專案，要求他們全職投入。 其中幾位成員表示，他們目前仍支援原部門的例行工作與其他改善活動，擔心無法兼顧新專案。專案經理回應，根據組織目前的專案治理方式，成員一旦被指派至該專案，即主要向專案經理回報，工作安排也由專案經理決定；若與原部門工作發生衝突，應以專案交付為優先。 此專案最有可能在哪一種組織結構中進行？", "options": ["平衡矩陣式組織，因為專案經理與職能經理通常共享資源管理權限，雙方都能決定成員的工作安排。", "弱矩陣式組織，因為團隊成員仍有原部門工作，因此專案經理主要扮演協調者而非資源決策者。", "專案導向型組織，因為專案經理對團隊成員的工作指派、優先順序與資源使用具有高度權限。", "多部門型組織，因為成員來自不同職能部門，專案經理必須透過各部門主管協調人員工作。", "混合式組織，因為團隊成員同時支援例行營運與專案工作，組織會依不同工作型態彈性調整權責。"], "answers": [2], "explanation": "這題的關鍵資訊是：專案經理可以直接指派團隊成員的工作優先順序與每日任務，成員主要向專案經理回報，且專案工作優先於原部門工作。這些特徵最符合專案導向型組織（Projectized Organization）。在專案導向型組織中：專案經理權限高；團隊成員通常全職投入專案；成員主要向專案經理回報；專案經理對資源、工作指派與優先順序有較大控制權；以及組織以專案交付為主要管理單位。題目中雖然提到成員原本還有其他工作，但重點不是他們「曾經」或「目前」有其他任務，而是組織授權專案經理可以要求他們以新專案為主，並決定其工作安排。故正解是「專案導向型組織，因為專案經理對團隊成員的工作指派、優先順序與資源使用具有高度權限」。"}, {"source": "PMSuccess1.pdf", "number": 7, "stem": "某企業正在推動一項「客戶體驗轉型」計畫，其中包含三個相互關聯的專案：專案 A 負責升級會員App，專案 B 負責整合客服平台，專案 C 負責重設門市服務流程。這三個專案各自有專案經理，但共用部分 UX 設計師、資料分析人員與客服流程專家。 在規劃初期，專案經理發現有多位利害關係人同時參與兩個以上的專案，且不同專案對相同資源的需求時間互相衝突。如果處理不當，可能造成重複溝通、優先順序不一致，以及整體客戶體驗改善效益無法實現。 你正在召開一場跨專案會議，參與者包括三個專案的專案經理、共用資源代表，以及跨足多個專案的關鍵利害關係人。會議目標是協調三個專案之間的資源使用、相依性與共同效益。你最有可能正在進行下列哪一項活動？", "options": ["專案組合管理，因為組織正在比較不同專案的策略價值，並決定是否終止或重新排序投資。", "活動資源估算，因為會議主要目的在於判斷每項活動需要哪些人力與設備資源。", "專案集管理，因為這些專案彼此相關，需要協調相依性、共用資源與整體效益。 ( (您的選項)", "專案管理，因為每個專案都需要專案經理協調資源、管理利害關係人並交付成果。", "利害關係人管理，因為多位利害關係人同時參與不同專案，需要建立一致的溝通方式。"], "answers": [2], "explanation": "這題的關鍵是：三個專案相互關聯、共用資源、利害關係人重疊，且需要協調相依性與整體效益。故這是典型的 專案集管理（Program Management）。專案集管理的重點是：管理多個相互關聯的專案；協調跨專案相依性；解決共用資源衝突；統一跨專案利害關係人溝通；以及確保多個專案共同產生整體效益。在題目中，專案 A、B、C 都是客戶體驗轉型的一部分，彼此不是完全獨立的專案。它們需要共同協調資源與交付節奏，才能實現整體客戶體驗改善，因此最符合專案集管理。"}, {"source": "PMSuccess1.pdf", "number": 8, "stem": "專案經理接手一項尚未正式啟動的供應鏈優化專案。業務主管已要求專案經理安排供應商會議，IT團隊也希望可以先指派開發人員。但專案經理尚未看到正式核准文件，也不清楚其授權範圍。專案經理應該先做什麼？", "options": ["召開供應商會議，以維持進度。", "建立初版風險登錄表。", "準備商業企劃案，並進行可行性評估。", "要求團隊提供粗略估算。", "確認專案章程與授權來源。"], "answers": [4], "explanation": "這題的關鍵是：專案尚未正式啟動，且專案經理不清楚自己的授權範圍。在PMP情境中，專案章程正式授權專案存在，並授權專案經理使用組織資源執行專案活動。在尚未確認專案章程或正式授權前，專案經理不應急著對外安排供應商會議、指派開發人員或承諾資源。此外，選項「準備商業企劃案，並進行可行性評估」是錯誤的，因為商業企劃案與可行性評估通常是啟動專案章程的重要輸入，但不是專案經理在授權不明時需要執行的工作。"}, {"source": "PMSuccess1.pdf", "number": 9, "stem": "專案經理加入了一項企業轉型專案。專案發起人表示，該專案必須支援組織未來三年的策略目標，但目前利害關係人只描述了高階需求，尚未清楚說明預期效益、成功衡量標準，以及專案成果如何支援組織目標。為了協助確保專案與組織策略和目標之間保持直接連結，專案經理應該做什麼？", "options": ["與專案贊助人確認商業需求、預期效益和成功標準，並將其納入專案章程。", "訪談組織高層以取得高階需求，並將其作為後續規劃的主要依據。", "先辨識可能影響策略目標達成的風險，並建立風險登錄表。", "要求業務單位重新發展商業企劃案，以證明專案值得投入資源。"], "answers": [0], "explanation": "* 正解是「與專案贊助人確認商業需求、預期效益和成功標準，並將其納入專案章程」。專案章程正式授權專案，並應反映商業需求、預期效益、成功標準及與組織策略的連結。專案經理應與專案發起人確認這些資訊，使專案從啟動階段就能與組織目標保持一致。* 其他選項是錯誤的，因為：- 雖然辨識風險是重要活動，但風險登錄表主要用於處理不確定性，無法建立專案與組織策略目標之間的正式連結。- 訪談高層可協助取得高階需求，但僅取得需求不足以確認專案是否支援組織策略、預期效益與成功衡量標準。- 商業企劃案通常在專案正式授權前形成，用來說明商業需求、投資理由和預期價值。專案經理可參考或協助釐清其中資訊，但通常不應自行重新發展商業企劃案。"}, {"source": "PMSuccess1.pdf", "number": 10, "stem": "在一個混合式方法的軟體開發專案中，團隊致力於開發一個智慧城市數據平台。此專案是由跨國虛擬團隊與多家外部供應商協作執行。專案進入第二個階段時，專案經理注意到利害關係人對專案的參與度不足，導致部分需求延後決定，影響了團隊的進度與方向。為了提升利害關係人的支持度，專案經理應該採取哪些行動？", "options": ["辨識其他潛在的利害關係人，以找尋支持專案的利害關係人。", "進行衝突管理，以解決因支持度不足而產生的團隊內部溝通問題。", "召開審查會議，要求利害關係人參與，以提供回饋。", "修訂利害關係人參與計畫書，確保參與策略更有效地滿足不同利害關係人的需求。 ( (您的選項)"], "answers": [3], "explanation": "* 提升利害關係人支持度的關鍵在於有效的策略調整與計畫修訂，所以專案經理可藉由修訂利害關係人參與計畫書中的管理策略，以促進利害關係人的參與度。* 辨識其他潛在的利害關係人無法解決當前利害關係人支持度不足的問題。* 審查會議主要是利害關係人審查交付標的或增量的會議，與改善利害關係人的支持度無關。* 利害關係人支持度不足的問題主要在於外部參與度的問題，而非內部衝突，故無法以衝突管理提升利害關係人的支持度。"}, {"source": "PMSuccess2.pdf", "number": 1, "stem": "專案經理正在管理一項企業客服轉型專案。贊助人表示專案目標是「提升客戶體驗」，客服主管認為重點是降低來電量，業務主管則期待增加交叉銷售機會，IT 團隊則專注於導入新的客服平台。專案尚未正式進入規劃，團隊已開始討論系統功能。專案經理接下來應該做什麼？", "options": ["先進行溝通需求分析。", "依 IT 團隊建議先選定解決方案。", "先完成系統需求清單，以避免團隊等待。", "與關鍵利害關係人建立共同願景。", "請贊助人直接決定所有功能，以期在期限內完工。", "建立里程碑時程後再處理目標差異。"], "answers": [3], "explanation": "這題的關鍵是：各部門都說支持專案，但對「專案成功」的理解不同。這代表專案在進入詳細規劃前，尚未對齊共同願景、商業目標與成功定義。因此，專案經理應先促進關鍵利害關係人建立共同願景。專案早期若各方對目標理解不同，應先建立共同願景與成功方向，再進行詳細需求與規劃。否則後續功能、優先順序與驗收標準都可能偏離。此外，選項「先進行溝通需求分析」並非最佳解，因為現在的問題不是「誰需要什麼資訊、用什麼頻率溝通」，而是各方對專案目的與成功定義尚未一致。"}, {"source": "PMSuccess2.pdf", "number": 2, "stem": "你剛接手一個已經進行一半的專案，你已經從前任專案經理手上得到所需要的專案管理計畫書及相關的專案文件，你現在想知道關鍵利害關係人的參與程度。你可以參考?\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "options": ["溝通管理計畫書", "專案章程", "利害關係人參與評量矩陣", "RACI矩陣"], "answers": [2], "explanation": "利害關係人參與評量矩陣記錄著利害關係人對於專案的參與程度，例如：不知、抗拒、中立、支持及領導，而此矩陣包含於利害關係人參與計畫書之中。"}, {"source": "PMSuccess2.pdf", "number": 3, "stem": "專案經理注意到有一位負責提供團隊關鍵資訊的利害關係人的參與度較低，且對專案的看法較為悲觀，認為此專案的實施無法為組織帶來足夠的效益。專案經理應該採取什麼行動？", "options": ["為此事件進行風險分析。", "重新辨識利害關係人，以期找出樂觀且參與度高的利害關係人。", "積極促進這位利害關係人的參與。", "要求專案贊助者提供另一位利害關係人。", "定期檢視專案資訊，以確保這位利害關係人所提供的關鍵資訊是準確無誤的。A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [2], "explanation": "專案經理需觀察與追蹤利害關係人在專案中的活動和參與程度，並制定適合各個利害關係人的參與計畫書，以引導他們參與專案活動。"}, {"source": "PMSuccess2.pdf", "number": 4, "stem": "某專案經理剛接手一項跨部門資料整合專案。專案章程已核准，但章程中只描述高階目標，未明確說明專案經理可否直接協調職能資源，也未定義哪些決策需提交治理委員會。兩位職能主管開始要求專案經理先安排工作分派。專案經理最應該先做什麼？", "options": ["依職能主管要求先安排工作分派，並在後續規劃時補充治理資訊。", "建立詳細時程基準，讓各部門根據時程自行提供所需資源。", "要求 PMO 指派資源，以避免職能主管對專案產生不同期待。", "與贊助人釐清專案經理授權、決策邊界與治理升級方式。"], "answers": [3], "explanation": "專案章程是授權專案的文件，但若授權與治理邊界不清，專案經理不應直接進入資源分派，而是應先與贊助人確認其權限、決策門檻、升級路徑與治理機制。"}, {"source": "PMSuccess2.pdf", "number": 5, "stem": "高階主管指派你擔任一個為期四年的大型專案的專案經理。你第一件事應該做什麼？", "options": ["與高階主管一起說服贊助者同意此專案", "確認經營需求", "取得專案章程", "評估與確認組織策略"], "answers": [2], "explanation": "「評估與確認組織策略」與「確認經營需求」都應該在啟動此專案前就完成了。另外，指派出專案經理前，一定是發起人同意的，故「與高階主管一起說服贊助者同意此專案」是錯誤的選項。所以此問題最好的選擇是「取得專案章程」。"}, {"source": "PMSuccess2.pdf", "number": 6, "stem": "某企業雲端轉型專案剛核准。高階主管要求兩週內提交完整時程與成本基準。專案經理發現目前只有商業企劃案。多位部門主管也尚未表態支持。專案經理應如何應對？", "options": ["先完成時程與成本基準，後續再根據利害關係人意見調整。", "先要求供應商提出估價與時程，作為內部基準的主要依據。", "依商業企劃案假設範疇與治理方式，以滿足高階主管時程要求。", "先進行基礎對齊，再建立基準。"], "answers": [3], "explanation": "正解是「先進行基礎對齊，再建立基準」。若共同願景、利害關係人、成功標準與治理都未建立，詳細基準會建立在不穩固假設上。故專案經理應先奠定基礎，再進入可靠規劃。其他選項都過早產生基準或依賴不足資訊。"}, {"source": "PMSuccess2.pdf", "number": 7, "stem": "在Sprint規劃會議時，若是產品負責人沒參與的話，將會造成？", "options": ["該 Sprint 將被中止。", "產品待辦清單將不會被完成。", "產品增量可能達不到預期結果。", "Scrum master 將取代產品負責人的角色。", "沒有影響，因為產品負責人不是開發人員。"], "answers": [2], "explanation": "產品負責人在Sprint規劃會議時會與團隊討論產品增量所預期的「完成狀態」，也就是「完成的定義」。因此，如果產品負責人沒有參與Sprint規劃會議的話，團隊可能將無法理解所需要滿足的期望為何。"}, {"source": "PMSuccess2.pdf", "number": 8, "stem": "一項混合式客服平台導入專案已進入第二個階段。專案初期，專案經理已建立利害關係人登錄表，記錄主要使用單位、贊助人、供應商代表與法遵窗口。 執行期間，營運部門主管更換，外部稽核單位要求參與部分審查，原本支持專案的客服主管近期參與度下降，而供應商也更換了技術窗口。專案經理正在檢視是否需要更新利害關係人相關文件。 專案經理應在何時更新利害關係人登錄表？", "options": ["僅在專案啟動時建立即可。", "在規劃完成後交由 PMO 保存。", "等專案收尾前再統一修訂。", "當利害關係人加入或退出時再更新即可。", "只在執行階段出現抱怨時更新。", "於整個專案期間持續更新。"], "answers": [5], "explanation": "正解是「於整個專案期間持續更新」。利害關係人登錄表不是只在專案初期建立一次，而是應隨專案進展持續更新。當出現新利害關係人、原有利害關係人角色改變、影響力改變、參與度下降、溝通需求改變，或專案進入新階段時，都應更新。選項「當利害關係人加入或退出時再更新即可」並不正確，因為除了加入或退出，角色、影響力、態度、參與程度、溝通需求改變時也需要更新。"}, {"source": "PMSuccess2.pdf", "number": 9, "stem": "在一個混合式專案（前端敏捷、後端預測式）中的第 4 個 Sprint 後，組織改組新增資安長（CISO）成為合規決策者。CISO表示：近期已通過UAT的功能因缺少「滲透測試/稽核證據」而不准上線，並要求未來每個 Sprint 都要交「稽核包」。PO 反對，稱這不在原本的DoD需求中。身爲專案經理，下一步最應該做的是？", "options": ["更新利害關係人登錄表與利害關係人參與策略。", "提出變更申請，把每 Sprint 稽核包納入範疇基準。", "向高層報告 PO 不配合，並指示專案贊助人的意見。", "要求團隊停工，直到稽核流程與模板完成。"], "answers": [0], "explanation": "正解是「更新利害關係人登錄表與利害關係人參與策略」。題目的核心變化是：新增了CISO這個具備合規否決權的關鍵利害關係人，而且已經造成「不准上線」的阻塞。這不是單純流程或文件問題，而是利害關係人識別與參與策略需要立即調整。故PM需要把 CISO 正式納入利害關係人登錄表（權力/影響力、態度、需求、參與程度），並更新利害關係人參與計畫書（他要何時參與、要看哪些證據、溝通頻率、決策路徑）。這樣才有辦法後續再決定：哪些需求需納入DoD、哪些要走變更…。"}, {"source": "PMSuccess2.pdf", "number": 10, "stem": "你剛剛接手一個進行到一半的專案，你可以透過哪些工具來了解與判斷你需要花多少心力來管理專案中不同群組的利害關係人？（選兩項）", "options": ["權力/關注網格", "RACI矩陣", "顯著模式", "檢核表", "溝通管理計畫書"], "answers": [0, 2], "explanation": "* 權力/關注網格是依據利害關係人在專案中的權力與對專案的關注程度來分類利害關係人的一種資料呈現網格。在此網格中，可以將利害關係人區分為四個象限，例如：權力大且關注程度高的關鍵人物，或是權力小且關注程度低的居民，對於這四個象限的管理策略通常是：密切管理、保持滿意、監視與保持聯繫。所以，專案經理對於分類於不同象限的利害關係人，其管理方針與心力是不同的。* 顯著模式是一種可依據利害關係人的職權層級、即時需要，以及他們參與專案的適當程度來予以分組的一種分類模式。"}, {"source": "PMSuccess4.pdf", "number": 1, "stem": "某製藥專案包括一個由醫學研究人員組成的敏捷團隊，他們的任務是分析來自藥物實驗患者身上的人體組織掃描。組織的CEO希望利用機器學習 (ML) 技術，因為事實證明它在掃描分析方面比醫學研究人員更快也更準確。Product owner應該如何回應CEO的心願？", "options": ["預測團隊的負面反應，並準備好以「他們的時間與技能將能在其他地方獲得善用」來說服他們。", "在登錄表中記錄此風險，並規劃在回顧會議中討論其回應策略。", "與團隊一起規劃如何使用ML這項資源。", "要求團隊產出可以支持以人工進行確認的SWOT分析。"], "answers": [2], "explanation": "Product owner需為企業工作，並支持CEO的決定，故與團隊一起規劃他們的新工作方式是最佳作法。儘管你應該使用情商來幫助團隊實現下一步，但應多關注團隊該如何參與，而不是另一個未知的未來。"}, {"source": "PMSuccess4.pdf", "number": 2, "stem": "你正在為當地社區規劃一項體育館興建專案，體育館預計將包含籃球場、田徑場、網球場和游泳池，預計可容納8,000名觀眾。下列哪些最有可能是此專案團隊的角色？（選三項）", "options": ["制定測試規則的支援專家", "體育館興建地附近的居民", "負責編列預算的人員", "透過合作關係提供專業支援的商業合作夥伴", "當地運動團隊的球迷\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [0, 2, 3], "explanation": "專案團隊指的是支援專案經理進行專案工作，以達成專案目標的一群人。專案團隊的組成可能會因為組織文化、地點及範疇而有所不同。專案團隊人員的角色可包括：• 專案管理人員：負責進行預算編列、排程、報告與管制、風險管理，以及專案溝通等活動。• 專案人員：負責打造專案的可交付成果。• 支援專家：負責協助專案管理計畫書的制定工作，如：法律、物流、工程、測試等規劃事宜。• 使用者或客戶代表：負責提供需求及驗收專案的可交付成果。• 賣方：透過契約的簽訂，提供專案所需之產品或服務。• 商業合作夥伴：透過合作關係，提供專業支援。"}, {"source": "PMSuccess4.pdf", "number": 3, "stem": "一項混合式系統導入專案正進入使用者驗收階段。團隊中的資深法規分析師 A 即將調任營運治理部門。A 不再執行專案工作，但仍將擔任合規報告的主要接收者與核准窗口。 接替 A 的專案資源已完成指派，團隊目錄、責任分配矩陣及資源安排也已更新。A 對專案的支持程度與參與策略維持不變，但其職稱、聯絡管道、報告接收頻率及機密資訊核准責任均有所調整。 為維持資訊流與溝通授權的連續性，專案經理接下來最應更新哪些專案工件？（選兩項）", "options": ["修改協作規範（團隊章程）。", "登錄溝通異常（議題紀錄）。", "調整傳遞規則（溝通管理計畫書）。 (A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果", "重整資源方式（資源管理計畫書）。", "更新角色資料（利害關係人登錄表）。", "修訂參與策略（利害關係人參與計畫書）。"], "answers": [2, 4], "explanation": "正解是「更新角色資料（利害關係人登錄表）」和「調整傳遞規則（溝通管理計畫）」。A 已由專案團隊成員轉為營運治理部門的關鍵利害關係人，因此應更新利害關係人登錄表中的：職稱與部門、聯絡資訊、專案角色、影響力及核准責任，以及與專案的關係。利害關係人登錄表應隨專案環境及利害關係人角色變化持續維護。此外，題目也指出報告接收頻率、聯絡管道及機密資訊授權責任已改變，這些都屬於溝通管理計畫書中的內容。該計畫書定義著：誰是資訊發送者與接收者、誰有權核准機密資訊、溝通的內容、格式與詳細程度，以及溝通頻率、管道與回應要求。"}, {"source": "PMSuccess4.pdf", "number": 4, "stem": "某專案經理正在領導一項企業級客戶服務轉型專案。經過多次討論後，關鍵利害關係人已同意將專案願景從「降低營運成本」修訂為「提升端到端客戶體驗並增加客戶留存率」。然而，專案經理發現部分業務單位仍以成本削減作為部門績效指標，獎金制度也持續鼓勵團隊縮短服務時間，而不是提升客戶滿意度。結果導致專案團隊對於應優先改善服務品質還是壓低處理成本產生混淆。專案經理應該做什麼？", "options": ["暫時維持現有績效指標，等到客戶體驗改善成果被量化後再進行調整。", "更新專案管理計畫書與溝通文件，說明修訂後的專案願景與新的優先事項。", "將此不一致情況提報給專案贊助人，請贊助人決定是否需要調整部門獎金制度。", "促使績效期望、成功標準與已議定的專案成果保持一致，以強化修訂後的願景。 ( (您的選項)", "要求各業務單位自行調整其績效指標，因為獎勵制度屬於部門管理責任。"], "answers": [3], "explanation": "* 正解是「促使績效期望、成功標準與已議定的專案成果保持一致，以強化修訂後的願景」。此題目的關鍵訊號是：專案願景已修訂並獲得共識，但組織內部的績效指標、獎勵機制與成功標準仍反映舊的優先事項。這會讓團隊收到混雜訊息，不知道真正重要的是「降低成本」還是「提升客戶體驗」。當願景已經改變，但實際管理機制仍未同步時，專案經理不應只更新文件、被動上報，或讓各部門自行處理。最佳做法是確保績效期望與成功標準和議定成果一致，讓團隊的行為、決策與衡量方式都支持更新後的共同願景。* 其他選項並不合適，是因為：- 要求各業務單位自行調整其績效指標，因為獎勵制度屬於部門管理責任：不佳。雖然部門可能擁有績效制度的管理權，但此問題已經影響專案團隊對成果優先順序的理解。專案經理不能完全切割責任，而應促進跨部門對齊。- 更新專案管理計畫書與溝通文件，說明修訂後的專案願景與新的優先事項：部分正確但不是最佳。更新文件有幫助，但本題問題的核心是績效期望與成功標準沒有改變。若只更新文件，團隊仍可能依照舊的獎勵與評估方式行動。- 將此不一致情況提報給專案贊助人，請贊助人決定是否需要調整部門獎金制度：這可能是後續需要的支持，但第一步不應只是上報。專案經理應先主動促進對齊，明確指出成功標準與績效期望需要支援已議定成果。- 暫時維持現有績效指標，等到客戶體驗改善成果被量化後再進行調整：不佳。等待會讓團隊繼續依照舊目標行動，增加錯誤決策與價值偏離的風險。PMP 題目通常偏好及早對齊，而不是等問題擴大後再處理。"}, {"source": "PMSuccess4.pdf", "number": 5, "stem": "當其他利害關係人都接受交付標的時，惟獨有一位當初並未參與專案初期階段的利害關係人拒絕接受。請問，專案經理原本應該如何做才可避免這樣的情況發生？", "options": ["在專案初期時，就了解該利害關係人的需求，以獲得他的支持。", "在規劃溝通管理時，清楚定義該名利害關係人所需要的資訊與發布方式。", "在辨識利害關係人時，將該名利害關係人納入名單。", "在規劃利害關係人參與時，定義出對該名利害關係人的有效管理策略。"], "answers": [0], "explanation": "專案初期時，專案經理有一項重要的職責是依據現有的資訊、過去類似專案的經驗學習、假設事項和限制條件等因素，來與相關的利害關係人會議或討論，以便可以評估新的專案、產品或是服務的需求與可行性。"}, {"source": "PMSuccess4.pdf", "number": 6, "stem": "某市政府啟動線上申辦服務專案，目標是在一年內將多項臨櫃申請流程數位化。啟動階段主要由資訊處、行政部門與法務單位參與，並已初步核准專案章程與高階範疇。專案經理在規劃初期發現，地方服務中心將負責協助民眾使用新系統，客服中心將處理大量流程查詢，身心障礙使用者可能受到介面與身分驗證方式影響，監管單位也需確認申辦紀錄保存與個資處理方式。 然而，這些群體尚未列入利害關係人登錄表，也沒有被納入參與或溝通安排。行政部門主管表示，為避免延誤時程，可由行政部門先代表所有使用者意見，等原型完成後再收集外部回饋。專案經理應該怎麼做？", "options": ["維持目前已核准的高階範疇與治理安排，等流程原型完成後，再邀請地方服務中心、客服中心與身心障礙使用者參與測試。", "讓行政部門擔任所有外部使用者與作業單位的單一代表，以避免過多利害關係人造成決策延遲。", "更新利害關係人登錄表，分析這些群體的影響程度、需求、期望與參與程度。", "將地方服務中心、客服中心、身心障礙使用者與監管單位的意見列為未來潛在變更，避免在專案早期影響已核准方向。", "立即要求資訊處重新設計系統架構，以納入無障礙、客服查詢與監管紀錄保存需求，避免後續發生返工。"], "answers": [2], "explanation": "這題的關鍵不是「現在要不要立刻改系統」，而是：專案早期發現重要利害關係人被遺漏，應先更新利害關係人辨識與分析，並規劃適當參與方式。題目中被遺漏的群體不是邊緣角色，而是會實際受到專案成果與流程變更影響的人：地方服務中心：未來要協助民眾使用系統；身心障礙使用者：可能受到介面與身分驗證方式影響；客服中心：會承接上線後的查詢與抱怨；監管單位：關注紀錄保存、個資與合規。這些利害關係人若未被早期辨識，後續可能造成需求缺漏、驗收爭議、合規風險、使用者抗拒與大量返工。因此，專案經理應先更新利害關係人登錄表，進行影響、權力、利益、需求與參與程度分析，再依分析結果調整參與策略與溝通安排。"}, {"source": "PMSuccess4.pdf", "number": 7, "stem": "你是專案經理。組織新任命的一位副總是你專案的重要利害關係人。你邀請他參加需求會議，他當場提出建議，但專案贊助者強烈反對，導致會議氣氛緊張。為了避免此衝突發生，你事前最好可以做哪些行動？（選兩項）", "options": ["管制好利害關係人之間的溝通管道。", "舉辦衝突管理訓練，以減少未來爭執。", "提前安排贊助者與副總見面，釐清立場。", "管理好利害關係人的期望。", "更新利害關係人登錄表，並依其影響力制定溝通策略。", "檢視溝通計畫，並事前提醒贊助者副總的立場。"], "answers": [4, 5], "explanation": "* 最適合的兩個做法是：-「更新利害關係人登錄表，並依其影響力制定溝通策略」。當副總已成為重要利害關係人，應即時更新登錄表，並依據其權力與關注程度規劃合適的參與與溝通方式。這樣就能提早預測他可能提出的建議。-「檢視溝通計畫，並事前提醒贊助者副總的立場」。即使你已辨識出副總為利害關係人，也需要將其納入溝通計畫中，並根據其立場提前讓其他高影響力利害關係人（如贊助者）知道其觀點，有助於事前協調，避免會議上直接衝突。* 其他選項較不合適，因為：-「提前安排贊助者與副總見面，釐清立場」雖然可能有效，但這是具體技巧而非標準專案管理流程。考試時應優先選擇制度化、規劃性強的行動。-「管理好利害關係人的期望」是一個持續性的長期行動，不是明確的事前預防行動。若沒有先進行利害關係人的辨識與溝通規劃，此步驟是無法展開的。-「管制好利害關係人之間的溝通管道」屬於過度控制，並不符合專案管理中的「促進透明與開放溝通」原則。-「舉辦衝突管理訓練，以減少未來爭執」是長期提升團隊能力的方法，對這次事件無法預防或改善當下衝突。"}, {"source": "PMSuccess4.pdf", "number": 8, "stem": "組織高層指派你擔任一項為期四年的企業轉型專案經理。該專案涉及多個事業單位、外部合作夥伴與未來營運移轉。高層已提供商業企劃案、效益管理資料、初步合約草案及部分治理文件，並要求你在一週內完成專案章程，以便正式授權專案啟動。你檢視資料後發現，部分文件對專案目標、成功標準、主要交付成果與專案經理授權程度的描述不完全一致。專案經理應採取哪些行動？（選兩項）", "options": ["審閱商業文件與相關協議。", "與關鍵利害關係人確認章程資訊。", "依高層口頭方向完成章程草案。", "請 PMO 決定章程中的成功標準。", "建立完整的專案管理計畫書。", "依採購工作說明書定義主要範疇。"], "answers": [0, 1], "explanation": "題目明確說高層已提供商業文件與其他相關文件，因此專案經理應先審閱這些資料，確認專案目的、商業理由、預期效益、限制條件與初步風險。而專案章程應根據商業企劃案、效益管理計畫書、協議、組織治理文件等高階輸入來建立。此外，當文件之間對目標、成功標準、交付成果與授權程度不一致時，專案經理不能單獨解讀，也不能只聽最高階主管的口頭意見。應與發起人、客戶、PMO、營運代表及其他關鍵利害關係人確認哪些資訊應納入章程，以建立共同理解並取得對專案目的與成功標準的共識。故正解是「審閱商業文件與相關協議」和「與關鍵利害關係人確認章程資訊」。"}, {"source": "PMSuccess4.pdf", "number": 9, "stem": "你正執行一個橫跨10個部門的複雜專案，系統部門希望你可以少用一些他們部門的資源，最好可以減少10%；多媒體部門希望此專案的目標時程可以不再被更動；而專案贊助人希望你可以多多配合顧客的要求，就算有些專案上的更動，也要儘量配合。你應該怎麼做？", "options": ["以專案贊助人的建議為主要考量", "先單獨與各單位溝通，等了解他們的要求後，再召開進一步的協調會議。", "更改專案管理計畫書，以滿足所有人的要求。", "請組織高層召開跨部門會議，讓所有利害關係人可以面對面討論。"], "answers": [1], "explanation": "此問題的要求都是一些不能被測量的管理目標，所以身為專案經理的你需要花更多的時間與這些單位溝通，並於考量與評估他們的要求後，再召開相關會議，因為全部的要求都應該被管理。"}, {"source": "PMSuccess4.pdf", "number": 10, "stem": "你剛被指派帶領一個已經啟動3個月的專案，此專案是組織及其他兩間外部組織一起合作的系統開發案。在你參考目前手上的文件之後，你發現你並不清楚在此專案中，誰的影響力最大、哪些人的需求應該被重視，以及有多少外包商。請問，你應該參考？", "options": ["利害關係人參與評量矩陣", "RACI矩陣", "利害關係人登錄表", "利害關係人管理計畫書"], "answers": [2], "explanation": "利害關係人登錄表中記載著利害關係人的基本身份資訊、主要的需求與期望、影響專案結果的可能性及其分類模式，例如：是屬於內部或外部利害關係人或其影響力或權力的大小等。"}, {"source": "PMSuccess5.pdf", "number": 1, "stem": "下列所描述的情境中，哪一項適合動用應變儲備？", "options": ["專案贊助人忽然將預分派成員調離專案。", "專案成員Tim今天電話告知你，他由於發生車禍，需要請假一週。", "專案經理是新手，他很擔心無法達成專案目標。", "專案團隊沒有組裝過任何類似可交付成果Ａ的產品之經驗，所以，此可交付成果將可能需要藉由重工來達到標準。"], "answers": [3], "explanation": "成本的應變儲備是為了因應成本的不確定性而制定的，其包含於成本基準內。應變儲備主要是為了因應已辨識的風險，也就是應對已知的未知(Known-unknowns)風險。選項中，只有「專案團隊沒有組裝過任何類似可交付成果Ａ的產品之經驗，所以，此可交付成果將可能需要藉由重工來達到標準」是已知的未知(Known-unknowns)風險。"}, {"source": "PMSuccess5.pdf", "number": 2, "stem": "某專案採用混合式方法進行開發。在專案初期階段，團隊發現了一個迫切的問題。由於受到大環境的影響，原物料價格暴漲，導致實際成本與預估成本出現較大的差異。這種情況如果不加以解決，可能會導致專案總資金短缺。專案團隊下一步該做什麼？", "options": ["結束專案，並重新招標，尋求新的供應商。", "重新估算完工預估值(EAC)，並由相關利害關係人決定專案動向。", "要求專案贊助人釋放管理儲備。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "動用應急儲備。", "加強風險管理，並制定應對策略以減少損失。"], "answers": [1], "explanation": "* 當原物料價格暴漲導致實際成本與預估成本出現較大差異時，最重要的是重新估算專案的完工預估成本 (EAC)，以確認專案在新條件下的資金需求與成本變化趨勢。根據更新後的EAC，專案經理應與利害關係人討論並決定下一步行動，確保專案資金不會耗盡。* 其他選項是錯誤的，因為：-管理儲備是專案資金中的一部分，用來應對「未知的未知」風險，而非處理已知的成本變化。故不可直接要求釋放管理儲備。-雖然加強風險管理是必要的，但此時已經發生了問題，而非潛在風險。此情況需要立即應對，無法僅依賴風險管理計畫書。-應急儲備是專案資金中的一部分，用來處理已識別的風險事件。但在此案例中，應該先確認事件的全貌，包括重新估算完工預估成本 (EAC) 和檢討現有預算情況，再決定是否動用應急儲備。貿然使用應急儲備，可能導致後續風險管理失衡。-結束專案並重新招標是一種極端選項，僅在資金無法支撐、供應鏈問題無法解決且無法達成專案目標時才考慮。只有在確認無法繼續執行的情況下，才需考慮結束專案並重新規劃。"}, {"source": "PMSuccess5.pdf", "number": 3, "stem": "以下有三項任務： A.估算地板工程活動的工時，並納入專案時程 B.估算工作的可能期程或複雜度C.估算待辦清單項目的故事點 這三項任務與開發手法之間的對應，何者是最適當的？A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果", "options": ["B與C皆是調適性開發手法的工作。", "B與C皆是混合式開發手法的工作。", "A是混合式開發手法的工作、B是所有開發手法的工作。", "A是預測式開發手法的工作、B是所有開發手法的工作。"], "answers": [3], "explanation": "*「任務A：估算地板工程活動的工時，並納入專案時程」是一種以明確任務為單位，估算工時並整合進時程基準的行為，這是典型的預測式開發手法特徵。這類手法強調：事前規劃 → 工時估算 →時程基準 → WBS / Gantt chart。*「任務 B：估算工作的可能期程或複雜度」的描述較中性，沒有明說是用什麼估算方式，因此可能適用於所有開發手法。*「任務 C：估算待辦清單項目的故事點」提到使用「故事點」，這是典型的調適性開發手法的做法。它反映相對複雜度與工作量估算，而非確切工時。* 所以正解是「A是預測式開發手法的工作、B是所有開發手法的工作」。"}, {"source": "PMSuccess5.pdf", "number": 4, "stem": "專案團隊正在為一個HRM系統建置專案進行初步規劃，專案經理希望可以盡快確定專案的假設、限制、風險和議題。請將下方的文字描述與專案的假設、限制、風險和議題進行正確的配對。 A.今天上午，使用於專案的伺服器忽然停止服務。 B.組織高層表示將於下個月升級基礎設施，以避免伺服器再次故障。 C.專案團隊擔心伺服器故障事件可能導致專案資料的遺失。 D.由於目前基礎設施的能力有限，專案團隊只能戰戰兢兢地推動開發工作。", "options": ["A是限制、B是風險、C是假設、D是議題。", "A是議題、B是假設、C是風險、D是限制。", "A是假設、B是風險、C是議題、D是限制。", "A是風險、B是限制、C是議題、D是假設。"], "answers": [1], "explanation": "「伺服器忽然停止服務」是指已經發生的事件，所以是議題。且必須找到解決方案的問題。「組織認為升級基礎設施後就可以避免伺服器再次故障」這是假設，有此假設，團隊就可以依照此假設來估算成本與時程。「擔心某件事情是否會發生」指的是風險。最後，「團隊目前在能力受限的基礎設施上進行工作」指的是限制。"}, {"source": "PMSuccess5.pdf", "number": 5, "stem": "專案執行後期，部分團隊成員工作超載，而其他成員尚有餘裕。里程碑仍可實現，但品質和可持續性的風險正在增加。專案經理應該怎麼做？", "options": ["保持指派不變以保護穩定性。", "接受超載，並在交付後解決。", "請求額外資源以減輕壓力。", "重新平衡工作以善用可用容量。"], "answers": [3], "explanation": "這題的關鍵是「專案已到後期，里程碑仍可達成，但團隊內部出現工作量分配不均」，這代表目前不是單純缺人，而是資源配置與工作負荷需要調整。因此，專案經理應該先重新平衡工作，讓有餘裕的成員支援超載的成員，降低品質風險、疲勞風險與團隊士氣問題。此外，重新平衡工作可以優化現有產能、降低風險，並在不增加成本的情況下穩定交付。故最佳解是「答案：重新平衡工作以善用可用容量」。"}, {"source": "PMSuccess5.pdf", "number": 6, "stem": "有一個新產品的開發專案將在困難的商業環境中啟動。競爭導致了賣價下降，補給成本提升。在這種情況下，為什麼敏捷增量式專案手法是最安全的選擇？", "options": ["它可確保專案可以隨時被取消，且不會造成損失。", "它可減少團隊規模，並消除溝通的瓶頸。", "它可加快商業價值的交付，並將風險降至最低。", "它可提供嚴格的方法來降低品質與合規性成本。"], "answers": [2], "explanation": "加速取得的商業價值與更好的定位是增量交付的結果，因為較小的版本可以更快速地進入市場，並從早期的使用者的回饋中受益。其他選項有的不切實際，如：取消不會造成損失），有的與管理手法無關，如：團隊規模和品質管制。"}, {"source": "PMSuccess5.pdf", "number": 7, "stem": "執行到一半時，贊助人要求定期提供財務更新，以清楚說明成本績效、新興趨勢以及對資金決策的潛在影響。先前的報告雖然詳細，但非財務背景的利害關係人難以解讀。專案經理應該做什麼？", "options": ["提供詳細的成本明細，以確保每份報告都完全透明。", "規劃財務報告，將成本數據轉化為清晰的洞見。", "要求財務部門直接向贊助者傳達財務績效。", "將報告內容限制在預算差異，以保持更新簡潔。"], "answers": [1], "explanation": "這題的關鍵是：贊助人要的不只是「成本數字」，而是希望定期了解：成本績效、新興趨勢，以及對資金決策的潛在影響。題目也說，先前報告雖然詳細，但非財務背景的利害關係人難以解讀。這表示問題不是資料不足，而是財務資訊沒有被轉化成可理解、可決策的管理洞見。所以專案經理應該規劃適合利害關係人的財務報告方式，例如：成本績效目前是好是壞、偏差是一次性問題還是持續趨勢、未來是否可能需要額外資金、目前資金是否足以支持後續階段、需要贊助人做什麼決策。有效的財務報告著重於清晰度和決策支援。將成本數據轉化為有意義的見解，有助於利害關係人理解其影響並做出明智的資金決定。故正解是「規劃財務報告，將成本數據轉化為清晰的洞見」。"}, {"source": "PMSuccess5.pdf", "number": 8, "stem": "某專案經理加入一個專案，該專案的團隊成員經驗豐富，但他們同時處理多項計畫。儘管時程和交付成果都已明確定義，但早期的執行問題顯示出重複性工作和決策延遲。專案經理應該做什麼？", "options": ["密切監控團隊表現，並在執行期間主動處理新出現的問題。", "更新專案時程與任務分配，以反映更明確的權責歸屬和相依性。", "要求功能經理為每位團隊成員指派具體任務，以實現更好的協調。", "與團隊釐清角色和職責，以建立明確的所有權和決策界線。"], "answers": [3], "explanation": "這題的關鍵是：雖然團隊成員經驗豐富，時程與交付成果也已明確定義，但仍出現重複性工作和決策延遲的問題。所以問題不是能力不足，而是角色、責任、所有權與決策界線不明確。因此，專案經理最適合先與團隊釐清角色與職責，例如使用RACI矩陣或責任分派矩陣，讓大家清楚：誰負責執行？誰擁有決策權？誰需要被諮詢？誰只需要被告知？故領導專案團隊需建立明確的角色和職責。釐清所有權責和決策界線可以解決工作重複和決策延遲的根本原因，從而實現多個計畫之間的有效協調。"}, {"source": "PMSuccess5.pdf", "number": 9, "stem": "專案經理今早收到三位專案團隊成員的長假需求。一位成員因為家庭緊急因素而請假、一位成員是為了準備重大考試，而另一位是因為自身的健康因素而要求請假。此專案對於組織的發展非常重要。專案經理該做什麼？", "options": ["與這些成員協商，要求他們在休假前加班，以提前完成他們手上的工作。", "保持平衡至關重要：批准他們的請假要求，但是需縮短30％的休假時間，以免影響專案進度。", "批准所有的休假請求，專案經理應該體諒專案成員。", "評估批准休假申請會對專案造成什麼影響。", "根據申請時間和公司政策決定休假的優先順序。"], "answers": [3], "explanation": "* 此題的關鍵點是：- 三位專案成員皆有合理的長假需求（家庭緊急事件、重大考試、健康因素）。- 專案對組織發展至關重要，需要確保不會嚴重影響進度。- 專案經理的角色是在員工需求與專案成功之間取得平衡。* 在這種情況下，專案經理應該先進行影響評估，確保專案的風險與對策是可控的，而不是立即決定批准或拒絕休假。也就是說，專案經理評估之後才能做出平衡的決策來兼顧員工福祉與專案成功。* 其他選項是錯誤的，因為：分析：- 雖然公司政策是重要的依據，但這不是唯一考量。專案經理應該先評估影響，而非單純按照申請時間排序。-「批准請假要求，但縮短30%休假時間」可能會影響員工的信任感與士氣，尤其是涉及健康與家庭緊急事件的休假。應該先評估影響，而非直接削減休假時間。- 雖然體諒員工很重要，但如果不考慮專案的影響，可能會導致進度嚴重延遲，影響組織發展。-「與成員協商，要求他們在休假前加班」可能會增加員工的壓力，尤其是已經面臨健康問題或家庭緊急事件的成員。此外，加班未必能有效解決問題。"}, {"source": "PMSuccess5.pdf", "number": 10, "stem": "專案經理負責一項與過去專案類似的專案，並使用三點估算法估算出專案預算，但贊助人質疑預算的準確性。專案經理該如何處理？", "options": ["變更成本基準。", "使用順序圖示法向贊助人說明。", "改用類比估算法進行估算。", "改用由下而上估算法進行估算。"], "answers": [3], "explanation": "採用由下而上估算法時會先估算個別活動的成本，然後匯總至更高層級。此估算方式雖然較費時，而且只能在WBS已經被明確定義後才能進行，但其估算結果會最準確。"}, {"source": "PMSuccess6.pdf", "number": 1, "stem": "專案經理在一家知名醫療器材公司帶領一大型專案，此專案除了需遵守行業法規和政府規範外，還需嚴格遵從專案預算與時程表。召開啟動會議之前，專案經理發現預估成本與時程尚未獲得批准，無法完成專案啟動文件。專案經理應該採取什麼行動？（選兩項）", "options": ["要求專案管理辦公室（PMO）盡快批准計畫書。", "通知專案贊助者。", "進行風險分析，並增加品質成本。", "提出變更申請，以利加快審核速度。", "確認成本與時程表未獲得批准的原因，並與相關的利害關係人溝通。"], "answers": [1, 4], "explanation": "* 召開啟動會議之前，專案經理需確保專案管理計畫書，已經獲得專案贊助者以及相關利害關係人的核准，以利可以在會議中與所有利害關係人溝通專案事宜。* 此外，通知專案贊助者也是正確的作法，因為贊助者有責任決定成本，並決定是否可以核准計畫書。"}, {"source": "PMSuccess6.pdf", "number": 2, "stem": "某個採用混合式開發方法的應用程式開發專案的固定預算為800,000歐元。專案團隊採用資訊散熱器向利害關係人發布實際成本 (AC) 和計劃成本 (PC) 等資訊。專案團隊注意到在過去的四個月中，實際成本持續超過計劃成本，而且差異變得越來越大。專案團隊應該做什麼？", "options": ["評估剩餘成本，並告知團隊只開發符合剩餘預算的任務。", "與專家一起評估剩餘工作的成本，並要求增加預算。", "制定一份包含合理價格的專案契約。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "在專案範疇保持不變的情況下，將品質降低到最低的可行指標（minimum viable metric）。"], "answers": [3], "explanation": "由於此專案採用固定預算，因此不適合增加預算，而是應該在範疇不變的情況下，找出可以調整的地方，如降低品質，或者是與利害關係人協商，刪除不必要的功能，以確保能在預算內完成關鍵需求。"}, {"source": "PMSuccess6.pdf", "number": 3, "stem": "一項採用預測式方法的企業系統升級專案，已完成商業文件，並獲准啟動。專案進入規劃階段後，一位新加入的高階利害關係人表示，他不想先閱讀完整的可行性分析或效益衡量資料，而是想快速了解此專案為何被正式啟動、要解決的商業需要、以及專案預期達成的高階目標。專案經理應引導該利害關係人查閱哪一項工件？", "options": ["商業企劃案", "專案管理計畫書", "效益管理計畫書", "專案章程 (A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [3], "explanation": "正解是「專案章程」。題目關鍵是「正式啟動」、「商業需要」、「高階目標」。專案章程是授權專案的文件，並承接商業論證後形成。教材也提到商業企劃案通常會導向專案章程；此外，期望與需求也可記錄在專案章程中。雖然「商業企劃案」確實包含商業需要、成本效益分析與專案是否值得投資的理由；但題目說專案已獲准啟動，利害關係人想看的是「正式啟動後」的高階專案目標與啟動依據，因此不是最佳答案。"}, {"source": "PMSuccess6.pdf", "number": 4, "stem": "某預測型專案正在進行成本規劃。專案團隊已完成活動成本估算，並針對已辨識的技術風險、供應商交付延遲風險及匯率波動風險，量化可能的成本影響。專案經理計畫將一筆儲備納入成本基準，以便在這些已辨識風險發生時使用。在審查成本管理計畫書時，財務部門與專案贊助人對儲備的使用方式提出幾項說法。下列哪些說法不是應變儲備的正確使用方式？（選兩項）", "options": ["專案若加入應變儲備，則需減少活動成本的總估算。", "應變儲備的使用應依成本管理計畫、風險回應計畫或組織治理規定執行。", "應變儲備可用於已辨識風險發生時的成本影響。", "若專案加入應變儲備，應相對減少活動成本估算，以維持總預算不變。", "應變儲備可用於處理「未知的未知」風險或未事先辨識的工作。"], "answers": [3, 4], "explanation": "應變儲備是為已辨識風險所保留的預算，通常會納入成本基準。成本基準再加上管理儲備，才形成完整的專案預算。應變儲備用於處理「已辨識風險」的成本影響，也就是常說的已知的未知（known unknowns）。例如已知供應商可能延遲，因此預留額外費用。應變儲備雖然屬於成本基準的一部分，但仍應依成本管理計畫、風險回應計畫或組織規定使用。不能解讀為專案經理可完全不受管控地任意動用。故選項「應變儲備可用於處理未知的未知風險或未事先辨識的工作」和「若專案加入應變儲備，應相對減少活動成本估算，以維持總預算不變」是錯誤的說法。"}, {"source": "PMSuccess6.pdf", "number": 5, "stem": "某個城市垃圾管理專案採用混合式方法。主要的系統改善工作由敏捷團隊以迭代方式交付，且目前進展良好；但許多短暫的行政協調事項與小型公共工程任務，因為依賴市民通報、天候、承包商可用性或現場觸發事件，持續在待辦清單中累積。大多數任務可在一天內完成，但若未即時處理，可能會阻塞後續工作並影響利害關係人信任。專案經理應該採取哪種方法，最有效地快速清除這些小型任務？", "options": ["將這些小型任務納入驗收標準，以確保團隊在交付主要成果時一併處理。", "每天重新排列整個產品待辦清單的優先順序，讓最小的故事優先進入下一個迭代。", "將多個小型任務合併成較大的故事，使其規模與主要敏捷目標一致。", "建立可視化的看板工作流，限制進行中工作，並讓團隊在觸發事件出現時拉取並完成小型任務。"], "answers": [3], "explanation": "* 正解是「建立可視化的看板工作流，限制進行中工作，並讓團隊在觸發事件出現時拉取並完成小型任務」。看板適合管理持續流入、大小較小、完成時間短且觸發時間不固定的工作。透過可視化工作、限制進行中工作並採用拉式制度，團隊能快速回應觸發事件，同時避免讓小任務阻塞主要交付。* 其他選項是錯誤的，因為：- 每天重新排序整個產品待辦清單雖然能提高彈性，但可能干擾主要敏捷目標的穩定交付。題目中的小型任務具有事件驅動、短週期、可快速完成的特性，較適合用流動式工作管理，而不是不斷重排整個待辦清單。- 將多個小型任務合併成較大的故事，可能讓工作看起來更一致，但會降低透明度、延遲處理時間，且不符合這些任務「短暫、事件觸發、可快速完成」的特性。- 雖然驗收標準可用來確認交付成果是否符合完成條件，但不能取代對小型營運或現場任務的排程與流動管理。把任務塞進驗收標準，可能會模糊交付品質標準與待辦工作管理之間的界線。"}, {"source": "PMSuccess6.pdf", "number": 6, "stem": "在專案初期，多個工作流程並行運行，依賴於來自不同職能領域的相同專業資源。利害關係人對於交付目標已達成共識，但各團隊對資源可用性的假設程度並不相同。職能經理指出，存在相互衝突的營運優先級可能會限制資源取得。在強化交付承諾之前，專案贊助人詢問了計劃資源使用的可行性。專案經理應該做什麼？", "options": ["根據目前的資源可用性調整工作流程排程，並據此指派專家。", "向治理單位呈報資源可用性限制，並請求提供優先順序指引。", "根據功能經理提供的現有庫存狀況訊號，更新交貨承諾。", "釐清每個工作流程的資源需求，並與功能經理確認可用性。"], "answers": [3], "explanation": "這題的關鍵是：專案還在初期，利害關係人雖然已對交付目標有共識，但各團隊對「資源可用性假設」不同，而且職能經理也提醒可能有營運優先順序衝突。所以在專案贊助人要求確認資源使用可行性時，專案經理不應該立刻承諾、調整時程或升級，而是要先把資源需求與可用性釐清。故最佳做法是：先釐清每個工作流程需要哪些專家資源、需要多久、何時需要，再與功能經理確認實際可用性與限制。"}, {"source": "PMSuccess6.pdf", "number": 7, "stem": "在專案的某個迭代進行中，一位實習生取代了某個關鍵資源，為了加速實習生的工作進度，專案經理指派一位資深工程師進行輔導，但兩個月後專案進度嚴重落後。專案經理該如何避免這種狀況？", "options": ["說服關鍵資源留在專案團隊。", "以資深人員取代該關鍵資源。", "協商取得更多的時間來完成專案。", "分配更多的時間進行輔導。"], "answers": [1], "explanation": "* 以資深人員而非實習生來取代關鍵資源是最佳解。請注意此選項並無說該資深人員為原來的團隊成員或是從功能經理處取得的新資源。* 其他選項是錯誤的，因為：-「協商取得更多的時間來完成專案」屬於時程延遲的補救策略，但無法解決核心問題（能力不足），是治標不治本。-「分配更多的時間進行輔導」雖然屬於培養團隊能力的一環，但題目情境提到「已經輔導兩個月了」，這表示輔導至目前為止並無法解決能力不足的問題。-「說服關鍵資源留在專案團隊」也不合適，因為題目敘述無從得知實習生取代關鍵資源的原因，無法連結到這個做法是否有效，而且資源指派並不是專案經理能完全掌控的。"}, {"source": "PMSuccess6.pdf", "number": 8, "stem": "W專案已經進行6個月，目前的特徵如下： - 總預算為300萬 - 計劃價值（PV）是63萬 - 實際成本（AC）65萬 - 實獲值（EV）是54萬 下列選項中，哪一項最符合專案目前的狀態？", "options": ["該專案可以提前完成，但是將超出預算。", "該專案進度落後，但是將低於預算。", "該專案進度落後，且超出預算。", "該專案進度提前，且低於預算。"], "answers": [2], "explanation": "CV = EV - AC：54 - 65 = -11 SV = EV - PV：54 - 63 = -9 CV為負值，表示專案超出預算。SV為負值，表示專案的進度落後了。"}, {"source": "PMSuccess6.pdf", "number": 9, "stem": "生產精簡專案已經完成一半。團隊合作良好，對實現目標抱持樂觀的態度。該公司正面臨嚴重的人事問題，許多資深技術人員流失到提供高薪的初創公司。更糟糕的是，製造副總裁要求將團隊最資深的技術資源移到下周將啟動的重大新專案上。團隊領導者應該怎麼做？", "options": ["在精簡專案完成之前，詢問副總裁是否可以共享資源。", "將此資源在精簡團隊中的職責外包給專家。", "提出保留該資源的理由，以確保實現專案成果。", "將團隊成員重新分配到製造部門，並聘請兩名通才進入精簡專案。"], "answers": [2], "explanation": "專案成果是團隊領導的最高優先事項，因此他們應該盡其所能保護它。雖然一個組織良好的專案團隊不應該依賴任何一個成員，無論他們多麼有才華或技能。但在此題的情境下，還是須先考量專案的資源問題。如果無法達成協議，則需將問題升級，以求解決。"}, {"source": "PMSuccess6.pdf", "number": 10, "stem": "在執行初期，一個專案會有多個成本類別，在不同階段有不同的支出模式。專案贊助者希望了解實際支出將如何隨著時間推移，而非僅在階段關卡，受到預算監控。專案經理應該做什麼？", "options": ["以彙總層級追蹤專案總支出，而不區分成本類別。", "定義符合生命週期和成本類別的支出追蹤方法。", "要求財務部門獨立於專案控管部門來報告差異。", "僅在重大里程碑時檢視實際成本，以減少報告工作。"], "answers": [1], "explanation": "這題的關鍵是：專案有多個成本類別，而且在不同階段會有不同的支出模式；專案贊助者希望了解實際支出如何隨時間推移被監控，而不是只在階段關卡才看一次。所以專案經理應該建立一套能反映專案生命週期與成本類別的追蹤方式，以便可以及時了解成本績效，並在支出模式變化時支援主動的財務控制。故最佳解是「定義符合生命週期和成本類別的支出追蹤方法」。"}, {"source": "PMSuccess7.pdf", "number": 1, "stem": "在採用敏捷式方法的軟體開發專案中，產品負責人在下個迭代開始前可以先準備好什麼，以促進迭代規劃的進行並節省時間？（選兩項） a.短衝目標 b.待辦的使用者故事 c.燃盡圖 d.看板 e.短衝章程", "options": ["a和b", "a和e", "b和e", "c和d"], "answers": [0], "explanation": "正解是：a和b。在迭代規劃會議時，產品負責人（product owner）與開發團隊會依據迭代（短衝）目標一起討論出該迭代預計將開發的故事。所以，產品負責人最好手上已經有清楚的迭代（短衝）目標，以及待辦的使用者故事，這樣團隊在選擇故事時才能有所依循。"}, {"source": "PMSuccess7.pdf", "number": 2, "stem": "專案團隊正致力於開發一個智能語音助理的核心功能。某天有一位開發人員向專案經理表示他很沮喪，因為某位資深成員每次都會挑選所有有趣的待辦清單項目，將重複性和繁瑣的任務留給其他人處理。專案經理應該如何處理此情況？", "options": ["鼓勵感到不滿的成員參加提升自信的培訓，以增強面對不公平的應對能力。", "定義工作分配規則，並要求所有成員必須輪流選擇待辦清單項目。", "私下與資深成員面談，討論公平分配工作的重要性以及對團隊合作的影響。", "召開全體開發人員討論會議，共同制定新的工作分配基本規則。 (\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [3], "explanation": "* 專案經理應引導團隊公開討論並制定共識性的基本規則，這樣既能解決當前問題，又能促進團隊內部的透明和合作精神，同時提升團隊凝聚力。* 私下討論可能解決部分問題，但無法讓整個開發團隊釐清並改善工作分配的規則，且可能導致問題反覆出現。* 在敏捷式專案中，專案經理的角色是引導而非命令，直接制定規則會削弱團隊的自組織能力，與敏捷原則不符。*「鼓勵感到不滿的成員參加提升自信的培訓」這選項忽略了問題的根本原因，這樣做可能讓抱怨者覺得其感受被忽視，反而加劇不滿情緒。"}, {"source": "PMSuccess7.pdf", "number": 3, "stem": "一家國際銀行正在進行跨國合併計畫，範疇包含核心金融系統整合、法規遵循、資料移轉、分行作業流程調整，以及不同國家團隊的組織文化整合。由於各地監管要求、客戶服務模式與內部流程差異很大，許多需求在初期尚無法完全確認。 銀行聘請的顧問建議，在部分工作流中導入敏捷方法，例如以短週期驗證整合假設、頻繁取得業務與法遵回饋，並逐步調整優先順序。高階主管詢問顧問為何提出此建議。 顧問最可能基於哪些理由建議使用敏捷？（選兩項）", "options": ["讓團隊跳過既有治理與核准流程。", "頻繁回饋可消除專案問題。", "透過短週期回饋調整整合方向。", "協助組織處理高度複雜與變動。 (A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果", "因為敏捷是金融合併的標準做法。", "以更快工作取代法遵與風險分析。"], "answers": [2, 3], "explanation": "正解是「透過短週期回饋調整整合方向」和「協助組織處理高度複雜與變動」。合併專案中的系統、流程、法規與使用者需求都可能逐步浮現。敏捷方法可透過短週期交付、展示、回饋與調整，讓團隊及早驗證假設，而不是等到大型整合完成後才發現方向錯誤。此外，國際銀行合併屬於高度複雜、變動大、利害關係人多且不確定性高的情境。敏捷或混合式方法有助於在複雜環境中逐步探索、調整做法並提高組織對變更的容忍度。教材在選擇專案方法時也提到，動態全球變化、複雜度與風險增加、創新需求，都是選擇與調整方法時要考量的因素；調適型方法可支援動態工作環境、及早探索價值需求，並促進利害關係人與團隊密切合作。"}, {"source": "PMSuccess7.pdf", "number": 4, "stem": "一項預測型專案原訂時程為 24個月，總預算為 8,000 萬元。專案目前已完成 30%，但最新成本績效顯示 CPI 為 0.91，代表專案已有成本效率偏低的趨勢。此時，主要利害關係人因市場窗口提前，要求專案必須在 18 個月內完成，但同時表示「預算最好不要增加太多」。專案團隊初步評估後發現： • 趕工可縮短部分關鍵路徑活動，但會增加外包與加班成本。 • 快速跟進可縮短時程，但可能增加返工與品質成本。 • 延後部分低價值需求到第二階段，可降低額外成本，但會影響第一階段範疇。 • 若維持全部範疇且壓縮時程，成本基準很可能需要調整。 專案經理應如何回應此要求？", "options": ["召集團隊找出可以趕工或快速跟進的活動，並優先選擇成本增加最少的壓縮方案，以維持原範疇與目標日期。", "要求團隊加速執行目前工作，並持續監控成本績效，等到實際成本偏差超過控制門檻後再提出變更申請。", "與利害關係人合作刪減或延後部分需求，以避免增加預算，並在取得口頭共識後更新專案時程。", "依據目前 CPI、成本預測與時程壓縮方案，評估趕工、快速跟進、範疇延後對成本基準、風險與商業價值的影響，並依變更流程提出建議。"], "answers": [3], "explanation": "題目表面上是時程從 24 個月縮短到 18 個月，但真正考點是：壓縮時程會造成成本影響，且成本基準可能需要變更。所以專案經理不應只選一種壓縮方法，也不應直接刪減範疇或要求團隊加速，而應先做整合分析，包括：趕工會增加多少外包、加班或顧問成本？ 快速跟進可能造成多少返工與品質成本？延後低價值需求是否能降低第一階段成本壓力？成本預測、EAC、ETC 是否需要更新？是否會影響成本基準、時程基準與範疇基準？是否需要正式變更申請？此外，成本基準是用來與實際結果比較的核准版本，且只能透過正式變更控制程序修改；同課也說明成本管理需監控成本差異、預測財務績效，並在成本或範疇變更時依治理流程提交正式變更請求。故「依據目前 CPI、成本預測與時程壓縮方案，評估趕工、快速跟進、範疇延後對成本基準、風險與商業價值的影響，並依變更流程提出建議」是正解。"}, {"source": "PMSuccess7.pdf", "number": 5, "stem": "在迭代結束時，故事無法被完成的態勢已變得明顯。多位團隊成員參與了這些故事的開發，但都沒有發現任何阻礙。敏捷團隊可以做些什麼來解決這種情況？", "options": ["與產品負責人一起進一步分解待辦清單中的故事，並更新備妥的定義 (DoR)。", "使用下一個迭代作為團隊Spike，以確認完成這些故事的可行性。", "將這些故事放回產品待辦清單中，然後等到較不那麼急迫的迭代時再處理它們。", "將這些故事放在「障礙」欄中，並與產品負責人一起消除這些障礙。"], "answers": [0], "explanation": "當故事無法在一個迭代中被完成，通常是因為故事沒有被分解成足夠小的目標。其他選項都不正確，因為：- 團隊不會藉由等待或是為障礙進行佈局來解決根本原因。- 如果障礙未被辨識與分析，產品負責人就無法消除障礙。- 將整個團隊投入到Spike（探針）開發是低效能的，並且這是繞過了一般的待辦事項精煉活動。"}, {"source": "PMSuccess7.pdf", "number": 6, "stem": "ABC公司目前有四個專案正在考慮，他們希望可以從中選擇出一個最佳的專案。 * 專案A：為期6年、淨現值為$70,000。 * 專案B：為期3年、淨現值為$30,000。 * 專案C：為期5年，淨現值為$40,000。 * 專案D：為期1年、淨現值為$60,000。 請問，你建議選擇哪一個專案？", "options": ["專案 C", "專案 D", "專案 B", "專案 A"], "answers": [3], "explanation": "以淨現值(NPV)來選擇專案時，不需要考量期限，因為期限已經被包括在淨現值的計算中了。所以只需要選擇淨現值最高的專案即可。"}, {"source": "PMSuccess7.pdf", "number": 7, "stem": "專案經理進行實獲值分析，得到如下圖的資料。請問，專案的時程狀況是？", "options": ["專案時程已經逾期", "專案時程逾期兩週", "專案時程尚在預期內", "專案時程超前"], "answers": [0], "explanation": "時程變異的公式是：SV= EV - PV。SV= $3,500 - 5,500= -2,000。SV為負值，表示專案時程已經逾期。"}, {"source": "PMSuccess7.pdf", "number": 8, "stem": "在汽車工廠中的一位專案經理正對於一項複雜的專案安排時程，該專案的某些需求是固定的而有些是變動的。專案經理進行了下列工作： A.估算「輪胎複合材料混合」的期程並納入專案時程。 B.對於待辦清單中的故事指派故事點。 C.取得團隊成員協助估算期程或複雜度。 D.確保專案階段結束時所有的迭代都結束，反之亦然。 請將以上工作對應到正確的開發手法。", "options": ["A：預測式、B：敏捷式、C：混合式、D：所有的開發手法", "A：預測式、B：敏捷式、C：所有的開發手法、D：混合式", "A：所有的開發手法、 B：敏捷式、C：混合式、D：預測式", "A：所有的開發手法、 B：混合式、C：預測式、D：敏捷式"], "answers": [1], "explanation": "* 正解是：A：預測式、B：敏捷式、C：所有的開發手法、D：混合式。* 選項「A. 估算『輪胎複合材料混合』的期程並納入專案時程」是預測式方法。在預測式開發手法中，專案經理通常根據固定需求進行詳細的規劃，如期程的估算，並將其估算結果納入專案時程表中。* 選項「B.對於待辦清單中的故事指派故事點」是敏捷式方法。指派故事點是敏捷式開發中的特有活動。* 選項「C.取得團隊成員協助估算期程或複雜度」對應到所有的開發手法。團隊協作估算是一種通用活動，無論是預測式、敏捷式還是混合式開發手法，都會依賴團隊的專業知識進行期程或複雜度的估算。* 選項「D. 確保專案階段結束時所有的迭代都結束，反之亦然」對應的手法是混合式。將專案階段（來自預測式）與迭代（來自敏捷式）結合是一種典型的混合式特徵。"}, {"source": "PMSuccess7.pdf", "number": 9, "stem": "某專案在規劃預算時，因組織過去曾執行過相似範疇的專案，專案經理採用類比估算建立初始成本預算。該估算主要參考過往專案的總成本，並依規模差異做比例調整。 專案執行半年後，實際成本明顯高於預算。進一步分析發現，本專案雖然範疇類似，但技術複雜度較高，供應商費率不同，部分工作包也需要額外專家支援。贊助人因此質疑原本預算估算的準確性。 若專案經理在規劃時希望降低此類估算落差，最適當的做法是什麼？", "options": ["使用可反映不確定性的三點估算法，以呈現客觀的成本區間。", "增加利害關係人審查，以確認假設與取得承諾。", "採用先分解工作包後再彙總成本的由下而上估算法。", "先補強歷史資料與估算假設後，再進行類比估算。"], "answers": [2], "explanation": "此題的關鍵是：專案雖然「範疇類似」，但實際上存在技術複雜度、供應商費率、專家支援等差異。這代表只用過往專案總成本來做類比估算，精確度不足。故較佳做法是將專案分解到工作包或活動層級，估算各項成本後再彙總，也就是採用由下而上估算法。教材中也說明，成本估算應估算每個活動或工作包的成本，成本項目可包含人力、材料、設備、設施、服務、資訊技術與應急儲備；專案預算則可使用 bottom-up approach 彙總活動成本、工作包成本與成本基準。"}, {"source": "PMSuccess7.pdf", "number": 10, "stem": "組織今年度的一個「戶外播音設備及教學設備改善專案」中包含一個成本加固定費用(CPFF)的採購案。廠商於評估過後，估計此專案的成本為$50,000，酬金為$5000。但是於結案時，廠商所提供的最終成本為$60,000。請問，你應該支付廠商多少錢？", "options": ["$50,000", "$65,000", "$55,000", "$60,000"], "answers": [1], "explanation": "成本加固定費用(CPFF)指的是：買方除了需要支付賣方執行契約的所有合理成本外，還需要支付一筆固定服務費，此費用會於專案初估成本時就商定好，且不受績效影響。故，你需要支付的就是最終成本加上初期所商定的酬金。"}, {"source": "PMSuccess8.pdf", "number": 1, "stem": "專案經理帶領的軟體發展專案的計劃值是：260、實獲值是：240、實際成本是：250、時程績效指標(SPI)是：0.92。此專案現在的狀況是？", "options": ["超出預算，時程落後。", "低於預算，時程落後。", "低於預算，時程超前。", "超出預算，時程超前。"], "answers": [0], "explanation": "成本績效指標(CPI) = 實獲值(EV) / 實際成本(AC)。當成本績效指標(CPI)小於1時則表示成本超出了預算，反之，大於1時則表示成本低於預算。此專案的成本績效指標(CPI)是：240 / 250 = 0.96，0.96小於1，所以此專案的成本超出了預算。另外，時程績效指標(SPI)是：0.92，0.92小於1則表示時程落後。"}, {"source": "PMSuccess8.pdf", "number": 2, "stem": "組織正在評估與考量要選擇哪一個方案來執行專案。方案A：設備費用$8,000，可使用次數：500次；方案B：設備費用$9,000，其可使用次數：600次。使用一次可為專案帶來$20的收益。請問，哪一個方案的獲利較佳？", "options": ["方案B，可獲利$2,000。", "方案B，可獲利$3,000。", "方案A，可獲利$2,000。", "方案A，可獲利$3,000。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [1], "explanation": "* 方案 A：$20 * 500（收益） – $8,000（成本） = $2,000* 方案 B：$20 * 600（收益） – $9,000（成本） = $3,000* 故，最佳解為：方案B，可獲利$3,000。"}, {"source": "PMSuccess8.pdf", "number": 3, "stem": "專案執行一半，一項關鍵交付成果有賴於少數專業資源，而這些資源同時也在支援營運工作。預測顯示，專案需求的暫時高峰與一個關鍵的營運期重疊。利害關係人希望確保交付不會受到干擾。專案經理應該做什麼？", "options": ["凍結目前的分配，以避免在關鍵時期造成中斷。", "要求贊助者確保能獨家使用專門的資源。", "檢視需求高峰並同意臨時分配調整。", "推遲交付項目，直到營運需求恢復正常水平為止。"], "answers": [2], "explanation": "A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n這題的關鍵情境是：專案需要的少數專業資源同時也支援營運工作，而且預測到專案需求高峰會與營運關鍵期重疊，代表即將發生資源衝突。遇到這種情況時，專案經理不應直接要求獨占資源，也不應自行延後交付，而是要先和相關資源擁有者、營運單位及利害關係人一起檢視：專案何時需要這些專業資源？營運關鍵期何時需要資源？哪些工作可以調整順序？是否可以短期調整分配比例、錯開工作高峰或安排替代支援？此外，檢討需求高峰並同意臨時調整，可在不致過早升級問題的情況下，支援交付的連續性，同時平衡專案與營運需求，因此最佳做法是「檢視需求高峰並同意臨時分配調整」。"}, {"source": "PMSuccess8.pdf", "number": 4, "stem": "在一個混合式專案中，product owner的時程非常緊湊，他希望將自己的一些任務委任給經驗豐富的敏捷團隊。哪項任務適合委派給敏捷團隊？", "options": ["啟動並進行待辦清單修整會議。", "開發並明確的描述與溝通產品目標。", "在確定優先等級之前將項目添加到待辦清單中。", "根據待辦清單項目的大小來進行優先等級的排序。", "將已排序過的項目挑選進sprint待辦清單中。"], "answers": [4], "explanation": "Product owner通常擁有依據商業需求對待辦清單進行優先等級的排序與規劃的唯一權限。而修整時也需要確定優先等級。只有將已排序過的項目挑選進為sprint待辦清單中是可以委任的。"}, {"source": "PMSuccess8.pdf", "number": 5, "stem": "一項新專案需要提交以獲得緊急的資金核准。該專案將使用一項新技術，這對組織來說至關重要。整個 Scrum 團隊已經合作超過 3 年，共同完成了多個專案，並且在上一個專案中以低於核准預算的成本完成交付。在這種情況下，專案經理應該實施哪種估算技術？", "options": ["預算估算 (Budget estimate)。", "故事點估算。", "粗略量級估算 (Order of magnitude)。", "確定性估算 (Definitive estimate)。"], "answers": [2], "explanation": "* 正解是「粗略量級估算 (Order of magnitude)」。這題最關鍵的不是「Scrum 團隊很強、曾經低於預算」，而是以下這兩個詞：-「緊急資金核准」（urgent funding approval）：代表此刻在 專案早期/高不確定 階段，需要「快速」給決策者一個可用來做投資判斷的成本量級。- 新技術（new technology）：代表不確定性更高、需求與技術風險更大，細緻估算（Definitive /Budget）通常不具備足夠資訊或不值得花時間做到很精準。* 在 PMI 教材中也強調：ROM 常用來作為預算估算的起點，先給一個「量級」以支持早期決策，再逐步細化。"}, {"source": "PMSuccess8.pdf", "number": 6, "stem": "你是某大型智慧園區建設專案的專案經理。專案為期三年，包含法規許可、土建工程、機電安裝與智慧監控系統整合。土建設計與主要合約範疇大致穩定，且預算與關鍵完工日期已由治理委員會核准；但現場施工條件、跨包商介面、設備整合需求及使用者回饋仍可能頻繁變動。高層希望維持成本與時程基準，同時提升團隊對變更與現場問題的回應速度。專案經理應建議採用哪一種方法？", "options": ["採用敏捷方法，將整個建設專案拆分為短週期迭代，以便在每次迭代中重新排序所有工作項目。", "將高變動性的施工與整合工作委外給總承包商，由承包商自行決定執行方法，以降低專案團隊管理複雜度與風險。", "採用滾動式規劃，在近期工作中保留較高細節，並將後續階段延後規劃，以降低前期規劃負擔。", "採用預測式方法，建立完整的範疇、時程與成本基準，並透過正式變更控制處理所有現場變動。", "採用混合式方法，對穩定且受治理約束的工程範圍維持預測式控制，並在整合、介面協調與現場問題處理上導入迭代式回饋機制。"], "answers": [4], "explanation": "* 正解是「採用混合式方法，對穩定且受治理約束的工程範圍維持預測式控制，並在整合、介面協調與現場問題處理上導入迭代式回饋機制」。本題的關鍵是：專案同時具備可預測性與高度不確定性。題目中有兩組訊號：第一組是適合預測式管理的條件：土建設計與主要合約範疇大致穩定、預算與關鍵完工日期已核准、以及法規許可、土建工程、主要合約通常需要明確基準與治理控制。第二組是需要彈性與快速回應的條件，如：現場施工條件可能變動、跨包商介面複雜、設備整合需求可能調整，以及使用者回饋仍會影響後續整合。因此，最佳做法不是單純採用預測式，也不是把整個建設專案改成敏捷，而是採用混合式方法。也就是：對穩定、受法規與治理約束、需要基準控制的部分使用預測式；對高不確定、需要頻繁協調與回饋的部分使用迭代式或敏捷實務。* 其他選項不佳的原因是：- 採用預測式方法，建立完整的範疇、時程與成本基準，並透過正式變更控制處理所有現場變動：此選項符合預算、時程與治理控制需求，但過於僵化。題目明確指出現場條件、介面協調與設備整合會頻繁變動，若所有變動都只靠正式變更控制，可能降低回應速度，無法滿足高層希望提升應變能力的要求。- 採用敏捷方法，將整個建設專案拆分為短週期迭代，以便在每次迭代中重新排序所有工作項目：敏捷適合需求高度不確定、可逐步交付與快速回饋的部分，但大型建設專案中的法規許可、土建工程、長交期採購與關鍵完工日通常不適合完全以敏捷方式管理。此選項忽略了成本、時程與合約基準的必要性。- 採用滾動式規劃，在近期工作中保留較高細節，並將後續階段延後規劃，以降低前期規劃負擔：滾動式規劃可以處理逐步明朗的資訊，也能提升規劃彈性，但它主要是一種規劃技術，不是完整的方法論選擇。題目問的是如何兼顧控制與彈性，因此僅採滾動式規劃不足以涵蓋整體治理、基準控制與迭代回饋需求。- 將高變動性的施工與整合工作委外給總承包商，由承包商自行決定執行方法，以降低專案團隊管理複雜度與風險：委外不等於解決不確定性，也不代表專案經理可以放棄整合管理與治理責任。即使承包商負責執行，專案經理仍需確保方法論、控制機制、溝通與交付成果符合專案目標。"}, {"source": "PMSuccess8.pdf", "number": 7, "stem": "一個專案具有以下特點： - 300萬美元的預算 - 計劃值是630,000美元 - 實際成本為 650,000 美元- 實獲值為540,000 美元 下列何項是關於此專案當前狀態的正確說法？", "options": ["該專案的時程提前，且超出預算。", "該專案的時程落後，且低於預算。", "該專案的時程提前，且低於預算。", "該專案的時程落後，且超出預算。"], "answers": [3], "explanation": "CV = EV - AC = 540 - 650 = -110 SV = EV - PV = 540 - 630 = -90成本差異為負值，意味著專案超出預算。進度差異為負值，意味著專案的時程落後。"}, {"source": "PMSuccess8.pdf", "number": 8, "stem": "閱讀下列選項，並選出適合採用預測式開發手法的情境。（選三項）", "options": ["專案交付標的不適合分批交付。", "專案交付標的具高度創新性，需採用新技術進行開發，團隊先前也無相關經驗。", "客戶要求及早且頻繁地交付增量。", "組織重視專案團隊的自組織與自管理等特性。", "範疇穩定，且幾乎不會發生變化。", "為了降低風險，專案需進行大量的前置規劃，並制定嚴謹的過程。"], "answers": [0, 4, 5], "explanation": "適合採用預測式開發手法的專案之特性包含：範疇穩定、交付標的不適合分批交付、較大量的前置規劃、嚴謹的過程管控、專案規模與專案團隊龐大。"}, {"source": "PMSuccess8.pdf", "number": 9, "stem": "在規劃初期，一個專案包含多個交付項目，且由不同來源資助，每個來源都有特定的支出限制和報告期望。贊助商在授權下一階段之前，要求先確認財務承諾的實現性。專案經理應該怎麼做？", "options": ["制定詳細的專案時程，以驗證支出與里程碑是否一致。", "分析各組成部分的財務需求，以確認關鍵的資金限制。", "以總體層級追蹤計劃成本，以簡化早期財務討論。", "請求治理部門根據高階預估核准臨時預算。"], "answers": [1], "explanation": "規劃專案財務的第一步是了解整體的財務需求、資金來源和限制。分析各個組成部分的財務需求，為承諾和明智的授權決策提供務實的基礎。故正解是「分析各組成部分的財務需求，以確認關鍵的資金限制」。"}, {"source": "PMSuccess8.pdf", "number": 10, "stem": "組織完成可行性評估和提供營運企劃案後，還需要完成下列何事，才能正式授權專案經理？(選兩項）", "options": ["分析營運需求", "製作契約", "執行專家判斷", "簽核專案章程", "指派專案贊助者"], "answers": [3, 4], "explanation": "專案章程是授權專案或專案階段啟動的正式文件，故，簽核專案章程後，就奠定與開啟了專案的執行方和委託方，或買賣雙方的合作關係。"}, {"source": "PMSuccess9.pdf", "number": 1, "stem": "在規劃期間，識別出數個一旦發生便可能影響專案成本的高衝擊風險。贊助人在核准預算基準前，詢問這些風險如何反映在專案的財務承諾中。專案經理應該做什麼？", "options": ["記錄風險，並僅在財務影響發生時才加以處理。", "請求治理單位核准專案預算外的額外資金。", "量化已識別的風險，並決定適當的應變準備金。", "在總預算中增加一個固定百分比的應急費用，以求簡便。"], "answers": [2], "explanation": "這題的關鍵是：高衝擊風險一旦發生，可能影響專案成本，而且現在是在核准預算基準前。因此，專案經理應該在預算基準建立前，先針對已識別風險進行分析與量化，評估可能的成本影響，再決定需要多少應變準備金（Contingency Reserve）。應變準備金是用來處理已識別風險 （known-unknowns）的預留預算，通常會納入成本基準中。故正解是「量化已識別的風險，並決定適當的應變準備金」。"}, {"source": "PMSuccess9.pdf", "number": 2, "stem": "某組織原本希望新產品在第一次上市時就具備完整功能，包括進階分析、客製化設定、多語系支援與第三方整合。產品負責人評估市場窗口後，建議先在限定時間內完成可支援主要使用情境的核心能力，讓產品先上市取得真實客戶回饋，再依據使用數據與市場反應逐步擴充功能。高階主管接受此方式，但要求團隊說明這種做法主要屬於哪一種開發手法。下列何者最能描述此做法？", "options": ["這是先完成細部規劃再一次交付的預測式方法。", "這是反覆改善同一組功能品質的迭代式開發方法。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "這是分批交付可用產品能力的增量式開發方法。", "這是依市場回饋調整的敏捷框架管理開發方法。"], "answers": [2], "explanation": "* 題目的關鍵是「先完成核心與重要功能後上市」，再依市場反應逐步擴充。這代表產品不是等到所有功能完整後才一次交付，而是先交付一個可用版本，再分批增加功能或能力，因此最符合「這是分批交付可用產品能力的增量式開發方法」。* 其他選項是錯誤的，因為：-「反覆改善同一組功能品質」比較接近迭代式。迭代式重點是對已有成果反覆修正與精煉，不一定代表每次都新增可上市的功能組合。-「先完整規劃再一次交付」比較接近預測式。題目中產品負責人不是等完整功能全部完成才上市，而是先上市核心能力。- 此題確實有敏捷思維，例如快速上市、依市場回饋調整。但「敏捷」是較大的價值觀與方法集合，不是本題最精準的開發手法。若題目問「整體管理方式」，敏捷可能合理；但題目問「先核心上市、再分批擴充」的開發手法，最佳還是增量式。"}, {"source": "PMSuccess9.pdf", "number": 3, "stem": "專案經理與專家一起使用3個數值來估算活動期程，請問，他們使用的是什麼方法？", "options": ["專家判斷", "Beta估算法 (A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果", "由下而上估算法", "參數估算法"], "answers": [1], "explanation": "依據三個數值來進行估算的公式包含：三點估算法與Beta估算法。使用 Beta估算法時，可將不確定性與風險考量在內，故較準確。"}, {"source": "PMSuccess9.pdf", "number": 4, "stem": "在定義交付方法和執行策略後，專案經理開始整合由不同團隊制定的附屬計畫。在此過程中，範疇假設、時程相依性和資源分配之間出現了數個不一致之處。專案經理應該做什麼？", "options": ["整合並協調附屬計畫，以處理相依性、落差和衝突。", "在繼續進行之前，將不一致之處上報給治理單位以尋求指示。", "要求各團隊獨立更新其計畫，以消除不一致之處。", "將差異處記錄進議題紀錄中，並由故該議題的負責人修訂之。", "提出變更申請，並於獲准後修訂差異處。", "優先調整排程，之後再逐步處理其他不一致之處。"], "answers": [0], "explanation": "專案管理計畫書不是把各附屬計畫「合併成一本文件」而已，而是要確認各計畫之間彼此一致，例如：範疇假設是否支持時程安排、時程相依性是否反映資源可用性、資源分配是否能支援關鍵交付順序、供應商計畫是否與整體交付策略一致，以及不同計畫之間是否有缺口、衝突或重疊。因此，專案經理應促進相關團隊協調，整合附屬計畫，解決相依性、落差與衝突。這題的情境顯示專案目前仍處於「制定與整合專案管理計畫書」。此時雖然不同團隊已經各自制定了附屬計畫書，但範疇假設、時程相依性與資源分配之間出現不一致，所以專案經理需要進行整合與協調，而不是立刻上報、各自修改或提出變更。"}, {"source": "PMSuccess9.pdf", "number": 5, "stem": "一項混合式企業系統專案剛獲正式授權。團隊正準備時程管理計畫，討論應採用何種時程模型、報告格式及偏差管制門檻。贊助人先前已承諾於特定季度完成法規測試，並在年度投資審查前達成一項關鍵里程碑；但詳細活動與核准時程尚未建立。 負責排程的團隊成員表示，他不確定哪些日期屬於不可調整的高階承諾，因此無法建議合適的時程管理方式。專案經理應請他先參考哪一項資訊？", "options": ["參考時程基準中的獲准活動之期程。", "參考專案章程中的里程碑承諾。", "參考時程管理計畫書中的偏差門檻。", "參考組織過程資產中的排程控制範本。"], "answers": [1], "explanation": "此專案仍處於規劃初期，詳細專案時程與時程基準尚未建立。此時要確認贊助人已承諾的高階日期、重大事件與時程限制，應先檢視專案章程中的摘要里程碑時程與高階限制。這些資訊可作為後續選擇時程模型、制定管理策略及設定管制方式的邊界。專案章程包含高階專案資訊，其中包括摘要里程碑時程。"}, {"source": "PMSuccess9.pdf", "number": 6, "stem": "在規劃期間，專案時程高度依賴共享資源，以及與進行中營運工作和另一個專案之間的交接安排。若任何一方發生延誤，都可能影響目前專案的交付承諾。贊助人詢問專案經理將如何在時程中管理這些相互依賴性。專案經理應該做什麼？", "options": ["將專案時程聚焦於團隊可直接控制的活動，同時在風險登錄表中記錄外部相依性，避免將不可控因素納入正式時程承諾。", "與相關營運單位及其他專案經理共同確認交接點、共享資源可用性與關鍵相依性，並將已協調的承諾整合進專案時程中持續追蹤。", "建立跨專案相依性升級機制，將共享資源衝突與交接延誤提交給治理單位，以確保影響交付承諾的問題能被及時解決。", "在時程中納入適當的應變儲備與管理儲備，並針對外部交接活動設定檢查點，以降低共享資源或其他專案延誤對交付承諾的影響。"], "answers": [1], "explanation": "* 這題的核心是「規劃期間如何管理相依性」。最佳做法是先與相關單位和其他專案協調相依性、交接點與共享資源，並整合到時程中。故正解是「與相關營運單位及其他專案經理共同確認交接點、共享資源可用性與關鍵相依性，並將已協調的承諾整合進專案時程中持續追蹤」。* 其他選項是錯誤的，因為：- 選項「在時程中納入適當的應變儲備與管理儲備」看似合理，因為緩衝可處理不確定性，但它沒有先處理相依性的協調與承諾對齊。- 選項「將專案時程聚焦於團隊可直接控制的活動，同時在風險登錄表中記錄外部相依性」有風險意識，但過度排除外部相依性，會讓時程不完整。- 選項「建立跨專案相依性升級機制，將共享資源衝突與交接延誤提交給治理單位」有治理概念，但「所有跨專案相依性」直接上報過度升級；應先由專案經理協調，必要時才升級。"}, {"source": "PMSuccess9.pdf", "number": 7, "stem": "在一個大型專案的啟動會議上，專案贊助人為了得到利害關係人與專案團隊對於專案的承諾，他向所有與會者說明專案目標、預計成本、交付標的之交付日期，以及各重要利害關係人的角色與責任。會議中，有位重要的利害關係人表示交付標的之交付日期與他的認知不同。專案發生此狀況，最有可能是哪件事項沒有被考量到？", "options": ["專案基準尚未建立。", "里程碑清單有誤。", "此利害關係人並未核准專案管理計畫書。", "團隊忘記將獲准的時程變更更新到專案管理計畫書中。"], "answers": [2], "explanation": "啟動會議會於專案管理計畫書被核准後，專案開始進入開發前舉辦，所以，當有重要利害關係人不認同專案管理計畫書時，最有可能的原因是他或她並未參與核准專案管理計畫書這任務，或是他或她並未核准專案管理計畫書。另外，請留意，關鍵利害關係人也包含客戶。這題的解題邏輯是：當關鍵利害關係人對重要承諾事項認知不一致，先看是否缺少其參與、審查或核准。"}, {"source": "PMSuccess9.pdf", "number": 8, "stem": "在評估專案複雜度並選擇混合式交付方法後，專案經理必須定義如何在團隊、供應商和治理機構之間協調工作。資深利害關係人希望清楚了解在執行期間將如何制定決策以及如何控制交付。專案經理應該怎麼做？", "options": ["開始執行並視需要調整協調、決策和控制。", "確定詳細的時程和預算，以指導執行和監控流程。", "定義專案執行策略，以協調工作、決策和控管。", "由贊助者釐清決策權限和陳報期望，並指派當責利害關係人。"], "answers": [2], "explanation": "此題不是單純排時程或估預算，而是建立專案執行策略，也就是需要說明專案在執行期間該如何整合工作、如何做決策、如何管理交付控制，以及不同角色之間如何協作。專案執行策略可以為協調、決策和控制提供了一個清晰的框架。在執行前定義此策略有助於確保交付的一致性和有效的治理。故正解是「定義專案執行策略，以協調工作、決策和控管」。"}, {"source": "PMSuccess9.pdf", "number": 9, "stem": "利害關係人表示他想知道專案的時程變異(SV)數值。請問，他想知道的資訊是？", "options": ["補救目前時程落後所需要的時間量。", "專案時程是提前或是落後。", "完成剩餘的專案工作所需要的時間。", "專案團隊完成專案工作的比率。"], "answers": [1], "explanation": "時程變異(SV)可顯示實獲值與計畫值之間的差異，也就是在特定時點下，專案時程提前或是落後的數值。另外，如想知道「專案團隊完成專案工作的比率」時，須參考時程績效指標(SPI)。"}, {"source": "PMSuccess9.pdf", "number": 10, "stem": "專案經理正對於某採購案進行結案，進行帳務審查時卻發現多出金額，與原本結算的金額不一致，專案經理應採取什麼行動？", "options": ["提出採購成本變更。", "將多餘的金額保留作為專案的應變儲備。", "將多餘的金額自採購案結算金額中減除。", "依據採購管理計畫書進行採購稽核。"], "answers": [3], "explanation": "採購稽核指的是審查契約與契約過程，例如：付款與收款程序等，以確保採購過程的完整性、準確度與有效性。"}, {"source": "PMSuccess10.pdf", "number": 1, "stem": "在使用者測試期間，客戶同意了最終產品。一天之後，客戶表示最終產品可能無法接受了。為了解決此問題，專案經理的第一步驟應該是？", "options": ["審查專案的品質管理計畫書。", "與客戶進行展示會議，以取代先前的使用者測試。", "查看專案章程與需求相關文件。", "與客戶討論此問題，並參考專案的驗收準則。"], "answers": [3], "explanation": "客戶說最終產品可能無法接受，因此，專案經理應該與客戶一起審查驗收準則，看看是否遺漏了什麼，並了解客戶為什麼認為產品可能無法接受。滿足所有驗收準則意味著利害關係人的需求已經得到滿足。"}, {"source": "PMSuccess10.pdf", "number": 2, "stem": "專案經理負責一個組織非常看重的專案，專案時程處於非常緊迫的狀態，而且現有的方法已經無法趕上時程，而且若是你採用另一種方式來加快進度，則會大幅提高成本。專案經理要如何應對？", "options": ["評估採取另一種方式的風險和可能的收益，因為提高成本可能是暫時的，但如果能夠按時完成專案，可能會帶來更大的效益與機會。", "平衡所有利害關係人的需求和期望，因為有些利害關係人關心時程，而有些可能更關心成本。", "分析專案的限制與假設，並要求組織協助提供資源，讓假設成真。", "召集利害關係人一同會議，並進行決策樹分析。"], "answers": [3], "explanation": "此題最佳的作法是進行決策樹分析。在決策樹分析中，專案團隊可以根據一系列的問題或條件來分類資料，以便最終做出一個決策。這些問題通常是二元的，即每個問題都有兩個可能的答案。通過不斷地將資料分成更小的子集，我們可以逐步地找到最終的結果或決策。它可以幫助決策者在複雜的情況下理清思路，並根據特定的條件或因素做出明智的決策。"}, {"source": "PMSuccess10.pdf", "number": 3, "stem": "你正在管理一項飯店整修專案，專案採預測型方法執行，時程基準已核准。大廳地坪施工必須使用一批進口磁磚，該磁磚將安裝於後續櫃台施工與消防驗收之前。 採購窗口通知你，因港口塞港與船期調整，磁磚預計延後 1 週送達。施工團隊表示可以等材料到場後加班趕工；供應商則建議改用另一批相似材料，但尚未確認是否符合客戶核准的設計規格。 專案經理接下來應該怎麼做？", "options": ["要求供應商吸收所有延誤成本。", "通知贊助人，請求調整完工承諾。", "重新分析浮時與要徑影響。", "採用替代材料避免停工。", "等磁磚到場後再安排趕工。"], "answers": [2], "explanation": "正解是「重新分析浮時與要徑影響」。磁磚延誤 1 週不一定會造成專案延誤，關鍵要先確認該活動是否在要徑上，以及是否有總浮時或自由浮時可吸收延誤。專案經理應先依時程模型、活動相依關係、浮時與要徑分析其影響，再決定是否需要趕工、快速跟進、提出變更申請、啟動替代方案或升級給贊助人。教材說明，要徑法用於估算最短專案工期與判斷時程彈性；浮時則可判斷活動延遲是否會影響專案完成日期。"}, {"source": "PMSuccess10.pdf", "number": 4, "stem": "某公司剛取得一項外部客戶的系統整合案。客戶在招標文件中附上產品範疇、主要交付成果、驗收條件與期望完成日期。專案贊助人要求專案經理在準備專案章程前，先確認這些文件是否足以描述高階工作內容與交付邊界。專案經理詢問，為何起始階段需要取得這類工作說明資料？", "options": ["工作說明書屬於組織過程資產，可直接授權專案。", "外部專案的工作說明書可源自客戶的招標文件。", "工作說明書等同效益管理計畫書，可衡量效益。", "工作說明書可取代商業企劃案與初始協議。", "沒有工作說明書即不能建立任何專案章程。"], "answers": [1], "explanation": "題目重點是「外部客戶」、「招標文件」、「產品範疇、交付成果、驗收條件」。在外部專案中，專案工作說明書或其等效資訊可能來自客戶的採購或招標文件，例如 RFP、IFB、RFQ 或合約附件。教材中也將 SOW 定義為對專案要交付的產品、服務或成果的敘述，也說明 RFP 可包含買方發布的工作要求。故「外部專案的工作說明書可源自客戶的招標文件」是正解。"}, {"source": "PMSuccess10.pdf", "number": 5, "stem": "在規劃期間，專案團隊確定了幾項品質檢查和改善活動，但不確定如何將其一致地應用於不同的交付項目和工作流程。發起人詢問在交付期間將如何規劃和應用品質。專案經理應該做什麼？", "options": ["允許每個團隊根據經驗選擇自己的品質工具。", "請求治理單位為專案定義強制性的品質工具。", "在各交付項目中一致地應用規劃完善的品質流程與工具。", "將品質工作的重心放在最終檢驗上，以減少規劃方面的開銷。"], "answers": [2], "explanation": "這題的關鍵是：專案團隊已經識別出幾項品質檢查與改善活動，但問題在於不知道如何在不同交付項目與工作流程中達到一致性的應用。所以專案經理應該做的是：把這些品質活動規劃成一致的品質管理方式，包含：品質標準是什麼、各交付項目要使用哪些檢查方法、什麼時點進行品質檢查、誰負責執行與審核，以及發現缺陷後如何改善與追蹤。因此最佳解是「在各交付項目中一致地應用規劃完善的品質流程與工具」。"}, {"source": "PMSuccess10.pdf", "number": 6, "stem": "在規劃期間，專案採用混合式方法：部分工作包已有明確需求、固定交付順序與外部相依性；其他工作包則仍須透過反覆展示、利害關係人回饋與漸進式澄清來細化。贊助人希望時程既能提供足夠的承諾能見度，又不會限制仍在演進中的工作。專案經理應該做什麼？", "options": ["建立一份整合式時程，對需求穩定且相依性明確的工作採用預測性排序與基準控管，並對仍在演進的工作採用漸進式規劃、短週期檢視與持續更新的時程細節。", "要求各工作流依其工作特性自行選擇預測式或適應式時程管理方式，再於定期整合會議中回報進度與相依性，以維持彈性並避免過度集中控管。", "建立涵蓋所有工作包的整合式主時程，並要求各團隊在核准的時程基準內透過正式變更流程處理所有調整，以維持整體可預測性。", "建立高階里程碑與主要相依性時程，暫不承諾詳細活動日期，並讓團隊在每個反覆週期開始前再完成必要的詳細規劃。"], "answers": [0], "explanation": "正解是「建立一份整合式時程，對需求穩定且相依性明確的工作採用預測性排序與基準控管，並對仍在演進的工作採用漸進式規劃、短週期檢視與持續更新的時程細節」，因為它同時做到三件事：保留穩定工作的可預測性、允許不確定工作漸進式細化，並維持整合式時程控管。這正符合混合式時程管理的核心：依工作確定性調整規劃深度，而不是把全部工作強迫套用同一方法。來源也指出，混合式方法可針對穩定與演進元素量身打造做法，同時維持整合、合規與交付控制。"}, {"source": "PMSuccess10.pdf", "number": 7, "stem": "專案經理執行一個大型晚會的舞臺設計專案，此專案的舞臺必須能夠承載15,000磅的重量，而且舞臺的左方須具備一個直徑8公尺的升降台，此專案從設計、備料、元件、測試、交件到驗收，必須在30個日曆天內完成。到了第20天時，顧客代表表示升降台的位置不對。專案經理首先應該做什麼？", "options": ["與專案成員討論趕工的相關事宜。", "提出變更申請。", "查看協議條款，並確定升降台的位置。", "暫停專案，並召開相關的利害關係者會議。"], "answers": [2], "explanation": "遇到與協議條款及條件相關事項時，首先你應該做的是確認協議的陳述是否如顧客所言，假如是的話，再考慮後續相關行動。"}, {"source": "PMSuccess10.pdf", "number": 8, "stem": "下列何項是為了避免專案失效而產生的成本？", "options": ["報廢和檢驗", "測試和設備", "重工和保固", "測試和產品責任"], "answers": [1], "explanation": "為了避免專案失效而產生的成本包含：訓練、記錄過程、設備、測試和檢驗…等。"}, {"source": "PMSuccess10.pdf", "number": 9, "stem": "下列哪一項描述可以代表固定價款加激勵費用 (FPIF)契約的性質？", "options": ["支付契約上的金額US$10,000，也就是以US$100購買100個產品。", "支付契約上的金額US$10,000，若達到績效要求，再加付US$1,000。", "支付契約上的金額US$10,000，再加上每月的US$500的維修成本。", "支付契約上的金額US$10,000，再加上因為通貨膨脹而調高的成本。"], "answers": [1], "explanation": "固定價款加獎金契約(FPIF)指的是：若是賣方達到買方的績效指標，買方除了支付合約上的固定價款合約外，還會支付一比獎金給於賣方。"}, {"source": "PMSuccess10.pdf", "number": 10, "stem": "品質管制成員剛剛完成的這個階段的管制圖，繪製的結果如圖所示。請問，身為專案經理的你將如何報告項目狀態？", "options": ["該管制圖中有數個監控點非常接近上下管制界線，故須提出經驗教訓與矯正措施。", "專案過程已失控。", "第25~32個監控點的起伏太大，須提出矯正措施。", "該階段的製程穩定，專案管制於績效內。"], "answers": [1], "explanation": "當管制圖出現七個點連續向上或下降的狀況，則表示專案的過程已經失控。"}, {"source": "PMSuccess11.pdf", "number": 1, "stem": "你是某敏捷團隊的流程顧問，協助一個以看板（Kanban）為主的團隊優化交付流程。該團隊正在開發一個跨平台應用程式，目前看板顯示如圖所示。作為敏捷顧問，你的初步分析會指出哪一個工作步驟是目前流程中的瓶頸？", "options": ["工作步驟D。", "工作步驟B。", "工作步驟A。", "工作步驟C。"], "answers": [1], "explanation": "正解是：工作步驟B。步驟B的WIP使用量已達到限制（5/5），表示它無法接收來自A的輸入，也無法向C輸出，造成流動阻塞。A的人員正在等待釋放任務給B（輸出受阻）。C雖為0，但這是因為B沒有輸出，而非自身處理問題。這正是典型看板瓶頸特徵：中間流程過載，造成上下游停滯。"}, {"source": "PMSuccess11.pdf", "number": 2, "stem": "某劇院燈光系統升級專案正在進行時程規劃。為了趕上開幕彩排日，贊助人建議將「燈座安裝」與「電路測試」部分重疊進行，以縮短工期。 電氣工程師指出，所有迴路必須先完成導通、負載與安\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。\n全測試，確認沒有短路或接地異常後，才能開始安裝燈座。若未完成測試即安裝，可能造成設備損壞或人員安全風險。專案經理因此在時程網路圖中將「完成電路測試」設為「安裝燈座」的前置條件。 這項活動關係最適合歸類為哪兩種依賴關係？（選兩項）", "options": ["外部相依關係", "軟邏輯關係", "強制相依關係", "刻意相依關係", "資源相依關係", "硬邏輯關係"], "answers": [2, 5], "explanation": "正解是「強制相依關係」和「硬邏輯關係」。電路測試必須先完成，燈座才能安全安裝，這不是團隊偏好或排程方便，而是由工作本質、安全要求與工程邏輯所造成的必要順序。硬邏輯通常用來描述無法任意調整的活動順序。此題中，未測試電路就安裝燈座會產生安全與品質風險，因此亦屬於硬邏輯。"}, {"source": "PMSuccess11.pdf", "number": 3, "stem": "某科技公司正在開發一個尖端人工智能平台，專案經理與供應商簽訂了一份成本加固定費用（CPFF）契約。該專案經過多次的稽核，且進行了多項變更。然而，供應商並未完全按照所有的變A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n更進行專案，組織的契約經理也忘記將必要的矯正措施更新到契約中。專案經理在檢視契約並準備進行付款時發現了這個問題。專案經理應該採取什麼行動？", "options": ["提出契約的變更申請。", "結束採購，並終止契約。", "暫停付款，直到供應商完全遵循已獲准的變更。", "與供應商安排會議，直接協商解決方案。", "發出警告信函，要求供應商立即糾正問題。"], "answers": [0], "explanation": "* 此題的最佳解是「提出契約的變更申請」。這是因為題目已明確指出：專案有多次稽核與多項變更、供應商未完全依照所有變更執行、契約經理忘記將必要的矯正措施更新到契約中；專案經理是在檢視契約並準備付款時發現問題。* 所以此題的關鍵不只是供應商執行有落差，而是正式契約文件本身沒有更新。在 PMI 邏輯中，只要牽涉到契約條款、採購文件、正式矯正措施未被納入契約，就應走正式契約變更控制程序。沒有更新到契約中的要求，後續不論是警告、扣款、終止，都會缺乏足夠的契約依據。* 其他選項較不佳，是因為：- 與供應商直接協商：可以作為後續溝通，但不能取代正式契約變更流程。- 結束採購並終止契約：太激烈，且題目未顯示已到無法補救程度。- 發出警告信函：如果契約尚未正式更新，直接警告供應商可能缺乏契約依據。。- 暫停付款：應先確認契約條款、已核准變更與實際履約差異，再依契約與變更流程處理。* 這題的考點是：當採購執行與已核准變更不一致，且契約未正確更新時，應先透過正式的契約變更程序修正契約文件。"}, {"source": "PMSuccess11.pdf", "number": 4, "stem": "在執行期間，供應商持續達成合約交付項目，但品質問題日益增多，需要反覆重做。這些問題尚未違反合約門檻，但它們耗費了專案產能並產生交付風險。發起人詢問是否應採取正式行動。專案經理應該做什麼？", "options": ["即使未達到門檻，仍應施以合約罰則，以遏止後續的品質問題。", "由於重複的重工表明供應商的履約情況已無法接受，因此觸發合約升級。", "繼續以非正式方式管理，因為合約遵循度名義上仍有達成。", "將品質與重工趨勢作為治理訊號，並就績效改善事宜與供應商進行"], "answers": [3], "explanation": "在採購治理中，合約合規性並非唯一的信號。重工增加和品質下降表示價值交付出現了新興風險。此外，題目亦提到品質問題日益增多，需要反覆重做，且已經造成：專案產能消耗、交付風險增加和品質趨勢惡化。因此，專案經理不能只是非正式提醒或繼續觀察，而應把這些品質與重工趨勢當成治理與供應商績效管理訊號，正式與供應商討論改善行動，例如要求改善計畫、追蹤缺陷趨勢、檢討根本原因、確認預防措施與後續監控方式。故正解是「答案：將品質與重工趨勢作為治理訊號，並就績效改善事宜與供應商進行正式交涉」。"}, {"source": "PMSuccess11.pdf", "number": 5, "stem": "專案經理正在為硬體升級專案規劃採購計畫書。為了確保委外策略可以與組織政策保持一致，專案經理應該怎麼做？", "options": ["依據商業企劃案的內容製作計畫書。", "製作效益管理計畫書，並提供給賣方。", "參考組織過程資產，以確保專案成功。", "將採購計畫書的製作任務加進去產品待辦清單中。"], "answers": [0], "explanation": "商業企劃案包含專案的經濟可行性研究和商業需求，可證明專案的合理性，並提供組織授權專案啟動的基礎。專案章程則是一份基於商業企劃案的資訊進一步說明專案目標與範疇的文件。商業分析師通常負責發展與維護商業企劃案。專案經理則需確保專案章程和專案管理計畫書上的資訊對齊商業企劃案的內容，如：組織願景與策略、競爭優勢和財務預測等。"}, {"source": "PMSuccess11.pdf", "number": 6, "stem": "你被指派到一個包含採購事項的專案，身為專案經理的你需要與契約管理部門一起選擇廠商。就此專案的規模而言，組織希望透過正式招標過程取得廠商。此時，組織的一位副總告訴你，他朋友的公司可以參與此標案，而且此公司是一家優良廠商。請問，下列何項是你應該採取的最佳行動？", "options": ["告知高階主管此事，由他們進行決策。", "委婉拒絕副總的請求。", "讓契約部門處理此一狀況。", "依照組織的採購規則行事。", "協助該廠商取得此專案。"], "answers": [3], "explanation": "身為專案經理，提供專案的需求標準給契約部門，並保護專案是你的責任，所以，選項「依照組織的採購規則行事」是最佳解。而其餘的選項都不是專案管理的正確態度。"}, {"source": "PMSuccess11.pdf", "number": 7, "stem": "某位不習慣敏捷實務的新團隊成員，當某位經常批評他先前工作的營運工程師出現在早上的站立會議時，會變得緊張。專案經理邀請此營運工程師的理由是什麼？", "options": ["這是提高新成員表現並使他保持警覺的一種方式。", "這是一種敏捷實務，用於防止每日會議的例行狀況。", "這是專案經理了解新成員的一種方式。", "主動修訂不一致之處是敏捷的標準實務。"], "answers": [3], "explanation": "主動從不同的利害關係人身上與藉由專案溝通的透明度來尋求意見被視為是良好的敏捷實務。其他選項是錯誤的，因為他們不會透過打破常規與提高績效與信任，也不會以間接了解成員的方式來促進團隊成員融入團隊。"}, {"source": "PMSuccess11.pdf", "number": 8, "stem": "請針對以下專案情境進行角色與責任的配對。 (a)授權專案啟動 (b)協助專案團隊針對使用者故事進行估算 (c)解決不同使用者故事之驗收準則之間的衝突", "options": ["Scrum Master-(c)解決不同使用者故事之允收準則之間的衝突", "專案經理-(a)授權專案啟動", "產品負責人-(b)協助專案團隊針對使用者故事進行估算", "產品負責人-(c)解決不同使用者故事之驗收準則之間的衝突"], "answers": [3], "explanation": "* 專案贊助者-(a)簽署專案章程。* Scrum Master-(b)協助專案團隊針對使用者故事進行估算。* 產品負責人-(c)解決不同使用者故事之驗收準則之間的衝突。"}, {"source": "PMSuccess11.pdf", "number": 9, "stem": "某應用程式開發專案採用敏捷方法。產品負責人希望產品可以在12/25上線，但是專案團隊認為不合理，並表示若要此日期上線，整個團隊勢必要加班。專案團隊應該怎麼做？（選兩項）", "options": ["要求Scrum Master告知產品負責人此上線日期並不合理，需要增加資源。", "與產品負責人溝通與協作，一起估算可用資源，並決定可行的上線日期。", "與產品負責人一起確認產品功能的優先順序，以確保在有限時間內實現最重要的功能。", "在加班趕工時相互激勵，以期達成產品負責人的期望。", "將加班時數平均分配到各個團隊成員身上，但要求組織提供額外的獎勵金。"], "answers": [1, 2], "explanation": "敏捷宣言12項原則之一是「敏捷過程促進可持續開發。贊助者、開發人員和使用者應該要能不斷地保持穩定的步伐」。所以，專案的贊助者、產品負責人和開發人員都需要保持永續發展的思維，避免開發人員由於加班或過勞而導致專案後續工作無法順利進行或完成。另外，專案團隊還可以與產品負責人一起確定產品功能的優先順序，以確保在有限時間內實現最重要的功能。這樣可以減少壓力，並確保產品在截止日期前提供價值。"}, {"source": "PMSuccess11.pdf", "number": 10, "stem": "為了每月交付一定數量的手機SIM卡，Enterprise Z與某公司進行合作。其成果每個月會在聯合指導委員會會議上進行審查。企業Z已經清楚他們在服務層級協議中的偏好和容忍度。什麼是監控此產品交付的最佳工具？", "options": ["管制圖", "散點圖", "因果圖", "親和圖"], "answers": [0], "explanation": "* 此題選「管制圖」是因為題目提到幾個重點：-「每月交付一定數量」→ 持續性、重複性的流程輸出（類似生產線）-「成果會在每月會議審查」→ 需要「趨勢、變異」的時間序列資訊-「企業已清楚SLA中的偏好與容忍度」→ 這對應到「規格界限 / 管制界限」的概念* 管制圖的用途就是：監控一個持續運作的過程（如每月交付 SIM 卡數量、缺陷率、延遲率），並從中心線（平均值）以及上、下管制界限（UCL/LCL）中看出：過程是否在可接受的變異範圍內，有無「失控點」或系統性趨勢（如交付數量持續下降、缺件率增加），這非常符合「有明確 SLA容忍度，且要持續監控交付品質/數量」這種情境。* 此外，魚骨圖（因果圖）不會是最佳解，因為：若發現SIM卡交付經常「不符合 SLA」，你當然可以用「魚骨圖（因果圖）來分析「為什麼會失敗」，但是題目問的是：「什麼是監控此產品交付的最佳工具？」，考的是「監測交付績效，而不是分析問題原因」，所以標準答案還是「管制圖」。"}, {"source": "PMSuccess12.pdf", "number": 1, "stem": "規劃專案時程時，你預計的活動期程是：10/20 開始發展庭園造景設計圖，此活動將維持10天、11/10 開始進行庭園造景，且將於 12/10 完成庭園造景。後來由於客戶要求，需要加速專案進展，變更成在發展庭園造景設計圖時就同時開始進行初步的庭園造景活動。請問，這是使用什麼技術？", "options": ["重工", "延後", "快速跟進", "趕工縮程"], "answers": [2], "explanation": "快速跟進法的時程壓縮技術之一。由題目所述，你會發現專案尚在「發展庭園造景設計圖」時，就開始進行「庭園造景」了。這兩項活動的期程是並行的，故此為快速跟進技術。使用此技術往往會提高專案風險。"}, {"source": "PMSuccess12.pdf", "number": 2, "stem": "一項資安系統專案將於三週後啟動。內部團隊具備一般開發能力，但對關鍵身分驗證技術缺乏實務經驗。專案經理計畫聘請一位外部專家，在專案初期協助技術決策、處理疑難問題並指導團隊。目前無法精確預估顧問所需工時，實際投入程度將取決於開發過程中出現的技術問題；組織已核准顧問的日費率與最高支出額度。專案經理應建議採用哪一種契約？", "options": ["時間與材料合約，並設定支出上限。", "採購單，並按預估工時開立。", "固定總價合約，並依訓練成果驗收。", "成本加激勵合約，並依績效支付。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [0], "explanation": "題目有三項關鍵條件：外聘的是短期專業顧問、工作內容會隨技術問題逐步明確，且無法精確預估所需工時。時間和材料契約（T&M）會先約定人員費率，再依實際投入時間與材料支付，適合專家支援、人力增援或範疇尚未完全明確的工作。設定最高支出額度，也能降低買方成本持續擴張的風險。選項「成本加激勵合約（CPIF）」較不適合是因為，CPIF適合的是範疇不確定、需償付實際成本，且希望以獎勵促進成本或績效目標的工作；但本題只是取得短期專家支援，不需要建立複雜的成本與激勵計算機制。"}, {"source": "PMSuccess12.pdf", "number": 3, "stem": "專案團隊已經篩選出兩家有能力執行專案的廠商，但是這兩家廠商的報價都高於預算。專案經理應該如何應對？", "options": ["重新招標。", "請公正的第三方進行採購仲裁。", "請專家再次進行獨立估算。", "進行採購協商與議價，並承擔可能流標的風險。", "減少範疇以降低價格。\nA. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [3], "explanation": "簽訂契約前，為了達成買賣雙方的共同協議，可進行採購協商，以闡明各方的權力、義務、時程、價格、品質要求、獎勵與懲罰、變更申請方式、終止契約......等條款。"}, {"source": "PMSuccess12.pdf", "number": 4, "stem": "請參考下圖。任務A、B與C是在此專案的要徑上。請問，此專案期程的技術評核術(PERT)估算是？", "options": ["24.66", "8.11", "12.33", "24.33"], "answers": [3], "explanation": "PERT = (P + 4M + O) / 6 Task A = (7 + 4 * 6 + 4) / 6 = 5.83 Task B = (15 + 4 * 10 + 9) / 6 = 10.67 Task C = (10 + 4 * 8 + 5) / 6 = 7.83專案期程 = 三個任務的技術評核術(PERT)的加總 = 5.83 + 10.67 + 7.83 = 24.33"}, {"source": "PMSuccess12.pdf", "number": 5, "stem": "某公部門資訊專案準備委外建置資安監控平台。採購團隊已完成 RFP、採購工作說明書與評選準則，並將文件發送給合格投標廠商。數家廠商回覆問題，內容涉及交付範圍、資料保護要求、驗收方式與既有系統介接責任。 為避免廠商對採購內容有不同解讀，採購部門建議舉辦投標人會議。專案經理應如何說明此會議的主要目的？", "options": ["比較各廠商的初步價格與方案。", "確認外包與自製工作的比例。", "決定最適合本案的契約類型。", "同步釐清採購需求與投標疑問。", "討論得標後的最終議價空間。"], "answers": [3], "explanation": "投標人會議主要目的是在投標人準備標案回應前，讓所有潛在賣方對採購目的、工作範圍、投標文件、限制條件與評選要求有一致理解。重點是公平、透明、同步釐清，避免某些廠商因資訊不對稱而取得優勢。教材中也說明，正式採購流程會使用 RFP、投標人會議與正式流程，以確保所有潛在供應商對採購有清楚且共同的理解。故正解是「同步釐清採購需求與投標疑問」。"}, {"source": "PMSuccess12.pdf", "number": 6, "stem": "請參考下圖，並選出正確的連結。", "options": ["3-c、4-b 和 2-a", "2-d、3-a 和 4-b", "1-c、3-b 和 4-a", "4-c、1-a 和 2-b"], "answers": [2], "explanation": "正解是：1-c、3-b和4-a。「品管人員發現產品有3個缺失」是內部失效成本、「客戶發現產品有瑕疵，要退貨」是外部失效成本、「專案產品的檢驗頻率為每天三次」是鑑定成本，以及「專案為了達到績效而添購的新機器」是預防成本。"}, {"source": "PMSuccess12.pdf", "number": 7, "stem": "某混合式專案團隊經過多次的磨合與調適之後，預計將於近期向客戶交付第一批的可交付成果。交付前，為了確保這些成果皆已達到專案要求，專案團隊應該如何做？（選兩項）", "options": ["確認成果已經達成完成的定義（DoD)。", "確認成果已經達成備妥的定義（DoR) 。", "確認成果已經符合允收準則。", "確認成果已經在回顧會議中被驗收。", "確認專案團隊已經完成變異分析與趨勢分析。"], "answers": [0, 2], "explanation": "正解是「確認成果已經達成完成的定義（DoD)）和「確認成果已經符合允收準則」。完成的定義（DoD)常用於敏捷式專案上，它記錄著成果在交付給客戶前所必須達成的所有準則。允收準則常使用於預測式專案中，它指的是可交付成果被接受前必須達到的一組績效要求的條件。不可以選「備妥的定義（DoR)），因為它是一份用來確認團隊可開始工作前所需要的所有資訊是否已經準備齊全。另外，其餘的兩個選項都是錯誤的，因為專案成果不是在回顧會議中進行驗收，而變異分析與趨勢分析雖然是監控專案產出的工具與技術，但是無法說明完成這些監控活動後，專案成果就一定能符合標準。"}, {"source": "PMSuccess12.pdf", "number": 8, "stem": "專案經理與品質管制成員正與承包商一起在現場進行逐項審閱。專案經理下一步需要做什麼？", "options": ["確認賣方的工作都已經獲得", "結束專案帳戶", "確保可交付成果已經交付給客戶", "重新分配專案成員與設備"], "answers": [0], "explanation": "從此題情境可以得知專案正在進行管制採購過程，所以，專案經理下一步可以做的是透過採購管理者提供賣方已完成契約的正式書面文件，以便確認賣方的工作都已經獲得正式允收。另外，其他三個選項都與採購活動沒有直接的關係。"}, {"source": "PMSuccess12.pdf", "number": 9, "stem": "為了讓潛在賣方確認是否有能力提供專案產品與服務。你會提供？", "options": ["採購管理計畫書", "範疇基準", "商源評選準則", "採購工作說明書", "專案章程"], "answers": [3], "explanation": "每一份採購工作說明書都會依據專案的範疇基準來制定，且會包含與該契約有關的工作範疇描述，例如：規格、品質等級、履約期限、工作目標與需求...等。這些資訊可以讓潛在賣方確認是否有能力可以提供產品或服務。"}, {"source": "PMSuccess12.pdf", "number": 10, "stem": "身為專案經理的你當初並未參與契約的協商，現在客戶和組織高層皆對契約提出變更要求，你要怎麼做？", "options": ["進行採購績效審查，以確認契約的變更申請是合理的", "依據客戶和組織的共識修訂契約", "透過求償管理來處理有爭議的變更要求", "借助契約變更管制系統來確認如何處理契約變更"], "answers": [3], "explanation": "遇到契約的變更申請時，你應該先透過契約變更管制系統來確認如何修訂此契約和了解核准變更所需要的審核層級，並透過進行整合變更管制過程來完成此變更之審查。故，「借助契約變更管制系統來確認如何修訂此契約」為最佳解。"}, {"source": "PMSuccess13.pdf", "number": 1, "stem": "你正在管理一項行動支付系統升級專案。專案進入使用者驗收測試後，客戶回報交易失敗率高於品質門檻，團隊因此需要修補缺陷、重新測試，且客服部門也收到更多客訴。贊助人要求你在品質檢\n討會中區分：哪些是「低品質已造成的負面衝擊」，哪些是「為了預防或評估品質而投入的管理活動」。下列哪些事項較不屬於品質偏低所造成的消極衝擊？（選兩項）", "options": ["團隊加班造成疲憊。", "增加抽樣檢查。", "缺陷修補造成重工增加。", "補強品質訓練。", "人員流失風險升高。", "交付延誤導致客戶抱怨。"], "answers": [1, 3], "explanation": "* 正解是「補強品質訓練」和「增加抽樣檢查」。訓練本身不是低品質造成的消極衝擊，而是為了避免缺陷、提升能力或降低未來錯誤所做的預防成本。在品質成本中，訓練屬於為了避免失敗而投入的成本，不是失敗已經造成的負面結果。而抽樣檢查、測試、檢驗屬於評估成本或品質控制活動，目的是發現缺陷、確認是否符合品質標準。它是品質管理投入，不是低品質本身造成的消極衝擊。* 其他選項皆是低品質的範例，說明如下：- 缺陷修補造成重工增加：重工是典型的低品質後果，屬於內部失敗成本。代表交付成果未符合要求，需要重新處理。- 交付延誤導致客戶抱怨：低品質可能造成修補、重測與驗收延後，進一步影響客戶滿意度，因此屬於負面衝擊。- 團隊加班造成疲憊：雖然「疲憊」不是品質成本模型中的正式分類名稱，但在情境題中，低品質導致大量修補與加班，會造成團隊負荷與士氣問題，因此是消極衝擊。- 人員流失風險升高：長期重工、加班與挫折感會影響士氣與留任意願，屬於低品質對團隊造成的間接負面影響。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"}, {"source": "PMSuccess13.pdf", "number": 2, "stem": "在公司的一個聚會上，人們對於哪一個團隊有最快的速度進行了友善且公開的對話。某個人笑著說A團隊的速度是20，而B團隊的速度是40，所以B團隊的成員都可獲得獎金。A團隊的領導者應該如何回應？", "options": ["對於B團隊比A團隊更有效率感到尷尬。", "什麼都不說。這只是一場聚會。", "什麼都不說，因為每個團隊都有自己的能力，速度並不是用來比較團隊的。", "詢問那個人他們是如何知道這一點的，並提醒他們這樣的競爭是違反公司文化的。"], "answers": [2], "explanation": "速度（Velocity）與能力有關，但與效率無關。每個團隊的速度數字都是唯一的。它們不能用來比較團隊。"}, {"source": "PMSuccess13.pdf", "number": 3, "stem": "某消費性產品公司準備委外設計並製造一批高階展示設備。採購工作說明書已明確定義產品風格、材質、品質容許度、驗收標準與交付日期，預期執行期間不會有重大需求變更。 由於專案預算不得超支，贊助人希望降低組織的財務曝險。採購部門因此建議使用固定價款契約，但提醒專案團隊仍須管理驗收與供應商績效。 從組織角度來看，採用此契約最可能帶來哪些優點？（選兩項）", "options": ["品質風險可完全轉移給賣方。", "賣方承擔多數超支風險。", "談判難度不受範疇複雜度影響。", "專案支出較容易預測。", "需求調整通常不需重新議價。", "買方可減少交付成果的查驗。"], "answers": [1, 3], "explanation": "固定價款契約會針對明確定義的產品、服務或成果設定總價，因此買方能較早掌握採購支出，提升預算確定性。這也是固定價款適合用於需求清楚、重大範疇變更可能性低之工作的主要原因。此外，若執行成本高於賣方原先估算，在契約範疇與條件未改變的情況下，額外成本通常由賣方承擔。因此，固定價款可將較多的成本超支風險移轉給賣方。故正解是「專案支出較容易預測」和「賣方承擔多數超支風險」。"}, {"source": "PMSuccess13.pdf", "number": 4, "stem": "顧客對於品質的期待顯示於管制圖上的那一部份？", "options": ["平均值", "規格界限", "管制界限", "中值"], "answers": [1], "explanation": "* 管制界限：反映流程本身的穩定範圍，通常由流程資料計算而來，例如：上管制界限 UCL、下管制界限 LCL。* 規格界限：反映顧客、合約、需求或品質標準的期待，例如：上規格界限 USL、下規格界限LSL。* 題目問「顧客對於品質的期待」顯示在管制圖上的哪一部分，故正解是：規格界限。"}, {"source": "PMSuccess13.pdf", "number": 5, "stem": "有一個以內部架構為主的專案，專案經理分解出以下三個活動： 活動一：設計內部架構 活動二：根據設計好的內部架構，進行開發工作。 活動三：設計外部介面。 依據專案經理的經驗，活動二與活動三同時進行會比較好。請問，下列描述何者正確?", "options": ["活動ㄧ與活動二為完成-開始(FS)關係，活動二與活動三為開始-開始(SS)關係。 ( (您的選項)", "活動一與活動二為開始-完成(SF)關係，活動二與活動三為完成-完成(FF)關係。", "活動一與活動二為完成-開始(FS)關係，活動二與活動三為完成-完成(FF)關係。", "活動一與活動二為開始-完成(SF)關係，活動二與活動三為開始-開始(SS)關係。"], "answers": [0], "explanation": "完成-開始 (FS)是指後續活動要於前置活動完成後才可以開始的邏輯關係，所以，活動ㄧ與活動二是FS關係。另外，題目提到「活動二與活動三同時進行會比較好」，這表示開始進行活動二時，就可同時進行活動三。而這正好符合：開始-開始 (SS)的邏輯關係，因為SS關係是：後續活動可在前置活動開始時就開始。"}, {"source": "PMSuccess13.pdf", "number": 6, "stem": "你已經辨識出與預期到專案可能會因為不當的系統操作而造成巨大風險。你應該怎麼做才能確保專案成員都是依照一模一樣的步驟操作系統？", "options": ["定期地進行肇因分析", "制定明確的品質指標", "使用品質檢核表", "進行品質稽核"], "answers": [2], "explanation": "檢核表可用來協助專案經理作為考量專案的事項、行動及要點的提醒之用。另外，品質檢核表通常會列出特定組件，以確認有哪些必要的步驟需要被執行或是有哪些需求需要被滿足。"}, {"source": "PMSuccess13.pdf", "number": 7, "stem": "某專案經理正在處理一項資料中心遷移專案，並且正在製定時程管理計畫書。此專案預計持續40天，但專案贊助人希望在35天內完成。為了符合這項新需求，專案經理應該採取什麼行動才能修定此時程表？", "options": ["使用延後（lags）。", "讓快速跟進的活動不在關鍵路徑上。", "使用提前（leads）。", "增加關鍵路徑的持續時間。"], "answers": [2], "explanation": "專案經理應該使用提前（leads）來減少修訂後之進度表的間隔時間。提前涉及在先行活動完成之前開始後續活動。透過確定提前的時間，專案經理可以調整活動時程表，將原始時程表縮短為35天。使用潛在客戶時，活動之間的邏輯關係必須具有任意的完成到開始或開始到開始的依賴性。延後是關於後續活動開始所需的延遲時間，可用於在人力或資源限制的情況下，等待另一項活動完成或部分完成或等待特定日期和事件發生時。增加關鍵路徑的持續時間會延長專案的持續時間，不在關鍵路徑上的快速跟進活動則會給專案帶來風險。"}, {"source": "PMSuccess13.pdf", "number": 8, "stem": "公司主管要求你指導一位新任專案經理建立專案時程網路圖。該專案是一項分公司客服系統升級案，其工作內容，以及與供應商系統連接的方式皆與你去年完成的專案高度相似。 新任專案經理已取得初版 WBS 與活動清單，但他不確定應如何呈現活動之間的相依關係、前置活動、後續活動、提前量與滯後量。PMO 也要求各專案使用一致的時程圖示與文件格式，以便後續審查與整合。 你應建議新任專案經理優先參考哪些資料？（選兩項）", "options": ["類似已完成專案的歷史時程資料。", "由下而上估算出的工作包成本。", "PMO 的標準化時程網路圖範本。", "三點估算表中的活動工期區間。", "要徑法計算後的總浮時結果。", "專案管理軟體產生的預設排程結果。"], "answers": [0, 2], "explanation": "正解是「PMO 的標準化時程網路圖範本」和「類似已完成專案的歷史時程資料」。題目強調 PMO要求一致格式與圖示，因此應參考組織既有的標準化範本。這屬於組織過程資產，可協助新任專案經理用一致方法建立時程網路圖。此外，此專案與先前專案高度相似，因此可參考歷史資料、經驗教訓、既有活動相依關係與先前時程模型。教材中也指出，時程規劃可從標竿與歷史資料開始，透過類似產品或服務的時程作為詳細分析前的起點。"}, {"source": "PMSuccess13.pdf", "number": 9, "stem": "專案資源發生了一些問題將影響到專案活動Ａ，但是專案經理向團隊說：「可以延後專案活動A的開始時間，但是不可以延誤專案的最終完成日期」。請問，專案經理在意的是？", "options": ["總浮時", "自由浮時", "提前量", "延後量"], "answers": [0], "explanation": "* 總浮時：是指專案的緩衝時間，也就是專案活動可以延遲的時間，但此延遲並不會延誤專案的完成日期。* 自由浮時：是指在不延誤任何後續活動的最早開始日期下，活動能被延遲的時間量。"}, {"source": "PMSuccess13.pdf", "number": 10, "stem": "專案經理想將造成缺失的潛在原因進行分類及群組，以便得到最需要關注的方向。請問，專案經理應該使用?", "options": ["流程圖", "觀察", "矩陣圖", "親和圖", "肇因分析", "問卷"], "answers": [3], "explanation": "親和圖可搭配腦力激盪一起使用。進行時，可以先使用腦力激盪展開與蒐集大量的想法或造成缺失的各式原因，而後利用親和圖將相似的缺失或缺失的潛在原因分類與歸納在同一個群組，而後再分析群組之間的關聯，以進行組織化的分析與思考，並找出需要關注的區塊。"}, {"source": "PMSuccess14.pdf", "number": 1, "stem": "專案進行到一半時，客戶告知專案經理，由於一些限制因素，專案必須比原定計畫提前15天完成，否則將可能導致1,000萬元的損失。專案經理應該怎麼應對？", "options": ["制定新的專案時程。", "激勵團隊，讓團隊產生更大的工作效能。", "快速跟進。", "審查時程儲備，以確認是否已經考量過此狀況。"], "answers": [3], "explanation": "此題情境表示專案出現了事件，當事件發生時，專案經理可以先將此事件記錄下來，好評估後續事宜。若確認此事件是已辨識風險的話，就可查看是否有其風險回應策略或風險儲備。"}, {"source": "PMSuccess14.pdf", "number": 2, "stem": "某食品業者正在為新產品設計包裝盒。為了遵循美國法律，包裝盒上需要以更大更醒目的方式顯示熱量，而且還需要額外列出添加糖的數量，並提醒消費者過多的糖分將導致肥胖或促發其他疾病的發生。在最終印刷之前，專案團隊再次審查設計稿，他們發現有一處標示明顯不符合法律規定。專案團隊在最終印刷之前進行了哪項活動？他們未來應該進行哪項活動才能避免此問題再次發生？", "options": ["檢查；流程改善。", "問題解決；訓練。", "確認範疇；稽核。", "決策制定；測試。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [0], "explanation": "題目情境「在最終印刷之前，專案團隊再次審查設計稿」，這正是管理品質活動之一，檢查的寫照。檢查可用於檢驗產品或交付標的是否符合特定的品質標準、規格或其他準則。為了避免這個問題再次發生，專案團隊應該在未來進行流程改善，這可以是改善專案的審核和批准流程，以確保所設計的包裝能符合法規要求。"}, {"source": "PMSuccess14.pdf", "number": 3, "stem": "組織打算使用PERT技術來估算一個簡易版的app開發專案的期程，最樂觀的期程為6周、最悲觀的期程為14周、最有可能的期程為10周。請問估算值為？", "options": ["14周", "10周", "20周", "6周"], "answers": [1], "explanation": "PERT估算公式是：(樂觀值 + 4*最可能值 + 悲觀值)/6 = (6 + 4*10 + 14) /6 = 10。"}, {"source": "PMSuccess14.pdf", "number": 4, "stem": "請參考下圖。請問，任務2的浮時是？", "options": ["4", "0", "1", "3"], "answers": [1], "explanation": "不同路線之時間長度為：* 開始 -> 1 -> 2 -> 結束 = 5 + 8 = 13(天)* 開始 -> 3 -> 5 -> 結束 = 6 + 4 = 10(天)* 開始 -> 4 -> 5 -> 結束 = 8 + 4 = 12(天)* 最長之路線為開始 -> 1 -> 2 -> 結束：13天，此路線也就是要徑，任務2處於要徑上，所以任務2之浮時為0。"}, {"source": "PMSuccess14.pdf", "number": 5, "stem": "專案經理正在管理一項企業核心系統汰換專案，專案即將進入整合測試階段。高階管理層要求專案經理在下週治理委員會中，簡單說明專案目前的時程狀態，包括主要工作階段、已完成項目、進行中活動，以及未來幾個重要里程碑的時間安排。 技術團隊提供了詳細的活動相依關係與浮時分析，但贊助人提醒專案經理，高階管理層主要想快速掌握整體時程進展，而不是檢視每項活動的邏輯細節。 專案經理應選擇下列哪一項工具來報告時程？", "options": ["親和圖：彙整各方進度意見。", "長條圖：呈現活動與時程區間。", "網路圖：呈現活動邏輯關係。", "要徑法：分析浮時與最短工期。", "因果圖：釐清時程延誤成因。"], "answers": [1], "explanation": "正解是「長條圖：呈現活動與時程區間」。向高階管理層報告時程時，重點通常是讓對方快速了解主要活動、階段、里程碑與整體進度。長條圖（Gantt chart）以橫道表示活動，並標示了活動開始與結束日期，及活動的期程。長條圖容易被看懂，故經常使用在向管理階層報告情況。選項「網路圖：呈現活動邏輯關係」較不合適，因為雖然網路圖可以呈現活動之間的相依關係，對專案團隊與排程分析很有價值；但對高階管理層而言，通常過於細節，不如長條圖直觀。"}, {"source": "PMSuccess14.pdf", "number": 6, "stem": "團隊領導者收到一封來自product owner的電子郵件，要求可以更準確地查看花在任務上的實際時間，以便能在產品待辦清單中採用更準確的商業價值估算。團隊非常忙碌，截止期限也很緊迫。團隊領導者應該如何回應這個請求？", "options": ["要求product owner為團隊提供更具體、更詳細的使用者故事，以便他們可以更好地理解客戶所期望的價值。", "解釋靈活的估算單位可以使團隊能夠加速商業價值的交付。", "確保團隊每天更新燃盡圖，以便product owner能準確了解工作的完成狀況。", "說明團隊非常忙碌，現在無法提供協助。"], "answers": [2], "explanation": "團隊需要讓product owner了解工作完成的情況，而燃盡圖是大多數團隊使用的日常工作衡量工具。Product owner應該已經透過詳細的使用者故事與團隊針對開發事項進行了溝通；監控價值是product owner的責任，而不是團隊的責任。Product owner應該已經知道他們為什麼使用靈活的估算單位。無論情況多麼緊張，專案利害關係人之間的溝通都應始終保持親切，並以團隊為中心。"}, {"source": "PMSuccess14.pdf", "number": 7, "stem": "專案時程表已完成，但在執行資源撫平後，發現專案的期程增加，無法符合原本規劃的時程。專案經理應該怎麼做才能將期程拉回到預定的時間？", "options": ["重新分配資源到非要徑上的活動，以提升整體效率。", "提出時程變更的要求。", "請求外部顧問幫助重新規劃時程。", "執行時程網圖分析。", "將非要徑的資源分配到要徑上。"], "answers": [4], "explanation": "* 選項「將非要徑的資源分配到要徑上」是最佳解。要徑上的活動決定了專案的最短完成時間。將非要徑活動的多餘資源分配到要徑活動上，可以縮短要徑活動的持續時間，進而縮短整體專案的期程，達到將期程拉回原定時間的目標。* 其他選項是錯誤的，因為：-專案時程尚在規劃中，所以此時尚不需要提出變更申請。-時程網圖分析可以幫助識別要徑活動，並不能直接縮短專案期程。需搭配其他行動才能產生效果。-顧問雖然可能提供建議，但重新規劃可能導致更多時間浪費，且專案經理需先自行解決時程規劃的問題。-非要徑活動的效率提升不會縮短專案的總期程，因為這些活動對專案完成時間沒有直接影響。應集中資源在要徑活動上。"}, {"source": "PMSuccess14.pdf", "number": 8, "stem": "你擔任一項超過3000萬美元的大型軟體發展專案的專案經理，在初期規劃時，資深程式設計師建議在發展第二階段前，如果先做使用者測試，將可以大大減低產品不穩定的風險。他以先前類似專案的歷史經驗文件來說明這個建議。請問，此案例是哪一種依存關係？", "options": ["軟邏輯關係", "外部相依關係", "內部依賴關係", "硬邏輯關係"], "answers": [0], "explanation": "此題目的關鍵字是「建議」，且是引用之前類似專案的歷史經驗文件來說明這個建議，所以，「軟邏輯關係」是最好的答案。"}, {"source": "PMSuccess14.pdf", "number": 9, "stem": "A組織將執行組織全面電子化專案，但是組織內部並無人員具備此方面的經驗，所以他們打算委外處理。現在的問題是，他們無法預測專案的具體需求和範圍，也沒有足夠的經驗與資訊來撰寫工作條款。在此情況下，你建議A組織使用下列哪一種契約？", "options": ["採購單", "成本加激勵費用 (CPIF)契約", "時間與材料 (T&M)契約", "成本加固定費用 (CPFF)契約"], "answers": [2], "explanation": "* 本題關鍵在於兩個核心條件：1. 需求與範疇尚不明確、2. 組織缺乏內部專業知識與工作條款撰寫能力。這代表買方難以預先估算工作總量與細節，故不適合使用固定價格型契約，需要靈活性與外部的專業支持。所以「時間與材料 (T&M) 契約」最適合，因為此類契約可以根據實際工時與材料付費，適合範疇尚未明確或變動頻繁的專案。兼具靈活與可控特性，常用於顧問服務，或是專案初期的探索階段。* 另外，雖然題目提到「買方無法預測需求與範圍、缺乏內部專業」，乍看之下確實像是成本補償契約（如 CPFF）適用的情境，但CPFF仍需買方具備「高監控能力」，因為CPFF的特性是：承包商報銷所有實際成本，外加固定費用作為利潤、風險大多由買方承擔（因為成本幾乎不設限），而且需要買方有足夠的能力來監控成本合理性、控制預算與驗收標準。* 本題情境中：買方缺乏經驗與資訊，連工作條款（SOW）都寫不出來，代表他們也難以進行成本監督與查核。這正是CPFF不適合的理由。"}, {"source": "PMSuccess14.pdf", "number": 10, "stem": "在執行過程中，專案團隊檢查管制圖時發現最近三筆樣本的變異值都低於下管制界線（LCL），這表示變異異常減少，且可能存在非隨機的特殊原因。專案經理下一步應該採取什麼行動？", "options": ["調查並找出造成變異異常減少的可能原因。", "執行品質保證以改善整體流程品質。", "立即停止流程以避免產生潛在缺陷。", "重新檢驗這三筆樣本是否測量錯誤。"], "answers": [0], "explanation": "* 上管制界線（UCL）與下管制界線（LCL）表示「正常變異」的合理範圍（±3σ），超出者需進一步分析。正解是「調查並找出造成變異異常減少的可能原因」。PMP重視系統化思考與風險導向，不鼓勵在無確認原因下就停止專案流程。* 其他選項是錯誤的，因為：- 若無指示測量錯誤的跡象，不應直接重新檢驗。- 暫停流程是後續行動，不是第一步。只有在確認有不良變異來源後才考慮停產。- 品質保證是針對系統性預防，非處理即時品質異常的手段。"}, {"source": "PMSuccess15.pdf", "number": 1, "stem": "專案共有六個階段，進行到第四個階段末期時，專案管理團隊發現交付標的出現瑕疵。此時專案贊助者想要知道專案進度。專案經理應該怎麼做？", "options": ["儘速提出變更申請", "查詢風險登錄表", "依據品質管理計畫書修訂此瑕疵", "提供專案時程表"], "answers": [3], "explanation": "不要被題目情境上的各式資訊混淆了，題目中所提到的唯一需求就是：專案贊助者想要知道專案進度。所以，專案經理只有提供與專案時程有關的資料，才能滿足專案贊助者的需求。"}, {"source": "PMSuccess15.pdf", "number": 2, "stem": "專案簽訂的是成本補償契約。在結束採購時，你應該注意下列哪一件事？", "options": ["確認賣方的產出符合品質標準。", "賣方所提出的成本明細。", "執行專案的所有人力。", "賣方所提出的總工時。", "執行專案所投入的資源。"], "answers": [1], "explanation": "單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。\n成本可償還契約是一種由買方依據賣方所提出的成本明細而支付成本的契約。此成本明細包含專案的實際支出成本(例如：直接成本與間接成本)和一筆當作賣方利潤的酬金。所以，最佳解為「賣方所提出的成本明細」。"}, {"source": "PMSuccess15.pdf", "number": 3, "stem": "增加專案的測試和檢驗次數將導致？", "options": ["外部失效成本的增加", "內部失效成本的增加", "鑑定成本的增加", "預防成本的增加"], "answers": [2], "explanation": "測試和檢驗都是屬於品質成本中的鑑定成本，故將導致鑑定成本的增加。"}, {"source": "PMSuccess15.pdf", "number": 4, "stem": "敏捷團隊進行到第2個迭代時，多數成員擔心如果到了迭代審查會議時產品負責人才表示不滿意所展示的增量，將延誤專案的後續進展。專案經理應該建議團隊怎麼做？", "options": ["在迭代進行中增加額外的展示，以提早取得產品負責人的回饋。", "延長每個迭代的時間長度，以在審查會議後有更多的時間改善。", "在每個迭代的回顧會議中討論改善方案。", "先照原計劃行事，如產品負責人真的不滿意增量，屆時再重新制定審查會議的時間。"], "answers": [0], "explanation": "*「在迭代進行中增加額外的展示」是敏捷實踐中常見的做法，稱為「早期驗收和早期回饋」。透過在迭代期間進行非正式的展示，團隊能提早獲取產品負責人的意見，以減少迭代審查會議中出現不滿意情況的風險。* 其他選項是錯誤的，因為：-延長迭代的時間長度違背了敏捷原則。敏捷強調固定迭代週期，並在短迭代中快速交付價值。延長迭代時間會破壞敏捷的節奏，並可能導致更長的等待時間，無法解決問題的根本原因。-迭代回顧會議是用於反思流程並提出改進計畫。然而，本題重點在於預防產品負責人在審查會議中不滿意的情況，而不僅是事後反思。因此，這個選項無法直接解決問題。-「先照原計劃行事，如產品負責人真的不滿意增量，屆時再重新制定審查會議的時間」是屬於「被動等待問題發生後再解決」的方式，不符合敏捷中持續回饋和適應變化的原則。敏捷強調主動識別和預防風險，而不是等問題發生後再應對。"}, {"source": "PMSuccess15.pdf", "number": 5, "stem": "目前專案的進度落後，經由專家討論過後，一致認為專案的活動順序難以調整，但是專案又必須追上進度。身為專案經理的你應該如何在專案期程內完成工作？", "options": ["資源撫平", "向發起人報告此事", "快速跟進", "趕工縮程"], "answers": [3], "explanation": "趕工縮程法指的是以增加資源的方式，例如：核定超時工作、取得額外的資源、或為要徑上的活動提供額外的趕工成本，以達成專案期程。另外，由於題目提到無法調整活動順序，所以，不需要考量「快速跟進法」。"}, {"source": "PMSuccess15.pdf", "number": 6, "stem": "敏捷專案團隊在第六個Sprint成功交付使用者故事，並通過驗收測試。然而，在Sprint回顧會議中，團隊成員表示在開發過程中為了克服時間壓力，犧牲了一些程式碼的最佳實踐（如缺乏單元測試與重構），導致技術債快速累積。Scrum Master該如何最有效地處理這個問題？", "options": ["召開一場額外的技術審查會議，逐一檢視每個使用者故事的程式碼品質。", "通知產品負責人暫停下一個 Sprint，改為技術債清理 Sprint。", "引導團隊將品質標準納入完成的定義（ DoD），並確保在未來的 Sprint 開始改善此狀況。", "建議產品負責人將所有技術債項目列入產品待辦清單，並等待其決定優先順序。"], "answers": [2], "explanation": "* 此題表示：團隊雖然完成交付，但是「為了時間而犧牲最佳實踐」，意味著品質標準未被充分呈現在流程與共識中。更新 DoD 可以讓團隊建立一個共同認可的「何時算完成」標準，包括程式碼的品質、測試覆蓋、重構、審查等項目。這是建構長期可維護、高品質交付的基礎。而且更新 DoD 屬於「持續改進」的敏捷實務，符合敏捷團隊應建立品質保障機制的精神。故正解是「將品質標準納入DoD」。* 其他選項是錯誤的，因為：- 雖然技術審查會議是提高程式碼品質的重要實踐，但該選項僅停留在「會議審查」層面，屬於單次行為。它缺乏建構流程與標準改善的長期方案。若只做審查，仍可能缺少團隊共識、流程標準、品質準則，問題就可能再次發生。- 選項「暫停下一個 Sprint，安排技術債清理 Sprint」看似積極，但若沒有先建立或更新品質標準／流程（如 DoD ），單純安排技術債清理 Sprint 可能只是短期救急。且在敏捷中，通常會鼓勵持續交付與改進，而非完全停下來除債。-「將技術債項目加入產品待辦清單，等待產品負責人排序」雖然也是一種常見策略，將技術債可視化並與功能項目一同排序是較被動的作為，因為目前品質問題已被發現，等待產品負責人排序可能使問題持續存在、增長後續風險。"}, {"source": "PMSuccess15.pdf", "number": 7, "stem": "在一個將以敏捷式方法進行的軟體開發專案中，你發現客戶有很長的需求清單，而你希望可以協助他們排定這些需求的優先等級，以協助他們辨識出最小可行性產品。你可以使用哪些技術來協助他們？（選兩項）", "options": ["迭代審查", "尋求專家協助", "配對比較分析", "繪製產品包裝盒", "Moscow"], "answers": [2, 4], "explanation": "為需求排定優先等級的技術包括：Kano 模式、Moscow、優先排序分析、配對比較分析，以及100點方法。"}, {"source": "PMSuccess15.pdf", "number": 8, "stem": "在一個系統開發專案中，專案經理與開發團隊檢查交付的模組是否符合專案要求。檢查時，你發現其中兩個模組未通過測試，無法完全滿足已定義的系統功能規範。專案經理下一步應該怎麼做？", "options": ["將模組問題直接告知客戶，並請客戶提供解決建議。", "拒收不符合規範的模組，並啟動內部改進流程。", "將模組問題提交給高層管理者，尋求進一步指導。", "與開發團隊共同分析問題根源，擬定修正計劃。"], "answers": [1], "explanation": "* 專案經理應確保交付標的符合已定義的系統功能規範。拒收不合格的模組是避免問題擴大，影響整體專案品質的正確行動。拒收並改進不合格的模組是專案管理中品質控制的重要部分，此舉有助於維持專案的專業性與客戶信任。* 其他選項是錯誤的，因為：-在問題未解決前，直接向客戶告知模組問題可能損害團隊的專業形象，且問題解決應由內部團隊主導，而非轉嫁給客戶。-雖然與團隊共同分析問題並擬定修正計劃是重要步驟，但這不是檢查後的首要行動。專案經理應先正式拒收不符合規範的模組，然後再與團隊進行討論和修正。-提交問題給高層管理者是一種不必要的升級。專案經理有責任處理此類問題，直接尋求高層指導可能被視為缺乏問題解決能力，並可能延誤專案進度。"}, {"source": "PMSuccess15.pdf", "number": 9, "stem": "某玻璃器皿製造商的IT部門認可與核准了敏捷團隊為裝配線工人所進行的品質檢驗軟體專案的期中展示會議。然而，最終產品卻被認為無法使用，因為工人的手套太厚無法按下機器的小按鈕。專案經理應該怎麼做才能避免將來出現這種失敗？", "options": ["直接與定義產品需求的客戶之部門簽訂契約。", "為測試軟體的開發人員打造一個符合最終使用者條件的真實模擬環境。", "為最終使用者進行規劃，讓他們在其生產環境中測試各項雛型與增量發布。", "確保所有的軟體發布都包含可調整的輔助功能。"], "answers": [2], "explanation": "實際的最終使用者之需求和回饋不能被組織結構、模擬或通用功能特性集（易操作）所取代。與最終使用者之部門簽訂契約也不合適，因為他們不具備與如何軟體整合到更大的IT環境相關的專業知識、規範和資產。"}, {"source": "PMSuccess15.pdf", "number": 10, "stem": "專案經理帶領的世界運動會專案包含8個階段，簽約了4家廠商，所有廠商已經達成共識，將一起合作達成專案目標。此專案的管理計畫書於20個月前獲得核准，現在正進行到第3個階段。今天有一位專案成員告訴專案經理，他發現有兩個必要的任務並未列在工作包中，若是進行這兩項任務，絕對會影響時程基準。專案經理要如何回應？", "options": ["請將這兩個活動外包給廠商。", "請告知相關利害關係人，時程基準已經獲准，故這兩項活動將不可於此專案中進行。", "先不進行這兩個活動，因為時程基準已經被核准了。", "請提出時程基準的變更申請。"], "answers": [3], "explanation": "專案資訊會隨著專案的進行而變得越來越清楚，所以專案早期所規劃完成的工作包，將可能因為專案資訊的逐步完善而產生更多的活動，所以，最初的活動清單、時程基準或成本基準，將可能於專案中後期時出現變化，此時可藉由變更申請的提出來變更這些基準。"}, {"source": "PMSuccess16.pdf", "number": 1, "stem": "專案經理利用即時通訊向利害關係人宣布了一項新決策，但事後發現，即時通訊工具並未記錄於計畫書中。專案經理接下來該如何處理?", "options": ["將此次宣布的決策加入下次的專案會議中。", "使用Email追蹤此決策的執行結果。", "將即時通訊工具加進溝通管理計畫書中。", "以簡報方式向利害關係人說明為什麼要使用即時通訊。"], "answers": [2], "explanation": "既然和利害關係人溝通的方法有所改變，那就需要更新溝通管理計畫書。"}, {"source": "PMSuccess16.pdf", "number": 2, "stem": "某跨國大型專案正進行中，專案經理觀察到團隊成員之間有一些溝通障礙與協作不佳的狀況，因此打算採取以下手段： A.召開團隊會議，以釐清專案目標。 B.輔導團隊成員重視彼此傾聽與回饋。C.更積極參與，並促進團隊成員間的互動。 D.培養團隊成員尊重彼此的文化差異。 這些手段與可能效果之間的對應關係是？", "options": ["A為增進共識，B為減少溝通差距，C為促進協作，D為提升包容性。", "A為促進協作，B為增進共識，C為提升包容性，D為減少溝通差距。", "A為增進共識，B為促進協作，C為減少溝通差距，D為提升包容性。", "A為促進協作，B為提升包容性， C為增進共識，D為減少溝通差距。\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。"], "answers": [0], "explanation": "最佳解是「A為增進共識，B為減少溝通差距，C為促進協作，D為提升包容性」。有些手段的效果是多重的，但請謹記應選擇「相對較佳解」！"}, {"source": "PMSuccess16.pdf", "number": 3, "stem": "專案經理帶領一個涵蓋物聯網技術與雲端平台的整合性專案。隨著專案進行，客戶需求多次變更，技術要求日益提高。本週，專案經理注意到部分團隊成員的技能不足以應對新需求，例如缺乏數據安全架構設計的經驗，導致進度延誤。專案經理應該如何處理？", "options": ["將技能不足的團隊成員從專案中移除，並要求功能經理為團隊提供更適合的成員。", "將成員技能不足的情況記錄至團隊績效評量中，以便未來能為其他專案提供更適合的成員。", "提出增加額外訓練的變更申請，以確保成員能夠獲取勝任專案需求的新技能。", "要求團隊成員加班，縮短學習曲線來迅速掌握新技術，以解決當前的進度問題。"], "answers": [2], "explanation": "* 專案經理有責任為成員提供適當的訓練。若成員技能不足而影響進度，透過正式的變更申請流程加入訓練計畫，是專案中常採用的強化訓練。* 在尚未嘗試提升現有成員技能的情況下直接更換人員，可能導致團隊士氣降低，且增加額外的管A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果\n理負擔。* 記錄績效問題僅是針對未來的預防措施，無法解決當前的技能缺口問題，無助於專案當前進展。* 強制加班無法有效提升技術能力，可能導致疲勞與士氣低落，並未解決根本問題。"}, {"source": "PMSuccess16.pdf", "number": 4, "stem": "在最近幾次衝突之後，專案經理注意到團隊成員和外部利害關係人處理分歧的方式不一致。有些人會立即將問題升級，而有些人則完全避免提出疑慮。結果，類似的衝突在整個專案中以不同的方式處理。專案經理應該做什麼？", "options": ["向團隊和利害關係人傳達明確的衝突管理原則和期望。", "個別處理發生的衝突情況，以盡量減少干擾。", "鼓勵團隊成員在將衝突升級到專案層級之前，先以非正式的方式解決。", "依據贊助者定義的上報及解決衝突規則。"], "answers": [0], "explanation": "這題的關鍵是「團隊和外部利害關係人對於衝突的處理方式不一致」。這表示問題不是單一衝突本身，而是缺少共同的衝突管理原則、處理流程與行為期待。而且有效管理衝突包括清楚傳達應如何提出、討論和解決分歧的共同原則。建立共同的期望有助於在整個專案環境中促進一致性、公平性和信任。所以最佳解是「向團隊和利害關係人傳達明確的衝突管理原則和期望」。"}, {"source": "PMSuccess16.pdf", "number": 5, "stem": "你在敏捷開發環境中擔任Scrum Master，團隊剛完成第5個Sprint審查會議。你觀察到有幾位利害關係人在會後並未提供任何回饋，進一步詢問後發現，他們沒有即時參加會議，而是事後才透過電子郵件觀看簡報與影片紀錄。若你希望未來這些關鍵利害關係人能更即時地理解產品狀況、並直接與開發團隊互動，以強化透明度與回饋速度，下列哪一項溝通策略最能達成此目的？", "options": ["改採非正式溝通風格，例如每週Slack群組快訊，減少會議壓力。", "建立一個專屬文件資料夾，讓利害關係人自行上網查閱會議資料，以減少團隊負擔。", "鼓勵利害關係人親自參與Sprint審查會議，並安排互動討論時間，以實施互動式溝通。", "每次會後將簡報與錄影檔發送給所有利害關係人，以推式溝通方式確保資訊覆蓋率。", "每週整理一次問答彙整表（FAQ）並寄送給利害關係人，作為補充說明。"], "answers": [2], "explanation": "* 此題核心在於提升即時理解與互動性，並希望利害關係人參與回饋，這一點明確指向互動式溝通，即雙向、同步、面對面的交流。在Scrum中，Sprint 審查會議的設計目的就是為了互動與即時回饋，不是單純傳達資訊。* 其他選項是錯誤的，因為：- 推式溝通雖然可以確保資訊送達，但仍無法保證對方參與與理解。- 拉式溝通適用於資訊儲存與查閱，不適合用於即時參與與互動。- 非正式溝通無法替代正式的互動會議。- 問答彙整可作為推式或拉式的補充活動，無法達成即時互動效果。"}, {"source": "PMSuccess16.pdf", "number": 6, "stem": "專案經理正在管理一項跨國併購整合專案，專案已進入組織整併與合約轉換階段。近期的狀態更新包含：人員調整時程、供應商合約重新談判條件、潛在裁撤部門、留任獎金，以及尚未公告的整併里程碑。 為了提升透明度，一位敏捷團隊成員建議將所有專案狀態、風險與決策紀錄都放到共用入口網站，讓全球整合團隊可以即時查閱。幾位區域主管支持這項建議，認為資訊越透明越能減少猜測。然而，法務部門提醒，部分資訊只允許高階主管、法務與特定人資代表存取，若提前揭露可能引發合約爭議、員工關係風險與法規問題。 專案經理應該怎麼做？", "options": ["依資訊分類與授權更新溝通控管方法。", "要求成員簽署保密協議後再開放網站。", "暫停發布狀態，直到法務完成所有審查。", "將所有資訊拆成公開版與機密版報告。", "維持共用網站，但移除人員調整與留任獎金內容。"], "answers": [0], "explanation": "* 本題重點不是「要不要透明」，而是透明度必須受到授權、法規與資訊敏感度限制。專案經理應更新或細化溝通管理安排，依資訊分類、接收者角色、授權人、保密要求、溝通管道與回覆機制來控管資訊。ATP 教材中的溝通管理計畫包含發送者、接收者、機密資訊授權人、資訊類型、格式、頻率、是否需確認回覆，以及使用的溝通方法與技術。故正解是「依資訊分類與授權更新溝通控管方法」。* 其他選項較不合適，因為：拆成公開版與機密版報告可能是這種控管方法的一部分，但不是最根本的管理動作。全面暫停發布過於極端，會影響必要溝通。簽保密協議後再開放不足以取代權限與合規控管。只移除部分內容但維持網站仍可能忽略其他敏感資訊的分類與授權問題。"}, {"source": "PMSuccess16.pdf", "number": 7, "stem": "一項大型土木工程專案正在進行場地整備。施工團隊每天都在專案管理資訊系統中更新推土機的預定到場日、實際使用時數及維護狀態，資源負責人也確認資料正確。 在月度治理會議中，一位負責協調周邊道路封閉的重要利害關係人表示，他無法從現有報告或儀表板得知推土機何時到場及使用安排。專案經理查閱紀錄後發現，該利害關係人的資訊需求曾被記錄，但最近數次溝通成效審查均未檢查他是否能取得所需資訊。 專案經理最可能遺漏了哪一項活動？", "options": ["檢視溝通成效並調整發布方式。", "修訂該利害關係人的參與策略。", "強化設備使用與維護管制機制。", "重新辨識並分類專案利害關係人。"], "answers": [0], "explanation": "題目已提到：推土機的到場與使用資料均已正確更新、該利害關係人也已被辨識、其資訊需求曾被記錄，故真正的問題是他無法透過目前的報告或儀表板取得資訊。因此，問題不在出在實體資源管制，而在於專案經理未持續確認溝通是否有效滿足利害關係人的資訊需求。教材強調，溝通管理應依不同角色確認資訊主題、頻率、方法與技術，並建立回饋迴路，讓團隊能據此調整溝通策略。故正解是「檢視溝通成效並調整發布方式」。"}, {"source": "PMSuccess16.pdf", "number": 8, "stem": "你在人流量大的公共場合張貼了一張與專案相關的大型看板。請問，你採用的是哪種溝通方式？", "options": ["推式溝通", "彈出式溝通", "拉式溝通", "互動式溝通"], "answers": [2], "explanation": "* 使用推式溝通時，有一個重要的特徵是：你手上有「特性對象」，可以讓你將資訊只傳送（推送）給他們。* 而此題的情境是：「你在該專案人員流量大的公共場合張貼了一張大型的看板」，所以這表示「你只將資訊張貼上看板」，然後並無法設定誰需要看，所以，這不符合「推式溝通」。* 此外，拉式溝通指的是：資訊需要由人們自己主動去觀看、搜尋或擷取才能獲得，例如：你去google上搜尋資訊或是你自己去公司的佈告欄前面逛一逛，看看公司最近公告的新消息有無你需要留意的。* 看板也是一樣的道理，資訊張貼上看板後，團隊成員或其他部門的員工都可以依照自己的需求，自己決定想要觀看哪一部分的資訊，或選擇不去觀看。所以，看板是拉式溝通的範例。"}, {"source": "PMSuccess16.pdf", "number": 9, "stem": "經過數個月的資訊蒐集，且與社區成員會面之後，警方希望設計和推出一款應用程式，以提升與社區大眾（他們的關鍵利害關係人之一）的溝通品質。請問，這是一個什麼樣的持續改進流程的範例？", "options": ["犯罪率將下降。", "它旨在提升警察與民眾之間的溝通效率和品質。", "應用程式開發是一個單獨的敏捷軌，這表明警察正使用良好的專案管理。", "使用該應用程式的人將每個月自動收到有關社區計畫的更新。"], "answers": [1], "explanation": "* 題目提到：「警方透過資訊蒐集與與社區互動後，設計應用程式以『改善』與關鍵利害關係人的『溝通品質』」，這是一種與「改善方案」有關的專案。所以，正解是「它旨在提升警察與民眾之間的溝通效率和品質」。* 其他選是錯誤的，因為：- 犯罪率將下降不是本情境中描述的「持續改進流程」的直接目標，也未聚焦在流程改善。- 選項「應用程式開發是一個單獨的敏捷軌，這表明警察正使用良好的專案管理」，這偏向「專案實施方式」的判斷，與持續改進無直接關聯。它描述的是方法論，而非持續改進的流程意圖。- 選項「使用該應用程式的人將每個月自動收到有關社區計畫的更新」描述的是功能或「成果輸出」，而不是反映持續改進的過程或動機。"}, {"source": "PMSuccess16.pdf", "number": 10, "stem": "在一項保險理賠流程改善專案中，專案經理每週都向營運主管寄送進度摘要。最近一次展示會中，營運主管對成果非常不滿，表示「這不是我們當初理解的優先順序」。專案經理發現，營運主管從未回覆過前幾週的進度摘要，因此團隊一直以為對方沒有異議。專案經理應如何避免此問題再次發生？", "options": ["只在展示會議上收集正式意見。", "提高報告寄送頻率。", "將沉默視為正式同意。", "請贊助人代為確認需求。", "建立理解確認與回饋機制。"], "answers": [4], "explanation": "正解是「建立理解確認與回饋機制」。溝通不是把訊息送出就完成，還要確認接收者理解內容並提供回饋。專案經理應設計明確的回饋迴路，例如要求確認、安排簡短同步、使用主動聆聽、重述重點、記錄決議與待辦事項。"}, {"source": "PMSuccess17.pdf", "number": 1, "stem": "專案經理正在管理一項銀行核心帳務系統升級專案。資深資料庫專家即將轉調至另一個部門，他熟悉多個過往的歷史例外情境、批次作業順序與夜間異常排除方式。雖然技術文件已存在，但多位團隊成員表示，實際排錯仍高度依賴該專家的經驗判斷。專案經理應優先採取哪一項行動？", "options": ["將此情況升級給職能主管，並安排訓練。", "安排工作影子與情境演練。", "要求該專家補齊所有技術文件。", "指派替代人員立即接手作業。", "要求團隊自行閱讀知識庫。"], "answers": [1], "explanation": "* 正解是「安排工作影子與情境演練」。本題重點核心不在於「文件不足」，而在於關鍵的隱性知識即將流失。像歷史例外情境、批次順序判斷、夜間異常排除這類經驗，通常很難只靠文件完整傳承，最有效的優先措施是透過工作影子、實際案例演練、情境模擬，把專家的經驗判斷轉移給其他成員。* 其他選項較不適合，因為：• 補齊技術文件有幫助，但不足以傳承隱性知識。• 升級主管並安排訓練通常是次一步，不是最優先。• 立即指派替代人員接手若沒有知識轉移，風險反而更高。• 自行閱讀知識庫無法有效取代實務經驗傳承。"}, {"source": "PMSuccess17.pdf", "number": 2, "stem": "專案經理在會議中向利害關係人說明變更事項。專案經理是使用哪種溝通方法？\n單純學 ChatGPT 工具，而是聚焦在一個更關鍵的問題：當企業想導入 AI，誰能把 AI 願景變成真正可落地、可管理、可衡量、可交付的成果。", "options": ["拉式溝通", "公開式溝通", "互動式溝通", "推式溝通"], "answers": [2], "explanation": "會議是互動式溝通之工件之一，故為互動式溝通。另外，你可淘汰「公開式」，因為公開溝通指的是：講者對一群人發表演說。"}, {"source": "PMSuccess17.pdf", "number": 3, "stem": "專案經理接手一項跨國資料分析平台專案。專案利害關係人分布於台灣、日本與歐洲。專案團隊過去每週寄出詳細進度報告，但部分高階主管仍表示「沒有收到真正需要的資訊」；技術團隊則抱怨管理層要求過多臨時說明，影響開發工作。專案經理應優先做什麼？", "options": ["要求利害關係人參加每日協調會議。", "建立單一共用儀表板。", "增加每週進度報告的細節。", "將溝通問題升級給贊助人。", "重新分析溝通需求。 (A. 會，我有興趣了解PM\n其他，歡迎留言\n觀看結果"], "answers": [4], "explanation": "正解是「重新分析溝通需求」。此題的問題不是資訊不足，而是資訊沒有符合不同利害關係人的需求。專案經理應重新執行溝通需求分析，確認每類利害關係人需要什麼資訊、為什麼需要、多久需要一次、用何種格式與語言、是否需要確認收到或回覆，以及何時升級。"}, {"source": "PMSuccess17.pdf", "number": 4, "stem": "專案經理想讓成員了解管理專案知識的重要性，專案經理應如何說明？", "options": ["我們要記得在每個專案階段將知識記錄下來，以利分享", "雖然隱性知識也很重要，但是只有編碼過的顯性知識才能被分享", "為了最大化專案知識，我們需要在專案結束時記錄經驗學習", "我們要塑造一個可以讓團隊信任的環境，好激勵人們主動分享知識或關注他人的知識 ( (您的選項)"], "answers": [3], "explanation": "管理專案知識主要是為了確保專案團隊和其他利害關係人的顯性與隱性知識，例如：技能、經驗、洞察力、訣竅及專業知識能在專案的前、中、後皆可被運用。但是由於知識存在於每個人的思想中，且無法強迫人分享，所以，專案經理和組織需著重於創造一個可以讓團隊信任的環境，以激勵人們分享知識或關注他人的知識。"}, {"source": "PMSuccess17.pdf", "number": 5, "stem": "專案進行到第5個階段時，有一項任務發生了變更，此變更影響的層面頗廣，預估有不少利害關係人將受到衝擊。專案經理應該參考什麼，才能清楚了解哪些利害關係人需要被通知？（選兩項）", "options": ["利害關係人登錄表", "溝通管理計畫書", "RACI 矩陣", "資源管理計畫書", "利害關係人參與評量矩陣"], "answers": [1, 2], "explanation": "* 正解是「RACI和溝通管理計畫書」。此題詢問
